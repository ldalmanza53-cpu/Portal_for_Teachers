<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar & Vocab Lab: Family & Noun Clauses</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    /* 3D Flashcard Flip Styling */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* Print styling for Certificate */
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-certificate, #printable-certificate * {
        visibility: visible;
      }
      #printable-certificate {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
        background: white !important;
        color: black !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // DATA DEFINITIONS & DATABASE
    // ==========================================

    const VOCAB_DATA = [
      {
        id: "v1",
        term: "Blended family",
        partOfSpeech: "noun",
        definition: "A family formed by combining two families from previous relationships (parents, step-siblings, half-siblings).",
        example: "Living in a blended family brought two new step-siblings into Maya's life.",
        cefr: "B1"
      },
      {
        id: "v2",
        term: "In-laws",
        partOfSpeech: "noun",
        definition: "Relatives gained through marriage, such as a spouse's parents or siblings.",
        example: "During holidays, her in-laws usually stay with them for dinner.",
        cefr: "B1"
      },
      {
        id: "v3",
        term: "Close-knit",
        partOfSpeech: "adjective",
        definition: "Bound together by strong affection, loyalty, and mutual support.",
        example: "They are a close-knit family that eats dinner together every evening.",
        cefr: "B1"
      },
      {
        id: "v4",
        term: "Breadwinner",
        partOfSpeech: "noun",
        definition: "The primary income earner who financially supports a household.",
        example: "Suresh became the primary breadwinner after starting his engineering career.",
        cefr: "B1"
      },
      {
        id: "v5",
        term: "Upbringing",
        partOfSpeech: "noun",
        definition: "The way a child is raised, educated, and taught values by parents or guardians.",
        example: "Her strict upbringing taught her the importance of hard work and respect.",
        cefr: "B2"
      },
      {
        id: "v6",
        term: "Take after",
        partOfSpeech: "phrasal verb",
        definition: "To resemble an older relative in appearance, character, or temperament.",
        example: "Liam takes after his grandfather in his love for storytelling.",
        cefr: "B1"
      },
      {
        id: "v7",
        term: "Matriarch",
        partOfSpeech: "noun",
        definition: "A female head or respected elder of a family or clan.",
        example: "Grandmother Clara is the undisputed matriarch of our household.",
        cefr: "B2"
      },
      {
        id: "v8",
        term: "Extended family",
        partOfSpeech: "noun",
        definition: "A family group including relatives beyond parents and children, such as aunts, uncles, and cousins.",
        example: "Our extended family gathers once a year for a massive summer barbecue.",
        cefr: "B1"
      }
    ];

    const FUNCTION_QUESTIONS = [
      {
        id: 1,
        sentence: "My grandmother always reminds us [that family support comes first].",
        clause: "that family support comes first",
        correct: "DO",
        options: [
          { code: "S", label: "Subject (S)" },
          { code: "DO", label: "Direct Object (DO)" },
          { code: "SC", label: "Subject Complement (SC)" },
          { code: "OP", label: "Object of Preposition (OP)" }
        ],
        explanation: "The clause acts as the Direct Object (DO) answering 'reminds us what?' after the transitive verb 'reminds'."
      },
      {
        id: 2,
        sentence: "[What surprised everyone at the family reunion] was how much Tim looked like his grandfather.",
        clause: "What surprised everyone at the family reunion",
        correct: "S",
        options: [
          { code: "S", label: "Subject (S)" },
          { code: "DO", label: "Direct Object (DO)" },
          { code: "SC", label: "Subject Complement (SC)" },
          { code: "OP", label: "Object of Preposition (OP)" }
        ],
        explanation: "The clause comes before the main verb 'was' and functions as the Subject (S) of the sentence."
      },
      {
        id: 3,
        sentence: "We were chatting about [how our ancestors migrated to America].",
        clause: "how our ancestors migrated to America",
        correct: "OP",
        options: [
          { code: "S", label: "Subject (S)" },
          { code: "DO", label: "Direct Object (DO)" },
          { code: "SC", label: "Subject Complement (SC)" },
          { code: "OP", label: "Object of Preposition (OP)" }
        ],
        explanation: "The clause directly follows the preposition 'about', functioning as the Object of Preposition (OP)."
      },
      {
        id: 4,
        sentence: "The main disagreement in our household was [whether we should host Thanksgiving this year].",
        clause: "whether we should host Thanksgiving this year",
        correct: "SC",
        options: [
          { code: "S", label: "Subject (S)" },
          { code: "DO", label: "Direct Object (DO)" },
          { code: "SC", label: "Subject Complement (SC)" },
          { code: "OP", label: "Object of Preposition (OP)" }
        ],
        explanation: "The clause follows the linking verb 'was' and renames/completes the subject 'disagreement', making it a Subject Complement (SC)."
      },
      {
        id: 5,
        sentence: "My mother explained [why my aunt had moved to Spain].",
        clause: "why my aunt had moved to Spain",
        correct: "DO",
        options: [
          { code: "S", label: "Subject (S)" },
          { code: "DO", label: "Direct Object (DO)" },
          { code: "SC", label: "Subject Complement (SC)" },
          { code: "OP", label: "Object of Preposition (OP)" }
        ],
        explanation: "The clause functions as the Direct Object (DO) of the verb 'explained'."
      }
    ];

    const TRANSFORMER_TASKS = [
      {
        id: 1,
        directQuestion: "Where did my great-grandparents meet?",
        starter: "My father told me",
        correctClause: "where my great-grandparents met",
        tiles: ["where", "my", "great-grandparents", "met", "did", "meet"],
        distractors: ["did", "meet"],
        explanation: "In embedded noun clauses, remove the auxiliary verb 'did' and put the main verb into past simple ('met'). Statement order: Subj + Verb."
      },
      {
        id: 2,
        directQuestion: "Is my stepbrother joining us for holiday dinner?",
        starter: "I am not sure",
        correctClause: "whether my stepbrother is joining us for holiday dinner",
        tiles: ["whether", "my", "stepbrother", "is", "joining", "us", "for", "holiday", "dinner", "does"],
        distractors: ["does"],
        explanation: "For yes/no questions, use 'whether' or 'if' + statement word order ('my stepbrother is joining...')."
      },
      {
        id: 3,
        directStatement: "Our family tradition brings us together every summer.",
        starter: "What I appreciate most about our extended family is",
        correctClause: "that our family tradition brings us together every summer",
        tiles: ["that", "our", "family", "tradition", "brings", "us", "together", "every", "summer"],
        distractors: [],
        explanation: "Use the conjunction 'that' to introduce a factual statement clause acting as a subject complement."
      },
      {
        id: 4,
        directQuestion: "Why did my uncle decide to change his career?",
        starter: "Nobody in our household understands",
        correctClause: "why my uncle decided to change his career",
        tiles: ["why", "my", "uncle", "decided", "to", "change", "his", "career", "did", "decide"],
        distractors: ["did", "decide"],
        explanation: "Remove auxiliary 'did' and change 'decide' to past tense 'decided'."
      },
      {
        id: 5,
        directQuestion: "How did my mother raise four children while working full-time?",
        starter: "We were talking about",
        correctClause: "how my mother raised four children while working full-time",
        tiles: ["how", "my", "mother", "raised", "four", "children", "while", "working", "full-time", "did"],
        distractors: ["did"],
        explanation: "Remove 'did' and use past tense 'raised' in statement word order."
      }
    ];

    const DETECTIVE_CASES = [
      {
        id: 1,
        incorrectText: "I asked my mother where did she hide the old family photo album.",
        errorPart: "where did she hide",
        options: [
          { text: "...where did she hid...", correct: false },
          { text: "...where she hid...", correct: true },
          { text: "...where she does hide...", correct: false }
        ],
        explanation: "Auxiliary 'did' should be omitted and question order inverted into statement order: 'where she hid'."
      },
      {
        id: 2,
        incorrectText: "What my cousin told me make everyone in the family laugh.",
        errorPart: "make",
        options: [
          { text: "...make everyone...", correct: false },
          { text: "...makes everyone...", correct: true },
          { text: "...making everyone...", correct: false }
        ],
        explanation: "A noun clause functioning as a singular subject ('What my cousin told me' = 'It') takes a singular verb ending in -s ('makes')."
      },
      {
        id: 3,
        incorrectText: "We discussed about whether our in-laws will visit us this winter.",
        errorPart: "discussed about whether",
        options: [
          { text: "...discussed about whether...", correct: false },
          { text: "...discussed whether...", correct: true },
          { text: "...discussed of whether...", correct: false }
        ],
        explanation: "The verb 'discuss' is transitive and takes a direct object directly without the preposition 'about'."
      },
      {
        id: 4,
        incorrectText: "She doesn't know who is the person standing next to her godfather.",
        errorPart: "who is the person",
        options: [
          { text: "...who is the person...", correct: false },
          { text: "...who the person is...", correct: true },
          { text: "...who does the person be...", correct: false }
        ],
        explanation: "In indirect question clauses, place the subject ('the person') before the verb ('is')."
      }
    ];

    const STORY_PROMPTS = {
      vocab1: { options: ["matriarch", "breadwinner", "in-laws"], answer: "matriarch" },
      vocab2: { options: ["nuclear family", "extended family", "blended family"], answer: "nuclear family" },
      vocab3: { options: ["close-knit", "distant", "in-law"], answer: "close-knit" },
      vocab4: { options: ["in-laws", "step-siblings", "godparents"], answer: "in-laws" },
      clause5: {
        options: [
          "what she had discovered about our family tree",
          "what had she discovered about our family tree",
          "that what did she discover about our family tree"
        ],
        answer: "what she had discovered about our family tree"
      },
      clause6: {
        options: [
          "that our ancestors immigrated from Scotland in 1890",
          "where did our ancestors immigrate from Scotland in 1890",
          "whether our ancestors immigrates from Scotland"
        ],
        answer: "that our ancestors immigrated from Scotland in 1890"
      },
      clause7: {
        options: [
          "whether we could visit the ancestral home",
          "could we visit whether the ancestral home",
          "that can we visit the ancestral home"
        ],
        answer: "whether we could visit the ancestral home"
      },
      clause8: {
        options: [
          "how our family history shapes our values",
          "how does our family history shape our values",
          "why does our family history shapes our values"
        ],
        answer: "how our family history shapes our values"
      }
    };

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================

    function App() {
      const [activeTab, setActiveTab] = useState('vocab'); // vocab, function, transformer, detective, story, certificate
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [completedModules, setCompletedModules] = useState({});
      const [showRuleModal, setShowRuleModal] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [studentName, setStudentName] = useState('Alex Taylor');

      // Helper to add points and update streak
      const handleEarnPoints = (points) => {
        setScore(prev => prev + points);
        setStreak(prev => prev + 1);
      };

      const handleResetStreak = () => {
        setStreak(0);
      };

      const markModuleComplete = (modKey) => {
        setCompletedModules(prev => ({ ...prev, [modKey]: true }));
      };

      // TTS Pronunciation Helper
      const speakText = (text) => {
        if (!soundEnabled || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      };

      const totalModulesCount = 5;
      const completedCount = Object.keys(completedModules).length;
      const progressPercent = Math.min(100, Math.round((completedCount / totalModulesCount) * 100));

      return (
        <div className="flex flex-col min-h-screen bg-slate-900 text-slate-100">
          {/* HEADER & NAV HUB */}
          <header className="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/80 sticky top-0 z-40 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
              <div className="flex flex-wrap items-center justify-between gap-4">
                
                {/* Logo & Title */}
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-xl shadow-lg shadow-indigo-500/20">
                    🧬
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-black tracking-tight bg-gradient-to-r from-indigo-300 via-purple-200 to-white bg-clip-text text-transparent">
                      Grammar & Vocab Lab
                    </h1>
                    <p className="text-xs text-slate-400 font-medium">B1-B2 Family Terms & Noun Clauses</p>
                  </div>
                </div>

                {/* Score, Streak & Quick Rule Button */}
                <div className="flex items-center space-x-3 sm:space-x-4">
                  {/* Streak */}
                  <div className="flex items-center space-x-1.5 bg-slate-900/80 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-bold text-amber-400">
                    <span>🔥</span>
                    <span>{streak} <span className="text-[10px] text-slate-400 font-normal">streak</span></span>
                  </div>

                  {/* Score */}
                  <div className="flex items-center space-x-1.5 bg-slate-900/80 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-bold text-indigo-300">
                    <span>⭐</span>
                    <span>{score} <span className="text-[10px] text-slate-400 font-normal">pts</span></span>
                  </div>

                  {/* Sound Toggle */}
                  <button
                    onClick={() => setSoundEnabled(!soundEnabled)}
                    className={`p-2 rounded-xl border text-xs transition ${
                      soundEnabled 
                        ? 'bg-indigo-600/30 border-indigo-500/50 text-indigo-300' 
                        : 'bg-slate-800 border-slate-700 text-slate-500'
                    }`}
                    title="Toggle Audio / Pronunciation"
                  >
                    {soundEnabled ? '🔊' : '🔇'}
                  </button>

                  {/* Grammar Rules Modal Trigger */}
                  <button
                    onClick={() => setShowRuleModal(true)}
                    className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white hover:from-purple-500 hover:to-indigo-500 text-xs font-bold px-3.5 py-2 rounded-xl transition shadow-md shadow-indigo-500/20 flex items-center gap-1.5"
                  >
                    💡 Quick Rules
                  </button>
                </div>
              </div>

              {/* Progress Bar & Navigation Tabs */}
              <div className="mt-3.5 pt-2 border-t border-slate-700/50 flex flex-col md:flex-row md:items-center justify-between gap-3">
                {/* Tabs */}
                <nav className="flex items-center gap-1.5 overflow-x-auto pb-1 md:pb-0 no-scrollbar">
                  {[
                    { id: 'vocab', label: '🎴 1. Vocab', name: 'Vocab' },
                    { id: 'function', label: '🧩 2. Functions', name: 'Functions' },
                    { id: 'transformer', label: '🔄 3. Transformer', name: 'Transformer' },
                    { id: 'detective', label: '🔍 4. Error Detective', name: 'Detective' },
                    { id: 'story', label: '📖 5. Story Lab', name: 'Story' },
                    { id: 'certificate', label: '🎓 6. Certificate', name: 'Certificate' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 ${
                        activeTab === tab.id
                          ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30'
                          : 'text-slate-300 hover:bg-slate-700/60 hover:text-white'
                      }`}
                    >
                      <span>{tab.label}</span>
                      {completedModules[tab.id] && <span className="text-[10px] bg-emerald-500/30 text-emerald-300 border border-emerald-500/50 rounded-full px-1.5">✓</span>}
                    </button>
                  ))}
                </nav>

                {/* Completion Bar */}
                <div className="flex items-center space-x-2 text-xs text-slate-400 min-w-[160px]">
                  <span>Lab Progress:</span>
                  <div className="flex-1 bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-700">
                    <div 
                      className="bg-gradient-to-r from-indigo-500 to-emerald-400 h-full transition-all duration-500"
                      style={{ width: `${progressPercent}%` }}
                    />
                  </div>
                  <span className="font-bold text-slate-200">{progressPercent}%</span>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN MODULE CONTENT */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {activeTab === 'vocab' && (
              <Module1Vocab
                vocabData={VOCAB_DATA}
                speakText={speakText}
                onEarnPoints={handleEarnPoints}
                onComplete={() => markModuleComplete('vocab')}
              />
            )}

            {activeTab === 'function' && (
              <Module2Function
                questions={FUNCTION_QUESTIONS}
                onEarnPoints={handleEarnPoints}
                onResetStreak={handleResetStreak}
                onComplete={() => markModuleComplete('function')}
              />
            )}

            {activeTab === 'transformer' && (
              <Module3Transformer
                tasks={TRANSFORMER_TASKS}
                onEarnPoints={handleEarnPoints}
                onResetStreak={handleResetStreak}
                onComplete={() => markModuleComplete('transformer')}
              />
            )}

            {activeTab === 'detective' && (
              <Module4Detective
                cases={DETECTIVE_CASES}
                onEarnPoints={handleEarnPoints}
                onResetStreak={handleResetStreak}
                onComplete={() => markModuleComplete('detective')}
              />
            )}

            {activeTab === 'story' && (
              <Module5Story
                prompts={STORY_PROMPTS}
                onEarnPoints={handleEarnPoints}
                onComplete={() => markModuleComplete('story')}
              />
            )}

            {activeTab === 'certificate' && (
              <Module6Certificate
                score={score}
                completedModules={completedModules}
                studentName={studentName}
                setStudentName={setStudentName}
              />
            )}
          </main>

          {/* QUICK RULE REFERENCE MODAL */}
          {showRuleModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl overflow-y-auto max-h-[90vh]">
                <div className="flex justify-between items-start border-b border-slate-700 pb-4 mb-4">
                  <div className="flex items-center space-x-2">
                    <span className="text-2xl">📚</span>
                    <h3 className="text-xl font-extrabold text-white">Noun Clauses & Family Terms Reference</h3>
                  </div>
                  <button
                    onClick={() => setShowRuleModal(false)}
                    className="text-slate-400 hover:text-white bg-slate-700/50 hover:bg-slate-700 rounded-full w-8 h-8 flex items-center justify-center transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-5 text-xs sm:text-sm text-slate-300 leading-relaxed">
                  {/* Concept 1 */}
                  <div className="bg-slate-900/80 p-4 rounded-2xl border border-indigo-500/30">
                    <h4 className="font-bold text-indigo-300 text-sm mb-1 flex items-center gap-1.5">
                      <span>💡</span> What is a Noun Clause?
                    </h4>
                    <p>A dependent clause that functions like a single noun. It can serve as a **Subject**, **Direct Object**, **Subject Complement**, or **Object of a Preposition**.</p>
                  </div>

                  {/* Functions Table */}
                  <div className="bg-slate-900/60 rounded-2xl p-4 border border-slate-700">
                    <h4 className="font-bold text-slate-200 text-xs uppercase tracking-wider mb-2">Syntactic Functions Summary:</h4>
                    <ul className="space-y-2 font-mono text-xs">
                      <li className="p-2 bg-slate-800/80 rounded-xl border border-slate-700">
                        <strong className="text-emerald-400">Subject (S):</strong> <span className="text-slate-200">[What she said]</span> brought the family together.
                      </li>
                      <li className="p-2 bg-slate-800/80 rounded-xl border border-slate-700">
                        <strong className="text-indigo-400">Direct Object (DO):</strong> She knows <span className="text-slate-200">[that family comes first]</span>.
                      </li>
                      <li className="p-2 bg-slate-800/80 rounded-xl border border-slate-700">
                        <strong className="text-purple-400">Subject Complement (SC):</strong> The main issue was <span className="text-slate-200">[whether we could afford the trip]</span>.
                      </li>
                      <li className="p-2 bg-slate-800/80 rounded-xl border border-slate-700">
                        <strong className="text-amber-400">Object of Preposition (OP):</strong> We talked about <span className="text-slate-200">[how our grandparents met]</span>.
                      </li>
                    </ul>
                  </div>

                  {/* Golden Word Order Rule */}
                  <div className="bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl">
                    <h4 className="font-bold text-amber-300 text-xs uppercase tracking-wider mb-1">
                      ⚠️ Golden Word Order Rule (No Auxiliary Inversion!)
                    </h4>
                    <p className="text-slate-200">
                      When embedding a question into a noun clause, use **STATEMENT word order** (Subject + Verb), and **do NOT** use auxiliary verbs like <code className="bg-slate-900 px-1 py-0.5 rounded text-amber-400">did/does/do</code>.
                    </p>
                    <div className="mt-2 text-xs space-y-1 font-mono">
                      <p className="text-rose-400">❌ Incorrect: I asked where did she go.</p>
                      <p className="text-emerald-400">✅ Correct: I asked where she went.</p>
                    </div>
                  </div>
                </div>

                <div className="mt-6 flex justify-end">
                  <button
                    onClick={() => setShowRuleModal(false)}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-lg"
                  >
                    Got It, Let's Practice!
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
            <p>Grammar & Vocab Lab • B1-B2 Family & Noun Clause Mastery Module</p>
          </footer>
        </div>
      );
    }

    // ==========================================
    // MODULE 1: VOCABULARY & FLASHCARDS
    // ==========================================

    function Module1Vocab({ vocabData, speakText, onEarnPoints, onComplete }) {
      const [viewMode, setViewMode] = useState('flashcards'); // flashcards or matching
      const [flippedCards, setFlippedCards] = useState({});
      
      // Matching Game state
      const [selectedTerm, setSelectedTerm] = useState(null);
      const [matchedPairs, setMatchedPairs] = useState([]);
      const [matchingScore, setMatchingScore] = useState(0);

      // Shuffle definitions for matching game
      const [shuffledDefs, setShuffledDefs] = useState([]);

      useEffect(() => {
        const defs = vocabData.map(v => ({ id: v.id, definition: v.definition, term: v.term }));
        setShuffledDefs([...defs].sort(() => Math.random() - 0.5));
      }, [vocabData]);

      const toggleCardFlip = (id) => {
        setFlippedCards(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handleSelectTerm = (vocabObj) => {
        if (matchedPairs.includes(vocabObj.id)) return;
        setSelectedTerm(vocabObj);
      };

      const handleSelectDef = (defObj) => {
        if (!selectedTerm || matchedPairs.includes(defObj.id)) return;

        if (selectedTerm.id === defObj.id) {
          // Correct match
          setMatchedPairs(prev => [...prev, defObj.id]);
          onEarnPoints(15);
          setMatchingScore(prev => prev + 1);
          setSelectedTerm(null);

          if (matchedPairs.length + 1 === vocabData.length) {
            onComplete();
          }
        } else {
          // Incorrect match
          setSelectedTerm(null);
        }
      };

      return (
        <div className="space-y-6">
          {/* TOP MODULE HEADER */}
          <div className="bg-slate-800/80 rounded-3xl p-6 border border-slate-700/80 flex flex-wrap justify-between items-center gap-4 shadow-xl">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/30">
                Module 1 • Family Terms
              </span>
              <h2 className="text-2xl font-black text-white mt-2">🎴 Family Vocabulary & Lexicon Lab</h2>
              <p className="text-xs text-slate-400 mt-1">Master B1-B2 terms describing extended family dynamics and relationships.</p>
            </div>

            {/* View Mode Switcher */}
            <div className="flex bg-slate-900 p-1.5 rounded-2xl border border-slate-700/80">
              <button
                onClick={() => setViewMode('flashcards')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                  viewMode === 'flashcards' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                }`}
              >
                🃏 3D Flashcards
              </button>
              <button
                onClick={() => setViewMode('matching')}
                className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                  viewMode === 'matching' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                }`}
              >
                🧩 Matching Challenge
              </button>
            </div>
          </div>

          {/* FLASHCARDS VIEW */}
          {viewMode === 'flashcards' && (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
              {vocabData.map((item) => {
                const isFlipped = flippedCards[item.id];
                return (
                  <div
                    key={item.id}
                    onClick={() => toggleCardFlip(item.id)}
                    className="perspective-1000 h-64 cursor-pointer group"
                  >
                    <div className={`relative w-full h-full transition-transform duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                      
                      {/* FRONT */}
                      <div className="absolute inset-0 bg-slate-800/90 rounded-3xl p-6 border border-slate-700/80 shadow-xl backface-hidden flex flex-col justify-between items-center text-center group-hover:border-indigo-500/50 transition">
                        <div className="w-full flex justify-between items-center text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                          <span className="bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded-full border border-indigo-500/30">{item.cefr}</span>
                          <span>Click to Flip 🔄</span>
                        </div>

                        <div>
                          <h3 className="text-xl font-extrabold text-white capitalize">{item.term}</h3>
                          <span className="text-xs italic text-indigo-300 block mt-1">[{item.partOfSpeech}]</span>
                        </div>

                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            speakText(item.term);
                          }}
                          className="text-xs bg-slate-700 hover:bg-slate-600 text-indigo-300 font-semibold px-3 py-1.5 rounded-xl border border-slate-600 transition flex items-center gap-1.5"
                        >
                          🔊 Listen Pronunciation
                        </button>
                      </div>

                      {/* BACK */}
                      <div className="absolute inset-0 bg-slate-900 rounded-3xl p-6 border border-indigo-500/40 shadow-xl backface-hidden rotate-y-180 flex flex-col justify-between text-left">
                        <div>
                          <div className="flex justify-between items-center text-[10px] text-indigo-400 uppercase tracking-wider font-bold mb-2">
                            <span>Definition</span>
                            <span>Click to Flip 🔄</span>
                          </div>
                          <p className="text-xs text-slate-200 leading-relaxed font-sans">{item.definition}</p>
                        </div>

                        <div className="bg-slate-800/90 p-3 rounded-2xl border border-slate-700/80">
                          <span className="text-[10px] font-bold text-indigo-300 uppercase block mb-0.5">Example Context:</span>
                          <p className="text-xs text-slate-300 italic">"{item.example}"</p>
                        </div>
                      </div>

                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* MATCHING CHALLENGE VIEW */}
          {viewMode === 'matching' && (
            <div className="bg-slate-800/90 rounded-3xl p-6 sm:p-8 border border-slate-700/80 shadow-2xl space-y-6">
              <div className="flex justify-between items-center border-b border-slate-700 pb-4">
                <div>
                  <h3 className="text-lg font-bold text-white">Match Family Terms with Definitions</h3>
                  <p className="text-xs text-slate-400">Click a term on the left, then click its corresponding definition on the right.</p>
                </div>
                <div className="text-right">
                  <span className="text-xs text-slate-400 block">Matched Pairs</span>
                  <span className="text-lg font-extrabold text-indigo-400">{matchedPairs.length} / {vocabData.length}</span>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {/* Left Column: Terms */}
                <div className="space-y-3">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Family Terms</h4>
                  {vocabData.map((item) => {
                    const isMatched = matchedPairs.includes(item.id);
                    const isSelected = selectedTerm?.id === item.id;

                    let btnStyle = "bg-slate-900 border-slate-700 text-slate-200 hover:border-indigo-500/50";
                    if (isMatched) btnStyle = "bg-emerald-500/20 border-emerald-500/50 text-emerald-300 cursor-not-allowed opacity-60";
                    else if (isSelected) btnStyle = "bg-indigo-600 border-indigo-400 text-white ring-2 ring-indigo-500/50";

                    return (
                      <button
                        key={item.id}
                        disabled={isMatched}
                        onClick={() => handleSelectTerm(item)}
                        className={`w-full text-left p-3.5 rounded-2xl border text-sm font-bold transition flex justify-between items-center ${btnStyle}`}
                      >
                        <span>{item.term}</span>
                        {isMatched && <span>✅</span>}
                      </button>
                    );
                  })}
                </div>

                {/* Right Column: Definitions */}
                <div className="space-y-3">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Definitions</h4>
                  {shuffledDefs.map((defItem) => {
                    const isMatched = matchedPairs.includes(defItem.id);

                    let btnStyle = "bg-slate-900 border-slate-700 text-slate-300 hover:border-indigo-500/50";
                    if (isMatched) btnStyle = "bg-emerald-500/20 border-emerald-500/50 text-emerald-300 cursor-not-allowed opacity-60";

                    return (
                      <button
                        key={defItem.id}
                        disabled={isMatched}
                        onClick={() => handleSelectDef(defItem)}
                        className={`w-full text-left p-3.5 rounded-2xl border text-xs leading-relaxed transition ${btnStyle}`}
                      >
                        {defItem.definition}
                      </button>
                    );
                  })}
                </div>
              </div>

              {matchedPairs.length === vocabData.length && (
                <div className="p-6 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl text-center space-y-2">
                  <span className="text-3xl">🎉</span>
                  <h4 className="text-lg font-bold text-emerald-300">Vocabulary Mastered!</h4>
                  <p className="text-xs text-slate-300">You successfully matched all B1-B2 family lexicon terms!</p>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MODULE 2: SYNTACTIC FUNCTION IDENTIFIER
    // ==========================================

    function Module2Function({ questions, onEarnPoints, onResetStreak, onComplete }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isSubmitted, setIsSubmitted] = useState(false);

      const currentQ = questions[currentIndex];

      const handleSelectOption = (code) => {
        if (isSubmitted) return;
        setSelectedOption(code);
      };

      const handleSubmit = () => {
        if (!selectedOption || isSubmitted) return;
        setIsSubmitted(true);

        if (selectedOption === currentQ.correct) {
          onEarnPoints(20);
        } else {
          onResetStreak();
        }
      };

      const handleNext = () => {
        if (currentIndex < questions.length - 1) {
          setCurrentIndex(prev => prev + 1);
          setSelectedOption(null);
          setIsSubmitted(false);
        } else {
          onComplete();
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          {/* HEADER */}
          <div className="bg-slate-800/80 rounded-3xl p-6 border border-slate-700/80 shadow-xl flex justify-between items-center">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-purple-400 bg-purple-500/10 px-3 py-1 rounded-full border border-purple-500/30">
                Module 2 • Syntactic Functions
              </span>
              <h2 className="text-2xl font-black text-white mt-2">🧩 Noun Clause Function Identifier</h2>
            </div>
            <div className="text-right">
              <span className="text-xs text-slate-400 font-medium block">Question Progress</span>
              <span className="text-sm font-extrabold text-purple-400">{currentIndex + 1} / {questions.length}</span>
            </div>
          </div>

          {/* MAIN CARD */}
          <div className="bg-slate-800/90 rounded-3xl p-6 sm:p-8 border border-slate-700/80 shadow-2xl space-y-6">
            <div>
              <p className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                Analyze the sentence below. What function does the highlighted noun clause serve?
              </p>
              <div className="bg-slate-900 p-5 rounded-2xl border border-slate-700 text-base sm:text-lg font-medium leading-relaxed text-slate-200">
                {currentQ.sentence.split('[').map((part, pIdx) => {
                  if (pIdx === 0) return part;
                  const [clausePart, rest] = part.split(']');
                  return (
                    <span key={pIdx}>
                      <mark className="bg-purple-500/30 text-purple-200 border-b-2 border-purple-400 px-1 py-0.5 rounded font-bold">
                        [{clausePart}]
                      </mark>
                      {rest}
                    </span>
                  );
                })}
              </div>
            </div>

            {/* OPTIONS GRID */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              {currentQ.options.map((opt) => {
                const isSelected = selectedOption === opt.code;
                let btnStyle = "bg-slate-900 border-slate-700 text-slate-300 hover:border-purple-500/50";

                if (isSelected) {
                  btnStyle = "bg-purple-600/30 border-purple-500 text-white ring-2 ring-purple-500/50 font-bold";
                }

                if (isSubmitted) {
                  if (opt.code === currentQ.correct) {
                    btnStyle = "bg-emerald-500/20 border-emerald-500 text-emerald-300 font-bold";
                  } else if (isSelected) {
                    btnStyle = "bg-rose-500/20 border-rose-500 text-rose-300";
                  }
                }

                return (
                  <button
                    key={opt.code}
                    onClick={() => handleSelectOption(opt.code)}
                    disabled={isSubmitted}
                    className={`p-4 rounded-2xl border text-sm text-left transition flex items-center justify-between ${btnStyle}`}
                  >
                    <span>{opt.label}</span>
                    {isSubmitted && opt.code === currentQ.correct && <span>✅</span>}
                  </button>
                );
              })}
            </div>

            {/* EXPLANATION & CONTROLS */}
            {isSubmitted && (
              <div className={`p-4 rounded-2xl border text-xs sm:text-sm space-y-1.5 ${
                selectedOption === currentQ.correct ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' : 'bg-rose-500/10 border-rose-500/30 text-rose-200'
              }`}>
                <p className="font-bold">
                  {selectedOption === currentQ.correct ? '🎉 Correct Function!' : '❌ Not Quite Correct!'}
                </p>
                <p className="text-slate-300 leading-relaxed">{currentQ.explanation}</p>
              </div>
            )}

            <div className="flex justify-end pt-2">
              {!isSubmitted ? (
                <button
                  onClick={handleSubmit}
                  disabled={!selectedOption}
                  className={`px-6 py-3 rounded-xl font-bold text-xs sm:text-sm transition shadow-lg ${
                    selectedOption ? 'bg-purple-600 hover:bg-purple-500 text-white shadow-purple-600/30' : 'bg-slate-700 text-slate-500 cursor-not-allowed'
                  }`}
                >
                  Confirm Answer
                </button>
              ) : (
                <button
                  onClick={handleNext}
                  className="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs sm:text-sm px-6 py-3 rounded-xl transition shadow-lg shadow-purple-600/30 flex items-center gap-2"
                >
                  {currentIndex < questions.length - 1 ? 'Next Question ➔' : 'Complete Module'}
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE 3: NOUN CLAUSE TRANSFORMER
    // ==========================================

    function Module3Transformer({ tasks, onEarnPoints, onResetStreak, onComplete }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedTiles, setSelectedTiles] = useState([]);
      const [availableTiles, setAvailableTiles] = useState([]);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [showHint, setShowHint] = useState(false);

      const currentTask = tasks[currentIndex];

      useEffect(() => {
        // Initialize tiles
        const shuffled = [...currentTask.tiles].sort(() => Math.random() - 0.5);
        setAvailableTiles(shuffled);
        setSelectedTiles([]);
        setIsSubmitted(false);
        setShowHint(false);
      }, [currentIndex]);

      const handleAddTile = (tile, index) => {
        if (isSubmitted) return;
        setSelectedTiles(prev => [...prev, tile]);
        setAvailableTiles(prev => prev.filter((_, i) => i !== index));
      };

      const handleRemoveTile = (tile, index) => {
        if (isSubmitted) return;
        setSelectedTiles(prev => prev.filter((_, i) => i !== index));
        setAvailableTiles(prev => [...prev, tile]);
      };

      const handleSubmit = () => {
        if (isSubmitted) return;
        setIsSubmitted(true);

        const constructedSentence = selectedTiles.join(" ").toLowerCase();
        const target = currentTask.correctClause.toLowerCase();

        if (constructedSentence === target) {
          onEarnPoints(25);
        } else {
          onResetStreak();
        }
      };

      const handleNext = () => {
        if (currentIndex < tasks.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          onComplete();
        }
      };

      const userString = selectedTiles.join(" ").toLowerCase();
      const targetString = currentTask.correctClause.toLowerCase();
      const isCorrect = userString === targetString;

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          {/* HEADER */}
          <div className="bg-slate-800/80 rounded-3xl p-6 border border-slate-700/80 shadow-xl flex justify-between items-center">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/30">
                Module 3 • Statement Word Order
              </span>
              <h2 className="text-2xl font-black text-white mt-2">🔄 Noun Clause Transformer</h2>
            </div>
            <div className="text-right">
              <span className="text-xs text-slate-400 font-medium block">Task Progress</span>
              <span className="text-sm font-extrabold text-emerald-400">{currentIndex + 1} / {tasks.length}</span>
            </div>
          </div>

          {/* MAIN TRANSFORMER CARD */}
          <div className="bg-slate-800/90 rounded-3xl p-6 sm:p-8 border border-slate-700/80 shadow-2xl space-y-6">
            {/* PROMPT */}
            <div>
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Original Direct Item:</span>
              <p className="text-lg font-bold text-amber-300 italic bg-slate-900 p-4 rounded-2xl border border-slate-700">
                "{currentTask.directQuestion || currentTask.directStatement}"
              </p>
            </div>

            {/* CLAUSE BUILDER BOX */}
            <div className="space-y-2">
              <div className="flex justify-between items-center">
                <span className="text-xs font-bold uppercase tracking-wider text-slate-300">
                  Constructed Sentence:
                </span>
                <button
                  onClick={() => setShowHint(!showHint)}
                  className="text-xs text-indigo-400 hover:text-indigo-300 font-semibold"
                >
                  {showHint ? "Hide Hint 💡" : "Show Rule Hint 💡"}
                </button>
              </div>

              {showHint && (
                <div className="p-3 bg-indigo-500/10 border border-indigo-500/30 rounded-xl text-xs text-indigo-200">
                  {currentTask.explanation}
                </div>
              )}

              {/* Starter + Tile drop area */}
              <div className="bg-slate-900 p-5 rounded-2xl border border-slate-700 min-h-[100px] flex flex-wrap items-center gap-2">
                <span className="font-extrabold text-slate-200 text-sm sm:text-base mr-2">{currentTask.starter}</span>
                {selectedTiles.map((tile, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleRemoveTile(tile, idx)}
                    className="bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-200 border border-emerald-500/50 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1 shadow-sm"
                  >
                    <span>{tile}</span>
                    <span className="text-[10px] text-emerald-400">✕</span>
                  </button>
                ))}
              </div>
            </div>

            {/* AVAILABLE WORD TILES */}
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Available Word Tiles (Click to Insert):</span>
              <div className="flex flex-wrap gap-2.5 bg-slate-900/50 p-4 rounded-2xl border border-slate-800 min-h-[70px]">
                {availableTiles.map((tile, idx) => {
                  const isDistractor = currentTask.distractors.includes(tile);
                  return (
                    <button
                      key={idx}
                      onClick={() => handleAddTile(tile, idx)}
                      className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition shadow-sm hover:scale-105"
                    >
                      {tile}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* FEEDBACK & ACTION */}
            {isSubmitted && (
              <div className={`p-4 rounded-2xl border text-xs sm:text-sm space-y-1 ${
                isCorrect ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200' : 'bg-rose-500/10 border-rose-500/30 text-rose-200'
              }`}>
                <p className="font-bold">{isCorrect ? '✅ Perfect Statement Order!' : '❌ Word Order Error!'}</p>
                <p className="text-slate-300">Correct Target: <strong>{currentTask.starter} {currentTask.correctClause}</strong></p>
              </div>
            )}

            <div className="flex justify-end pt-2">
              {!isSubmitted ? (
                <button
                  onClick={handleSubmit}
                  disabled={selectedTiles.length === 0}
                  className={`px-6 py-3 rounded-xl font-bold text-xs sm:text-sm transition shadow-lg ${
                    selectedTiles.length > 0 ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-600/30' : 'bg-slate-700 text-slate-500 cursor-not-allowed'
                  }`}
                >
                  Verify Noun Clause
                </button>
              ) : (
                <button
                  onClick={handleNext}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm px-6 py-3 rounded-xl transition shadow-lg shadow-emerald-600/30 flex items-center gap-2"
                >
                  {currentIndex < tasks.length - 1 ? 'Next Sentence ➔' : 'Complete Module'}
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE 4: ERROR DETECTIVE
    // ==========================================

    function Module4Detective({ cases, onEarnPoints, onResetStreak, onComplete }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOptionIdx, setSelectedOptionIdx] = useState(null);
      const [isSubmitted, setIsSubmitted] = useState(false);

      const currentCase = cases[currentIndex];

      const handleSelectOption = (idx) => {
        if (isSubmitted) return;
        setSelectedOptionIdx(idx);
      };

      const handleSubmit = () => {
        if (selectedOptionIdx === null || isSubmitted) return;
        setIsSubmitted(true);

        if (currentCase.options[selectedOptionIdx].correct) {
          onEarnPoints(20);
        } else {
          onResetStreak();
        }
      };

      const handleNext = () => {
        if (currentIndex < cases.length - 1) {
          setCurrentIndex(prev => prev + 1);
          setSelectedOptionIdx(null);
          setIsSubmitted(false);
        } else {
          onComplete();
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          {/* HEADER */}
          <div className="bg-slate-800/80 rounded-3xl p-6 border border-slate-700/80 shadow-xl flex justify-between items-center">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-rose-400 bg-rose-500/10 px-3 py-1 rounded-full border border-rose-500/30">
                Module 4 • Error Analysis
              </span>
              <h2 className="text-2xl font-black text-white mt-2">🔍 Error Detective: Spot & Fix</h2>
            </div>
            <div className="text-right">
              <span className="text-xs text-slate-400 font-medium block">Case Progress</span>
              <span className="text-sm font-extrabold text-rose-400">{currentIndex + 1} / {cases.length}</span>
            </div>
          </div>

          {/* MAIN CARD */}
          <div className="bg-slate-800/90 rounded-3xl p-6 sm:p-8 border border-slate-700/80 shadow-2xl space-y-6">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Flawed Sentence Case:</span>
              <div className="bg-slate-900 p-5 rounded-2xl border border-slate-700 text-base sm:text-lg font-medium text-slate-200">
                {currentCase.incorrectText.split(currentCase.errorPart).map((part, idx, arr) => (
                  <span key={idx}>
                    {part}
                    {idx < arr.length - 1 && (
                      <span className="bg-rose-500/20 text-rose-300 border-b-2 border-rose-500 px-1 py-0.5 rounded font-bold">
                        {currentCase.errorPart}
                      </span>
                    )}
                  </span>
                ))}
              </div>
            </div>

            {/* FIX CHOICES */}
            <div className="space-y-3">
              <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block">Select the Correct Rewritten Fix:</span>
              <div className="space-y-2.5">
                {currentCase.options.map((opt, idx) => {
                  const isSelected = selectedOptionIdx === idx;
                  let btnStyle = "bg-slate-900 border-slate-700 text-slate-300 hover:border-rose-500/50";

                  if (isSelected) {
                    btnStyle = "bg-rose-600/30 border-rose-500 text-white ring-2 ring-rose-500/50 font-bold";
                  }

                  if (isSubmitted) {
                    if (opt.correct) {
                      btnStyle = "bg-emerald-500/20 border-emerald-500 text-emerald-300 font-bold";
                    } else if (isSelected) {
                      btnStyle = "bg-rose-500/20 border-rose-500 text-rose-300";
                    }
                  }

                  return (
                    <button
                      key={idx}
                      onClick={() => handleSelectOption(idx)}
                      disabled={isSubmitted}
                      className={`w-full text-left p-4 rounded-2xl border text-sm transition flex items-center justify-between ${btnStyle}`}
                    >
                      <span>{opt.text}</span>
                      {isSubmitted && opt.correct && <span>✅</span>}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* EXPLANATION */}
            {isSubmitted && (
              <div className="p-4 rounded-2xl bg-slate-900 border border-slate-700 text-xs sm:text-sm space-y-1">
                <p className="font-bold text-indigo-300">🔎 Grammar Detective Notes:</p>
                <p className="text-slate-300 leading-relaxed">{currentCase.explanation}</p>
              </div>
            )}

            <div className="flex justify-end pt-2">
              {!isSubmitted ? (
                <button
                  onClick={handleSubmit}
                  disabled={selectedOptionIdx === null}
                  className={`px-6 py-3 rounded-xl font-bold text-xs sm:text-sm transition shadow-lg ${
                    selectedOptionIdx !== null ? 'bg-rose-600 hover:bg-rose-500 text-white shadow-rose-600/30' : 'bg-slate-700 text-slate-500 cursor-not-allowed'
                  }`}
                >
                  Apply Fix
                </button>
              ) : (
                <button
                  onClick={handleNext}
                  className="bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs sm:text-sm px-6 py-3 rounded-xl transition shadow-lg shadow-rose-600/30 flex items-center gap-2"
                >
                  {currentIndex < cases.length - 1 ? 'Next Case ➔' : 'Complete Module'}
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE 5: STORY LAB
    // ==========================================

    function Module5Story({ prompts, onEarnPoints, onComplete }) {
      const [userChoices, setUserChoices] = useState({});
      const [isChecked, setIsChecked] = useState(false);

      const handleChange = (key, val) => {
        if (isChecked) return;
        setUserChoices(prev => ({ ...prev, [key]: val }));
      };

      const handleCheckStory = () => {
        let correctCount = 0;
        Object.keys(prompts).forEach(k => {
          if (userChoices[k] === prompts[k].answer) correctCount++;
        });

        onEarnPoints(correctCount * 10);
        setIsChecked(true);
        onComplete();
      };

      const renderSelect = (key) => {
        const p = prompts[key];
        const userVal = userChoices[key] || "";
        const isCorrect = isChecked && userVal === p.answer;
        const isWrong = isChecked && userVal !== p.answer;

        let borderClass = "border-slate-700 bg-slate-900 text-slate-200";
        if (isChecked) {
          if (isCorrect) borderClass = "border-emerald-500 bg-emerald-500/20 text-emerald-300 font-bold";
          else if (isWrong) borderClass = "border-rose-500 bg-rose-500/20 text-rose-300";
        }

        return (
          <select
            value={userVal}
            onChange={(e) => handleChange(key, e.target.value)}
            disabled={isChecked}
            className={`mx-1 my-1 px-3 py-1.5 rounded-xl text-xs sm:text-sm border focus:outline-none focus:ring-2 focus:ring-indigo-500 ${borderClass}`}
          >
            <option value="">-- Choose clause/term --</option>
            {p.options.map((opt, idx) => (
              <option key={idx} value={opt}>{opt}</option>
            ))}
          </select>
        );
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-slate-800/80 rounded-3xl p-6 border border-slate-700/80 shadow-xl flex justify-between items-center">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/30">
                Module 5 • Contextual Application
              </span>
              <h2 className="text-2xl font-black text-white mt-2">📖 Story Lab: "The Unexpected Family Secret"</h2>
            </div>
          </div>

          <div className="bg-slate-800/90 rounded-3xl p-6 sm:p-8 border border-slate-700/80 shadow-2xl space-y-6 leading-relaxed text-sm sm:text-base text-slate-200">
            <p>
              My grandmother Clara has always been the undisputed {renderSelect("vocab1")} of our household. 
              Even though our {renderSelect("vocab2")} lives in a modern city, Clara works hard to keep our entire extended family {renderSelect("vocab3")}. 
              Last Sunday, Clara invited everyone—including her {renderSelect("vocab4")}—for dinner.
            </p>

            <p>
              During dessert, Clara announced {renderSelect("clause5")}. 
              She told us {renderSelect("clause6")}. 
              My brother Luke immediately asked {renderSelect("clause7")} next summer. 
              Clara smiled and concluded that {renderSelect("clause8")} is something we should never forget.
            </p>

            <div className="pt-4 flex justify-between items-center border-t border-slate-700">
              {!isChecked ? (
                <button
                  onClick={handleCheckStory}
                  disabled={Object.keys(userChoices).length < Object.keys(prompts).length}
                  className={`px-6 py-3 rounded-xl font-bold text-xs sm:text-sm transition shadow-lg ${
                    Object.keys(userChoices).length === Object.keys(prompts).length
                      ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-amber-600/30'
                      : 'bg-slate-700 text-slate-500 cursor-not-allowed'
                  }`}
                >
                  Check Story Completeness ({Object.keys(userChoices).length}/{Object.keys(prompts).length})
                </button>
              ) : (
                <div className="w-full flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-700">
                  <span className="text-xs font-bold text-emerald-400">
                    🎉 Story verified! Check highlighted choices above.
                  </span>
                  <button
                    onClick={() => {
                      setUserChoices({});
                      setIsChecked(false);
                    }}
                    className="bg-slate-800 hover:bg-slate-700 text-xs text-white font-semibold px-4 py-2 rounded-xl transition border border-slate-600"
                  >
                    Reset Passage
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE 6: REFLECTION & CERTIFICATE
    // ==========================================

    function Module6Certificate({ score, completedModules, studentName, setStudentName }) {
      const [reflections, setReflections] = useState({
        r1: "",
        r2: "",
        r3: ""
      });

      const triggerConfetti = () => {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      };

      useEffect(() => {
        triggerConfetti();
      }, []);

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="max-w-4xl mx-auto space-y-8">
          {/* CREATIVE REFLECTION INPUTS */}
          <div className="bg-slate-800/90 rounded-3xl p-6 sm:p-8 border border-slate-700/80 shadow-2xl space-y-6">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/30">
                Module 6 • Personal Production
              </span>
              <h2 className="text-2xl font-black text-white mt-2">💬 Creative Noun Clause Reflection</h2>
              <p className="text-xs text-slate-400 mt-1">
                Complete the prompts using correct noun clauses to demonstrate personalized mastery.
              </p>
            </div>

            <div className="space-y-4 text-xs sm:text-sm">
              <div>
                <label className="font-bold text-slate-200 block mb-1">
                  1. What I admire most about my family is...
                </label>
                <input
                  type="text"
                  placeholder="e.g., that we always support each other during difficult times."
                  value={reflections.r1}
                  onChange={(e) => setReflections({ ...reflections, r1: e.target.value })}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>

              <div>
                <label className="font-bold text-slate-200 block mb-1">
                  2. When I was growing up, my parents emphasized that...
                </label>
                <input
                  type="text"
                  placeholder="e.g., hard work and honesty are essential values."
                  value={reflections.r2}
                  onChange={(e) => setReflections({ ...reflections, r2: e.target.value })}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>

              <div>
                <label className="font-bold text-slate-200 block mb-1">
                  3. One thing my relatives often debate about is whether...
                </label>
                <input
                  type="text"
                  placeholder="e.g., we should hold our holiday reunion at the beach or in the mountains."
                  value={reflections.r3}
                  onChange={(e) => setReflections({ ...reflections, r3: e.target.value })}
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>
            </div>
          </div>

          {/* CERTIFICATE SECTION */}
          <div className="bg-slate-800/90 rounded-3xl p-6 sm:p-8 border border-slate-700/80 shadow-2xl space-y-6">
            <div className="flex flex-wrap justify-between items-center gap-4">
              <div>
                <h3 className="text-xl font-extrabold text-white">🎓 Certificate of Mastery Generator</h3>
                <p className="text-xs text-slate-400">Enter your name to generate your official B1-B2 completion certificate.</p>
              </div>

              <div className="flex items-center space-x-3">
                <input
                  type="text"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  className="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs font-bold text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  placeholder="Your Full Name"
                />
                <button
                  onClick={handlePrint}
                  className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center gap-1.5"
                >
                  🖨️ Print / Save PDF
                </button>
              </div>
            </div>

            {/* PRINTABLE CERTIFICATE CARD */}
            <div 
              id="printable-certificate"
              className="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 p-8 sm:p-12 rounded-3xl border-4 border-indigo-500/40 text-center space-y-6 relative overflow-hidden shadow-2xl"
            >
              <div className="absolute top-4 left-4 text-xs font-mono text-indigo-400/60">ID: GVL-FAMILY-NC-2026</div>
              <div className="absolute top-4 right-4 text-xs font-mono text-indigo-400/60">CEFR LEVEL B1-B2</div>

              <div className="space-y-2 pt-4">
                <span className="text-4xl">🏅</span>
                <h2 className="text-2xl sm:text-3xl font-black tracking-wider uppercase text-amber-400">
                  Certificate of Achievement
                </h2>
                <p className="text-xs text-slate-300 uppercase tracking-widest">Grammar & Vocab Lab • Family & Noun Clauses</p>
              </div>

              <div className="py-4 border-y border-indigo-500/30 space-y-2">
                <p className="text-xs text-slate-400">This certifies that</p>
                <p className="text-2xl sm:text-3xl font-black text-white underline decoration-indigo-500 decoration-2">{studentName}</p>
                <p className="text-xs text-slate-300 max-w-md mx-auto leading-relaxed pt-2">
                  has successfully completed all laboratory interactive modules in **Family Lexicon** and **Noun Clause Syntactic Functions & Statement Word Order**.
                </p>
              </div>

              <div className="grid grid-cols-3 gap-4 max-w-md mx-auto text-center text-xs">
                <div className="bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
                  <span className="text-slate-400 block text-[10px]">Total Score</span>
                  <span className="text-base font-black text-amber-400">{score} pts</span>
                </div>
                <div className="bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
                  <span className="text-slate-400 block text-[10px]">CEFR Standard</span>
                  <span className="text-base font-black text-indigo-300">B1 - B2</span>
                </div>
                <div className="bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
                  <span className="text-slate-400 block text-[10px]">Status</span>
                  <span className="text-base font-black text-emerald-400">VERIFIED</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // RENDER APP
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
