<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cipher & Certainty: Mystery Reading & Deduction Studio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cipher: {
              950: '#070a12',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
            },
            parchment: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            },
            emerald: {
              400: '#34d399',
              500: '#10b981',
            },
            crimson: {
              500: '#ef4444',
            }
          },
          fontFamily: {
            serif: ['Cinzel', 'Georgia', 'serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts: Cinzel, Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #070a12;
      color: #f8fafc;
    }
    .font-cipher-header {
      font-family: 'Cinzel', serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f59e0b;
    }

    /* Highlight Pulse Animation for Scanning Passage */
    .scan-highlight {
      background-color: rgba(245, 158, 11, 0.25);
      border-bottom: 2px solid #f59e0b;
      color: #fef3c7;
      border-radius: 4px;
      padding: 0 4px;
      transition: all 0.4s ease-in-out;
    }
    .scan-highlight-active {
      background-color: rgba(16, 185, 129, 0.35);
      border-bottom: 2px solid #10b981;
      color: #a7f3d0;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    /* Print Styles for Certificate */
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-certificate, #printable-certificate * {
        visibility: visible;
      }
      #printable-certificate {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 40px;
        background: #0f172a !important;
        color: #f8fafc !important;
        box-shadow: none !important;
        border: 8px double #f59e0b !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-cipher-950 text-slate-100 antialiased selection:bg-parchment-500 selection:text-cipher-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // AUDIO SYNTHESIZER HELPER (NO EXTERNAL SOUND FILES NEEDED)
    // =========================================================================
    const playSoundEffect = (type, enabled = true) => {
      if (!enabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'correct') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15); // G5
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'scan') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(350, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.start();
          osc.stop(ctx.currentTime + 0.03);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.35);
            osc.start(ctx.currentTime + idx * 0.09);
            osc.stop(ctx.currentTime + idx * 0.09 + 0.35);
          });
        }
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    };

    // Text To Speech Helper
    const speakText = (text, rate = 1.0) => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = rate;
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    };

    // =========================================================================
    // STATIC CURRICULUM DATA
    // =========================================================================

    const SCANNING_QUESTIONS = [
      {
        id: 'q1_year',
        prompt: "1. What year was the manuscript purchased by Wilfrid Voynich?",
        options: ["1912", "1404", "2009", "1942"],
        correct: "1912",
        highlightId: "hl_1912",
        explanation: "Scanning match: 'In 1912, rare-book dealer Wilfrid Voynich purchased...'"
      },
      {
        id: 'q2_pages',
        prompt: "2. How many handwritten pages does the volume contain?",
        options: ["120 pages", "240 pages", "408 pages", "500 pages"],
        correct: "240 pages",
        highlightId: "hl_240",
        explanation: "Scanning match: '...purchased an unusual 240-page handwritten book...'"
      },
      {
        id: 'q3_location',
        prompt: "3. In which city and country was the manuscript originally acquired?",
        options: ["London, UK", "Frascati, Italy", "New Haven, USA", "Paris, France"],
        correct: "Frascati, Italy",
        highlightId: "hl_frascati",
        explanation: "Scanning match: '...from a Jesuit college in Frascati, Italy.'"
      },
      {
        id: 'q4_carbon',
        prompt: "4. What timeframe was established by the 2009 radiocarbon testing?",
        options: ["1200–1250", "1404–1438", "1600–1650", "1890–1912"],
        correct: "1404–1438",
        highlightId: "hl_carbon",
        explanation: "Scanning match: '...revealed that the vellum was created between 1404 and 1438.'"
      },
      {
        id: 'q5_housing',
        prompt: "5. Where is the manuscript housed today and under what catalog number?",
        options: ["British Library (MS 100)", "Yale University (MS 408)", "Oxford Library (MS 200)", "Vatican Archives (MS 50)"],
        correct: "Yale University (MS 408)",
        highlightId: "hl_yale",
        explanation: "Scanning match: '...safely stored at Yale University under catalog number MS 408.'"
      }
    ];

    const DEDUCTION_EXERCISES = [
      {
        id: 1,
        context: "Radiocarbon testing dates the parchment precisely between 1404 and 1438.",
        prompt: "Therefore, the manuscript ________ a modern 20th-century forgery.",
        options: ["can't be", "must have been", "might be", "should be"],
        correct: "can't be",
        timeframe: "Present Certainty (Impossible)",
        explanation: "100% Negative Deduction: Because 15th-century parchment was proven by testing, it is logically impossible (can't be) for it to be a modern fake."
      },
      {
        id: 2,
        context: "The text contains hundreds of unique symbols found in no other historical language.",
        prompt: "The author ________ an encrypted cipher system designed to keep secrets.",
        options: ["must have invented", "couldn't invent", "might forgotten", "was supposed to write"],
        correct: "must have invented",
        timeframe: "Past Certainty (High Probability)",
        explanation: "100% Past Deduction: The unique symbols strongly indicate that the author created/invented their own cipher code."
      },
      {
        id: 3,
        context: "The book includes extensive drawings of strange plants and astronomical wheels.",
        prompt: "Scholars believe the writer ________ an herbalist, astrologer, or alchemist.",
        options: ["might have been", "can't be", "must to be", "had better be"],
        correct: "might have been",
        timeframe: "Past Speculation (50% Possibility)",
        explanation: "50% Past Speculation: We do not know the author's identity for sure, so 'might have been' expresses an educated possibility."
      },
      {
        id: 4,
        context: "Top World War II cryptographers, including Enigma experts, failed to crack the code.",
        prompt: "The code ________ extremely complex, or it ________ complete nonsense.",
        options: ["must be / could be", "can't be / must have", "should be / had better", "might have / couldn't be"],
        correct: "must be / could be",
        timeframe: "Mixed Deductions",
        explanation: "Combining 100% positive deduction ('must be') with 50% alternative possibility ('could be')."
      },
      {
        id: 5,
        context: "No written records explain why Wilfrid Voynich concealed where he obtained the book.",
        prompt: "Voynich ________ to protect his source, or he ________ afraid the manuscript was stolen.",
        options: ["might have wanted / may have been", "must be / can't be", "was supposed to / had better", "should have / ought to"],
        correct: "might have wanted / may have been",
        timeframe: "Past Unverified Speculation",
        explanation: "Dual past speculations ('might have wanted' / 'may have been') express two plausible historical theories."
      }
    ];

    const CLASSIFIER_ITEMS = [
      {
        id: 'c1',
        text: "The manuscript consists of 240 vellum pages housed at Yale University.",
        category: 'fact',
        rationale: "Factual Detail: Verifiable data obtained directly via scanning the text."
      },
      {
        id: 'c2',
        text: "The author must have possessed deep botanical knowledge to illustrate hundreds of plants.",
        category: 'deduction',
        rationale: "Certainty Deduction: Uses 'must have + V3' to form a logical conclusion based on evidence."
      },
      {
        id: 'c3',
        text: "I find it completely baffling that modern supercomputers haven't solved the code yet.",
        category: 'reaction',
        rationale: "Personal Reaction: Uses opinion frame 'I find it...' to express personal surprise."
      },
      {
        id: 'c4',
        text: "Radiocarbon analysis was conducted at the University of Arizona in 2009.",
        category: 'fact',
        rationale: "Factual Detail: Specific historical/scientific fact with year and location."
      },
      {
        id: 'c5',
        text: "The book could have been created as a hoax to sell to wealthy Renaissance collectors.",
        category: 'deduction',
        rationale: "Certainty Deduction: Uses 'could have + V3' to express a 50% past possibility."
      },
      {
        id: 'c6',
        text: "In my view, deciphering ancient manuscripts is the most thrilling branch of history.",
        category: 'reaction',
        rationale: "Personal Reaction: Uses stance starter 'In my view...' to state a subjective opinion."
      }
    ];

    const MYSTERY_TOPICS = [
      {
        id: 'voynich',
        title: "The Voynich Manuscript",
        icon: "📜",
        summary: "A 15th-century codex written in an unknown script with mysterious illustrations."
      },
      {
        id: 'roanoke',
        title: "The Lost Colony of Roanoke",
        icon: "🌲",
        summary: "In 1590, 115 English settlers vanished from Roanoke Island, leaving only the word 'CROATOAN' carved on a post."
      },
      {
        id: 'mary_celeste',
        title: "The Ghost Ship Mary Celeste",
        icon: "⛵",
        summary: "In 1872, an American merchant brigantine was found adrift in the Atlantic Ocean, completely deserted with all cargo untouched."
      }
    ];

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    function App() {
      const [xp, setXp] = useState(50);
      const [streak, setStreak] = useState(3);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [activeTab, setActiveTab] = useState('scanning'); // scanning, deduction, classifier, studio, certificate
      const [showHandbook, setShowHandbook] = useState(false);
      const [detectiveName, setDetectiveName] = useState('Investigator Morgan');

      // Rank calculation
      const getRank = (points) => {
        if (points < 120) return { title: "Novice Cryptographer", icon: "🔍", color: "text-amber-400 border-amber-500/30 bg-amber-500/10" };
        if (points < 250) return { title: "Assistant Investigator", icon: "🕵️‍♂️", color: "text-teal-400 border-teal-500/30 bg-teal-500/10" };
        if (points < 400) return { title: "Senior Investigator", icon: "💼", color: "text-indigo-400 border-indigo-500/30 bg-indigo-500/10" };
        return { title: "Master Cryptanalyst", icon: "👑", color: "text-emerald-400 border-emerald-500/30 bg-emerald-500/10" };
      };

      const currentRank = getRank(xp);

      const addXp = (amount) => {
        setXp(prev => prev + amount);
      };

      return (
        <div className="min-h-screen flex flex-col font-sans border-t-4 border-parchment-500">
          
          {/* HEADER & PROGRESS HUB */}
          <header className="bg-cipher-900 border-b border-slate-800 sticky top-0 z-40 shadow-2xl no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
              <div className="flex flex-wrap items-center justify-between gap-3">
                
                {/* Brand Title */}
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-parchment-500 to-parchment-600 flex items-center justify-center text-xl shadow-lg shadow-parchment-500/20 text-cipher-950 font-black">
                    🔮
                  </div>
                  <div>
                    <h1 className="text-base sm:text-lg font-black font-cipher-header tracking-wider text-parchment-400">
                      CIPHER & CERTAINTY
                    </h1>
                    <p className="text-[11px] text-slate-400 font-mono tracking-tight">Mystery Reading & Deduction Studio • ESL B1-B2</p>
                  </div>
                </div>

                {/* Case Stats Bar */}
                <div className="flex items-center space-x-2 sm:space-x-3">
                  
                  {/* Streak */}
                  <div className="flex items-center space-x-1.5 bg-cipher-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-mono" title="Daily Learning Streak">
                    <span className="text-amber-500">🔥</span>
                    <span className="font-bold text-slate-200">{streak} Days</span>
                  </div>

                  {/* Rank Badge */}
                  <div className={`hidden md:flex items-center space-x-1.5 border px-3 py-1.5 rounded-xl text-xs font-bold ${currentRank.color}`}>
                    <span>{currentRank.icon}</span>
                    <span>{currentRank.title}</span>
                  </div>

                  {/* XP Counter */}
                  <div className="flex items-center space-x-1.5 bg-cipher-950 border border-parchment-500/30 px-3 py-1.5 rounded-xl text-xs font-bold text-parchment-400">
                    <span>⭐</span>
                    <span>{xp} <span className="text-[10px] text-slate-400 font-normal">XP</span></span>
                  </div>

                  {/* Handbook Button */}
                  <button
                    onClick={() => {
                      setShowHandbook(true);
                      playSoundEffect('click', soundEnabled);
                    }}
                    className="bg-parchment-500 hover:bg-parchment-600 text-cipher-950 font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-md shadow-parchment-500/20"
                  >
                    <span>📖</span>
                    <span className="hidden sm:inline">Grammar & Phrase Drawer</span>
                  </button>

                  {/* Sound Toggle */}
                  <button
                    onClick={() => {
                      setSoundEnabled(!soundEnabled);
                      playSoundEffect('click', !soundEnabled);
                    }}
                    className={`p-2 rounded-xl border text-xs transition ${
                      soundEnabled 
                        ? 'bg-slate-800 border-parchment-500/50 text-parchment-400' 
                        : 'bg-cipher-950 border-slate-800 text-slate-500'
                    }`}
                    title="Toggle Audio Synth"
                  >
                    {soundEnabled ? '🔊' : '🔇'}
                  </button>

                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="mt-3 pt-2 border-t border-slate-800/80 flex items-center justify-between overflow-x-auto no-scrollbar">
                <nav className="flex items-center gap-2">
                  {[
                    { id: 'scanning', label: '1. Scanning Challenge', icon: '🔍' },
                    { id: 'deduction', label: '2. Certainty Lab', icon: '⚡' },
                    { id: 'classifier', label: '3. Evidence Sorting', icon: '📊' },
                    { id: 'studio', label: '4. Theory Writer', icon: '✍️' },
                    { id: 'certificate', label: '5. Accreditation', icon: '🎓' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => {
                        setActiveTab(tab.id);
                        playSoundEffect('click', soundEnabled);
                      }}
                      className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 ${
                        activeTab === tab.id
                          ? 'bg-parchment-500 text-cipher-950 font-black shadow-md shadow-parchment-500/20'
                          : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                      }`}
                    >
                      <span>{tab.icon}</span>
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </nav>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT WORKSPACE */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {activeTab === 'scanning' && (
              <Module1ScanningChallenge
                questions={SCANNING_QUESTIONS}
                addXp={addXp}
                soundEnabled={soundEnabled}
              />
            )}

            {activeTab === 'deduction' && (
              <Module2DeductionMatrix
                exercises={DEDUCTION_EXERCISES}
                addXp={addXp}
                soundEnabled={soundEnabled}
                speakText={speakText}
              />
            )}

            {activeTab === 'classifier' && (
              <Module3EvidenceClassifier
                items={CLASSIFIER_ITEMS}
                addXp={addXp}
                soundEnabled={soundEnabled}
              />
            )}

            {activeTab === 'studio' && (
              <Module4TheoryStudio
                topics={MYSTERY_TOPICS}
                addXp={addXp}
                soundEnabled={soundEnabled}
              />
            )}

            {activeTab === 'certificate' && (
              <Module5Certificate
                detectiveName={detectiveName}
                setDetectiveName={setDetectiveName}
                xp={xp}
                currentRank={currentRank}
                soundEnabled={soundEnabled}
              />
            )}
          </main>

          {/* QUICK REFERENCE GRAMMAR & PHRASE DRAWER */}
          {showHandbook && (
            <div className="fixed inset-0 bg-cipher-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-cipher-900 border border-slate-700 rounded-3xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl space-y-6 relative max-h-[90vh] overflow-y-auto text-slate-200">
                
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <div className="flex items-center space-x-2">
                    <span className="text-2xl">📖</span>
                    <h3 className="text-lg font-black font-cipher-header text-parchment-400">Cipher Reference Handbook</h3>
                  </div>
                  <button
                    onClick={() => setShowHandbook(false)}
                    className="text-slate-400 hover:text-white bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-6 text-xs sm:text-sm">
                  
                  {/* Table 1: Certainty Levels */}
                  <div className="space-y-2">
                    <h4 className="font-bold text-parchment-400 uppercase tracking-wider font-mono text-xs">
                      1. Modals of Deduction (Present vs. Past)
                    </h4>
                    <div className="overflow-x-auto rounded-2xl border border-slate-800">
                      <table className="w-full text-left border-collapse">
                        <thead className="bg-cipher-950 text-slate-400 text-[11px] uppercase font-mono">
                          <tr>
                            <th className="p-3 border-b border-slate-800">Certainty Level</th>
                            <th className="p-3 border-b border-slate-800">Present Formula</th>
                            <th className="p-3 border-b border-slate-800">Past Formula</th>
                            <th className="p-3 border-b border-slate-800">Example</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800 text-xs font-mono">
                          <tr className="hover:bg-slate-800/50">
                            <td className="p-3 font-bold text-emerald-400">100% Positive Certainty</td>
                            <td className="p-3">must + V1</td>
                            <td className="p-3">must have + V3</td>
                            <td className="p-3 text-slate-300">"The author **must have lived** in Europe."</td>
                          </tr>
                          <tr className="hover:bg-slate-800/50">
                            <td className="p-3 font-bold text-parchment-400">50% Possibility / Uncertainty</td>
                            <td className="p-3">might / could / may + V1</td>
                            <td className="p-3">might / could / may have + V3</td>
                            <td className="p-3 text-slate-300">"The text **could be** an ancient secret code."</td>
                          </tr>
                          <tr className="hover:bg-slate-800/50">
                            <td className="p-3 font-bold text-crimson-500">100% Negative Impossibility</td>
                            <td className="p-3">can't / couldn't + V1</td>
                            <td className="p-3">can't / couldn't have + V3</td>
                            <td className="p-3 text-slate-300">"It **can't have been** written in 1990."</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Section 2: Personal Reactions & Scanning Tips */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-cipher-950 p-4 rounded-2xl border border-slate-800 space-y-2">

    // =========================================================================
    // MODULE 1: SCANNING CHALLENGE (READING FOR SPECIFIC INFORMATION)
    // =========================================================================
    function Module1ScanningChallenge({ questions, addXp, soundEnabled }) {
      const [userAnswers, setUserAnswers] = useState({});
      const [activeHighlights, setActiveHighlights] = useState({});

      const handleAnswer = (q, selectedOpt) => {
        const isCorrect = selectedOpt === q.correct;
        setUserAnswers(prev => ({ ...prev, [q.id]: { choice: selectedOpt, isCorrect } }));

        if (isCorrect) {
          setActiveHighlights(prev => ({ ...prev, [q.highlightId]: true }));
          addXp(20);
          playSoundEffect('scan', soundEnabled);
        } else {
          playSoundEffect('wrong', soundEnabled);
        }
      };

      return (
        <div className="max-w-6xl mx-auto space-y-6">
          
          <div className="bg-cipher-900 rounded-3xl p-6 border border-slate-800 shadow-xl flex flex-wrap justify-between items-center gap-4">
            <div>
              <span className="text-xs font-mono font-bold uppercase tracking-wider text-parchment-400 bg-parchment-500/10 px-3 py-1 rounded-full border border-parchment-500/30">
                Module 1 • Reading for Specific Information
              </span>
              <h2 className="text-xl font-black font-cipher-header text-white mt-1">
                The Voynich Manuscript Scanning Lab

              </p>

          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* PASSAGE PANEL */}
            <div className="lg:col-span-6 bg-cipher-900 rounded-3xl p-6 border border-slate-800 shadow-xl space-y-4">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                <span className="text-xs font-mono font-bold text-amber-400 flex items-center gap-1.5">
                  <span>📜</span> Historical Evidence Text
                </span>
                <span className="text-[10px] font-mono text-slate-400">Scan for dates, names & numbers</span>
              </div>

              <div className="text-xs sm:text-sm leading-relaxed text-slate-300 font-serif space-y-3 bg-cipher-950 p-5 rounded-2xl border border-slate-800/80">
                <p>
                  In{" "}
                  <span className={`transition-all duration-500 ${activeHighlights.hl_1912 ? 'scan-highlight-active font-mono font-bold' : 'scan-highlight'}`}>
                    1912
                  </span>
                  , rare-book dealer Wilfrid Voynich purchased an unusual{" "}
                  <span className={`transition-all duration-500 ${activeHighlights.hl_240 ? 'scan-highlight-active font-mono font-bold' : 'scan-highlight'}`}>
                    240-page
                  </span>{" "}
                  handwritten book from a Jesuit college located in{" "}
                  <span className={`transition-all duration-500 ${activeHighlights.hl_frascati ? 'scan-highlight-active font-mono font-bold' : 'scan-highlight'}`}>
                    Frascati, Italy
                  </span>
                  . Written in an entirely unidentified alphabet accompanied by bizarre botanical and astrological illustrations, the mystery has baffled codebreakers for over a century.
                </p>

                <p>
                  Radiocarbon testing conducted at the University of Arizona in 2009 revealed that the parchment was created between{" "}
                  <span className={`transition-all duration-500 ${activeHighlights.hl_carbon ? 'scan-highlight-active font-mono font-bold' : 'scan-highlight'}`}>
                    1404 and 1438
                  </span>
                  , during the Early Renaissance. During World War II, top British and American cryptographers attempted to decipher the manuscript, but not a single sentence was successfully translated.
                </p>

                <p>
                  Today, the original manuscript is safely preserved at{" "}
                  <span className={`transition-all duration-500 ${activeHighlights.hl_yale ? 'scan-highlight-active font-mono font-bold' : 'scan-highlight'}`}>
                    Yale University under catalog number MS 408
                  </span>
                  , remaining one of history's greatest cryptographic enigmas.
                </p>
              </div>

              <div className="p-3 bg-cipher-950/60 rounded-xl border border-slate-800 text-[11px] font-mono text-slate-400 flex items-center justify-between">
                <span>Passage Highlights Active:</span>
                <span className="text-emerald-400 font-bold">
                  {Object.keys(activeHighlights).length} / {questions.length} Facts Discovered
                </span>
              </div>
            </div>

            {/* SCANNING QUESTIONS PANEL */}
            <div className="lg:col-span-6 space-y-4">
              {questions.map((q) => {
                const ans = userAnswers[q.id];

                return (
                  <div
                    key={q.id}
                    className={`p-5 rounded-3xl border transition space-y-3 ${
                      ans
                        ? ans.isCorrect
                          ? 'bg-emerald-950/20 border-emerald-500/80'
                          : 'bg-crimson-950/20 border-rose-500/80'
                        : 'bg-cipher-900 border-slate-800'
                    }`}
                  >
                    <p className="text-xs sm:text-sm font-mono font-bold text-slate-200">
                      {q.prompt}

                    <div className="grid grid-cols-2 gap-2">
                      {q.options.map((opt, idx) => {
                        const isChosen = ans?.choice === opt;

                        return (
                          <button

                            disabled={ans?.isCorrect}
                            onClick={() => handleAnswer(q, opt)}

            </div>

          </div>

        </div>

    // =========================================================================
    // MODULE 2: DEDUCTION & CERTAINTY MATRIX (GRAMMAR LAB)
    // =========================================================================
    function Module2DeductionMatrix({ exercises, addXp, soundEnabled, speakText }) {
      const [userChoices, setUserChoices] = useState({});
      const [checkedItems, setCheckedItems] = useState({});

      const handleSelectOption = (exId, opt) => {
        setUserChoices({ ...userChoices, [exId]: opt });
        playSoundEffect('click', soundEnabled);
      };

      const handleVerify = (ex) => {
        const choice = userChoices[ex.id];
        const isCorrect = choice === ex.correct;
        setCheckedItems({ ...checkedItems, [ex.id]: isCorrect });

        if (isCorrect) {
          addXp(25);
          playSoundEffect('correct', soundEnabled);
        } else {
          playSoundEffect('wrong', soundEnabled);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          
          <div className="bg-cipher-900 rounded-3xl p-6 border border-slate-800 shadow-xl">
            <span className="text-xs font-mono font-bold uppercase tracking-wider text-parchment-400 bg-parchment-500/10 px-3 py-1 rounded-full border border-parchment-500/30">
              Module 2 • Modals of Deduction Matrix
            </span>
            <h2 className="text-xl font-black font-cipher-header text-white mt-1">
              Grammar Lab: Degrees of Certainty
            </h2>
            <p className="text-xs text-slate-400 mt-1">
              Select the exact modal structure (`must have`, `might be`, `can't have`) to complete each historical deduction. Listen to native speech audio for pronunciation practice!
            </p>
          </div>

          <div className="space-y-4">
            {exercises.map((ex) => {
              const selectedOpt = userChoices[ex.id];
              const isChecked = checkedItems[ex.id] !== undefined;
              const isCorrect = checkedItems[ex.id] === true;

              // Complete sentence for Text To Speech
              const fullSentence = ex.prompt.replace("________", selectedOpt || ex.correct);

              return (
                <div
                  key={ex.id}
                  className={`bg-cipher-900 rounded-3xl p-6 border transition space-y-4 ${
                    isChecked
                      ? isCorrect
                        ? 'border-emerald-500/80 bg-emerald-950/10'
                        : 'border-rose-500/80 bg-rose-950/10'
                      : 'border-slate-800'
                  }`}
                >
                  <div className="flex justify-between items-start gap-3 border-b border-slate-800/80 pb-3">
                    <div>
                      <span className="text-[10px] font-mono font-bold text-teal-400 uppercase tracking-widest block">
                        Context Evidence:
                      </span>
                      <p className="text-xs text-slate-300 italic">"{ex.context}"</p>
                    </div>

                    <span className="text-[10px] font-mono text-parchment-400 bg-parchment-500/10 px-2.5 py-1 rounded-lg border border-parchment-500/20 shrink-0">
                      {ex.timeframe}
                    </span>
                  </div>

                  <div className="space-y-3">
                    <p className="text-xs sm:text-sm font-mono font-bold text-white leading-relaxed">
                      {ex.prompt}
                    </p>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {ex.options.map((opt, idx) => (
                        <button
                          key={idx}
                          disabled={isChecked}
                          onClick={() => handleSelectOption(ex.id, opt)}
                          className={`p-3 rounded-xl border text-xs font-mono text-left transition ${
                            selectedOpt === opt
                              ? 'bg-parchment-500 text-cipher-950 font-bold border-parchment-500 shadow-md'
                              : 'bg-cipher-950 border-slate-800 text-slate-300 hover:border-slate-700'
                          }`}
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex flex-wrap justify-between items-center gap-3 pt-2">
                    {/* Speech buttons */}
                    <div className="flex items-center space-x-2">
                      <button
                        onClick={() => speakText(fullSentence, 1.0)}
                        className="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-xl text-slate-200 font-mono transition flex items-center gap-1"
                        title="Normal Speed Audio"
                      >
                        🔊 1.0x Audio
                      </button>
                      <button
                        onClick={() => speakText(fullSentence, 0.75)}
                        className="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-xl text-slate-200 font-mono transition flex items-center gap-1"
                        title="Slow Speed Audio"
                      >
                        🐢 0.75x Slow
                      </button>
                    </div>

                    {isChecked ? (
                      <div className="text-xs font-mono">
                        <span className={`font-bold ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                          {isCorrect ? '✓ Correct Grammar Deduction (+25 XP)' : '❌ Incorrect Modal Choice'}
                        </span>
                      </div>
                    ) : (
                      <button
                        onClick={() => handleVerify(ex)}
                        disabled={!selectedOpt}
                        className={`px-5 py-2 rounded-xl text-xs font-bold transition ${
                          selectedOpt
                            ? 'bg-parchment-500 hover:bg-parchment-600 text-cipher-950 shadow-md'
                            : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                        }`}
                      >
                        Verify Deduction
                      </button>
                    )}
                  </div>

                  {isChecked && (
                    <div className="p-3 bg-cipher-950 rounded-2xl border border-slate-800 text-xs font-mono text-slate-300">
                      💡 <strong>Grammar Rationale:</strong> {ex.explanation}
                    </div>
                  )}

                </div>
              );
            })}
          </div>

        </div>
      );
    }

    // =========================================================================
    // MODULE 3: EVIDENCE CLASSIFIER (SORTING FACT VS DEDUCTION VS REACTION)
    // =========================================================================
    function Module3EvidenceClassifier({ items, addXp, soundEnabled }) {
      const [sortedCategories, setSortedCategories] = useState({});
      const [checkedItems, setCheckedItems] = useState({});

      const handleAssignCategory = (itemId, cat) => {
        setSortedCategories({ ...sortedCategories, [itemId]: cat });
        playSoundEffect('click', soundEnabled);
      };

      const handleVerifyItem = (item) => {
        const userCat = sortedCategories[item.id];
        const isCorrect = userCat === item.category;
        setCheckedItems({ ...checkedItems, [item.id]: isCorrect });

        if (isCorrect) {
          addXp(15);
          playSoundEffect('correct', soundEnabled);
        } else {
          playSoundEffect('wrong', soundEnabled);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          
          <div className="bg-cipher-900 rounded-3xl p-6 border border-slate-800 shadow-xl">
            <span className="text-xs font-mono font-bold uppercase tracking-wider text-parchment-400 bg-parchment-500/10 px-3 py-1 rounded-full border border-parchment-500/30">
              Module 3 • Evidence Classifier
            </span>
            <h2 className="text-xl font-black font-cipher-header text-white mt-1">
              Distinguish Fact, Certainty & Personal Reaction
            </h2>
            <p className="text-xs text-slate-400 mt-1">
              Classify each statement into its correct discourse type: Factual Detail (Scanning Data), Deduction (Grammar Modal), or Personal Reaction (Opinion).
            </p>
          </div>

          <div className="space-y-4">
            {items.map((item) => {
              const selectedCat = sortedCategories[item.id];
              const isChecked = checkedItems[item.id] !== undefined;
              const isCorrect = checkedItems[item.id] === true;

              return (
                <div
                  key={item.id}
                  className={`bg-cipher-900 rounded-3xl p-5 border transition space-y-4 ${
                    isChecked
                      ? isCorrect
                        ? 'border-emerald-500/80 bg-emerald-950/10'
                        : 'border-rose-500/80 bg-rose-950/10'
                      : 'border-slate-800'
                  }`}
                >
                  <p className="text-xs sm:text-sm font-mono font-medium text-slate-200 leading-relaxed">
                    "{item.text}"
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    {[
                      { id: 'fact', label: '📊 Factual Detail', desc: 'Scanning data' },
                      { id: 'deduction', label: '⚡ Certainty Deduction', desc: 'Modal verb structure' },
                      { id: 'reaction', label: '💬 Personal Reaction', desc: 'Opinion / stance' }
                    ].map((cat) => {
                      const isSelected = selectedCat === cat.id;

                      return (
                        <button
                          key={cat.id}
                          disabled={isChecked}
                          onClick={() => handleAssignCategory(item.id, cat.id)}
                          className={`p-3 rounded-xl border text-xs font-mono text-left transition ${
                            isSelected
                              ? 'bg-parchment-500 text-cipher-950 font-bold border-parchment-500 shadow-md'
                              : 'bg-cipher-950 border-slate-800 text-slate-300 hover:border-slate-700'
                          }`}
                        >
                          <div className="font-bold">{cat.label}</div>
                          <div className="text-[10px] opacity-70">{cat.desc}</div>
                        </button>
                      );
                    })}
                  </div>

                  <div className="flex justify-between items-center pt-1 text-xs font-mono">
                    {isChecked ? (
                      <div className="space-y-1">
                        <span className={`font-bold ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                          {isCorrect ? '✓ Correct Classification (+15 XP)' : '❌ Incorrect Category'}
                        </span>
                        <p className="text-[11px] text-slate-400">💡 {item.rationale}</p>
                      </div>
                    ) : (
                      <button
                        onClick={() => handleVerifyItem(item)}
                        disabled={!selectedCat}
                        className={`px-4 py-1.5 rounded-xl text-xs font-bold transition ${
                          selectedCat
                            ? 'bg-parchment-500 hover:bg-parchment-600 text-cipher-950 shadow-md'
                            : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                        }`}
                      >
                        Verify Classification
                      </button>
                    )}
                  </div>

                </div>
              );
            })}
          </div>

        </div>
      );
    }

    // =========================================================================
    // MODULE 4: PERSONAL REACTION & THEORY STUDIO (GUIDED WRITING & LIVE DETECTOR)
    // =========================================================================
    function Module4TheoryStudio({ topics, addXp, soundEnabled }) {
      const [selectedTopicIdx, setSelectedTopicIdx] = useState(0);
      const [theoryText, setTheoryText] = useState(
        "In my view, the Voynich Manuscript must have been written by an ancient scholar in code. I find it fascinating that modern codebreakers couldn't solve it. The author could have created it to preserve secret botanical alchemy recipes."
      );
      const [detectedBadges, setDetectedBadges] = useState([]);

      const topic = topics[selectedTopicIdx];

      const TARGET_PATTERNS = [
        { label: "must have", regex: /must have/i, xp: 15 },
        { label: "might / could have", regex: /(might|could|may) have/i, xp: 15 },
        { label: "can't / couldn't have", regex: /can't have|couldn't have/i, xp: 15 },
        { label: "must / could be", regex: /(must|could|might|can't) be/i, xp: 10 },
        { label: "In my view", regex: /in my view/i, xp: 10 },
        { label: "I find it...", regex: /i find it (fascinating|baffling|bizarre|surprising)/i, xp: 10 },
        { label: "What strikes me...", regex: /what strikes me/i, xp: 10 },
        { label: "It seems to me...", regex: /it seems to me/i, xp: 10 }
      ];

      useEffect(() => {
        const found = TARGET_PATTERNS.filter(p => p.regex.test(theoryText));
        setDetectedBadges(found);
      }, [theoryText]);

      const wordCount = theoryText.trim().split(/\s+/).filter(Boolean).length;

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          
          <div className="bg-cipher-900 rounded-3xl p-6 border border-slate-800 shadow-xl space-y-4">
            <span className="text-xs font-mono font-bold uppercase tracking-wider text-parchment-400 bg-parchment-500/10 px-3 py-1 rounded-full border border-parchment-500/30">
              Module 4 • Theory Studio & Phrase Scanner
            </span>
            <h2 className="text-xl font-black font-cipher-header text-white mt-1">
              Formulate Your Personal Reaction & Deductive Theory
            </h2>

            {/* Topic Selector */}
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
              {topics.map((t, idx) => (
                <button
                  key={t.id}
                  onClick={() => {
                    setSelectedTopicIdx(idx);
                    playSoundEffect('click', soundEnabled);
                  }}
                  className={`p-4 rounded-2xl border text-left transition ${
                    selectedTopicIdx === idx
                      ? 'bg-parchment-500/10 border-parchment-500 text-white ring-1 ring-parchment-500/30'
                      : 'bg-cipher-950 border-slate-800 text-slate-400 hover:border-slate-700'
                  }`}
                >
                  <div className="text-2xl mb-1">{t.icon}</div>
                  <h3 className="font-bold text-xs sm:text-sm text-slate-200">{t.title}</h3>
                  <p className="text-[10px] text-slate-400 font-mono mt-0.5 line-clamp-2">{t.summary}</p>
                </button>
              ))}
            </div>
          </div>

          {/* Guided Writing Area */}
          <div className="bg-cipher-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
            
            <div className="space-y-2">
              <label className="text-xs font-mono font-bold text-amber-400 uppercase tracking-wider block">
                Draft Theory on "{topic.title}":
              </label>
              <textarea
                rows={6}
                value={theoryText}
                onChange={(e) => setTheoryText(e.target.value)}
                placeholder="Write your theory using certainty modals (must have, could be) and stance starters (In my view, I find it fascinating that...)"
                className="w-full bg-cipher-950 border border-slate-800 rounded-2xl p-4 text-xs sm:text-sm text-slate-100 font-mono leading-relaxed focus:outline-none focus:ring-2 focus:ring-parchment-500"
              />
              <div className="flex justify-between items-center text-[11px] font-mono text-slate-400">
                <span>Target Words: Modals + Stance Expressions</span>
                <span>Word Count: {wordCount} words</span>
              </div>
            </div>

            {/* Real-time Phrase Scanner */}
            <div className="bg-cipher-950 p-5 rounded-2xl border border-slate-800 space-y-3">
              <div className="flex justify-between items-center text-xs font-mono">
                <span className="font-bold text-parchment-400 uppercase tracking-wider">
                  ⚡ Live Phrase Scanner ({detectedBadges.length} Target Expressions Detected)
                </span>
                <span className="text-emerald-400 font-bold">
                  +{detectedBadges.reduce((acc, b) => acc + b.xp, 0)} Bonus Writing XP
                </span>
              </div>

              <div className="flex flex-wrap gap-2">
                {detectedBadges.length === 0 ? (
                  <span className="text-xs text-slate-500 italic font-mono">
                    Type expressions like "must have", "in my view", "i find it fascinating" to unlock writing badges...
                  </span>
                ) : (
                  detectedBadges.map((badge, idx) => (
                    <span
                      key={idx}
                      className="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[11px] font-mono font-bold px-3 py-1 rounded-full flex items-center gap-1.5 shadow-sm"
                    >
                      <span>✓</span>
                      <span>{badge.label}</span>
                      <span className="text-[9px] opacity-70">+{badge.xp} XP</span>
                    </span>
                  ))
                )}
              </div>
            </div>

          </div>

        </div>
      );
    }

    // =========================================================================
    // MODULE 5: PROGRESS SUMMARY & PRINTABLE CERTIFICATE
    // =========================================================================
    function Module5Certificate({ detectiveName, setDetectiveName, xp, currentRank, soundEnabled }) {

      useEffect(() => {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
        playSoundEffect('fanfare', soundEnabled);
      }, []);

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="max-w-4xl mx-auto space-y-8">
          
          {/* Certificate Customizer Bar */}
          <div className="bg-cipher-900 rounded-3xl p-6 border border-slate-800 shadow-xl flex flex-wrap justify-between items-center gap-4 no-print">
            <div>
              <span className="text-xs font-mono font-bold uppercase tracking-wider text-parchment-400 bg-parchment-500/10 px-3 py-1 rounded-full border border-parchment-500/30">
                Module 5 • Mastery Accreditation
              </span>
              <h2 className="text-xl font-black font-cipher-header text-white mt-1">
                Official Cryptographic Certificate
              </h2>
            </div>

            <div className="flex items-center space-x-3">
              <input
                type="text"
                value={detectiveName}
                onChange={(e) => setDetectiveName(e.target.value)}
                className="bg-cipher-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs font-bold text-white focus:outline-none focus:ring-2 focus:ring-parchment-500 font-mono"
                placeholder="Investigator Name"
              />
              <button
                onClick={handlePrint}
                className="bg-parchment-500 hover:bg-parchment-600 text-cipher-950 font-bold text-xs px-4 py-2 rounded-xl transition shadow-md shadow-parchment-500/20 flex items-center gap-2"
              >
                🖨️ Print Certificate
              </button>
            </div>
          </div>

          {/* PRINTABLE DIPLOMA / CERTIFICATE CARD */}
          <div 
            id="printable-certificate"
            className="bg-cipher-950 p-8 sm:p-12 rounded-3xl border-4 border-parchment-500/50 text-center space-y-6 relative overflow-hidden shadow-2xl text-slate-100"
          >
            <div className="absolute top-4 left-4 text-[10px] font-mono text-parchment-500/60">
              ACCREDITATION-NO: CIPHER-2026-STUDIO
            </div>
            <div className="absolute top-4 right-4 text-[10px] font-mono text-parchment-500/60">
              CEFR B1-B2 ESL ACCREDITATION
            </div>

            <div className="space-y-2 pt-4">
              <span className="text-5xl">🔮</span>
              <h2 className="text-2xl sm:text-3xl font-black font-cipher-header tracking-widest text-parchment-400">
                CERTIFICATE OF CRYPTOGRAPHIC MASTERY
              </h2>
              <p className="text-xs text-slate-400 uppercase tracking-widest font-mono">
                Cipher & Certainty • Mystery Reading & Deduction Studio
              </p>
            </div>

            <div className="py-4 border-y border-slate-800 space-y-3">
              <p className="text-xs text-slate-400">This official document certifies that</p>
              <p className="text-2xl sm:text-3xl font-black text-white underline decoration-parchment-500 decoration-2 font-cipher-header">{detectiveName}</p>
              <p className="text-xs text-slate-300 max-w-lg mx-auto leading-relaxed pt-2">
                has successfully completed all modules in **scanning for specific information** (dates, names, places) and **expressing degrees of certainty** using modal structures (`must have`, `might be`, `can't have`) and stance expressions.
              </p>
            </div>

            <div className="grid grid-cols-3 gap-4 max-w-md mx-auto text-center text-xs font-mono">
              <div className="bg-cipher-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">Title Rank</span>
                <span className="text-xs font-black text-parchment-400">{currentRank.title}</span>
              </div>
              <div className="bg-cipher-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">Total XP</span>
                <span className="text-xs font-black text-teal-300">{xp} XP</span>
              </div>
              <div className="bg-cipher-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">CEFR Level</span>
                <span className="text-xs font-black text-emerald-400">B1–B2 Proficient</span>
              </div>
            </div>
          </div>

        </div>
      );
    }

    // RENDER APP
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
