  <style>

      font-family: 'Plus Jakarta Sans', sans-serif;

    }

<body class="min-h-screen bg-urban-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // AUDIO SYNTHESIZER & SPEECH SYNTHESIS (TTS)
    // =========================================================================
    const playSound = (type, enabled = true) => {
      if (!enabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'correct') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.18); // A5
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(240, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.start();
          osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
            gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.35);
            osc.start(ctx.currentTime + idx * 0.1);
            osc.stop(ctx.currentTime + idx * 0.1 + 0.35);
          });
        }
      } catch (e) {
        console.warn("Web Audio API not supported or blocked", e);
      }
    };

    const speakText = (text, rate = 1.0) => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = rate;
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    };

    // =========================================================================
    // STATIC CURRICULUM DATA
    // =========================================================================

    const CITY_VOCABULARY = [
      {
        id: 'v1',
        word: 'vibrant',
        category: 'positive',

        icon: '✨'
      },
      {
        id: 'v2',
        word: 'concrete jungle',
        category: 'negative',
        definition: 'A modern city area with many tall concrete buildings and little green space or nature.',
        example: 'Without urban parks, downtown can feel like an overwhelming concrete jungle.',
        icon: '🏢'
      },
      {
        id: 'v3',
        word: 'sprawling',
        category: 'negative',
        definition: 'Covering a vast area in an unplanned, untidy, or scattered way.',
        example: 'Los Angeles is a sprawling metropolis where residents rely heavily on automobiles.',
        icon: '🚗'
      },
      {
        id: 'v4',

        category: 'positive',
        definition: 'Designed safely and conveniently for people walking rather than driving.',

        icon: '🚶‍♂️'
      },
      {
        id: 'v5',
        word: 'picturesque',
        category: 'positive',
        definition: 'Visually charming or attractive, like a beautiful painting.',
        example: 'Venice is famous for its picturesque canals and historic stone bridges.',
        icon: '🖼️'
      },
      {
        id: 'v6',
        word: 'congested',
        category: 'negative',
        definition: 'So crowded with traffic or people that movement is hindered.',
        example: 'Rush-hour roads in Jakarta become severely congested every evening.',
        icon: '🚦'
      },
      {
        id: 'v7',
        word: 'overpriced',
        category: 'negative',
        definition: 'Costing much more money than is reasonable or fair.',
        example: 'Housing in Zurich is notoriously overpriced for international students.',
        icon: '💸'
      },
      {
        id: 'v8',
        word: 'tranquil',
        category: 'positive',
        definition: 'Calm, peaceful, and free from disturbance or heavy noise.',
        example: 'Kyoto’s botanical gardens offer a tranquil sanctuary away from city bustle.',
        icon: '🌿'
      },
      {
        id: 'v9',
        word: 'cosmopolitan',
        category: 'positive',
        definition: 'Containing people, cultures, and influences from many different countries.',
        example: 'London is a cosmopolitan hub where over 300 languages are spoken daily.',
        icon: '🌍'
      },
      {
        id: 'v10',
        word: 'cramped',
        category: 'negative',
        definition: 'Uncomfortably small or lacking sufficient space for living or working.',
        example: 'Many young professionals in Hong Kong reside in cramped micro-apartments.',
        icon: '📦'
      }
    ];

    const CITY_COMPARISONS = [
      {
        id: 'comp1',
        cityA: 'Amsterdam',
        cityB: 'Los Angeles',
        attr: 'Pedestrian Infrastructure & Bike Accessibility',
        intensity: 'high',
        correctModifier: 'substantially',
        sampleSentence: 'Amsterdam is substantially more pedestrian-friendly than Los Angeles.',
        modifiers: ['substantially', 'slightly', 'marginally'],
        explanation: 'Use "substantially" or "far" when comparing extreme differences in urban layout.'
      },
      {
        id: 'comp2',
        cityA: 'Tokyo',
        cityB: 'New York City',
        attr: 'Transit Punctuality & Public Cleanliness',
        intensity: 'medium',
        correctModifier: 'significantly',
        sampleSentence: 'Tokyo’s rail system is significantly more punctual than New York’s subway network.',
        modifiers: ['significantly', 'marginally', 'barely'],
        explanation: 'Use "significantly" to highlight strong statistical or practical differences.'
      },
      {
        id: 'comp3',
        cityA: 'Venice',
        cityB: 'Vienna',
        attr: 'Historic Tourism Density',
        intensity: 'high',
        correctModifier: 'by far',
        sampleSentence: 'Venice is by far the most canal-centric city in Southern Europe.',
        modifiers: ['by far', 'slightly', 'a little'],
        explanation: 'Use "by far" before superlatives to indicate unmatched superiority or uniqueness.'
      },
      {
        id: 'comp4',
        cityA: 'Zurich',
        cityB: 'Geneva',
        attr: 'Overall Living Expense',
        intensity: 'low',
        correctModifier: 'slightly',
        sampleSentence: 'Zurich is slightly more expensive than Geneva for everyday dining.',
        modifiers: ['slightly', 'by far', 'substantially'],
        explanation: 'Use "slightly" or "marginally" when comparing subtle differences between similar cities.'
      }
    ];

    const URBAN_CRISES = [
      {
        id: 'crisis1',
        title: 'Severe Traffic Congestion',
        district: 'Metropolitan Core',
        icon: '🚦',
        problem: 'Peak-hour traffic speeds have dropped to 7 km/h. High carbon emissions and commuter frustration are at an all-time high.',
        targetGrammar: 'Modal of Strong Advice (had better) & Second Conditional',
        proposals: [
          {
            text: 'We had better introduce congestion pricing charges for private cars entering downtown.',
            scoreChange: +20,
            grammarType: 'Had Better (Strong Advice)',
            feedback: 'Excellent! "Had better" correctly emphasizes urgent policy action to prevent worsening traffic.'
          },
          {
            text: 'If city leaders built underground light rail tunnels, citizens would leave their cars at home.',
            scoreChange: +25,
            grammarType: 'Second Conditional (Hypothetical)',
            feedback: 'Superb! The second conditional ("If + past, would + verb") eloquently presents a transformative infrastructure proposal.'
          },
          {
            text: 'We should build three new parking garages in the historic central plaza.',
            scoreChange: -15,
            grammarType: 'Weak / Flawed Policy Proposal',
            feedback: 'Flawed strategy! Adding parking garages attracts more vehicle traffic into the congested core.'
          }
        ]
      },
      {
        id: 'crisis2',
        title: 'Housing Affordability Emergency',
        district: 'Residential Inner Ring',
        icon: '🏙️',
        problem: 'Rent prices have jumped 45% in 2 years. Essential workers (nurses, teachers, transit operators) are being priced out.',
        targetGrammar: 'Modal of Obligation (ought to / must)',
        proposals: [
          {
            text: 'Municipal authorities must mandate that 30% of new high-rise developments are reserved for affordable housing.',
            scoreChange: +25,
            grammarType: 'Must (Legal/Policy Obligation)',
            feedback: 'Outstanding! "Must" expresses vital mandatory regulatory action.'
          },
          {
            text: 'Developers ought to repurpose vacant commercial office towers into residential apartments.',
            scoreChange: +20,
            grammarType: 'Ought To (Moral Duty/Recommendation)',
            feedback: 'Great job! "Ought to" effectively highlights moral responsibility and practical adaptive reuse.'
          },
          {
            text: 'The city should eliminate all building safety standards so developers can build faster.',
            scoreChange: -20,
            grammarType: 'Hazardous Proposal',
            feedback: 'Dangerous choice! Compromising safety regulations endangers citizen lives.'
          }
        ]
      },
      {
        id: 'crisis3',
        title: 'Loss of Green Space & Urban Heat Islands',
        district: 'East Industrial Zone',
        icon: '🌳',
        problem: 'Recent concrete construction destroyed 80% of tree canopy, driving summer ambient temperatures up by 6°C.',
        targetGrammar: 'Second Conditional & Modal Recommendation',
        proposals: [
          {
            text: 'If urban planners planted 50,000 micro-forests, neighborhood temperatures would drop dramatically.',
            scoreChange: +25,
            grammarType: 'Second Conditional',
            feedback: 'Inspirational! Second conditional frames an visionary environmental solution.'
          },
          {
            text: 'The city ought to transform abandoned elevated train tracks into linear public parks.',
            scoreChange: +20,
            grammarType: 'Ought To',
            feedback: 'Brilliant! Reclaiming historic transit corridors creates vibrant green spaces.'
          },
          {
            text: 'We had better pave over remaining wetlands to construct artificial grass playgrounds.',
            scoreChange: -15,
            grammarType: 'Counter-productive',
            feedback: 'Inadvisable! Replacing natural wetlands with artificial turf worsens urban heat and flooding.'
          }
        ]
      }
    ];

    const TARGET_DETECTION_PATTERNS = [
      { id: 'p1', label: 'In my view / From my perspective', regex: /(in\s+my\s+view|from\s+my\s+perspective|as\s+far\s+as\s+i'm\s+concerned|what\s+appeals\s+to\s+me)/i, category: 'Opinion Frame' },
      { id: 'p2', label: 'Pedestrian-friendly / Vibrant / Tranquil', regex: /(pedestrian-friendly|vibrant|tranquil|cosmopolitan|picturesque)/i, category: 'Urban Vocab (+)' },
      { id: 'p3', label: 'Congested / Concrete jungle / Sprawling', regex: /(congested|concrete\s+jungle|sprawling|overpriced|cramped)/i, category: 'Urban Vocab (-)' },
      { id: 'p4', label: 'Substantially / Significantly / By far', regex: /(substantially|significantly|marginally|by\s+far)/i, category: 'Comparative Modifier' },
      { id: 'p5', label: 'Had better / Ought to / Must / Should', regex: /(had\s+better|ought\s+to|must|should)/i, category: 'Planning Modal' },
      { id: 'p6', label: 'Second Conditional (If ... would ...)', regex: /if\s+\w+.*?\b(built|banned|created|planted|introduced|had)\b.*?\bwould\b/i, category: 'Conditional Proposal' }
    ];

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    function App() {
      const [xp, setXp] = useState(110);
      const [streak, setStreak] = useState(5);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [ttsRate, setTtsRate] = useState(1.0);
      const [activeTab, setActiveTab] = useState('vocab'); // vocab, comparison, simulator, studio, certificate
      const [showCheatSheet, setShowCheatSheet] = useState(false);
      const [studentName, setStudentName] = useState('Alex Rivers');

      // Rank Titles based on XP
      const getRank = (points) => {
        if (points < 150) return { title: "Urban Tourist", icon: "🏙️", color: "text-amber-400 border-amber-500/30 bg-amber-500/10" };
        if (points < 300) return { title: "Suburban Architect", icon: "📐", color: "text-sky-400 border-sky-500/30 bg-sky-500/10" };
        if (points < 450) return { title: "Metropolitan Strategist", icon: "🏢", color: "text-indigo-400 border-indigo-500/30 bg-indigo-500/10" };
        return { title: "Chief City Planner", icon: "🏛️", color: "text-emerald-400 border-emerald-500/30 bg-emerald-500/10" };
      };

      const currentRank = getRank(xp);

      const addXp = (amount) => {
        setXp(prev => Math.max(0, prev + amount));
      };

      return (
        <div className="min-h-screen flex flex-col font-sans border-t-4 border-emerald-500">
          
          {/* HEADER & PROGRESS HUB */}
          <header className="bg-urban-900 border-b border-slate-800 sticky top-0 z-40 shadow-2xl no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
              <div className="flex flex-wrap items-center justify-between gap-3">
                
                {/* Brand & Title */}
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-sky-600 flex items-center justify-center text-xl shadow-lg shadow-emerald-500/20 font-black text-white">
                    🏙️
                  </div>
                  <div>
                    <h1 className="text-base sm:text-lg font-black font-header tracking-wide text-white">
                      URBANOPOLIS
                    </h1>
                    <p className="text-[11px] text-slate-400 font-mono tracking-tight">City Descriptions, Opinions & Planning Studio • B1-C1 ESL</p>
                  </div>
                </div>

                {/* Gamification Stats & Quick Controls */}
                <div className="flex items-center space-x-2 sm:space-x-3">
                  
                  {/* Streak */}
                  <div className="flex items-center space-x-1.5 bg-urban-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-mono" title="Daily Learning Streak">
                    <span className="text-amber-500">🔥</span>
                    <span className="font-bold text-slate-200">{streak} Days</span>
                  </div>

                  {/* Rank Badge */}
                  <div className={`hidden md:flex items-center space-x-1.5 border px-3 py-1.5 rounded-xl text-xs font-bold ${currentRank.color}`}>
                    <span>{currentRank.icon}</span>
                    <span>{currentRank.title}</span>
                  </div>

                  {/* XP Display */}
                  <div className="flex items-center space-x-1.5 bg-urban-950 border border-emerald-500/40 px-3 py-1.5 rounded-xl text-xs font-bold text-emerald-400">
                    <span>⚡</span>
                    <span>{xp} <span className="text-[10px] text-slate-400 font-normal">XP</span></span>
                  </div>

                  {/* Dual Speed TTS Selector */}
                  <div className="hidden sm:flex items-center bg-urban-950 border border-slate-800 rounded-xl p-1 text-[11px] font-mono">
                    <button
                      onClick={() => setTtsRate(1.0)}
                      className={`px-2 py-0.5 rounded-lg transition ${ttsRate === 1.0 ? 'bg-emerald-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
                    >
                      1.0x
                    </button>
                    <button
                      onClick={() => setTtsRate(0.75)}
                      className={`px-2 py-0.5 rounded-lg transition ${ttsRate === 0.75 ? 'bg-emerald-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
                    >
                      0.75x 🐢
                    </button>
                  </div>

                  {/* Grammar & Vocab Cheat Sheet Button */}
                  <button
                    onClick={() => {
                      setShowCheatSheet(true);
                      playSound('click', soundEnabled);
                    }}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-md shadow-emerald-600/20"
                  >
                    <span>📚</span>
                    <span className="hidden sm:inline">Grammar Matrix</span>
                  </button>

                  {/* Sound Toggle */}
                  <button
                    onClick={() => {
                      setSoundEnabled(!soundEnabled);
                      playSound('click', !soundEnabled);
                    }}
                    className={`p-2 rounded-xl border text-xs transition ${
                      soundEnabled 
                        ? 'bg-slate-800 border-emerald-500/40 text-emerald-400' 
                        : 'bg-urban-950 border-slate-800 text-slate-500'
                    }`}
                    title="Audio Effects Toggle"
                  >
                    {soundEnabled ? '🔊' : '🔇'}
                  </button>

                </div>
              </div>

              {/* Module Navigation */}
              <div className="mt-3 pt-2 border-t border-slate-800 flex items-center gap-2 overflow-x-auto no-scrollbar">
                {[
                  { id: 'vocab', label: '1. City Vocab Classifier', icon: '🏙️' },
                  { id: 'comparison', label: '2. City Comparison Studio', icon: '⚖️' },
                  { id: 'simulator', label: '3. Urban Planning Simulator', icon: '🏛️' },
                  { id: 'studio', label: '4. Ideal City Writing Studio', icon: '✍️' },
                  { id: 'certificate', label: '5. Accreditation Certificate', icon: '🎓' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => {
                      setActiveTab(tab.id);
                      playSound('click', soundEnabled);
                    }}
                    className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 ${
                      activeTab === tab.id
                        ? 'bg-emerald-600 text-white font-black shadow-lg shadow-emerald-600/25'
                        : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'

              <Module1VocabClassifier
                vocabulary={CITY_VOCABULARY}
                addXp={addXp}
                soundEnabled={soundEnabled}
                ttsRate={ttsRate}
              />
            )}

            {activeTab === 'comparison' && (
              <Module2ComparisonStudio
                comparisons={CITY_COMPARISONS}
                addXp={addXp}
                soundEnabled={soundEnabled}
                ttsRate={ttsRate}
              />
            )}

            {activeTab === 'simulator' && (
              <Module3PlanningSimulator
                crises={URBAN_CRISES}
                addXp={addXp}
                soundEnabled={soundEnabled}
                ttsRate={ttsRate}
              />
            )}

            {activeTab === 'studio' && (
              <Module4WritingStudio
                patterns={TARGET_DETECTION_PATTERNS}
                addXp={addXp}
                soundEnabled={soundEnabled}
                ttsRate={ttsRate}
              />
            )}

            {activeTab === 'certificate' && (
              <Module5Certificate
                studentName={studentName}
                setStudentName={setStudentName}
                xp={xp}
                currentRank={currentRank}
                soundEnabled={soundEnabled}
              />
            )}
          </main>

          {/* GRAMMAR & VOCABULARY CHEAT SHEET MODAL */}
          {showCheatSheet && (
            <div className="fixed inset-0 bg-urban-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-urban-900 border border-slate-700 rounded-3xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl space-y-6 relative max-h-[90vh] overflow-y-auto text-slate-200">
                
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <div className="flex items-center space-x-2">
                    <span className="text-2xl">📚</span>
                    <h3 className="text-lg font-black font-header text-emerald-400">Urban Language & Grammar Cheat Sheet</h3>
                  </div>

    // =========================================================================
    // MODULE 2: CITY COMPARISON & MODIFIER STUDIO
    // =========================================================================
    function Module2ComparisonStudio({ comparisons, addXp, soundEnabled, ttsRate }) {
      const [selectedIndex, setSelectedIndex] = useState(0);
      const [selectedModifier, setSelectedModifier] = useState('');
      const [builtSentence, setBuiltSentence] = useState('');
      const [feedback, setFeedback] = useState(null);

      const activeComp = comparisons[selectedIndex];

      const handleModifierSelect = (mod) => {
        setSelectedModifier(mod);
        playSound('click', soundEnabled);
        
        // Generate dynamic sentence
        let sentence = "";
        if (mod === 'by far') {
          sentence = `${activeComp.cityA} is ${mod} the most picturesque city regarding ${activeComp.attr.toLowerCase()}.`;
        } else {
          sentence = `${activeComp.cityA} is ${mod} more impressive than ${activeComp.cityB} in terms of ${activeComp.attr.toLowerCase()}.`;
        }
        setBuiltSentence(sentence);
      };

      const handleVerifySentence = () => {
        const isCorrect = selectedModifier === activeComp.correctModifier;
        if (isCorrect) {
          setFeedback({ isCorrect: true, msg: `✓ Perfect Comparison! (+20 XP). ${activeComp.explanation}` });
          addXp(20);
          playSound('correct', soundEnabled);
        } else {
          setFeedback({ isCorrect: false, msg: `❌ Not optimal. Target modifier for this comparison is "${activeComp.correctModifier}".` });
          playSound('wrong', soundEnabled);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-urban-900 rounded-3xl p-6 border border-slate-800 shadow-xl space-y-2">
            <span className="text-xs font-mono font-bold uppercase tracking-wider text-sky-400 bg-sky-500/10 px-3 py-1 rounded-full border border-sky-500/30">
              Module 2 • City Comparison & Modifier Studio
            </span>
            <h2 className="text-xl font-black font-header text-white">
              Fine-Tune Comparative Intensity
            </h2>
            <p className="text-xs text-slate-400">
              Select comparative modifiers (e.g., 'substantially', 'significantly', 'slightly') to construct precise global city analyses.
            </p>
          </div>

          {/* City Selection Carousel */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            {comparisons.map((c, idx) => (
              <button
                key={c.id}
                onClick={() => {
                  setSelectedIndex(idx);
                  setSelectedModifier('');
                  setBuiltSentence('');
                  setFeedback(null);
                  playSound('click', soundEnabled);
                }}
                className={`p-3 rounded-2xl border text-left transition ${
                  selectedIndex === idx
                    ? 'bg-sky-600/20 border-sky-500 text-white shadow-lg'
                    : 'bg-urban-900 border-slate-800 text-slate-400 hover:border-slate-700'
                }`}
              >
                <span className="text-[10px] font-mono text-sky-400 font-bold block">Comparison {idx + 1}</span>
                <span className="text-xs font-bold font-header line-clamp-1">{c.cityA} vs {c.cityB}</span>
              </button>
            ))}
          </div>

          {/* Active Comparison Card */}
          <div className="bg-urban-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
            
            <div className="flex flex-wrap justify-between items-center gap-4 border-b border-slate-800 pb-4">
              <div>
                <span className="text-[10px] font-mono uppercase tracking-widest text-slate-400">Comparing Global Metropolises:</span>
                <h3 className="text-xl font-bold font-header text-sky-400">{activeComp.cityA} ⚖️ {activeComp.cityB}</h3>
              </div>
              <div className="bg-urban-950 px-3.5 py-1.5 rounded-xl border border-slate-800 text-xs font-mono text-slate-300">
                Focus Attribute: <strong className="text-amber-400">{activeComp.attr}</strong>
              </div>
            </div>

            {/* Intensity Modifier Selector */}
            <div className="space-y-3">
              <label className="text-xs font-mono text-slate-400 uppercase tracking-wider block">
                Select Intensity Modifier:
              </label>

              <div className="grid grid-cols-3 gap-3">
                {activeComp.modifiers.map((mod) => (
                  <button
                    key={mod}
                    onClick={() => handleModifierSelect(mod)}
                    className={`p-3.5 rounded-2xl border font-mono text-xs font-bold transition text-center ${
                      selectedModifier === mod
                        ? 'bg-sky-600 border-sky-400 text-white shadow-md'
                        : 'bg-urban-950 border-slate-800 text-slate-300 hover:border-slate-700'
                    }`}
                  >
                    "{mod}"
                  </button>
                ))}
              </div>
            </div>

            {/* Dynamic Generated Comparison Sentence */}
            {builtSentence && (
              <div className="bg-urban-950 p-5 rounded-2xl border border-sky-500/30 space-y-3">
                <span className="text-[10px] font-mono text-sky-400 uppercase tracking-widest block font-bold">Constructed Comparative Analysis:</span>
                <p className="text-sm font-mono text-slate-100 font-bold leading-relaxed">
                  "{builtSentence}"

                <div className="flex justify-between items-center pt-2">
                  <button
                    onClick={() => speakText(builtSentence, ttsRate)}

                    <span>🔊</span>
                    <span>Listen Analysis ({ttsRate}x)</span>
                  </button>

                  <button
                    onClick={handleVerifySentence}
                    className="bg-sky-600 hover:bg-sky-500 text-white font-mono font-bold text-xs px-5 py-2 rounded-xl transition shadow-md"

    // =========================================================================
    // MODULE 3: URBAN PLANNING PROPOSAL SIMULATOR
    // =========================================================================
    function Module3PlanningSimulator({ crises, addXp, soundEnabled, ttsRate }) {
      const [livabilityScore, setLivabilityScore] = useState(55); // Starts at 55%
      const [activeCrisisIdx, setActiveCrisisIdx] = useState(0);
      const [selectedProposals, setSelectedProposals] = useState({});

      const crisis = crises[activeCrisisIdx];

      const handleProposalClick = (pIdx, proposal) => {
        if (selectedProposals[crisis.id] !== undefined) return; // already answered

        setSelectedProposals(prev => ({ ...prev, [crisis.id]: pIdx }));
        setLivabilityScore(prev => Math.min(100, Math.max(0, prev + proposal.scoreChange)));

        if (proposal.scoreChange > 0) {
          addXp(30);
          playSound('correct', soundEnabled);
        } else {
          playSound('wrong', soundEnabled);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">

              <div>
                <span className="text-xs font-mono font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/30">

                <h2 className="text-xl font-black font-header text-white mt-1">

            <div className="flex items-center space-x-3 border-b border-slate-800 pb-4">
              <span className="text-4xl">{crisis.icon}</span>

                <h3 className="text-lg font-bold font-header text-white">{crisis.title}</h3>

            </div>

                Submit Consultant Proposal:

              <div className="space-y-3">
                {crisis.proposals.map((prop, idx) => {
                  const isSelected = selectedProposals[crisis.id] === idx;
                  const isAnswered = selectedProposals[crisis.id] !== undefined;

                  return (
                    <div key={idx} className="space-y-2">
                      <button
                        onClick={() => handleProposalClick(idx, prop)}
                        disabled={isAnswered}
                        className={`w-full text-left p-4 rounded-2xl border font-mono text-xs sm:text-sm transition flex justify-between items-center gap-3 ${
                          isSelected
                            ? prop.scoreChange > 0
                              ? 'bg-emerald-950/60 border-emerald-500 text-emerald-200 font-bold'
                              : 'bg-rose-950/60 border-rose-500 text-rose-200 font-bold'
                            : 'bg-urban-950 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <span className="leading-relaxed">"{prop.text}"</span>
                        <span className="text-[10px] uppercase font-bold shrink-0 bg-slate-800 px-2 py-1 rounded-md text-slate-400">
                          {prop.grammarType}
                        </span>
                      </button>

                      {isSelected && (
                        <div className={`p-4 rounded-2xl font-mono text-xs space-y-1 ${prop.scoreChange > 0 ? 'bg-emerald-950/40 border border-emerald-500/40 text-emerald-300' : 'bg-rose-950/40 border border-rose-500/40 text-rose-300'}`}>
                          <div className="flex justify-between items-center">
                            <span className="font-bold">
                              {prop.scoreChange > 0 ? `✓ Livability Boost (+${prop.scoreChange}%)` : `⚠️ Policy Failure (${prop.scoreChange}%)`}
                            </span>
                            <button
                              onClick={() => speakText(prop.text, ttsRate)}
                              className="text-[10px] bg-slate-800 px-2 py-1 rounded hover:text-white"
                            >
                              🔊 Listen
                            </button>
                          </div>
                          <p className="text-slate-300 text-[11px]">{prop.feedback}</p>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 4: "IDEAL CITY" WRITING STUDIO & LIVE DETECTOR
    // =========================================================================
    function Module4WritingStudio({ patterns, addXp, soundEnabled, ttsRate }) {
      const [essayText, setEssayText] = useState(
        "In my view, an ideal city must be pedestrian-friendly and vibrant. From my perspective, city leaders ought to replace concrete jungles with tranquil parks. If we built high-speed electric trains, traffic would decrease substantially."
      );
      const [matchedPatterns, setMatchedPatterns] = useState([]);

      useEffect(() => {
        const matches = patterns.filter(pat => pat.regex.test(essayText));
        setMatchedPatterns(matches);
      }, [essayText]);

      const handleClaimWritingXp = () => {
        if (matchedPatterns.length > 0) {
          addXp(matchedPatterns.length * 15);
          playSound('fanfare', soundEnabled);
        }
      };

      const wordCount = essayText.trim().split(/\s+/).filter(Boolean).length;

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-urban-900 rounded-3xl p-6 border border-slate-800 shadow-xl space-y-2">
            <span className="text-xs font-mono font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/30">
              Module 4 • Ideal City Writing Studio
            </span>
            <h2 className="text-xl font-black font-header text-white">
              Draft Your Urban Vision & Real-Time Grammar Scanner
            </h2>
            <p className="text-xs text-slate-400">
              Compose a proposal for your ideal city. The live scanner checks for opinion frames, target adjectives, comparative modifiers, and recommendation modals.
            </p>
          </div>

          <div className="bg-urban-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
            
            <div className="bg-urban-950 p-4 rounded-2xl border border-slate-800 space-y-1">
              <span className="text-[10px] font-mono text-emerald-400 uppercase tracking-widest font-bold">Writing Prompt:</span>
              <p className="text-xs sm:text-sm font-mono text-white font-bold">
                "Describe your ideal city. What features appeal to you most, and what policies should urban planners implement?"
              </p>
            </div>

            {/* Live Detected Target Phrases Chips Bar */}
            <div className="space-y-2">
              <div className="flex justify-between items-center">
                <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">
                  ⚡ Detected Language Structures ({matchedPatterns.length}/{patterns.length}):
                </span>
                <span className="text-xs font-mono text-emerald-400 font-bold">
                  +{matchedPatterns.length * 15} Bonus Writing XP
                </span>
              </div>

              <div className="flex flex-wrap gap-2 bg-urban-950 p-3 rounded-2xl border border-slate-800">
                {patterns.map(pat => {
                  const isDetected = matchedPatterns.some(m => m.id === pat.id);
                  return (
                    <span
                      key={pat.id}
                      className={`px-3 py-1.5 rounded-xl text-xs font-mono font-bold transition flex items-center gap-1.5 ${
                        isDetected
                          ? 'bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 shadow-sm'
                          : 'bg-slate-900 border border-slate-800 text-slate-600'
                      }`}
                    >
                      <span>{isDetected ? '✓' : '•'}</span>
                      <span>{pat.label}</span>
                    </span>
                  );
                })}
              </div>
            </div>

            {/* Main Textarea */}
            <div className="space-y-2">
              <textarea
                rows={7}
                value={essayText}
                onChange={(e) => setEssayText(e.target.value)}
                placeholder="Type your urban planning essay here..."
                className="w-full bg-urban-950 border border-slate-800 rounded-2xl p-4 text-xs sm:text-sm text-slate-100 font-mono leading-relaxed focus:outline-none focus:ring-2 focus:ring-emerald-500"
              />
              <div className="flex justify-between text-[11px] font-mono text-slate-400">
                <span>Use opinion frames and policy modals to light up indicators above.</span>
                <span>Word Count: {wordCount} words</span>
              </div>
            </div>

            {/* Action Bar */}
            <div className="flex justify-between items-center pt-2">
              <button
                onClick={() => speakText(essayText, ttsRate)}
                disabled={!essayText.trim()}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-mono text-xs px-4 py-2.5 rounded-xl transition disabled:opacity-40"
              >
                🔊 Read Aloud ({ttsRate}x)
              </button>

              <button
                onClick={handleClaimWritingXp}
                className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-6 py-2.5 rounded-xl transition shadow-md shadow-emerald-600/20"
              >
                Claim Writing XP
              </button>
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 5: ACCREDITATION & PRINTABLE CERTIFICATE
    // =========================================================================
    function Module5Certificate({ studentName, setStudentName, xp, currentRank, soundEnabled }) {

      useEffect(() => {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 130,
            spread: 90,
            origin: { y: 0.6 }
          });
        }
        playSound('fanfare', soundEnabled);
      }, []);

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="max-w-4xl mx-auto space-y-8">
          
          <div className="bg-urban-900 rounded-3xl p-6 border border-slate-800 shadow-xl flex flex-wrap justify-between items-center gap-4 no-print">
            <div>
              <span className="text-xs font-mono font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/30">
                Module 5 • Urban Planner Accreditation
              </span>
              <h2 className="text-xl font-black font-header text-white mt-1">
                Official Urbanopolis Mastery Diploma
              </h2>
            </div>

            <div className="flex items-center space-x-3">
              <input
                type="text"
                value={studentName}
                onChange={(e) => setStudentName(e.target.value)}
                className="bg-urban-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs font-bold text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono"
                placeholder="Learner Full Name"
              />
              <button
                onClick={handlePrint}
                className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow-md shadow-emerald-600/20 flex items-center gap-2"
              >
                🖨️ Print Certificate
              </button>
            </div>
          </div>

          {/* PRINTABLE DIPLOMA CARD */}
          <div 
            id="printable-certificate"
            className="bg-urban-950 p-8 sm:p-12 rounded-3xl border-4 border-emerald-500/50 text-center space-y-6 relative overflow-hidden shadow-2xl text-slate-100"
          >
            <div className="absolute top-4 left-4 text-[10px] font-mono text-emerald-400/60">
              ACCREDITATION-ID: URBANOPOLIS-2026-B1C1
            </div>
            <div className="absolute top-4 right-4 text-[10px] font-mono text-emerald-400/60">
              CEFR B1-C1 PROFICIENCY
            </div>

            <div className="space-y-2 pt-4">
              <span className="text-5xl">🏛️</span>
              <h2 className="text-2xl sm:text-3xl font-black font-header tracking-widest text-emerald-400">
                CERTIFICATE OF URBAN PLANNING MASTERY
              </h2>
              <p className="text-xs text-slate-400 uppercase tracking-widest font-mono">
                Urbanopolis • City Descriptions, Opinions & Planning Studio
              </p>
            </div>

            <div className="py-4 border-y border-slate-800 space-y-3">
              <p className="text-xs text-slate-400">This official document certifies that</p>
              <p className="text-2xl sm:text-3xl font-black text-white underline decoration-emerald-500 decoration-2 font-header">{studentName}</p>
              <p className="text-xs text-slate-300 max-w-lg mx-auto leading-relaxed pt-2 font-mono">
                has successfully demonstrated advanced English language proficiency in **urban adjective classification**, **comparative intensity modifiers** (`substantially`, `significantly`), **policy recommendation modals** (`had better`, `ought to`, `must`), and **second conditional urban proposal synthesis**.
              </p>
            </div>

            <div className="grid grid-cols-3 gap-4 max-w-md mx-auto text-center text-xs font-mono">
              <div className="bg-urban-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">Planner Rank</span>
                <span className="text-xs font-black text-emerald-400">{currentRank.title}</span>
              </div>
              <div className="bg-urban-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">Total Score</span>
                <span className="text-xs font-black text-amber-300">{xp} XP</span>
              </div>
              <div className="bg-urban-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">CEFR Standard</span>
                <span className="text-xs font-black text-sky-400">B1–C1 Advanced</span>
              </div>
            </div>
          </div>

        </div>
      );
    }

    // RENDER APPLICATION
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
