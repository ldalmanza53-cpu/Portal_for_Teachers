    // =========================================================================
    // AUDIO SYNTHESIZER HELPER (NO EXTERNAL MP3 DEPENDENCIES)
    // =========================================================================
    const playSoundEffect = (type, enabled = true) => {
      if (!enabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        if (type === 'correct') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc2.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5

          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

          osc1.start(ctx.currentTime);
          osc2.start(ctx.currentTime + 0.1);
          osc1.stop(ctx.currentTime + 0.3);
          osc2.stop(ctx.currentTime + 0.3);
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(450, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.12, ctx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.25);
            osc.start(ctx.currentTime + idx * 0.08);
            osc.stop(ctx.currentTime + idx * 0.08 + 0.25);
          });
        }
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    };

    // =========================================================================

    const RULE_GUIDE_DATA = {

          example: "We could have taken the express train, but we chose the bus instead."
        },
        {
          structure: "wish / if only + had (not) + V3",
          meaning: "Hypothesizes an alternate past reality (Third Conditional context).",
          example: "I wish I had double-checked the passport expiration date."
        },
        {
          structure: "regret + V-ing",
          meaning: "Expresses emotional remorse for performing a specific past action.",
          example: "She regrets leaving her previous job without a backup plan."

          structure: "was / were supposed to + V1",

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================

    function App() {
      const [activeTab, setActiveTab] = useState('transformer'); // transformer, detective, scenario, pronunciation, story, journal
      const [xp, setXp] = useState(140);
      const [streak, setStreak] = useState(4);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [showRuleModal, setShowRuleModal] = useState(false);
      const [studentName, setStudentName] = useState('Alex Morgan');
      
      const [completedModules, setCompletedModules] = useState({
        transformer: false,
        detective: false,
        scenario: false,
        pronunciation: false,
        story: false,
        journal: false
      });

      // Calculate Level
      const getMasteryRank = (points) => {
        if (points < 180) return { title: "Reflective Apprentice", badge: "🌱", color: "text-amber-400 border-amber-500/40" };
        if (points < 320) return { title: "Duty Specialist", badge: "⚖️", color: "text-teal-300 border-teal-500/40" };
        if (points < 500) return { title: "Hindsight Strategist", badge: "🛡️", color: "text-indigo-300 border-indigo-500/40" };
        return { title: "Master Arbitrator of Past Actions", badge: "👑", color: "text-emerald-300 border-emerald-500/40" };
      };

      const currentRank = getMasteryRank(xp);

      const addXp = (amount) => {
        setXp(prev => prev + amount);
        playSoundEffect('correct', soundEnabled);
      };

      const markModuleComplete = (key) => {
        setCompletedModules(prev => ({ ...prev, [key]: true }));
      };

      // TTS Helper
      const speakText = (text, rate = 1.0) => {
        if (!('speechSynthesis' in window)) {
          alert("Text-to-speech is not supported in this browser.");
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = rate;
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          
          {/* HEADER & TOP NAV */}

                  </div>

                  <button

                      setSoundEnabled(!soundEnabled);

                  <button
                    onClick={() => {
                      setShowRuleModal(true);

                    }}
                    className="bg-gradient-to-r from-teal-600 to-indigo-600 hover:from-teal-500 hover:to-indigo-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow-md shadow-teal-600/20 flex items-center gap-1"

                    📖 Rule Guide
                  </button>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="mt-3 pt-2 border-t border-slate-800/80 flex items-center justify-between overflow-x-auto no-scrollbar">
                <nav className="flex items-center gap-1.5">
                  {[
                    { id: 'transformer', label: '🧩 1. Word Tile Transformer', short: 'Transformer' },
                    { id: 'detective', label: '🔍 2. Error Detective', short: 'Detective' },
                    { id: 'scenario', label: '🎭 3. Scenario Simulator', short: 'Simulator' },

                    { id: 'journal', label: '✍️ 6. Journal & Certificate', short: 'Journal' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => {
                        setActiveTab(tab.id);

                      className={`px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 ${

            {activeTab === 'pronunciation' && (

                speakText={speakText}

              />
            )}

            {activeTab === 'story' && (
              <Module5Story
                storyData={STORY_GAP_DATA}
                addXp={addXp}
                soundEnabled={soundEnabled}
                onComplete={() => markModuleComplete('story')}
              />
            )}

            {activeTab === 'journal' && (
              <Module6Journal
                xp={xp}
                currentRank={currentRank}
                completedModules={completedModules}
                studentName={studentName}

                soundEnabled={soundEnabled}
              />
            )}
          </main>

          {/* QUICK RULE REFERENCE MODAL */}
          {showRuleModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl overflow-y-auto max-h-[90vh] space-y-6">
                
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <div className="flex items-center space-x-2">
                    <span className="text-2xl">📚</span>
                    <h3 className="text-lg font-black text-white">Grammar Reference: Past Modals & Obligations</h3>
                  </div>
                  <button
                    onClick={() => setShowRuleModal(false)}
                    className="text-slate-400 hover:text-white bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center transition"
                  >
                    ✕
                  </button>
                </div>

                {/* Regrets Section */}
                <div className="space-y-3">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-teal-400 flex items-center gap-1.5">
                    <span>🔄</span> 1. Past Mistakes & Regrets
                  </h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {RULE_GUIDE_DATA.regrets.map((item, idx) => (
                      <div key={idx} className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 space-y-1.5">
                        <span className="text-xs font-bold font-mono text-indigo-300 block">{item.structure}</span>
                        <p className="text-xs text-slate-300">{item.meaning}</p>
                        <div className="bg-slate-900 p-2 rounded-xl text-[11px] font-mono text-teal-300 border border-slate-800">
                          💬 "{item.example}"
                        </div>
                      </div>
                    ))}

                {/* Obligations Section */}
                <div className="space-y-3 pt-2">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-indigo-400 flex items-center gap-1.5">
                    <span>⚖️</span> 2. Past Obligations & Duties
                  </h4>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    {RULE_GUIDE_DATA.obligations.map((item, idx) => (
                      <div key={idx} className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 space-y-1.5">
                        <span className="text-xs font-bold font-mono text-amber-300 block">{item.structure}</span>
                        <p className="text-xs text-slate-300">{item.meaning}</p>
                        <div className="bg-slate-900 p-2 rounded-xl text-[11px] font-mono text-amber-200 border border-slate-800">
                          💬 "{item.example}"
                        </div>
                      </div>
                    ))}

                {/* Critical Comparison Table */}
                <div className="bg-indigo-950/40 p-4 rounded-2xl border border-indigo-500/30 space-y-3">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-indigo-300">
                    {RULE_GUIDE_DATA.comparison.title}
                  </h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {RULE_GUIDE_DATA.comparison.items.map((c, idx) => (
                      <div key={idx} className="bg-slate-900/90 p-3.5 rounded-xl border border-indigo-500/20 space-y-1">
                        <span className="text-xs font-bold font-mono text-purple-300 block">{c.term}</span>
                        <p className="text-xs text-slate-300 leading-relaxed">{c.nuance}</p>

                <div className="flex justify-end pt-2">
                  <button
                    onClick={() => setShowRuleModal(false)}
                    className="bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-lg shadow-teal-600/30"
                  >
                    Got it! Return to Practice
                  </button>
                </div>
              </div>

          {/* FOOTER */}
          <footer className="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500 no-print">
            <p>Hindsight & Duty • Interactive English Pragmatics & Grammar Mastery Web Application</p>
          </footer>
        </div>
      );
    }

    // =========================================================================
    // MODULE 1: WORD-TILE GRAMMAR TRANSFORMER
    // =========================================================================

    function Module1Transformer({ questions, addXp, speakText, soundEnabled, onComplete }) {
      const [currentIdx, setCurrentIdx] = useState(0);
      const [availableTiles, setAvailableTiles] = useState([]);
      const [selectedTiles, setSelectedTiles] = useState([]);
      const [isChecked, setIsChecked] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);

      const q = questions[currentIdx];

      // Shuffle helper
      const shuffleArray = (arr) => {
        return [...arr].sort(() => Math.random() - 0.5);
      };

      // Load new question
      useEffect(() => {
        if (q) {
          // Add 2 distractor tiles for higher challenge
          const distractors = ["must", "to", "would", "having"];
          const extra = distractors.slice(0, 2);
          const allTiles = shuffleArray([...q.target, ...extra]);
          setAvailableTiles(allTiles.map((text, id) => ({ id: `${text}-${id}`, text })));
          setSelectedTiles([]);
          setIsChecked(false);
          setIsCorrect(false);
        }
      }, [currentIdx]);

      const handleTileClick = (tile) => {
        if (isChecked) return;
        playSoundEffect('click', soundEnabled);
        setSelectedTiles(prev => [...prev, tile]);
        setAvailableTiles(prev => prev.filter(t => t.id !== tile.id));
      };

      const handleRemoveTile = (tile) => {
        if (isChecked) return;
        playSoundEffect('click', soundEnabled);
        setAvailableTiles(prev => [...prev, tile]);
        setSelectedTiles(prev => prev.filter(t => t.id !== tile.id));
      };

      const handleCheck = () => {
        if (isChecked || selectedTiles.length === 0) return;

        const userSentence = selectedTiles.map(t => t.text).join(" ");
        const targetSentence = q.target.join(" ");

        const correct = userSentence.trim().toLowerCase() === targetSentence.trim().toLowerCase();
        setIsCorrect(correct);
        setIsChecked(true);

        if (correct) {
          addXp(25);
        } else {
          playSoundEffect('wrong', soundEnabled);
        }
      };

      const handleNext = () => {
        if (currentIdx + 1 < questions.length) {
          setCurrentIdx(prev => prev + 1);
        } else {
          onComplete();
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-slate-900/90 rounded-3xl p-6 border border-slate-800 shadow-xl flex justify-between items-center">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-teal-400 bg-teal-500/10 px-3 py-1 rounded-full border border-teal-500/30">
                Module 1 • Word-Tile Transformer
              </span>
              <h2 className="text-xl font-black text-white mt-1">Transform Prompt into Target Past Modal</h2>
            </div>
            <span className="text-xs font-bold text-teal-400 font-mono">
              Sentence {currentIdx + 1} / {questions.length}
            </span>
          </div>

          <div className="bg-slate-900/90 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
            
            {/* PROMPT BOX */}
            <div className="space-y-2">
              <div className="flex justify-between items-center">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Original Context / Statement:</span>
                <span className="text-[10px] font-mono px-2.5 py-0.5 rounded-full bg-slate-800 text-indigo-300 border border-slate-700">
                  Target: {q.category}
                </span>
              </div>
              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-base sm:text-lg font-bold text-slate-200">
                "{q.prompt}"
              </div>
            </div>

            {/* CONSTRUCTED SENTENCE TARGET ZONE */}
            <div className="space-y-2">
              <span className="text-xs font-bold text-teal-400 uppercase tracking-wider block">Your Rephrased Sentence:</span>
              <div className="min-h-[72px] bg-slate-950 p-3 rounded-2xl border-2 border-dashed border-slate-800 flex flex-wrap gap-2 items-center">
                {selectedTiles.length === 0 && (
                  <span className="text-xs text-slate-600 italic">Click the tiles below to construct the target sentence...</span>
                )}
                {selectedTiles.map((tile) => (
                  <button
                    key={tile.id}
                    onClick={() => handleRemoveTile(tile)}
                    disabled={isChecked}
                    className="bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs sm:text-sm px-3.5 py-2 rounded-xl transition shadow-md flex items-center gap-1.5"
                  >
                    <span>{tile.text}</span>
                    <span className="text-[10px] text-teal-200">✕</span>
                  </button>
                ))}
              </div>
            </div>

            {/* AVAILABLE WORD TILES BANK */}
            <div className="space-y-2">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Available Tiles:</span>
              <div className="flex flex-wrap gap-2 min-h-[60px] p-2 bg-slate-950/60 rounded-2xl border border-slate-800">
                {availableTiles.map((tile) => (
                  <button
                    key={tile.id}
                    onClick={() => handleTileClick(tile)}
                    disabled={isChecked}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-xs sm:text-sm px-3.5 py-2 rounded-xl transition hover:border-teal-500"
                  >
                    {tile.text}
                  </button>
                ))}
              </div>
            </div>

            {/* FEEDBACK & EXPLANATION */}
            {isChecked && (
              <div className={`p-5 rounded-2xl border space-y-2 ${
                isCorrect ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-200' : 'bg-rose-500/10 border-rose-500/40 text-rose-200'
              }`}>
                <div className="flex justify-between items-center">
                  <span className="font-bold text-sm">
                    {isCorrect ? '🎉 Correct Transformation!' : '❌ Needs Adjustment'}
                  </span>
                  <button
                    onClick={() => speakText(q.target.join(" "), 0.9)}
                    className="text-xs font-bold text-teal-300 bg-slate-900 px-3 py-1 rounded-xl border border-slate-700 hover:bg-slate-800 flex items-center gap-1"
                  >
                    🔊 Listen Target
                  </button>
                </div>
                <p className="text-xs text-slate-300 leading-relaxed">{q.explanation}</p>
                {!isCorrect && (
                  <div className="text-xs font-mono text-teal-300 pt-1">
                    Correct Target: "{q.target.join(" ")}"
                  </div>
                )}
              </div>
            )}

            {/* ACTION BUTTONS */}
            <div className="flex justify-between items-center pt-2">
              <button
                onClick={() => {
                  setSelectedTiles([]);
                  const distractors = ["must", "to", "would", "having"];
                  const extra = distractors.slice(0, 2);
                  setAvailableTiles(shuffleArray([...q.target, ...extra]).map((text, id) => ({ id: `${text}-${id}`, text })));
                  setIsChecked(false);
                }}
                disabled={isChecked}
                className="text-xs text-slate-400 hover:text-white underline"
              >
                Reset Tiles
              </button>

              {!isChecked ? (
                <button
                  onClick={handleCheck}
                  disabled={selectedTiles.length === 0}
                  className={`px-6 py-3 rounded-xl font-bold text-xs sm:text-sm transition shadow-lg ${
                    selectedTiles.length > 0 ? 'bg-teal-600 hover:bg-teal-500 text-white shadow-teal-600/30' : 'bg-slate-800 text-slate-600 cursor-not-allowed'
                  }`}
                >
                  Verify Sentence
                </button>
              ) : (
                <button
                  onClick={handleNext}
                  className="bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs sm:text-sm px-6 py-3 rounded-xl transition shadow-lg shadow-teal-600/30 flex items-center gap-2"
                >
                  {currentIdx + 1 < questions.length ? 'Next Sentence ➔' : 'Complete Module'}
                </button>
              )}
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 2: ERROR DETECTIVE
    // =========================================================================

    function Module2Detective({ questions, addXp, soundEnabled, onComplete }) {
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selectedChoice, setSelectedChoice] = useState(null);
      const [isSubmitted, setIsSubmitted] = useState(false);

      const q = questions[currentIdx];

      const handleSubmit = () => {
        if (!selectedChoice || isSubmitted) return;
        setIsSubmitted(true);

        if (selectedChoice === q.correctSegment) {
          addXp(25);
        } else {
          playSoundEffect('wrong', soundEnabled);
        }
      };

      const handleNext = () => {
        setSelectedChoice(null);
        setIsSubmitted(false);
        if (currentIdx + 1 < questions.length) {
          setCurrentIdx(prev => prev + 1);
        } else {
          onComplete();
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-slate-900/90 rounded-3xl p-6 border border-slate-800 shadow-xl flex justify-between items-center">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/30">
                Module 2 • Error Detective
              </span>
              <h2 className="text-xl font-black text-white mt-1">Spot & Correct Common Learner Errors</h2>
            </div>
            <span className="text-xs font-bold text-indigo-400 font-mono">
              Item {currentIdx + 1} / {questions.length}
            </span>
          </div>

          <div className="bg-slate-900/90 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
            
            {/* INCORRECT SENTENCE DISPLAY */}
            <div className="space-y-2">
              <span className="text-xs font-bold text-rose-400 uppercase tracking-wider block">🚫 Flawed Sentence:</span>
              <div className="bg-slate-950 p-4 rounded-2xl border border-rose-500/30 text-base sm:text-lg font-mono text-rose-200">
                "{q.sentence}"
              </div>
            </div>

            {/* SELECTION OPTIONS */}
            <div className="space-y-3">
              <span className="text-xs font-bold text-slate-300 uppercase tracking-wider block">Choose the Grammatically Correct Replacement:</span>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {q.options.map((opt, idx) => {
                  const isSelected = selectedChoice === opt;
                  let btnStyle = "bg-slate-950 border-slate-800 text-slate-300 hover:border-indigo-500/50";

                  if (isSelected) {
                    btnStyle = "bg-indigo-600/30 border-indigo-500 text-white ring-2 ring-indigo-500/50 font-bold";
                  }

                  if (isSubmitted) {
                    if (opt === q.correctSegment) {
                      btnStyle = "bg-emerald-500/20 border-emerald-500 text-emerald-300 font-bold";
                    } else if (isSelected) {
                      btnStyle = "bg-rose-500/20 border-rose-500 text-rose-300";
                    }
                  }

                  return (
                    <button
                      key={idx}
                      disabled={isSubmitted}
                      onClick={() => {
                        setSelectedChoice(opt);
                        playSoundEffect('click', soundEnabled);
                      }}
                      className={`p-4 rounded-2xl border text-sm font-mono transition text-left flex justify-between items-center ${btnStyle}`}
                    >
                      <span>{opt}</span>
                      {isSubmitted && opt === q.correctSegment && <span>✅</span>}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* EXPLANATION */}
            {isSubmitted && (
              <div className={`p-5 rounded-2xl border text-xs leading-relaxed space-y-2 ${
                selectedChoice === q.correctSegment ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-200' : 'bg-rose-500/10 border-rose-500/40 text-rose-200'
              }`}>
                <span className="font-bold text-sm block">
                  {selectedChoice === q.correctSegment ? '🎯 Detective Precision!' : '❌ Incorrect Selection'}
                </span>
                <p className="text-slate-300">{q.explanation}</p>
              </div>
            )}

            <div className="flex justify-end pt-2">
              {!isSubmitted ? (
                <button
                  onClick={handleSubmit}
                  disabled={!selectedChoice}
                  className={`px-6 py-3 rounded-xl font-bold text-xs sm:text-sm transition shadow-lg ${
                    selectedChoice ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-600/30' : 'bg-slate-800 text-slate-600 cursor-not-allowed'
                  }`}
                >
                  Verify Fix
                </button>
              ) : (
                <button
                  onClick={handleNext}
                  className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs sm:text-sm px-6 py-3 rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center gap-2"
                >
                  {currentIdx + 1 < questions.length ? 'Next Error ➔' : 'Complete Module'}
                </button>
              )}
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 3: SCENARIO SIMULATOR
    // =========================================================================

    function Module3Scenario({ scenarios, addXp, speakText, soundEnabled, onComplete }) {
      const [activeScenarioIdx, setActiveScenarioIdx] = useState(0);
      const [stepIdx, setStepIdx] = useState(0);
      const [conflictLevel, setConflictLevel] = useState(50);
      const [history, setHistory] = useState([]);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isFinished, setIsFinished] = useState(false);

      const sc = scenarios[activeScenarioIdx];
      const currentStep = sc.steps[stepIdx] || null;

      const handleSelectOption = (option) => {
        if (selectedOption) return;
        setSelectedOption(option);
        playSoundEffect('click', soundEnabled);

        const newConflict = Math.max(0, Math.min(100, conflictLevel + option.conflictChange));
        setConflictLevel(newConflict);

        addXp(option.xp);

        setHistory(prev => [...prev, {
          userChoice: option.text,
          feedback: option.feedback,
          type: option.type,
          nextQuote: option.nextQuote
        }]);
      };

      const handleNextStep = () => {
        setSelectedOption(null);
        if (stepIdx + 1 < sc.steps.length) {
          setStepIdx(prev => prev + 1);
        } else {
          setIsFinished(true);
          onComplete();
        }
      };

      const handleResetScenario = (idx) => {
        setActiveScenarioIdx(idx);
        setStepIdx(0);
        setConflictLevel(50);
        setHistory([]);
        setSelectedOption(null);
        setIsFinished(false);
      };

      return (
        <div className="space-y-6">
          {/* SCENARIO SELECTOR */}
          <div className="bg-slate-900/90 rounded-3xl p-4 border border-slate-800 shadow-xl flex flex-wrap items-center justify-between gap-3">
            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 pl-2">Select Roleplay Scenario:</span>
            <div className="flex flex-wrap gap-2">
              {scenarios.map((s, idx) => (
                <button
                  key={s.id}
                  onClick={() => handleResetScenario(idx)}
                  className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 ${
                    activeScenarioIdx === idx
                      ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30'
                      : 'bg-slate-950 text-slate-300 border border-slate-800 hover:border-purple-500/50'
                  }`}
                >
                  <span>{s.avatar}</span>
                  <span>{s.title}</span>
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* MAIN ROLEPLAY STREAM */}
            <div className="lg:col-span-8 bg-slate-900/90 rounded-3xl p-6 border border-slate-800 shadow-2xl space-y-6">
              
              {/* Header Info */}
              <div className="flex flex-wrap justify-between items-center border-b border-slate-800 pb-4 gap-4">
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="text-2xl">{sc.avatar}</span>
                    <h2 className="text-lg font-black text-white">{sc.title}</h2>
                  </div>
                  <p className="text-xs text-slate-400 mt-1">{sc.situation}</p>
                </div>

                {/* Tension Meter */}
                <div className="min-w-[160px]">
                  <div className="flex justify-between items-center text-[11px] font-bold mb-1">
                    <span className="text-slate-400">Tension Level:</span>
                    <span className={conflictLevel > 60 ? 'text-rose-400' : 'text-emerald-400'}>
                      {conflictLevel}%
                    </span>
                  </div>
                  <div className="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                    <div 
                      className={`h-full transition-all duration-500 ${
                        conflictLevel > 60 ? 'bg-rose-500' : 'bg-emerald-400'
                      }`}
                      style={{ width: `${conflictLevel}%` }}
                    />
                  </div>
                </div>
              </div>

              {/* DIALOGUE HISTORY */}
              <div className="space-y-4 bg-slate-950 p-5 rounded-2xl border border-slate-800 min-h-[200px]">
                {/* Initial Prompt */}
                <div className="flex items-start gap-3">
                  <div className="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-base flex-shrink-0">
                    {sc.avatar}
                  </div>
                  <div className="flex-1 bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-1">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-purple-400">{sc.role}</span>

                    </div>

                    <div className="flex items-start justify-end gap-3">
                      <div className="flex-1 bg-purple-950/50 p-4 rounded-2xl border border-purple-500/30 text-right">
                        <span className="text-[10px] uppercase font-bold text-purple-300 block mb-0.5">{h.type}</span>
                        <p className="text-sm text-purple-100 font-medium">"{h.userChoice}"</p>

                      <div className="w-9 h-9 rounded-full bg-purple-600 flex items-center justify-center text-xs font-bold text-white flex-shrink-0">

                    {h.nextQuote && (

                        <div className="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-base flex-shrink-0">

                        <div className="flex-1 bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-1">
                          <div className="flex justify-between items-center">
                            <span className="text-xs font-bold text-purple-400">{sc.role}</span>
                            <button

                              className="text-[11px] text-slate-400 hover:text-purple-300"

              {!isFinished && currentStep && (

                  <div className="space-y-2.5">
                    {currentStep.options.map((opt) => (
                      <button
                        key={opt.id}
                        disabled={selectedOption !== null}
                        onClick={() => handleSelectOption(opt)}
                        className={`w-full text-left p-4 rounded-2xl border transition flex flex-col space-y-1 ${
                          selectedOption?.id === opt.id
                            ? 'bg-purple-600/30 border-purple-500 text-white'
                            : 'bg-slate-950 border-slate-800 hover:border-purple-500/50 text-slate-200'
                        }`}
                      >
                        <div className="flex justify-between items-center">
                          <span className="text-[10px] font-bold uppercase tracking-wider text-purple-300 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">
                            {opt.type}
                          </span>
                          <span className="text-xs font-bold text-purple-400">+{opt.xp} XP</span>
                        </div>
                        <p className="text-xs sm:text-sm leading-relaxed">"{opt.text}"</p>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* NEXT / FINISHED */}
              {selectedOption && !isFinished && (
                <div className="flex justify-end pt-2">
                  <button
                    onClick={handleNextStep}
                    className="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs sm:text-sm px-6 py-3 rounded-xl transition shadow-lg shadow-purple-600/30 flex items-center gap-2"
                  >
                    <span>Continue Dialogue ➔</span>
                  </button>
                </div>

              {isFinished && (
                <div className="bg-emerald-500/10 border border-emerald-500/30 p-5 rounded-2xl text-center space-y-3">
                  <span className="text-3xl">🎉</span>
                  <h3 className="text-lg font-bold text-emerald-300">Scenario Navigated!</h3>
                  <p className="text-xs text-slate-300">You successfully applied past modals to handle this high-stakes scenario.</p>
                  <button
                    onClick={() => handleResetScenario(activeScenarioIdx)}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition"
                  >
                    Replay Scenario
                  </button>
                </div>
              )}
            </div>

            {/* PRAGMATIC ANALYSIS FEEDBACK PANEL */}
            <div className="lg:col-span-4 bg-slate-900/90 rounded-3xl p-6 border border-slate-800 shadow-2xl space-y-4">
              <h3 className="text-xs font-bold uppercase tracking-wider text-purple-400 flex items-center gap-1.5">
                <span>🧐</span> Pragmatic Analysis
              </h3>
              {selectedOption ? (
                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
                  <span className="text-xs font-bold text-amber-300 block">Feedback:</span>
                  <p className="text-xs text-slate-300 leading-relaxed">{selectedOption.feedback}</p>
                </div>
              ) : (
                <div className="text-center py-12 text-slate-500 text-xs">
                  Select a response strategy on the left to analyze its linguistic impact.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 4: PRONUNCIATION & SHADOWING TRAINER
    // =========================================================================

    function Module4Pronunciation({ data, addXp, speakText, soundEnabled, onComplete }) {
      const [currentIdx, setCurrentIdx] = useState(0);
      const [isListening, setIsListening] = useState(false);
      const [speechResult, setSpeechResult] = useState('');
      const [score, setScore] = useState(null);

      const item = data[currentIdx];

      const handleSpeechRecognition = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          alert("Speech Recognition is not supported in this browser. You can still practice shadowing aloud!");
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        setIsListening(true);
        setSpeechResult("Listening... Speak clearly now!");
        setScore(null);

        recognition.start();

        recognition.onresult = (event) => {
          const spoken = event.results[0][0].transcript;
          setSpeechResult(`"${spoken}"`);
          setIsListening(false);

          // Calculate basic similarity
          const targetClean = item.standard.toLowerCase().replace(/[^a-z ]/g, '');
          const spokenClean = spoken.toLowerCase().replace(/[^a-z ]/g, '');

          if (spokenClean.includes(targetClean.split(" ")[1])) {
            setScore("Great Pronunciation! Reduced form recognized.");
            addXp(20);
          } else {
            setScore("Good effort! Try focusing on the reduced rhythm.");
          }
        };

        recognition.onerror = () => {
          setSpeechResult("Could not hear clearly. Try again.");
          setIsListening(false);
        };
      };

      const handleNext = () => {
        setSpeechResult('');
        setScore(null);
        if (currentIdx + 1 < data.length) {
          setCurrentIdx(prev => prev + 1);
        } else {
          onComplete();
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-slate-900/90 rounded-3xl p-6 border border-slate-800 shadow-xl flex justify-between items-center">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/30">
                Module 4 • Pronunciation & Reductions
              </span>
              <h2 className="text-xl font-black text-white mt-1">Master Natural Spoken Reductions</h2>
            </div>
            <span className="text-xs font-bold text-amber-400 font-mono">
              Pattern {currentIdx + 1} / {data.length}
            </span>
          </div>

          <div className="bg-slate-900/90 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
            
            {/* TARGET PHRASE CARD */}
            <div className="space-y-4 text-center bg-slate-950 p-6 sm:p-8 rounded-3xl border border-slate-800">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">Standard Written English:</span>
              <h3 className="text-xl sm:text-2xl font-black text-white">"{item.standard}"</h3>

              <div className="py-2 border-y border-slate-800/80 my-4 space-y-1">
                <span className="text-xs font-bold text-amber-400 uppercase tracking-wider block">Native Spoken Reduction:</span>
                <p className="text-lg font-mono text-teal-300">{item.phonetic}</p>
              </div>

              <p className="text-xs text-slate-400 max-w-md mx-auto leading-relaxed">{item.tip}</p>
            </div>

            {/* AUDIO PLAYBACK CONTROLS */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <button
                onClick={() => speakText(item.standard, 1.0)}
                className="bg-slate-950 hover:bg-slate-800 text-teal-300 border border-teal-500/30 p-4 rounded-2xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2"
              >
                <span>🔊 Standard Speed (1.0x)</span>
              </button>

              <button
                onClick={() => speakText(item.standard, 0.7)}
                className="bg-slate-950 hover:bg-slate-800 text-amber-300 border border-amber-500/30 p-4 rounded-2xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2"
              >
                <span>🐢 Slow Reduced Speed (0.7x)</span>
              </button>
            </div>

            {/* SPEECH RECOGNITION PRACTICE */}
            <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-3 text-center">
              <span className="text-xs font-bold text-slate-400 uppercase block">Interactive Voice Shadowing:</span>
              
              <button
                onClick={handleSpeechRecognition}
                disabled={isListening}
                className={`px-6 py-3.5 rounded-2xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 mx-auto ${
                  isListening
                    ? 'bg-rose-600 text-white mic-recording'
                    : 'bg-teal-600 hover:bg-teal-500 text-white shadow-lg shadow-teal-600/30'
                }`}
              >
                <span>🎙️</span>
                <span>{isListening ? 'Listening... Speak Now' : 'Record & Test Pronunciation'}</span>
              </button>

              {speechResult && (
                <div className="text-xs font-mono text-slate-300 bg-slate-900 p-3 rounded-xl border border-slate-800">
                  Transcribed: {speechResult}
                </div>
              )}

              {score && (
                <div className="text-xs font-bold text-emerald-300 bg-emerald-500/10 p-2.5 rounded-xl border border-emerald-500/30">
                  {score}
                </div>
              )}
            </div>

            {/* NEXT BUTTON */}
            <div className="flex justify-end pt-2">
              <button
                onClick={handleNext}
                className="bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs sm:text-sm px-6 py-3 rounded-xl transition shadow-lg shadow-amber-600/30 flex items-center gap-2"
              >
                {currentIdx + 1 < data.length ? 'Next Pattern ➔' : 'Complete Module'}
              </button>
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 5: STORY GAP-FILL
    // =========================================================================

    function Module5Story({ storyData, addXp, soundEnabled, onComplete }) {
      const [userSelections, setUserSelections] = useState({});
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [score, setScore] = useState(null);

      const handleSelect = (gapId, val) => {
        if (isSubmitted) return;
        playSoundEffect('click', soundEnabled);
        setUserSelections(prev => ({ ...prev, [gapId]: val }));
      };

      const handleSubmit = () => {
        if (isSubmitted) return;
        let correctCount = 0;

        storyData.paragraphs.forEach(p => {
          const selected = userSelections[p.gapId];
          const correctOption = p.options.find(o => o.correct)?.label;
          if (selected === correctOption) correctCount++;
        });

        setScore(correctCount);
        setIsSubmitted(true);
        addXp(correctCount * 10);
        onComplete();
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-slate-900/90 rounded-3xl p-6 border border-slate-800 shadow-xl flex justify-between items-center">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/30">
                Module 5 • Contextual Narrative
              </span>
              <h2 className="text-xl font-black text-white mt-1">{storyData.title}</h2>
            </div>
          </div>

          <div className="bg-slate-900/90 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
            
            {/* NARRATIVE WITH INLINE DROPDOWNS */}
            <div className="text-sm sm:text-base leading-relaxed text-slate-200 space-y-4 bg-slate-950 p-6 rounded-3xl border border-slate-800">
              {storyData.paragraphs.map((p, idx) => {
                const selectedVal = userSelections[p.gapId] || "";
                const correctOption = p.options.find(o => o.correct)?.label;
                const isCorrect = selectedVal === correctOption;

                return (
                  <span key={idx} className="inline">
                    {p.text}
                    <select
                      value={selectedVal}
                      disabled={isSubmitted}
                      onChange={(e) => handleSelect(p.gapId, e.target.value)}
                      className={`mx-1 px-2.5 py-1 rounded-xl text-xs sm:text-sm font-bold border transition focus:outline-none ${
                        isSubmitted
                          ? isCorrect
                            ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300'
                            : 'bg-rose-500/20 border-rose-500 text-rose-300'
                          : 'bg-slate-900 border-slate-700 text-teal-300 hover:border-teal-500'
                      }`}
                    >
                      <option value="">-- select modal --</option>
                      {p.options.map((o, oIdx) => (
                        <option key={oIdx} value={o.label}>{o.label}</option>
                      ))}
                    </select>
                    {p.afterText}{" "}
                  </span>
                );
              })}
            </div>

            {/* RESULTS OVERVIEW */}
            {isSubmitted && (
              <div className="bg-emerald-500/10 border border-emerald-500/30 p-5 rounded-2xl text-center space-y-2">
                <span className="text-2xl">📖</span>
                <h3 className="text-lg font-bold text-emerald-300">
                  Narrative Complete: {score} / {storyData.paragraphs.length} Correct
                </h3>
                <p className="text-xs text-slate-300">You have earned +{score * 10} XP for contextual story completion.</p>
              </div>
            )}

            {/* SUBMIT BUTTON */}
            <div className="flex justify-end pt-2">
              {!isSubmitted ? (
                <button
                  onClick={handleSubmit}
                  disabled={Object.keys(userSelections).length < storyData.paragraphs.length}
                  className={`px-6 py-3 rounded-xl font-bold text-xs sm:text-sm transition shadow-lg ${
                    Object.keys(userSelections).length === storyData.paragraphs.length
                      ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-600/30'
                      : 'bg-slate-800 text-slate-600 cursor-not-allowed'
                  }`}
                >
                  Verify Narrative Modals
                </button>
              ) : (
                <button
                  onClick={onComplete}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm px-6 py-3 rounded-xl transition shadow-lg shadow-emerald-600/30"
                >
                  Proceed to Final Journal ➔
                </button>
              )}
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 6: REFLECTION JOURNAL & PRINTABLE MASTERY CERTIFICATE
    // =========================================================================

    function Module6Journal({ xp, currentRank, completedModules, studentName, setStudentName, soundEnabled }) {
      const [journalInput, setJournalInput] = useState('');
      const [detectedGrammar, setDetectedGrammar] = useState([]);

      useEffect(() => {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 90,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
        playSoundEffect('fanfare', soundEnabled);
      }, []);

      // Real-time grammar badge detector
      const handleJournalChange = (text) => {
        setJournalInput(text);
        const lower = text.toLowerCase();
        const detected = [];

        if (lower.includes('should have') || lower.includes("shouldn't have")) detected.push("should have + V3");
        if (lower.includes('was supposed to') || lower.includes('were supposed to')) detected.push("was/were supposed to");
        if (lower.includes('had to')) detected.push("had to + V1");
        if (lower.includes('wish i had') || lower.includes('if only')) detected.push("wish/if only + had + V3");
        if (lower.includes("needn't have") || lower.includes("didn't have to")) detected.push("needn't have / didn't have to");

        setDetectedGrammar(detected);
      };

      const handlePrint = () => {
        window.print();
      };

      const completedCount = Object.values(completedModules).filter(Boolean).length;

      return (
        <div className="max-w-4xl mx-auto space-y-8">
          
          {/* REFLECTION JOURNAL INPUT */}
          <div className="bg-slate-900/90 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-4 no-print">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-teal-400 bg-teal-500/10 px-3 py-1 rounded-full border border-teal-500/30">
                Module 6 • Personal Reflection
              </span>
              <h2 className="text-xl font-black text-white mt-1">Guided Grammar Reflection Journal</h2>
              <p className="text-xs text-slate-400 mt-1">
                Write a paragraph about a past mistake or an obligation from your life using target structures (<code className="text-teal-300">should have</code>, <code className="text-teal-300">was supposed to</code>, <code className="text-teal-300">had to</code>).
              </p>
            </div>

            <textarea
              rows={4}
              value={journalInput}
              onChange={(e) => handleJournalChange(e.target.value)}
              placeholder="Example: Last month, I was supposed to submit my visa application early, but I delayed. I should have double-checked the requirements..."
              className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-xs sm:text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-teal-500"
            />

            {/* DETECTED GRAMMAR BADGES */}
            <div className="flex flex-wrap items-center gap-2 pt-1">
              <span className="text-[11px] font-bold text-slate-400 uppercase">Target Structures Detected:</span>
              {detectedGrammar.length === 0 && (
                <span className="text-[11px] text-slate-600 italic">Type using target structures to unlock live badges...</span>
              )}
              {detectedGrammar.map((badge, idx) => (
                <span key={idx} className="bg-teal-500/20 text-teal-300 border border-teal-500/40 text-[10px] font-bold px-2.5 py-0.5 rounded-full">
                  ✓ {badge}
                </span>
              ))}
            </div>
          </div>

          {/* STATS OVERVIEW */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 no-print">
            <div className="bg-slate-900/90 rounded-3xl p-5 border border-slate-800 shadow-xl flex items-center space-x-4">
              <div className="w-12 h-12 rounded-2xl bg-teal-500/20 text-teal-300 flex items-center justify-center text-2xl">
                ⭐
              </div>
              <div>
                <span className="text-xs text-slate-400 block font-bold uppercase">Total Earned XP</span>
                <span className="text-xl font-black text-white">{xp} Points</span>
              </div>
            </div>

            <div className="bg-slate-900/90 rounded-3xl p-5 border border-slate-800 shadow-xl flex items-center space-x-4">
              <div className="w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-300 flex items-center justify-center text-2xl">
                👑
              </div>
              <div>
                <span className="text-xs text-slate-400 block font-bold uppercase">Mastery Rank</span>
                <span className="text-sm font-black text-indigo-300">{currentRank.title}</span>
              </div>
            </div>

            <div className="bg-slate-900/90 rounded-3xl p-5 border border-slate-800 shadow-xl flex items-center space-x-4">
              <div className="w-12 h-12 rounded-2xl bg-purple-500/20 text-purple-300 flex items-center justify-center text-2xl">
                ✅
              </div>
              <div>
                <span className="text-xs text-slate-400 block font-bold uppercase">Modules Completed</span>
                <span className="text-xl font-black text-purple-300">{completedCount} / 5</span>
              </div>
            </div>
          </div>

          {/* CERTIFICATE SECTION */}
          <div className="bg-slate-900/90 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
            
            <div className="flex flex-wrap justify-between items-center gap-4 border-b border-slate-800 pb-4 no-print">
              <div>
                <h3 className="text-xl font-black text-white">🎓 Official Mastery Certificate</h3>
                <p className="text-xs text-slate-400">Generate your printable proof of achievement in English Pragmatics & Past Modals.</p>
              </div>

              <div className="flex items-center space-x-3">
                <input
                  type="text"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs font-bold text-white focus:outline-none focus:ring-2 focus:ring-teal-500"
                  placeholder="Your Full Name"
                />
                <button
                  onClick={handlePrint}
                  className="bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-lg shadow-teal-600/30 flex items-center gap-2"
                >
                  🖨️ Print Certificate
                </button>
              </div>
            </div>

            {/* PRINTABLE CERTIFICATE CARD */}
            <div 
              id="printable-certificate"
              className="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 p-8 sm:p-12 rounded-3xl border-4 border-teal-500/40 text-center space-y-6 relative overflow-hidden shadow-2xl"
            >
              <div className="absolute top-4 left-4 text-[10px] font-mono text-teal-400/60">
                CERT-ID: HD-2026-REGRETS
              </div>
              <div className="absolute top-4 right-4 text-[10px] font-mono text-teal-400/60">
                CEFR B1-C1 ENGLISH PRAGMATICS
              </div>

              <div className="space-y-2 pt-4">
                <span className="text-4xl">👑</span>
                <h2 className="text-2xl sm:text-3xl font-black tracking-widest uppercase text-amber-400">
                  Certificate of Achievement
                </h2>
                <p className="text-xs text-slate-300 uppercase tracking-widest font-mono">Hindsight & Duty • Past Modals & Obligations</p>
              </div>

              <div className="py-4 border-y border-teal-500/30 space-y-3">
                <p className="text-xs text-slate-400">This certifies that</p>
                <p className="text-2xl sm:text-3xl font-black text-white underline decoration-teal-500 decoration-2">{studentName}</p>
                <p className="text-xs text-slate-300 max-w-lg mx-auto leading-relaxed pt-2">

                <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800">
                  <span className="text-slate-400 block text-[10px]">Earned XP</span>
                  <span className="text-xs font-black text-teal-300">{xp} Points</span>
                </div>
                <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800">
                  <span className="text-slate-400 block text-[10px]">Verification</span>
                  <span className="text-xs font-black text-emerald-400">PASSED</span>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // RENDER APPLICATION
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
