<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethical Crossroads - B1 Second Conditional App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-xl bg-slate-900 rounded-3xl shadow-2xl overflow-hidden border border-slate-800">
    
    <!-- Timer & Level Header -->
    <div class="bg-indigo-900/40 border-b border-indigo-500/20 p-6 flex justify-between items-center">
      <div>
        <span class="bg-indigo-500/20 text-indigo-300 text-xs font-bold px-3 py-1 rounded-full border border-indigo-500/30">
          B1 Level • Second Conditional
        </span>
        <h1 class="text-xl font-bold text-white mt-2">Ethical Crossroads App</h1>
      </div>
      <div class="text-right">
        <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Timer</p>
        <div id="timer" class="text-3xl font-extrabold text-indigo-400">10:00</div>
      </div>
    </div>

    <!-- Main Interactive Area -->
    <div class="p-6 space-y-6">

      <!-- Navigation Tabs -->
      <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800">
        <button id="tab1" onclick="switchTab('dilemmas')" class="flex-1 py-2 text-xs font-bold rounded-lg transition bg-indigo-600 text-white">
          Moral Dilemmas
        </button>
        <button id="tab2" onclick="switchTab('grammar')" class="flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">
          Grammar Checker
        </button>
      </div>

      <!-- Tab 1: Moral Dilemmas View -->
      <div id="viewDilemmas" class="space-y-4">
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 min-h-[180px] flex flex-col justify-between text-center relative">
          <span id="dilemmaCategory" class="text-xs font-semibold text-indigo-400 uppercase tracking-widest">
            Category: Workplace
          </span>
          <p id="dilemmaText" class="text-lg font-medium text-slate-200 my-4 leading-relaxed">
            Loading dilemma...
          </p>
          <div class="text-xs text-slate-500 font-medium">
            Prompt <span id="currentIndex">1</span> of <span id="totalIndex">5</span>
          </div>
        </div>

        <!-- Structure Helper Box -->
        <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-4 text-xs text-slate-300">
          <p class="font-bold text-indigo-300 mb-1">Target Pattern:</p>
          <code class="text-amber-300 font-mono">If I + [past simple], I would / wouldn't + [base verb]...</code>
        </div>

        <!-- Sample Model Answer Reveal -->
        <div id="answerBox" class="hidden bg-indigo-950/40 border border-indigo-500/30 rounded-xl p-4 text-xs text-indigo-200">
          <p class="font-bold text-indigo-400 mb-1">Sample Answer:</p>
          <p id="sampleAnswerText"></p>
        </div>

        <div class="flex gap-3">
          <button onclick="toggleAnswer()" class="border border-slate-700 hover:bg-slate-800 text-slate-300 font-semibold py-3 px-4 rounded-xl text-xs transition">
            💡 Sample Answer
          </button>
          <button id="prevBtn" onclick="prevDilemma()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 rounded-xl text-xs transition disabled:opacity-40">
            Previous
          </button>
          <button id="nextBtn" onclick="nextDilemma()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs transition disabled:opacity-40">
            Next Dilemma
          </button>
        </div>
      </div>

      <!-- Tab 2: Grammar Check View -->
      <div id="viewGrammar" class="hidden space-y-4">
        <p class="text-xs text-slate-400">Identify and fix the second conditional grammar error in each sentence:</p>
        
        <div id="grammarList" class="space-y-3">
          <!-- Injected via JavaScript -->
        </div>
      </div>

    </div>

    <!-- Footer Controls -->
    <div class="bg-slate-950 px-6 py-4 border-t border-slate-800 flex justify-between items-center">
      <button onclick="resetTimer()" class="text-xs font-semibold text-slate-400 hover:text-slate-200">
        🔄 Reset Timer
      </button>
      <button onclick="finishSession()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition">
        Complete Session
      </button>
    </div>

  </div>

  <script>
    const DILEMMAS = [
      {
        category: "Workplace Ethics",
        question: "What would you do if you saw a colleague taking expensive company property home?",
        sample: "If I saw a colleague taking company property, I would report it to my manager privately."
      },
      {
        category: "Personal Honesty",
        question: "If a cashier forgot to charge you for an item in your shopping cart, would you tell them?",
        sample: "If a cashier forgot to charge me, I would inform them immediately and pay for it."
      },
      {
        category: "Friendship & Loyalty",
        question: "If your friend let someone else take the blame for their mistake, would you convince them to speak up?",
        sample: "If my friend did that, I would advise them to tell the truth to avoid punishing an innocent person."
      },
      {
        category: "Accidents & Responsibility",
        question: "If you accidentally scratched a parked car while leaving, and nobody saw you, what would you do?",
        sample: "If I scratched a parked car, I would leave a note with my phone number on the windshield."
      },
      {
        category: "Academic Integrity",
        question: "What would you do if a classmate offered you the answer key before a final examination?",
        sample: "If a classmate offered me the answer key, I would refuse it and study by myself."
      }
    ];

    const GRAMMAR_TASKS = [
      {
        incorrect: "If I find $200 in the street, I would keep it.",
        correct: "If I found $200 in the street, I would keep it.",
        explanation: "Use Past Simple ('found') in the if-clause."
      },
      {
        incorrect: "If my friend cheated on the exam, I will tell the teacher.",
        correct: "If my friend cheated on the exam, I would tell the teacher.",
        explanation: "Use 'would' instead of 'will' in the main clause."
      },
      {
        incorrect: "What will you do if a cashier gave you extra change?",
        correct: "What would you do if a cashier gave you extra change?",
        explanation: "Use 'would' for imaginary/unreal conditional questions."
      }
    ];

    let currentIdx = 0;
    let timerSeconds = 600;

    function renderDilemma() {
      const item = DILEMMAS[currentIdx];
      document.getElementById('dilemmaCategory').innerText = `Category: ${item.category}`;
      document.getElementById('dilemmaText').innerText = item.question;
      document.getElementById('sampleAnswerText').innerText = item.sample;
      document.getElementById('currentIndex').innerText = currentIdx + 1;
      document.getElementById('totalIndex').innerText = DILEMMAS.length;
      document.getElementById('answerBox').classList.add('hidden');

      document.getElementById('prevBtn').disabled = currentIdx === 0;
      document.getElementById('nextBtn').disabled = currentIdx === DILEMMAS.length - 1;
    }

    function nextDilemma() {
      if (currentIdx < DILEMMAS.length - 1) {
        currentIdx++;
        renderDilemma();
      }
    }

    function prevDilemma() {
      if (currentIdx > 0) {
        currentIdx--;
        renderDilemma();
      }
    }

    function toggleAnswer() {
      document.getElementById('answerBox').classList.toggle('hidden');
    }

    function renderGrammar() {
      const container = document.getElementById('grammarList');
      container.innerHTML = GRAMMAR_TASKS.map((item, index) => `
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
          <p class="text-xs text-red-400 font-medium">❌ ${item.incorrect}</p>
          <div id="corr-${index}" class="hidden text-xs text-emerald-400 font-medium pt-1 border-t border-slate-900">
            ✅ ${item.correct}
            <span class="block text-[10px] text-slate-400 mt-1">${item.explanation}</span>
          </div>
          <button onclick="document.getElementById('corr-${index}').classList.toggle('hidden')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded">
            Show / Hide Correction
          </button>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      if (tab === 'dilemmas') {
        document.getElementById('viewDilemmas').classList.remove('hidden');
        document.getElementById('viewGrammar').classList.add('hidden');
        document.getElementById('tab1').className = "flex-1 py-2 text-xs font-bold rounded-lg transition bg-indigo-600 text-white";
        document.getElementById('tab2').className = "flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white";
      } else {
        document.getElementById('viewDilemmas').classList.add('hidden');
        document.getElementById('viewGrammar').classList.remove('hidden');
        document.getElementById('tab1').className = "flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white";
        document.getElementById('tab2').className = "flex-1 py-2 text-xs font-bold rounded-lg transition bg-indigo-600 text-white";
      }
    }

    // Timer Logic
    setInterval(() => {
      if (timerSeconds > 0) {
        timerSeconds--;
        const mins = Math.floor(timerSeconds / 60);
        const secs = timerSeconds % 60;
        document.getElementById('timer').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }
    }, 1000);

    function resetTimer() {
      timerSeconds = 600;
    }

    function finishSession() {
      alert("Session completed! Great job practicing second conditionals and ethical dilemmas.");
    }

    // Initialize
    renderDilemma();
    renderGrammar();
  </script>
</body>
</html>
