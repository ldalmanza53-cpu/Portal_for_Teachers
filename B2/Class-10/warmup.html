<html lang="en" class="dark">

  <meta charset="UTF-8">

  <title>Experience & Incident Lab: Mistakes, Regrets & Problem Solving</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              400: '#2dd4bf',
              500: '#14b8a6',
              600: '#0d9488',

              900: '#134e4a',

  <!-- React 18 & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* 3D Flip Card Styles */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(13, 148, 136, 0.6);
    }

    @media print {
      body * {
        visibility: hidden;

      #printable-certificate, #printable-certificate * {
        visibility: visible;

</head>
<body class="min-h-screen bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // AUDIO SYNTHESIZER HELPER (NO EXTERNAL AUDIO FILES)
    // =========================================================================
    const playSoundEffect = (type, enabled = true) => {
      if (!enabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'correct') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc2.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5

          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

          osc1.start(ctx.currentTime);
          osc2.start(ctx.currentTime + 0.1);
          osc1.stop(ctx.currentTime + 0.3);
          osc2.stop(ctx.currentTime + 0.3);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(260, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(450, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.start();
          osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.28);
            osc.start(ctx.currentTime + idx * 0.09);
            osc.stop(ctx.currentTime + idx * 0.09 + 0.28);
          });
        }
      } catch (e) {
        console.warn("Audio synthesizer error:", e);
      }
    };

    // Speech Synthesis TTS Helper
    const speakText = (text, rate = 1.0) => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = rate;
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    };

    // =========================================================================
    // STATIC DATA
    // =========================================================================

    // MODULE 1 DATA: Sentence Transformer
    const SENTENCE_BUILDER_DATA = [
      {
        id: 1,
        title: "Expressing Past Regrets & Mistakes",
        hint: "We failed to perform a stress test before launching.",
        correctSentence: ["We", "should", "have", "run", "a", "full", "stress", "test", "before", "the", "product", "launch", "."],
        grammarFocus: "should have + V3 (Past Regret)"
      },
      {
        id: 2,
        title: "Unfulfilled Past Obligations",
        hint: "They had a scheduled task yesterday afternoon that was not done.",
        correctSentence: ["They", "were", "supposed", "to", "submit", "the", "incident", "report", "yesterday", "afternoon", "."],
        grammarFocus: "was/were supposed to + V1"
      },
      {
        id: 3,
        title: "Explaining Problems with Cause Linkers",
        hint: "The delay happened because of an unexpected technical glitch.",
        correctSentence: ["The", "project", "delay", "occurred", "due", "to", "an", "unexpected", "technical", "failure", "."],
        grammarFocus: "due to + Noun Phrase"
      },
      {
        id: 4,
        title: "Hypothetical Past Regret",
        hint: "I strongly wish we had listened to the lead engineer.",
        correctSentence: ["If", "only", "we", "had", "listened", "to", "the", "lead", "developer", "'s", "warning", "."],
        grammarFocus: "wish / If only + Past Perfect"
      },
      {
        id: 5,
        title: "Actionable Problem Solving",
        hint: "We held an urgent meeting so that we could solve the conflict.",
        correctSentence: ["In", "order", "to", "resolve", "the", "conflict", ",", "we", "held", "an", "emergency", "meeting", "."],
        grammarFocus: "in order to + V1 (Purpose)"
      }
    ];

    // MODULE 2 DATA: Error Detective
    const ERROR_DETECTIVE_DATA = [
      {
        id: 1,
        sentence: "We shouldn't of ignored the warning lights on the database server.",
        highlight: "shouldn't of",
        options: ["shouldn't of", "shouldn't have", "shouldn't to have", "should not of"],
        correctIndex: 1,
        explanation: "'Shouldn't of' is a common phonetic spelling mistake. The correct modal verb phrase for past regrets is 'should not have' + Past Participle (V3)."
      },
      {
        id: 2,
        sentence: "To tackle with this client issue, we hired an external communications specialist.",
        highlight: "tackle with",
        options: ["tackle with", "tackle to", "tackle", "tackled with"],
        correctIndex: 2,
        explanation: "'Tackle' is a direct transitive verb meaning 'to deal with a problem'. It takes a direct object without the preposition 'with' (e.g., 'tackle the problem')."
      },
      {
        id: 3,
        sentence: "I have seen that major system failure yesterday afternoon during the demo.",
        highlight: "have seen",
        options: ["have seen", "saw", "was seeing", "had seen"],
        correctIndex: 1,
        explanation: "When referencing a specific, finished time in the past ('yesterday afternoon'), use the Past Simple ('saw'), not the Present Perfect ('have seen')."
      },
      {
        id: 4,
        sentence: "The project team was suppose to deliver the prototypes by Monday.",
        highlight: "was suppose to",
        options: ["was suppose to", "was supposed to", "were suppose to", "supposed to"],
        correctIndex: 1,
        explanation: "The structure expressing unfulfilled past expectation is 'was/were supposed to' (always ending in '-d')."
      },
      {
        id: 5,
        sentence: "The meeting was delayed because the unexpected power outage.",
        highlight: "because",
        options: ["because", "due to", "in order to", "as a result"],
        correctIndex: 1,
        explanation: "'Because' must be followed by a full subject-verb clause. For a direct noun phrase ('the unexpected power outage'), use 'due to' or 'because of'."
      }
    ];

    // MODULE 3 DATA: Workplace Roleplay Simulator
    const ROLEPLAY_SCENARIOS = [
      {
        id: "app_crash",
        title: "Crisis 1: The App Launch Collapse",
        subtitle: "10 minutes after launch, 15,000 users are locked out and the Vice President calls you.",
        initialSatisfaction: 40,
        initialResolution: 10,
        stages: [
          {
            step: 1,
            prompt: "VP of Operations: 'The launch is failing! How could this happen without anyone noticing?'",
            choices: [
              {
                text: "We should have run a stress test on high server load last week. I take full responsibility.",
                satDelta: +20,
                resDelta: +25,
                feedback: "Excellent! Admitting past mistakes with 'should have + V3' demonstrates accountability and clear insight.",
                grammarTag: "Correct: should have + V3"
              },
              {
                text: "I have seen the server crash yesterday, so it is not my personal issue.",
                satDelta: -20,
                resDelta: -10,
                feedback: "Poor grammar and attitude. 'I have seen yesterday' is incorrect tense usage, and blaming others damages morale.",
                grammarTag: "Incorrect: Present Perfect with 'yesterday'"
              },
              {
                text: "The server was suppose to handle this traffic automatically.",
                satDelta: -10,
                resDelta: +0,
                feedback: "Grammar mistake ('was suppose to' missing '-d') and passive stance.",
                grammarTag: "Incorrect: was suppose to"
              }
            ]
          },
          {
            step: 2,
            prompt: "VP: 'Okay, what are we doing right now to address this critical obstacle?'",
            choices: [
              {
                text: "In order to resolve the server bottleneck, our team is deploying temporary cloud nodes.",
                satDelta: +25,
                resDelta: +40,
                feedback: "Great leadership! Using 'In order to + V1' clearly communicates purposeful action.",
                grammarTag: "Correct: in order to resolve"
              },
              {
                text: "We plan to tackle with the glitch tomorrow when developers are rested.",
                satDelta: -25,
                resDelta: -20,
                feedback: "Unacceptable delay and grammatical error ('tackle with').",
                grammarTag: "Incorrect: tackle with"
              },
              {
                text: "The outage occurred due to high traffic, so we are waiting for traffic to decrease.",
                satDelta: -5,
                resDelta: +10,
                feedback: "Accurate cause linker ('due to'), but passive approach doesn't resolve the crisis.",
                grammarTag: "Partial: passive stance"
              }
            ]
          },
          {
            step: 3,
            prompt: "VP: 'How do we ensure we never encounter such a setback again?'",
            choices: [
              {
                text: "To prevent future setbacks, we will implement mandatory pre-launch audits and automated rollback tools.",
                satDelta: +20,
                resDelta: +25,
                feedback: "Outstanding closing plan! Combines clear target vocabulary ('setback', 'implement') with concrete action.",
                grammarTag: "Mastery Level"
              },
              {
                text: "I wish we didn't launch today. That is my only comment.",
                satDelta: -15,
                resDelta: -10,
                feedback: "Incorrect past wish structure. For past regrets, use 'wish + Past Perfect' ('wish we hadn't launched').",
                grammarTag: "Incorrect: past wish structure"
              }
            ]
          }
        ]
      },
      {
        id: "client_delay",
        title: "Crisis 2: The Key Client Pitch Disappointment",
        subtitle: "A vital client waited 40 minutes because of conflicting room schedules and unupdated slides.",
        initialSatisfaction: 35,
        initialResolution: 15,
        stages: [
          {
            step: 1,
            prompt: "Account Director: 'The client was furious about waiting! Why weren't the presentation rooms pre-booked?'",
            choices: [
              {
                text: "The booking oversight occurred due to a scheduling software synchronization glitch.",
                satDelta: +15,
                resDelta: +20,
                feedback: "Clear and precise! Uses 'oversight' and 'due to + Noun Phrase' accurately.",
                grammarTag: "Correct: due to + NP"
              },
              {
                text: "We were suppose to double-check the calendar, but everyone forgot.",
                satDelta: -15,
                resDelta: -5,
                feedback: "Grammar mistake ('was suppose to' instead of 'was supposed to') and lacks professional tone.",
                grammarTag: "Incorrect: was suppose to"
              }
            ]
          },
          {
            step: 2,
            prompt: "Account Director: 'How will you regain the client's confidence right now?'",
            choices: [
              {
                text: "We could have sent the summary slides earlier; however, I am emailing them a tailored project proposal now to resolve their concerns.",
                satDelta: +30,
                resDelta: +35,
                feedback: "Brilliant recovery! Uses 'could have + V3' to acknowledge past possibilities and offers immediate action.",
                grammarTag: "Correct: could have + V3"
              },
              {
                text: "I shouldn't of let the intern handle the calendar.",
                satDelta: -20,
                resDelta: -15,
                feedback: "Phonetic grammar mistake ('shouldn't of') and passes blame downward.",
                grammarTag: "Incorrect: shouldn't of"
              }
            ]
          }
        ]
      }
    ];

    // MODULE 4 DATA: Vocabulary Items
    const VOCABULARY_ITEMS = [
      {
        word: "accomplishment",
        category: "Experiences",
        pos: "noun",
        phonetic: "/əˈkʌm.plɪʃ.mənt/",
        meaning: "Something successful achieved through skill, effort, or courage.",
        example: "Completing the system migration ahead of schedule was our team's greatest accomplishment this quarter."
      },
      {
        word: "milestone",
        category: "Experiences",
        pos: "noun",
        phonetic: "/ˈmaɪl.stəʊn/",
        meaning: "An important event or stage in the development or history of something.",
        example: "Reaching 100,000 active users marked a major milestone for the app."
      },
      {
        word: "oversight",
        category: "Mistakes",
        pos: "noun",
        phonetic: "/ˈəʊ.və.saɪt/",
        meaning: "An unintentional failure to notice or do something; a mistake caused by forgetfulness.",
        example: "Failing to check the server logs before launch was a costly oversight."
      },
      {
        word: "setback",
        category: "Mistakes",
        pos: "noun",
        phonetic: "/ˈset.bæk/",
        meaning: "A problem that delays progress or makes a situation worse.",
        example: "The sudden server crash was a temporary setback for our launch timeline."
      },
      {
        word: "obstacle",
        category: "Problems & Actions",
        pos: "noun",
        phonetic: "/ˈɒb.stə.kəl/",
        meaning: "A situation, thing, or condition that blocks movement or prevents progress.",
        example: "Lack of funding was the main obstacle we had to overcome."
      },
      {
        word: "encounter",
        category: "Problems & Actions",
        pos: "verb",
        phonetic: "/ɪnˈkaʊn.tər/",
        meaning: "To unexpectedly experience or face a difficulty or problem.",
        example: "During stress testing, we encountered several security vulnerabilities."
      },
      {
        word: "tackle",
        category: "Problems & Actions",
        pos: "verb",
        phonetic: "/ˈtæk.əl/",
        meaning: "To make a determined effort to deal with a difficult problem or task.",
        example: "Our engineers worked through the night to tackle the database bug."
      },
      {
        word: "resolve",
        category: "Problems & Actions",
        pos: "verb",
        phonetic: "/rɪˈzɒlv/",
        meaning: "To find an effective solution to a problem, conflict, or issue.",
        example: "By deploying a hotfix, we were able to resolve the issue within two hours."
      }
    ];

    // MODULE 5 DATA: Incident Report Gap-Fill
    const INCIDENT_REPORT_DATA = {
      title: "Incident Investigation Report: App Launch Delay",
      textParts: [
        "Last month, our technical department ",
        " [gap 1: experienced] ",
        " one of the most severe system disruptions in recent history. We ",
        " [gap 2: were supposed to launch] ",
        " our new client portal on October 1st, but an unexpected glitch locked out thousands of users.\n\nLooking back, our engineering leads ",
        " [gap 3: should have run] ",
        " a comprehensive stress test prior to deployment. Because of this critical ",
        " [gap 4: oversight] ",
        ", initial traffic overwhelmed database capacity.\n\nIn order to ",
        " [gap 5: tackle] ",
        " this crisis, our senior developers worked continuously for 24 hours. As a ",
        " [gap 6: result] ",
        " of their rapid intervention, we successfully ",
        " [gap 7: resolved] ",
        " the login issue and restored normal operations. Overall, although I ",
        " [gap 8: had never encountered] ",
        " such a complex crash before, it reinforced the crucial need for thorough pre-launch protocols."
      ],
      gaps: [
        { id: 1, correct: "experienced", options: ["experienced", "have experienced", "was experiencing", "experience"] },
        { id: 2, correct: "were supposed to launch", options: ["were supposed to launch", "was suppose to launch", "should launch", "suppose to launch"] },
        { id: 3, correct: "should have run", options: ["should have run", "should of run", "should ran", "must run"] },
        { id: 4, correct: "oversight", options: ["oversight", "accomplishment", "milestone", "resolution"] },
        { id: 5, correct: "tackle", options: ["tackle", "tackle with", "tackled to", "tackling with"] },
        { id: 6, correct: "result", options: ["result", "reason", "purpose", "cause"] },
        { id: 7, correct: "resolved", options: ["resolved", "were resolved", "resolving", "have resolve"] },
        { id: 8, correct: "had never encountered", options: ["had never encountered", "have never encountered", "never encounter", "didn't encountered"] }
      ]
    };

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    function App() {
      // User Progress & Settings State
      const [xp, setXp] = useState(60);
      const [streak, setStreak] = useState(3);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [darkMode, setDarkMode] = useState(true);
      const [activeTab, setActiveTab] = useState('builder'); // builder, detective, roleplay, vocab, report, journal
      const [showRulesModal, setShowRulesModal] = useState(false);
      const [studentName, setStudentName] = useState('Alex Morgan');

      // Rank calculation
      const getRank = (points) => {
        if (points < 120) return { title: "Junior Investigator", icon: "🔍", color: "text-amber-400 border-amber-500/30 bg-amber-500/10" };
        if (points < 260) return { title: "Incident Investigator", icon: "🕵️", color: "text-teal-400 border-teal-500/30 bg-teal-500/10" };
        if (points < 420) return { title: "Crisis Manager", icon: "💼", color: "text-indigo-400 border-indigo-500/30 bg-indigo-500/10" };
        return { title: "Master Resolver", icon: "👑", color: "text-emerald-400 border-emerald-500/30 bg-emerald-500/10" };
      };

      const currentRank = getRank(xp);

      const addXp = (amount) => {
        setXp(prev => prev + amount);
        playSoundEffect('correct', soundEnabled);
      };

      // Apply Dark Mode Class to Root HTML
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      return (
        <div className="min-h-screen flex flex-col font-sans transition-colors duration-300">
          
          {/* HEADER & PROGRESS HUB */}
          <header className="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 shadow-sm no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
              <div className="flex flex-wrap items-center justify-between gap-3">
                
                {/* Brand Logo & Title */}
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-teal-500 via-indigo-600 to-emerald-400 flex items-center justify-center text-xl shadow-md shadow-teal-500/20 text-white font-bold">
                    ⚖️
                  </div>
                  <div>
                    <h1 className="text-base sm:text-lg font-black tracking-tight bg-gradient-to-r from-teal-600 via-indigo-600 to-emerald-500 dark:from-teal-300 dark:via-indigo-200 dark:to-emerald-300 bg-clip-text text-transparent">
                      Experience & Incident Lab
                    </h1>
                    <p className="text-[11px] text-slate-500 dark:text-slate-400 font-medium">B1–B2 ESL • Mistakes, Regrets & Problem Solving</p>
                  </div>
                </div>

                {/* Dashboard Stats & Controls */}
                <div className="flex items-center space-x-2 sm:space-x-3">
                  
                  {/* Streak Indicator */}
                  <div className="hidden sm:flex items-center space-x-1.5 bg-slate-100 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold text-amber-500" title="Daily Practice Streak">
                    <span>🔥</span>
                    <span>{streak} <span className="text-[10px] text-slate-400 font-normal">days</span></span>
                  </div>

                  {/* Rank Badge */}
                  <div className={`hidden md:flex items-center space-x-1.5 border px-3 py-1.5 rounded-xl text-xs font-bold ${currentRank.color}`}>
                    <span>{currentRank.icon}</span>
                    <span>{currentRank.title}</span>
                  </div>

                  {/* XP Counter */}
                  <div className="flex items-center space-x-1.5 bg-slate-100 dark:bg-slate-950 border border-teal-500/30 px-3 py-1.5 rounded-xl text-xs font-bold text-teal-600 dark:text-teal-300">
                    <span>⭐</span>
                    <span>{xp} <span className="text-[10px] text-slate-400 font-normal">XP</span></span>
                  </div>

                  {/* Quick Rule Cheat Sheet Trigger */}
                  <button
                    onClick={() => {
                      setShowRulesModal(true);
                      playSoundEffect('click', soundEnabled);
                    }}
                    className="bg-indigo-50 dark:bg-indigo-950/60 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 text-indigo-600 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800/60 text-xs font-bold px-3 py-2 rounded-xl transition flex items-center gap-1.5 shadow-sm"
                  >
                    <span>📖</span>
                    <span className="hidden sm:inline">Grammar Rules</span>
                  </button>

                  {/* Theme Toggle */}
                  <button
                    onClick={() => {
                      setDarkMode(!darkMode);
                      playSoundEffect('click', soundEnabled);
                    }}
                    className="p-2 rounded-xl border border-slate-200 dark:border-slate-800 text-xs hover:bg-slate-100 dark:hover:bg-slate-800 transition text-slate-600 dark:text-slate-300"
                    title="Toggle Dark/Light Mode"
                  >
                    {darkMode ? '☀️' : '🌙'}
                  </button>

                  {/* Sound Toggle */}
                  <button

              </div>

              {/* Navigation Tabs */}
              <div className="mt-3 pt-2 border-t border-slate-200 dark:border-slate-800/80 flex items-center justify-between overflow-x-auto no-scrollbar">
                <nav className="flex items-center gap-1.5">
                  {[
                    { id: 'builder', label: '1. Sentence Builder', icon: '🧩' },
                    { id: 'detective', label: '2. Error Detective', icon: '🕵️‍♂️' },
                    { id: 'roleplay', label: '3. Incident Roleplay', icon: '🏢' },
                    { id: 'vocab', label: '4. Flashcards & Sorting', icon: '🎴' },

                    <button
                      key={tab.id}

                        activeTab === tab.id
                          ? 'bg-teal-600 text-white shadow-md shadow-teal-600/30'

                      }`}

                  ))}

              </div>
            </div>
          </header>

          {/* MAIN CONTENT WORKSPACE */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {activeTab === 'builder' && (
              <Module1SentenceBuilder
                data={SENTENCE_BUILDER_DATA}
                addXp={addXp}
                soundEnabled={soundEnabled}
                speakText={speakText}
              />
            )}

            {activeTab === 'detective' && (
              <Module2ErrorDetective
                data={ERROR_DETECTIVE_DATA}
                addXp={addXp}
                soundEnabled={soundEnabled}
              />
            )}

            {activeTab === 'roleplay' && (
              <Module3RoleplaySimulator
                scenarios={ROLEPLAY_SCENARIOS}
                addXp={addXp}
                soundEnabled={soundEnabled}
              />
            )}

            {activeTab === 'vocab' && (
              <Module4VocabClassifier
                items={VOCABULARY_ITEMS}
                addXp={addXp}
                soundEnabled={soundEnabled}
                speakText={speakText}
              />
            )}

            {activeTab === 'report' && (
              <Module5IncidentReport
                data={INCIDENT_REPORT_DATA}
                addXp={addXp}
                soundEnabled={soundEnabled}
                speakText={speakText}
              />
            )}

            {activeTab === 'journal' && (
              <Module6ReflectionCertificate
                studentName={studentName}
                setStudentName={setStudentName}
                xp={xp}
                currentRank={currentRank}
                addXp={addXp}
                soundEnabled={soundEnabled}
              />
            )}
          </main>

          {/* GRAMMAR & LINKER CHEAT SHEET MODAL */}
          {showRulesModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl space-y-6 relative max-h-[90vh] overflow-y-auto">
                
                <div className="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-4">
                  <div className="flex items-center space-x-2">
                    <span className="text-2xl">📖</span>
                    <h3 className="text-lg font-black text-slate-900 dark:text-white">Quick Language & Grammar Guide</h3>
                  </div>
                  <button
                    onClick={() => setShowRulesModal(false)}
                    className="text-slate-400 hover:text-slate-600 dark:hover:text-white bg-slate-100 dark:bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-5 text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                  
                  {/* Rule 1: Present Perfect vs Past Simple */}
                  <div className="bg-slate-50 dark:bg-slate-950 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2">
                    <h4 className="font-bold text-teal-600 dark:text-teal-300 flex items-center gap-1.5">
                      <span>1.</span> Present Perfect vs. Past Simple
                    </h4>
                    <ul className="space-y-1 text-xs">
                      <li>• <strong>Present Perfect (have/has + V3):</strong> Unspecified life experiences or past actions with present result. <em>"I have handled server crashes before."</em></li>
                      <li>• <strong>Past Simple (V2):</strong> Finished actions at a specific past time. <em>"Yesterday at 3 PM, the server crashed."</em></li>
                    </ul>
                  </div>

                  {/* Rule 2: Past Modals of Regret */}
                  <div className="bg-slate-50 dark:bg-slate-950 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2">
                    <h4 className="font-bold text-indigo-600 dark:text-indigo-300 flex items-center gap-1.5">
                      <span>2.</span> Modals of Past Regret & Unfulfilled Obligation
                    </h4>
                    <ul className="space-y-1.5 text-xs font-mono">
                      <li>• <strong>should have + V3:</strong> Past mistake/criticism. <em>"We should have run a stress test."</em></li>
                      <li>• <strong>was/were supposed to + V1:</strong> Expected past action that did not happen. <em>"They were supposed to log off."</em></li>
                      <li>• <strong>wish + Past Perfect (had + V3):</strong> Imagined past situation. <em>"I wish we had listened to the engineer."</em></li>
                      <li className="text-rose-500 dark:text-rose-400 font-sans italic">⚠️ Avoid "shouldn't of" — always write "should not have"!</li>
                    </ul>
                  </div>

                  {/* Rule 3: Cause/Effect Linkers */}
                  <div className="bg-slate-50 dark:bg-slate-950 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2">
                    <h4 className="font-bold text-emerald-600 dark:text-emerald-300 flex items-center gap-1.5">
                      <span>3.</span> Cause, Effect & Purpose Connectors
                    </h4>
                    <ul className="space-y-1.5 text-xs">
                      <li>• <strong>due to / because of + Noun Phrase:</strong> <em>"The outage was due to heavy network traffic."</em></li>
                      <li>• <strong>as a result / consequently + Clause:</strong> <em>"We updated the server; as a result, performance improved."</em></li>
                      <li>• <strong>in order to + Base Verb:</strong> <em>"In order to resolve the bug, developers deployed a hotfix."</em></li>
                      <li className="text-amber-600 dark:text-amber-400 font-sans italic">⚠️ 'Tackle' takes a direct object without 'with' (e.g. "tackle the issue").</li>
                    </ul>
                  </div>

                </div>

                <div className="flex justify-end pt-2">
                  <button
                    onClick={() => setShowRulesModal(false)}
                    className="bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-md shadow-teal-600/30"
                  >
                    Got it! Back to Practice
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-4 text-center text-xs text-slate-500 no-print">
            <p>Experience & Incident Lab • CEFR B1–B2 Interactive English Learning Environment</p>
          </footer>

        </div>
      );
    }

    // =========================================================================
    // MODULE 1: WORD-TILE SENTENCE BUILDER
    // =========================================================================
    function Module1SentenceBuilder({ data, addXp, soundEnabled, speakText }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [availableTiles, setAvailableTiles] = useState([]);
      const [constructedSentence, setConstructedSentence] = useState([]);
      const [isCorrect, setIsCorrect] = useState(null);
      const [completed, setCompleted] = useState({});
      const [playbackSpeed, setPlaybackSpeed] = useState(1.0);

      const currentItem = data[currentIndex];

      // Shuffle tiles whenever currentItem changes
      useEffect(() => {
        if (!currentItem) return;
        const shuffled = [...currentItem.correctSentence].sort(() => Math.random() - 0.5);
        setAvailableTiles(shuffled);
        setConstructedSentence([]);
        setIsCorrect(null);
      }, [currentIndex]);

      const handleAddTile = (word, index) => {
        playSoundEffect('click', soundEnabled);
        setConstructedSentence([...constructedSentence, word]);
        setAvailableTiles(availableTiles.filter((_, idx) => idx !== index));
        setIsCorrect(null);
      };

      const handleRemoveTile = (word, index) => {
        playSoundEffect('click', soundEnabled);
        setAvailableTiles([...availableTiles, word]);
        setConstructedSentence(constructedSentence.filter((_, idx) => idx !== index));
        setIsCorrect(null);
      };

      const handleCheck = () => {
        const userStr = constructedSentence.join(" ");
        const correctStr = currentItem.correctSentence.join(" ");

        if (userStr === correctStr) {
          setIsCorrect(true);
          if (!completed[currentItem.id]) {
            setCompleted({ ...completed, [currentItem.id]: true });
            addXp(15);
          } else {
            playSoundEffect('correct', soundEnabled);
          }
        } else {
          setIsCorrect(false);
          playSoundEffect('wrong', soundEnabled);
        }
      };

      const handleReset = () => {
        playSoundEffect('click', soundEnabled);
        const shuffled = [...currentItem.correctSentence].sort(() => Math.random() - 0.5);
        setAvailableTiles(shuffled);
        setConstructedSentence([]);
        setIsCorrect(null);
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          
          {/* Header Card */}
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-xl flex flex-wrap justify-between items-center gap-4">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-teal-600 dark:text-teal-400 bg-teal-50 dark:bg-teal-500/10 px-3 py-1 rounded-full border border-teal-200 dark:border-teal-500/30">
                Module 1 • Word-Tile Unscrambler
              </span>
              <h2 className="text-xl font-black text-slate-900 dark:text-white mt-1">
                Construct Target Sentences
              </h2>
            </div>

            {/* Pagination Controls */}
            <div className="flex items-center gap-1.5">
              {data.map((item, idx) => (
                <button
                  key={item.id}
                  onClick={() => setCurrentIndex(idx)}
                  className={`w-8 h-8 rounded-xl text-xs font-bold transition flex items-center justify-center ${
                    currentIndex === idx
                      ? 'bg-teal-600 text-white'
                      : completed[item.id]
                      ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-800'
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'
                  }`}
                >
                  {idx + 1}
                </button>
              ))}
            </div>
          </div>

          {/* Main Interactive Challenge */}
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-6">
            
            {/* Target Concept & Hint */}
            <div className="space-y-2 border-b border-slate-100 dark:border-slate-800/80 pb-4">
              <div className="flex justify-between items-center">
                <span className="text-xs font-mono font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-widest">
                  Target Grammar: {currentItem.grammarFocus}
                </span>
                <span className="text-xs text-slate-400">Task {currentIndex + 1} of {data.length}</span>
              </div>
              <h3 className="text-base font-bold text-slate-800 dark:text-slate-100">
                "{currentItem.title}"
              </h3>
              <p className="text-xs text-slate-500 dark:text-slate-400 italic">
                💡 Context Hint: {currentItem.hint}
              </p>
            </div>

            {/* Construction Target Drop Area */}
            <div className={`min-h-[110px] p-4 sm:p-6 rounded-2xl border-2 transition flex flex-wrap gap-2 items-center align-content-start ${
              isCorrect === true
                ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-500'
                : isCorrect === false
                ? 'bg-rose-50 dark:bg-rose-950/30 border-rose-500'
                : 'bg-slate-50 dark:bg-slate-950 border-dashed border-slate-300 dark:border-slate-800'
            }`}>
              {constructedSentence.length === 0 && (
                <span className="text-xs text-slate-400 italic">Click available word tiles below to build the sentence...</span>
              )}
              {constructedSentence.map((word, idx) => (
                <button
                  key={idx}
                  onClick={() => handleRemoveTile(word, idx)}
                  className="bg-teal-600 hover:bg-teal-700 text-white font-mono text-xs sm:text-sm font-bold px-3 py-2 rounded-xl shadow-md transition transform hover:-translate-y-0.5 flex items-center gap-1"
                >
                  <span>{word}</span>
                  <span className="text-[10px] opacity-70">✕</span>
                </button>
              ))}
            </div>

            {/* Available Word Tiles Bank */}
            <div className="space-y-2">
              <span className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider block">
                Available Word Bank:
              </span>
              <div className="flex flex-wrap gap-2 min-h-[60px] p-3 bg-slate-50 dark:bg-slate-950 rounded-2xl border border-slate-200 dark:border-slate-800">
                {availableTiles.map((word, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleAddTile(word, idx)}
                    className="bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-700 font-mono text-xs sm:text-sm font-bold px-3 py-2 rounded-xl shadow-sm transition transform hover:-translate-y-0.5"
                  >
                    {word}
                  </button>
                ))}
              </div>
            </div>

            {/* Validation Feedback & Action Buttons */}
            <div className="flex flex-wrap items-center justify-between gap-4 pt-2">
              <div className="flex items-center space-x-2">
                <button
                  onClick={handleCheck}
                  disabled={constructedSentence.length === 0}
                  className={`px-6 py-2.5 rounded-xl text-xs font-bold transition shadow-md ${
                    constructedSentence.length > 0
                      ? 'bg-teal-600 hover:bg-teal-500 text-white shadow-teal-600/30'
                      : 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'
                  }`}
                >
                  Check Sentence (+15 XP)
                </button>

                <button
                  onClick={handleReset}
                  className="px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition"
                >
                  🔄 Reset
                </button>
              </div>

              {/* TTS Speech Controls if Correct */}
              {isCorrect === true && (
                <div className="flex items-center space-x-2 bg-emerald-500/10 border border-emerald-500/30 px-3.5 py-1.5 rounded-2xl text-xs font-bold text-emerald-600 dark:text-emerald-300">
                  <span>🎉 Correct! Hear Audio:</span>
                  <button
                    onClick={() => speakText(constructedSentence.join(" "), 1.0)}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg transition"
                  >
                    🔊 1.0x
                  </button>
                  <button
                    onClick={() => speakText(constructedSentence.join(" "), 0.75)}
                    className="bg-teal-600 hover:bg-teal-500 text-white px-2.5 py-1 rounded-lg transition"
                  >
                    🐢 0.75x
                  </button>
                </div>
              )}

              {isCorrect === false && (
                <span className="text-xs font-bold text-rose-500 bg-rose-500/10 border border-rose-500/30 px-3 py-1.5 rounded-xl">
                  ❌ Not quite right yet. Try reordering the tiles!
                </span>
              )}
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 2: INCIDENT ERROR DETECTIVE
    // =========================================================================
    function Module2ErrorDetective({ data, addXp, soundEnabled }) {
      const [userSelections, setUserSelections] = useState({});
      const [checkedItems, setCheckedItems] = useState({});

      const handleSelectOption = (itemIdx, optionIdx) => {
        setUserSelections({ ...userSelections, [itemIdx]: optionIdx });
        playSoundEffect('click', soundEnabled);
      };

      const handleVerifyItem = (itemIdx, correctIdx) => {
        const isRight = userSelections[itemIdx] === correctIdx;
        setCheckedItems({ ...checkedItems, [itemIdx]: isRight });

        if (isRight) {
          addXp(15);
        } else {
          playSoundEffect('wrong', soundEnabled);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-xl">
            <span className="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-200 dark:border-indigo-500/30">
              Module 2 • ESL Error Detective
            </span>
            <h2 className="text-xl font-black text-slate-900 dark:text-white mt-1">
              Spot & Repair Incident Log Grammar Bugs
            </h2>
            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
              Identify common errors in past modal structures, prepositions, and time markers.
            </p>
          </div>

          <div className="space-y-4">
            {data.map((item, itemIdx) => {
              const selectedOpt = userSelections[itemIdx];
              const isVerified = checkedItems[itemIdx] !== undefined;
              const isCorrect = checkedItems[itemIdx] === true;

              return (
                <div
                  key={item.id}
                  className={`bg-white dark:bg-slate-900 rounded-3xl p-6 border transition shadow-lg space-y-4 ${
                    isVerified
                      ? isCorrect
                        ? 'border-emerald-500 ring-1 ring-emerald-500/30'
                        : 'border-rose-500 ring-1 ring-rose-500/30'
                      : 'border-slate-200 dark:border-slate-800'
                  }`}
                >
                  <div className="flex justify-between items-start gap-2">
                    <span className="text-xs font-mono font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-xl">
                      Bug Report #{itemIdx + 1}
                    </span>
                    {isVerified && (
                      <span className={`text-xs font-bold px-3 py-1 rounded-full ${
                        isCorrect ? 'bg-emerald-500/20 text-emerald-500' : 'bg-rose-500/20 text-rose-500'
                      }`}>
                        {isCorrect ? '✓ Repaired (+15 XP)' : '❌ Incorrect Selection'}
                      </span>
                    )}
                  </div>

                  {/* Incident Sentence */}
                  <div className="bg-slate-50 dark:bg-slate-950 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs sm:text-sm font-mono text-slate-800 dark:text-slate-200 leading-relaxed">
                    "{item.sentence.split(item.highlight)[0]}
                    <mark className="bg-rose-500/30 text-rose-700 dark:text-rose-300 px-1 rounded font-bold underline underline-offset-2">
                      {item.highlight}
                    </mark>
                    {item.sentence.split(item.highlight)[1]}"
                  </div>

                  {/* Multiple Choice Options */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    {item.options.map((opt, optIdx) => {
                      const isSelected = selectedOpt === optIdx;
                      let btnStyle = "bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 hover:border-indigo-400";

                      if (isSelected) {
                        btnStyle = "bg-indigo-600 text-white font-bold border-indigo-600";
                      }

                      if (isVerified) {
                        if (optIdx === item.correctIndex) {
                          btnStyle = "bg-emerald-600 text-white font-bold border-emerald-600";
                        } else if (isSelected && !isCorrect) {
                          btnStyle = "bg-rose-600 text-white font-bold border-rose-600";
                        }
                      }

                      return (
                        <button
                          key={optIdx}
                          disabled={isVerified}
                          onClick={() => handleSelectOption(itemIdx, optIdx)}
                          className={`p-3 rounded-xl border text-xs text-left transition font-mono ${btnStyle}`}
                        >
                          {optIdx + 1}. {opt}
                        </button>
                      );
                    })}
                  </div>

                  {/* Verification Button & Feedback */}
                  <div className="flex flex-wrap items-center justify-between gap-3 pt-1">
                    {!isVerified ? (
                      <button
                        onClick={() => handleVerifyItem(itemIdx, item.correctIndex)}
                        disabled={selectedOpt === undefined}
                        className={`px-5 py-2 rounded-xl text-xs font-bold transition ${
                          selectedOpt !== undefined
                            ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/30'
                            : 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'
                        }`}
                      >
                        Verify Correction
                      </button>
                    ) : (
                      <div className="bg-slate-50 dark:bg-slate-950 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-300 leading-relaxed w-full">
                        <span className="font-bold text-teal-600 dark:text-teal-400 block mb-1">💡 Detective Notes:</span>
                        {item.explanation}
                      </div>
                    )}
                  </div>

                </div>
              );
            })}
          </div>

        </div>
      );
    }

    // =========================================================================
    // MODULE 3: WORKPLACE INCIDENT ROLEPLAY SIMULATOR
    // =========================================================================
    function Module3RoleplaySimulator({ scenarios, addXp, soundEnabled }) {
      const [selectedScenarioIdx, setSelectedScenarioIdx] = useState(0);
      const [currentStep, setCurrentStep] = useState(0);
      const [satisfaction, setSatisfaction] = useState(scenarios[0].initialSatisfaction);
      const [resolution, setResolution] = useState(scenarios[0].initialResolution);
      const [history, setHistory] = useState([]);
      const [isFinished, setIsFinished] = useState(false);

      const scenario = scenarios[selectedScenarioIdx];

      const handleSelectScenario = (idx) => {
        setSelectedScenarioIdx(idx);
        setCurrentStep(0);
        setSatisfaction(scenarios[idx].initialSatisfaction);
        setResolution(scenarios[idx].initialResolution);
        setHistory([]);
        setIsFinished(false);
        playSoundEffect('click', soundEnabled);
      };

      const handleChooseOption = (choice) => {
        const nextSat = Math.max(0, Math.min(100, satisfaction + choice.satDelta));
        const nextRes = Math.max(0, Math.min(100, resolution + choice.resDelta));

        setSatisfaction(nextSat);
        setResolution(nextRes);
        setHistory([...history, { step: currentStep, choice }]);

        if (currentStep + 1 < scenario.stages.length) {
          setCurrentStep(currentStep + 1);
          playSoundEffect('click', soundEnabled);
        } else {
          setIsFinished(true);
          addXp(35);
        }
      };

      const stage = scenario.stages[currentStep];

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          
          {/* Header & Scenario Selector */}
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-xl space-y-4">
            <div className="flex justify-between items-center">

    // =========================================================================
    // MODULE 4: VOCABULARY FLASHCARDS & CATEGORY CLASSIFIER
    // =========================================================================
    function Module4VocabClassifier({ items, addXp, soundEnabled, speakText }) {
      const [viewMode, setViewMode] = useState('flashcards'); // flashcards, classifier
      const [flippedCards, setFlippedCards] = useState({});
      
      // Classifier Game State
      const [unsortedItems, setUnsortedItems] = useState(items);
      const [buckets, setBuckets] = useState({
        "Experiences": [],
        "Mistakes": [],
        "Problems & Actions": []
      });
      const [classifierCompleted, setClassifierCompleted] = useState(false);

      const handleFlip = (idx) => {
        setFlippedCards({ ...flippedCards, [idx]: !flippedCards[idx] });
        playSoundEffect('click', soundEnabled);
      };

      const handleSortCard = (item, targetCategory) => {
        if (item.category === targetCategory) {
          playSoundEffect('correct', soundEnabled);
          setBuckets(prev => ({ ...prev, [targetCategory]: [...prev[targetCategory], item] }));
          setUnsortedItems(prev => prev.filter(i => i.word !== item.word));

          if (unsortedItems.length === 1) {
            setClassifierCompleted(true);
            addXp(30);
          }
        } else {
          playSoundEffect('wrong', soundEnabled);
        }
      };

      const handleResetClassifier = () => {
        setUnsortedItems(items);
        setBuckets({ "Experiences": [], "Mistakes": [], "Problems & Actions": [] });
        setClassifierCompleted(false);
        playSoundEffect('click', soundEnabled);
      };

      return (
        <div className="max-w-5xl mx-auto space-y-6">
          
          {/* Header & Mode Switch */}
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-xl flex flex-wrap justify-between items-center gap-4">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-500/10 px-3 py-1 rounded-full border border-amber-200 dark:border-amber-500/30">
                Module 4 • Incident Phrasebook & Classifier
              </span>
              <h2 className="text-xl font-black text-slate-900 dark:text-white mt-1">
                Master B1–B2 Workplace Vocabulary
              </h2>
            </div>

            <div className="flex items-center gap-2 bg-slate-100 dark:bg-slate-950 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-800">
              <button
                onClick={() => setViewMode('flashcards')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                  viewMode === 'flashcards' ? 'bg-amber-500 text-white' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                🎴 3D Flashcards
              </button>
              <button
                onClick={() => setViewMode('classifier')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                  viewMode === 'classifier' ? 'bg-amber-500 text-white' : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                🏷️ Category Classifier
              </button>
            </div>
          </div>

          {/* VIEW 1: 3D FLASHCARDS */}
          {viewMode === 'flashcards' && (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {items.map((item, idx) => {
                const isFlipped = flippedCards[idx];

                return (
                  <div
                    key={idx}
                    className="h-64 perspective-1000 cursor-pointer"
                    onClick={() => handleFlip(idx)}
                  >
                    <div className={`relative w-full h-full transform-style-3d rounded-3xl shadow-lg border border-slate-200 dark:border-slate-800 ${
                      isFlipped ? 'rotate-y-180' : ''
                    }`}>
                      
                      {/* FRONT FACE */}
                      <div className="absolute inset-0 backface-hidden bg-white dark:bg-slate-900 p-6 rounded-3xl flex flex-col justify-between items-center text-center">
                        <div className="w-full flex justify-between items-center">
                          <span className="text-[10px] font-mono font-bold uppercase bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full">
                            {item.category}
                          </span>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              speakText(item.word);
                            }}
                            className="text-xs bg-slate-100 dark:bg-slate-800 hover:bg-amber-500 hover:text-white p-2 rounded-xl transition"
                            title="Pronounce Word"
                          >
                            🔊
                          </button>
                        </div>

                        <div>
                          <h3 className="text-xl font-black text-slate-900 dark:text-white">{item.word}</h3>
                          <span className="text-xs font-mono text-slate-400">{item.phonetic} • {item.pos}</span>
                        </div>

                        <span className="text-[10px] text-slate-400 font-mono">Tap to flip card 🔄</span>
                      </div>

                      {/* BACK FACE */}
                      <div className="absolute inset-0 backface-hidden rotate-y-180 bg-slate-900 text-slate-100 p-6 rounded-3xl flex flex-col justify-between text-left border border-slate-700">
                        <div className="space-y-2">
                          <span className="text-[10px] font-bold text-amber-400 uppercase tracking-widest">Meaning:</span>
                          <p className="text-xs leading-relaxed text-slate-200">{item.meaning}</p>
                        </div>

                        <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 text-[11px] font-mono text-teal-300 italic">
                          "{item.example}"
                        </div>
                      </div>

                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* VIEW 2: CATEGORY CLASSIFIER */}
          {viewMode === 'classifier' && (
            <div className="space-y-6">
              
              {/* Cards Bank to Sort */}
              <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-xl space-y-3">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    Remaining Unsorted Vocabulary ({unsortedItems.length}):
                  </span>
                  {classifierCompleted && (
                    <span className="text-xs font-bold text-emerald-500 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/30">
                      🎉 Sorted All Correctly! (+30 XP)
                    </span>
                  )}
                </div>

                <div className="flex flex-wrap gap-2 min-h-[60px]">
                  {unsortedItems.map((item, idx) => (
                    <div
                      key={idx}
                      className="bg-amber-500 text-white font-bold text-xs px-3.5 py-2 rounded-2xl shadow-md font-mono flex items-center gap-2"
                    >
                      <span>{item.word}</span>
                    </div>
                  ))}
                  {unsortedItems.length === 0 && (
                    <span className="text-xs text-slate-400 italic">All terms sorted into categories!</span>
                  )}
                </div>
              </div>

              {/* 3 Sorting Category Buckets */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {["Experiences", "Mistakes", "Problems & Actions"].map((category) => (
                  <div
                    key={category}
                    className="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200 dark:border-slate-800 shadow-lg space-y-3 min-h-[220px]"
                  >
                    <div className="border-b border-slate-100 dark:border-slate-800 pb-2">
                      <h4 className="text-xs font-bold text-slate-800 dark:text-slate-200 uppercase tracking-wider flex items-center gap-1.5">
                        <span>📂</span> {category}
                      </h4>
                    </div>

                    {/* Target Drop Button */}
                    {unsortedItems.length > 0 && (
                      <button
                        onClick={() => handleSortCard(unsortedItems[0], category)}
                        className="w-full bg-slate-50 dark:bg-slate-950 hover:bg-amber-500/10 border border-dashed border-slate-300 dark:border-slate-700 hover:border-amber-500 text-xs font-bold text-slate-600 dark:text-slate-400 py-2.5 rounded-xl transition"
                      >
                        ➕ Place "{unsortedItems[0]?.word}" Here
                      </button>
                    )}

                    {/* Sorted List */}
                    <div className="space-y-1.5 pt-1">
                      {buckets[category].map((item, idx) => (
                        <div key={idx} className="bg-slate-100 dark:bg-slate-950 px-3 py-2 rounded-xl text-xs font-mono text-teal-600 dark:text-teal-300 border border-teal-500/30 flex justify-between items-center">
                          <span>{item.word}</span>
                          <span className="text-emerald-500">✓</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>

              {classifierCompleted && (
                <div className="flex justify-end">
                  <button
                    onClick={handleResetClassifier}
                    className="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition"
                  >
                    🔄 Play Sorting Challenge Again
                  </button>
                </div>
              )}

            </div>
          )}

        </div>
      );
    }

                  value={userGaps[8] || ''}
                  onChange={(e) => handleSelectGap(8, e.target.value)}
                  className={`inline-block mx-1 font-mono font-bold rounded-xl px-2.5 py-1 text-xs focus:outline-none border ${
                    isSubmitted
                      ? userGaps[8] === data.gaps[7].correct
                        ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400'
                        : 'bg-rose-500/20 border-rose-500 text-rose-400'
                      : 'bg-slate-100 dark:bg-slate-950 border-slate-300 dark:border-slate-700 text-teal-600 dark:text-teal-300'
                  }`}
                >
                  <option value="">[ Select 8 ]</option>
                  {data.gaps[7].options.map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
                </select>
                {" "}such a complex crash before, it reinforced the crucial need for thorough pre-launch testing protocols.
              </p>
            </div>

            <div className="flex justify-end pt-4">
              {!isSubmitted ? (
                <button
                  onClick={handleCheckReport}
                  disabled={Object.keys(userGaps).length < 8}
                  className={`px-6 py-3 rounded-xl text-xs font-bold transition shadow-md ${
                    Object.keys(userGaps).length === 8
                      ? 'bg-teal-600 hover:bg-teal-500 text-white shadow-teal-600/30'
                      : 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'
                  }`}
                >
                  Submit Incident Report Gap-Fill
                </button>
              ) : (
                <div className="bg-emerald-500/10 border border-emerald-500/30 px-5 py-2.5 rounded-2xl text-xs font-bold text-emerald-600 dark:text-emerald-300">
                  🎉 Completed Report: {score} / 8 Correct Answers!
                </div>
              )}
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 6: REFLECTION JOURNAL & PRINTABLE CERTIFICATE
    // =========================================================================
    function Module6ReflectionCertificate({ studentName, setStudentName, xp, currentRank, addXp, soundEnabled }) {
      const [journalText, setJournalText] = useState(
        "Last month, our team experienced a project delay due to an unexpected technical obstacle. Looking back, we should have performed a stress test earlier. In order to resolve the situation, we held an emergency meeting and tackled the issue immediately."
      );
      const [detectedTags, setDetectedTags] = useState([]);

      const TARGET_TRIGGERS = [
        { label: "should have / shouldn't have", regex: /should (have|not have|n't have)/i },
        { label: "due to / because of", regex: /(due to|because of)/i },
        { label: "was/were supposed to", regex: /(was|were) supposed to/i },
        { label: "in order to / to resolve", regex: /(in order to|to resolve)/i },
        { label: "tackle / resolve", regex: /(tackle|resolve)/i },
        { label: "experienced / encountered", regex: /(experienced|encountered)/i },
        { label: "wish / if only", regex: /(wish|if only)/i }
      ];

      // Auto scan for grammar signposts
      useEffect(() => {
        const text = journalText;
        const found = TARGET_TRIGGERS.filter(item => item.regex.test(text));
        setDetectedTags(found);
      }, [journalText]);

      const handlePrint = () => {
        window.print();
      };

      useEffect(() => {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 80,
            spread: 60,
            origin: { y: 0.6 }
          });
        }
        playSoundEffect('fanfare', soundEnabled);
      }, []);

      const wordCount = journalText.trim().split(/\s+/).filter(Boolean).length;

      return (
        <div className="max-w-4xl mx-auto space-y-8">
          
          {/* Reflection Journal Section */}
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-xl space-y-4 no-print">
            <div>
              <span className="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-200 dark:border-emerald-500/30">
                Module 6 • Incident Reflection Studio
              </span>
              <h2 className="text-xl font-black text-slate-900 dark:text-white mt-1">
                Draft Your Incident & Solution Case Summary
              </h2>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                Describe a past mistake, regret, or obstacle. Use target past modals and linkers!
              </p>
            </div>

            {/* Live Text Area */}
            <textarea
              rows={5}
              value={journalText}
              onChange={(e) => setJournalText(e.target.value)}
              className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-xs sm:text-sm text-slate-800 dark:text-slate-100 font-mono leading-relaxed focus:outline-none focus:ring-2 focus:ring-teal-500"
            />

            {/* Target Grammar Detector Chips */}
            <div className="bg-slate-50 dark:bg-slate-950 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2">
              <div className="flex justify-between items-center">
                <span className="text-[11px] font-bold text-teal-600 dark:text-teal-400 uppercase tracking-wider">
                  Live Target Grammar Detector ({detectedTags.length} / 7):
                </span>
                <span className="text-[10px] text-slate-400 font-mono">Word Count: {wordCount} words</span>
              </div>

              <div className="flex flex-wrap gap-2">
                {detectedTags.map((tag, idx) => (
                  <span key={idx} className="bg-teal-500/20 text-teal-700 dark:text-teal-300 border border-teal-500/40 text-[10px] font-bold px-3 py-1 rounded-full flex items-center gap-1">
                    <span>✓</span>
                    <span>{tag.label}</span>
                  </span>
                ))}
              </div>
            </div>
          </div>

          {/* PRINTABLE CERTIFICATE CARD */}
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-xl space-y-6 no-print">
            <div className="flex flex-wrap justify-between items-center gap-4 border-b border-slate-100 dark:border-slate-800 pb-4">
              <div>
                <h3 className="text-lg font-black text-slate-900 dark:text-white">🎓 Official Completion Certificate</h3>
                <p className="text-xs text-slate-500 dark:text-slate-400">Export or print your verified proof of achievement in B1–B2 problem-solving grammar.</p>
              </div>

              <div className="flex items-center space-x-3">
                <input
                  type="text"
                  value={studentName}
                  onChange={(e) => setStudentName(e.target.value)}
                  className="bg-slate-100 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2 text-xs font-bold text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500"
                  placeholder="Your Full Name"
                />
                <button
                  onClick={handlePrint}
                  className="bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-md shadow-teal-600/30 flex items-center gap-2"
                >
                  🖨️ Print Certificate
                </button>
              </div>
            </div>
          </div>

          {/* FORMAL CERTIFICATE ELEMENT */}
          <div 
            id="printable-certificate"
            className="bg-slate-950 p-8 sm:p-12 rounded-3xl border-4 border-teal-500/40 text-center space-y-6 relative overflow-hidden shadow-2xl text-slate-100"
          >
            <div className="absolute top-4 left-4 text-[10px] font-mono text-teal-400/60">
              CERT-ID: LAB-2026-B2-INCIDENT
            </div>
            <div className="absolute top-4 right-4 text-[10px] font-mono text-teal-400/60">
              CEFR B1–B2 INTERMEDIATE ENGLISH
            </div>

            <div className="space-y-2 pt-4">
              <span className="text-4xl">👑</span>
              <h2 className="text-2xl sm:text-3xl font-black tracking-widest uppercase text-amber-400">
                Certificate of Competency
              </h2>
              <p className="text-xs text-slate-300 uppercase tracking-widest font-mono">
                Experience & Incident Lab • Mistakes, Regrets & Problem Solving
              </p>
            </div>

            <div className="py-4 border-y border-teal-500/30 space-y-3">
              <p className="text-xs text-slate-400">This certifies that</p>
              <p className="text-2xl sm:text-3xl font-black text-white underline decoration-teal-500 decoration-2">{studentName}</p>
              <p className="text-xs text-slate-300 max-w-lg mx-auto leading-relaxed pt-2">
                has successfully completed all diagnostic modules, demonstrating mastery in **CEFR B1–B2 past modals of regret**, cause and effect sentence structures, workplace incident navigation, and professional problem-solving vocabulary.
              </p>
            </div>

            <div className="grid grid-cols-3 gap-4 max-w-md mx-auto text-center text-xs">
              <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">Rank Achieved</span>
                <span className="text-xs font-black text-amber-400">{currentRank.title}</span>
              </div>
              <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">Total Score</span>
                <span className="text-xs font-black text-teal-300">{xp} XP Points</span>
              </div>
              <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">Status</span>
                <span className="text-xs font-black text-emerald-400">VERIFIED PASSED</span>
              </div>
            </div>
          </div>

        </div>
      );
    }

    // RENDER APPLICATION
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
