    // =========================================================================
    // AUDIO SYNTHESIZER & TTS SPEECH HELPER
    // =========================================================================
    const playSound = (type, enabled = true) => {
      if (!enabled) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'correct') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15); // G5
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(420, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.start();
          osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'fanfare') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
            gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.35);
            osc.start(ctx.currentTime + idx * 0.09);
            osc.stop(ctx.currentTime + idx * 0.09 + 0.35);
          });
        }
      } catch (e) {
        console.warn("Web Audio API warning", e);
      }
    };

    const speakText = (text, rate = 1.0) => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = rate;
      utterance.lang = 'en-US';
      window.speechSynthesis.speak(utterance);
    };

    // =========================================================================
    // STATIC CURRICULUM DATA
    // =========================================================================

    const HISTORICAL_CASES = [
      {
        id: 'c1',
        title: "Alexander Fleming & Penicillin",
        year: "1928",
        inventor: "Dr. Alexander Fleming",
        icon: "🧫",
        summary: "The Contaminated Petri Dish",
        fullStory: "In September 1928, Scottish scientist Alexander Fleming was researching Staphylococcus bacteria in his London laboratory. Before leaving for a two-week vacation, he accidentally left a stack of Petri dishes uncovered near an open window. When he returned, he noticed a unusual mold growing on one dish. Surprisingly, the bacteria immediately surrounding the mold had been completely destroyed! Fleming identified the mold as Penicillium notatum. This fortunate mistake launched the age of modern antibiotics, saving over 200 million lives worldwide.",

        targetGrammarSample: "If Greatbatch had installed the correct resistor, he would have built a recorder instead of an artificial pacemaker.",
        vocabHighlights: [

    const CONDITIONAL_TILES = [

      const [activeTab, setActiveTab] = useState('cases'); // cases, grammar, butterfly, studio, certificate

      const [studentName, setStudentName] = useState('Taylor Morgan');

      const getRank = (points) => {
        if (points < 150) return { title: "Accidental Observer", icon: "🌱", color: "text-amber-400 border-amber-500/30 bg-amber-500/10" };

              </div>

              <div className="mt-3 pt-2 border-t border-slate-800/80 flex items-center justify-between overflow-x-auto no-scrollbar">
                <nav className="flex items-center gap-2">
                  {[
                    { id: 'cases', label: '1. Accident Case Files', icon: '🧫' },
                    { id: 'grammar', label: '2. Grammar & Idiom Lab', icon: '🧩' },
                    { id: 'butterfly', label: '3. Butterfly Effect Simulator', icon: '🦋' },
                    { id: 'studio', label: '4. Personal Story Studio', icon: '✍️' },

                  ].map(tab => (
                    <button
                      key={tab.id}

                        setActiveTab(tab.id);
                        playSound('click', soundEnabled);
                      }}
                      className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition flex items-center gap-1.5 ${
                        activeTab === tab.id
                          ? 'bg-indigo-600 text-white font-black shadow-lg shadow-indigo-600/30'
                          : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'

                addXp={addXp}

              <Module2GrammarLab
                tileData={CONDITIONAL_TILES}
                interruptedData={INTERRUPTED_PAST_DATA}
                idioms={IDIOMS}
                addXp={addXp}
                soundEnabled={soundEnabled}
                ttsRate={ttsRate}
              />
            )}

            {activeTab === 'butterfly' && (
              <Module3ButterflyEffect
                scenarios={BUTTERFLY_SCENARIOS}
                addXp={addXp}
                soundEnabled={soundEnabled}
                ttsRate={ttsRate}

            )}

            {activeTab === 'studio' && (
              <Module4StoryStudio
                targetChips={TARGET_CHIPS}
                addXp={addXp}
                soundEnabled={soundEnabled}
              />
            )}

            {activeTab === 'certificate' && (
              <Module5MasteryCertificate
                studentName={studentName}
                setStudentName={setStudentName}
                xp={xp}
                currentRank={currentRank}
                soundEnabled={soundEnabled}
              />
            )}
          </main>

          {/* LANGUAGE TOOLKIT QUICK REFERENCE MODAL */}
          {showToolkitModal && (
            <div className="fixed inset-0 bg-brand-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-brand-900 border border-slate-700 rounded-3xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl space-y-6 relative max-h-[90vh] overflow-y-auto text-slate-200">
                
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <div className="flex items-center space-x-2">
                    <span className="text-2xl">📖</span>
                    <h3 className="text-lg font-black font-header text-indigo-400">Language Toolkit: B1-B2 Serendipity Structures</h3>
                  </div>
                  <button
                    onClick={() => setShowToolkitModal(false)}
                    className="text-slate-400 hover:text-white bg-slate-800 rounded-full w-8 h-8 flex items-center justify-center transition"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-6 text-xs sm:text-sm">
                  {/* 3rd Conditional */}
                  <div className="bg-brand-950 p-4 rounded-2xl border border-indigo-500/30 space-y-2">
                    <h4 className="font-bold text-indigo-400 font-mono text-xs uppercase tracking-wider">1. The 3rd Conditional (Past Unreal / Hypotheticals)</h4>
                    <p className="text-slate-300">Used to imagine a different past outcome that did not actually happen.</p>
                    <div className="bg-slate-900 p-3 rounded-xl font-mono text-xs border border-slate-800 text-indigo-300">
                      <strong>Structure:</strong> If + Past Perfect (had + V3), WOULD HAVE + Past Participle (V3)<br/>
                      <em>Example: "If Fleming **had cleaned** his dish, he **would not have discovered** penicillin."</em>
                    </div>
                  </div>

                  {/* Interrupted Past Tense */}
                  <div className="bg-brand-950 p-4 rounded-2xl border border-cyan-500/30 space-y-2">
                    <h4 className="font-bold text-cyan-400 font-mono text-xs uppercase tracking-wider">2. Interrupted Past (Past Continuous + Past Simple)</h4>
                    <p className="text-slate-300">Shows an ongoing background action interrupted by an unexpected discovery.</p>
                    <div className="bg-slate-900 p-3 rounded-xl font-mono text-xs border border-slate-800 text-cyan-300">
                      <strong>Structure:</strong> [was / were + V-ing] + WHEN + [Past Simple V2]<br/>
                      <em>Example: "Percy Spencer **was testing** a radar tube **when** his chocolate bar **melted**."</em>
                    </div>
                  </div>

                  {/* Key Idioms Table */}
                  <div className="bg-brand-950 p-4 rounded-2xl border border-amber-500/30 space-y-2">
                    <h4 className="font-bold text-amber-400 font-mono text-xs uppercase tracking-wider">3. Key Serendipity Expressions & Idioms</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs font-mono">
                      <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-800">
                        <span className="text-amber-300 font-bold block">Blessing in disguise:</span>
                        <span className="text-slate-400 text-[11px]">A problem that turns out good later.</span>
                      </div>
                      <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-800">
                        <span className="text-amber-300 font-bold block">Turning point:</span>
                        <span className="text-slate-400 text-[11px]">A moment of decisive positive change.</span>
                      </div>
                      <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-800">
                        <span className="text-amber-300 font-bold block">Stumble upon:</span>
                        <span className="text-slate-400 text-[11px]">To find something unexpectedly.</span>
                      </div>
                      <div className="p-2.5 bg-slate-900 rounded-xl border border-slate-800">
                        <span className="text-amber-300 font-bold block">Happy accident:</span>
                        <span className="text-slate-400 text-[11px]">A mistake producing good fortune.</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end pt-2">
                  <button
                    onClick={() => setShowToolkitModal(false)}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-md"
                  >
                    Got It! Back to Study
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-brand-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500 no-print">
            <p>Serendipity & Sparks • B1-B2 ESL Learning Studio for World-Changing Accidents</p>
          </footer>

        </div>
      );
    }

    // =========================================================================
    // MODULE 1: HISTORICAL CASE FILES
    // =========================================================================
    function Module1CaseFiles({ cases, addXp, soundEnabled, ttsRate }) {
      const [selectedIdx, setSelectedIdx] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [checkedQuestions, setCheckedQuestions] = useState({});

      const caseItem = cases[selectedIdx];

      const handleAnswerSelect = (optionIdx) => {
        setUserAnswers(prev => ({ ...prev, [caseItem.id]: optionIdx }));
      };

      const handleCheckQuiz = () => {
        const selected = userAnswers[caseItem.id];
        const isCorrect = selected === caseItem.quiz.correctIdx;
        setCheckedQuestions(prev => ({ ...prev, [caseItem.id]: { isCorrect, checked: true } }));

        if (isCorrect) {
          addXp(20);
          playSound('correct', soundEnabled);
        } else {
          playSound('wrong', soundEnabled);
        }
      };

      return (
        <div className="max-w-5xl mx-auto space-y-6">
          {/* Module Banner */}
          <div className="bg-brand-900 rounded-3xl p-6 border border-slate-800 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <span className="text-xs font-mono font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/30">
                Module 1 • Historical Accident Case Files
              </span>
              <h2 className="text-xl font-black font-header text-white mt-1">
                Discover the Fortunate Errors that Shaped History
              </h2>
              <p className="text-xs text-slate-400 mt-0.5">
                Listen to authentic narrations, explore target B1-B2 vocabulary, and test your comprehension.
              </p>
            </div>
          </div>

          {/* Selector Carousel Buttons */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2.5">
            {cases.map((c, idx) => (
              <button
                key={c.id}
                onClick={() => {
                  setSelectedIdx(idx);
                  playSound('click', soundEnabled);
                }}
                className={`p-3 rounded-2xl border text-left transition flex flex-col justify-between ${
                  selectedIdx === idx
                    ? 'bg-indigo-600/20 border-indigo-500 text-white shadow-lg shadow-indigo-600/10'
                    : 'bg-brand-900 border-slate-800 text-slate-400 hover:border-slate-700'
                }`}
              >
                <div className="flex items-center justify-between text-lg mb-1">
                  <span>{c.icon}</span>
                  <span className="text-[10px] font-mono text-slate-500">{c.year}</span>
                </div>
                <span className="text-xs font-bold font-mono line-clamp-1">{c.inventor}</span>
              </button>
            ))}
          </div>

          {/* Active Case File Reader Card */}
          <div className="bg-brand-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
            
            <div className="flex flex-wrap justify-between items-start gap-4 border-b border-slate-800 pb-4">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="text-3xl">{caseItem.icon}</span>
                  <div>
                    <h3 className="text-lg sm:text-xl font-bold font-header text-indigo-300">{caseItem.title}</h3>
                    <p className="text-xs font-mono text-amber-400">Accident: {caseItem.summary} ({caseItem.year})</p>
                  </div>
                </div>
              </div>

              {/* TTS Speech Player */}
              <button
                onClick={() => speakText(caseItem.fullStory, ttsRate)}
                className="bg-indigo-600 hover:bg-indigo-500 text-white font-mono text-xs px-4 py-2.5 rounded-xl transition shadow-md shadow-indigo-600/20 flex items-center gap-2"
              >
                <span>🔊</span>
                <span>Listen to Narration ({ttsRate}x)</span>
              </button>
            </div>

            {/* Main Narrative Text */}
            <div className="space-y-4">
              <h4 className="text-xs font-mono font-bold uppercase text-slate-400 tracking-wider">The Historical Case Story:</h4>
              <p className="text-sm sm:text-base font-mono text-slate-200 leading-relaxed bg-brand-950 p-5 rounded-2xl border border-slate-800/80">
                "{caseItem.fullStory}"
              </p>
            </div>

            {/* Targeted Grammar Highlight Card */}
            <div className="bg-indigo-950/40 p-4 rounded-2xl border border-indigo-500/30 space-y-1">
              <span className="text-[10px] font-mono font-bold uppercase tracking-widest text-indigo-400 block">💡 B1-B2 Target Grammar Sample (3rd Conditional):</span>
              <p className="text-xs font-mono text-indigo-200 italic">
                "{caseItem.targetGrammarSample}"
              </p>
            </div>

            {/* Key Vocabulary Highlights */}
            <div className="space-y-2">
              <h4 className="text-xs font-mono font-bold uppercase text-slate-400 tracking-wider">Key Serendipity & Scientific Terms:</h4>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {caseItem.vocabHighlights.map((v, i) => (
                  <div key={i} className="bg-brand-950 p-3 rounded-xl border border-slate-800 space-y-1">
                    <span className="text-xs font-mono font-bold text-emerald-400 block">{v.word}</span>
                    <span className="text-[11px] text-slate-400 leading-tight block">{v.def}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Interactive Case Comprehension Quiz */}
            <div className="pt-4 border-t border-slate-800 space-y-4">
              <h4 className="text-xs font-mono font-bold uppercase text-amber-400 tracking-wider flex items-center gap-1.5">
                <span>🎯</span> Case File Comprehension Check
              </h4>

              <div className="space-y-3">
                <p className="text-xs sm:text-sm font-mono text-slate-200 font-bold">
                  {caseItem.quiz.question}
                </p>

                <div className="space-y-2">
                  {caseItem.quiz.options.map((opt, oIdx) => {
                    const isSelected = userAnswers[caseItem.id] === oIdx;
                    return (
                      <button
                        key={oIdx}
                        disabled={checkedQuestions[caseItem.id]?.checked}
                        onClick={() => {
                          handleAnswerSelect(oIdx);
                          playSound('click', soundEnabled);
                        }}
                        className={`w-full text-left p-3.5 rounded-2xl border font-mono text-xs transition ${
                          isSelected
                            ? 'bg-indigo-600/30 border-indigo-500 text-white font-bold'
                            : 'bg-brand-950 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        {opt}
                      </button>
                    );
                  })}
                </div>

                <div className="flex justify-between items-center pt-2">
                  {checkedQuestions[caseItem.id]?.checked ? (
                    <div className="space-y-1 text-xs font-mono">
                      <span className={`font-bold ${checkedQuestions[caseItem.id].isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {checkedQuestions[caseItem.id].isCorrect ? '✓ Correct! (+20 XP)' : '❌ Incorrect Selection'}
                      </span>
                      <p className="text-slate-400 text-[11px]">💡 {caseItem.quiz.explanation}</p>
                    </div>
                  ) : (
                    <button
                      onClick={handleCheckQuiz}
                      disabled={userAnswers[caseItem.id] === undefined}
                      className={`px-5 py-2.5 rounded-xl text-xs font-bold font-mono transition ${
                        userAnswers[caseItem.id] !== undefined
                          ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md'
                          : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                      }`}
                    >
                      Verify Case Answer
                    </button>
                  )}
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 2: GRAMMAR & IDIOM LAB
    // =========================================================================
    function Module2GrammarLab({ tileData, interruptedData, idioms, addXp, soundEnabled, ttsRate }) {
      const [subTab, setSubTab] = useState('tiles'); // tiles, interrupted, idioms

      // Tile Builder State
      const [activeTileIdx, setActiveTileIdx] = useState(0);
      const [selectedTiles, setSelectedTiles] = useState([]);
      const [availableTiles, setAvailableTiles] = useState([]);
      const [tileValidation, setTileValidation] = useState(null);

      // Interrupted Past State
      const [userConnectors, setUserConnectors] = useState({});
      const [checkedInterrupted, setCheckedInterrupted] = useState({});

      // Idioms Card & Match Game State
      const [flippedCards, setFlippedCards] = useState({});

      const currentTile = tileData[activeTileIdx];

      useEffect(() => {
        // Initialize randomized tiles for tile builder
        if (currentTile) {
          const combined = [...currentTile.correctSequence, ...currentTile.distractors];
          const shuffled = combined.sort(() => Math.random() - 0.5);
          setAvailableTiles(shuffled);
          setSelectedTiles([]);
          setTileValidation(null);
        }
      }, [activeTileIdx]);

      const handleAddTile = (tile, idx) => {
        setSelectedTiles(prev => [...prev, tile]);
        setAvailableTiles(prev => prev.filter((_, i) => i !== idx));
        playSound('click', soundEnabled);
      };

      const handleRemoveTile = (tile, idx) => {
        setAvailableTiles(prev => [...prev, tile]);
        setSelectedTiles(prev => prev.filter((_, i) => i !== idx));
        playSound('click', soundEnabled);
      };

      const handleCheckTileSentence = () => {
        const isMatch = JSON.stringify(selectedTiles) === JSON.stringify(currentTile.correctSequence);
        if (isMatch) {
          setTileValidation({ isCorrect: true, msg: "✓ Perfect 3rd Conditional Structure! (+25 XP)" });
          addXp(25);
          playSound('correct', soundEnabled);
        } else {
          setTileValidation({ isCorrect: false, msg: "❌ Sequence incorrect. Check 'If + had + V3' and 'would have + V3'." });
          playSound('wrong', soundEnabled);
        }
      };

      const toggleCardFlip = (id) => {
        setFlippedCards(prev => ({ ...prev, [id]: !prev[id] }));
        playSound('click', soundEnabled);
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          
          {/* Sub Navigation Bar */}
          <div className="bg-brand-900 p-2 rounded-2xl border border-slate-800 flex flex-wrap gap-2">
            {[
              { id: 'tiles', label: '1. 3rd Conditional Builder', icon: '🧩' },
              { id: 'interrupted', label: '2. Interrupted Past Matcher', icon: '⚡' },
              { id: 'idioms', label: '3. Serendipity Flashcards', icon: '🎴' }
            ].map(st => (
              <button
                key={st.id}
                onClick={() => {
                  setSubTab(st.id);
                  playSound('click', soundEnabled);
                }}
                className={`px-4 py-2 rounded-xl text-xs font-mono font-bold transition flex items-center gap-1.5 ${
                  subTab === st.id
                    ? 'bg-indigo-600 text-white shadow-md'
                    : 'text-slate-400 hover:text-white'
                }`}
              >
                <span>{st.icon}</span>
                <span>{st.label}</span>
              </button>
            ))}
          </div>

          {/* SUB-TAB 1: 3RD CONDITIONAL TILE BUILDER */}
          {subTab === 'tiles' && (
            <div className="bg-brand-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-xl space-y-6">
              
              <div className="flex justify-between items-center">
                <div>
                  <span className="text-xs font-mono font-bold uppercase tracking-wider text-indigo-400">
                    Challenge {activeTileIdx + 1} of {tileData.length}
                  </span>
                  <h3 className="text-lg font-bold font-header text-white mt-0.5">3rd Conditional Word-Tile Unscrambler</h3>
                </div>

                <div className="flex gap-1.5">
                  {tileData.map((_, idx) => (
                    <button
                      key={idx}
                      onClick={() => setActiveTileIdx(idx)}
                      className={`w-7 h-7 rounded-xl font-mono text-xs font-bold transition border ${
                        activeTileIdx === idx
                          ? 'bg-indigo-600 border-indigo-500 text-white'
                          : 'bg-brand-950 border-slate-800 text-slate-500'
                      }`}
                    >
                      {idx + 1}
                    </button>
                  ))}
                </div>
              </div>

              <div className="bg-brand-950 p-4 rounded-2xl border border-slate-800 space-y-1">
                <span className="text-[10px] font-mono text-slate-400 uppercase tracking-widest block">Prompt Target:</span>
                <p className="text-sm font-mono text-slate-200 font-bold">{currentTile.prompt}</p>
              </div>

              {/* Sentence Construction Zone */}
              <div className="space-y-2">
                <span className="text-xs font-mono text-slate-400 uppercase tracking-wider block">Your Built Sentence:</span>
                <div className="min-h-[70px] p-4 bg-brand-950 border-2 border-dashed border-slate-800 rounded-2xl flex flex-wrap items-center gap-2">
                  {selectedTiles.length === 0 ? (
                    <span className="text-xs font-mono text-slate-600 italic">Click word tiles below to assemble sentence...</span>
                  ) : (
                    selectedTiles.map((tile, idx) => (
                      <button
                        key={idx}
                        onClick={() => handleRemoveTile(tile, idx)}
                        className="bg-indigo-600 hover:bg-indigo-500 text-white font-mono text-xs px-3 py-2 rounded-xl transition shadow-md flex items-center gap-1.5"
                      >
                        <span>{tile}</span>
                        <span className="text-[10px] opacity-70">✕</span>
                      </button>
                    ))
                  )}
                </div>
              </div>

              {/* Available Tiles */}
              <div className="space-y-2">
                <span className="text-xs font-mono text-slate-400 uppercase tracking-wider block">Available Word Tiles:</span>
                <div className="flex flex-wrap gap-2">
                  {availableTiles.map((tile, idx) => (
                    <button
                      key={idx}
                      onClick={() => handleAddTile(tile, idx)}
                      className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-mono text-xs px-3 py-2 rounded-xl transition shadow-sm"
                    >
                      + {tile}
                    </button>
                  ))}
                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex justify-between items-center pt-4 border-t border-slate-800">
                <button
                  onClick={() => speakText(selectedTiles.join(" "), ttsRate)}
                  disabled={selectedTiles.length === 0}
                  className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-mono text-xs px-4 py-2 rounded-xl transition disabled:opacity-40"
                >
                  🔊 Listen
                </button>

                <button
                  onClick={handleCheckTileSentence}
                  disabled={selectedTiles.length === 0}
                  className="bg-indigo-600 hover:bg-indigo-500 text-white font-mono font-bold text-xs px-6 py-2.5 rounded-xl transition shadow-md disabled:opacity-40"
                >
                  Verify Sentence
                </button>
              </div>

              {tileValidation && (
                <div className={`p-4 rounded-2xl font-mono text-xs ${tileValidation.isCorrect ? 'bg-emerald-950/40 border border-emerald-500/50 text-emerald-300' : 'bg-rose-950/40 border border-rose-500/50 text-rose-300'}`}>
                  {tileValidation.msg}
                </div>
              )}

            </div>
          )}

          {/* SUB-TAB 2: INTERRUPTED PAST MATCHER */}
          {subTab === 'interrupted' && (
            <div className="bg-brand-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-xl space-y-6">
              <div>
                <h3 className="text-lg font-bold font-header text-white">Interrupted Past Structure Matcher</h3>
                <p className="text-xs text-slate-400">Match background continuous actions with unexpected sudden events using 'WHEN'.</p>
              </div>

              <div className="space-y-4">
                {interruptedData.map((item) => {
                  const selectedConn = userConnectors[item.id];
                  const checked = checkedInterrupted[item.id];

                  return (
                    <div key={item.id} className="bg-brand-950 p-5 rounded-2xl border border-slate-800 space-y-3">
                      <div className="flex flex-wrap items-center gap-2 font-mono text-xs sm:text-sm">
                        <span className="text-cyan-300 font-bold bg-cyan-950/60 p-2 rounded-xl border border-cyan-800/50">
                          {item.background}
                        </span>

                        <span className="text-amber-400 font-bold px-2 py-1 bg-amber-500/10 border border-amber-500/30 rounded-lg">
                          [ WHEN ]
                        </span>

                        <span className="text-emerald-300 font-bold bg-emerald-950/60 p-2 rounded-xl border border-emerald-800/50">
                          {item.unexpected}
                        </span>
                      </div>

                      <div className="flex justify-between items-center pt-2 border-t border-slate-800/80">
                        <p className="text-[11px] font-mono text-slate-400">
                          💡 Rule: Past Continuous (was/were -ing) + WHEN + Past Simple (unexpected accident).
                        </p>
                        <button
                          onClick={() => speakText(`${item.background} when ${item.unexpected}`, ttsRate)}
                          className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-mono text-[11px] px-3 py-1.5 rounded-lg transition"
                        >
                          🔊 Listen
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* SUB-TAB 3: SERENDIPITY IDIOMS FLASHCARDS */}
          {subTab === 'idioms' && (
            <div className="bg-brand-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-xl space-y-6">
              <div>
                <h3 className="text-lg font-bold font-header text-white">Serendipity Idioms & Vocabulary Flip Cards</h3>
                <p className="text-xs text-slate-400">Click cards to flip and discover definitions, examples, and natural B1-B2 usage.</p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                {idioms.map((card) => {
                  const isFlipped = flippedCards[card.id];

                  return (
                    <div
                      key={card.id}
                      onClick={() => toggleCardFlip(card.id)}
                      className="h-44 cursor-pointer perspective-1000"
                    >
                      <div className={`relative w-full h-full duration-500 transform-style-3d transition-transform ${isFlipped ? 'rotate-y-180' : ''}`}>
                        
                        {/* Front Side */}
                        <div className="absolute inset-0 bg-brand-950 border border-indigo-500/30 rounded-2xl p-5 flex flex-col justify-between backface-hidden shadow-lg">
                          <span className="text-xs font-mono text-indigo-400 uppercase tracking-widest font-bold">Idiom Card</span>
                          <h4 className="text-base font-bold font-header text-amber-300">{card.term}</h4>
                          <span className="text-[10px] font-mono text-slate-500">Click to reveal definition ↺</span>
                        </div>

                        {/* Back Side */}
                        <div className="absolute inset-0 bg-indigo-950 border border-indigo-500 rounded-2xl p-4 flex flex-col justify-between rotate-y-180 backface-hidden shadow-xl text-slate-100">
                          <div className="space-y-1">
                            <span className="text-[10px] font-mono text-emerald-400 uppercase font-bold">Meaning:</span>
                            <p className="text-xs font-mono leading-tight text-slate-200">{card.meaning}</p>
                          </div>
                          <div className="space-y-1 pt-2 border-t border-indigo-800/60">
                            <span className="text-[10px] font-mono text-amber-300 uppercase font-bold">Example:</span>
                            <p className="text-[11px] font-mono italic text-indigo-200 line-clamp-2">"{card.example}"</p>
                          </div>
                        </div>

                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // MODULE 3: "BUTTERFLY EFFECT" ALTERNATE HISTORY SIMULATOR
    // =========================================================================
    function Module3ButterflyEffect({ scenarios, addXp, soundEnabled, ttsRate }) {
      const [activeScenarioIdx, setActiveScenarioIdx] = useState(0);
      const [userSelections, setUserSelections] = useState({});
      const [revealedTimelines, setRevealedTimelines] = useState({});

      const scenario = scenarios[activeScenarioIdx];

      const handleOptionClick = (optIdx, option) => {
        setUserSelections(prev => ({ ...prev, [scenario.id]: optIdx }));
        setRevealedTimelines(prev => ({
          ...prev,
          [scenario.id]: {
            isCorrect: option.isCorrect,
            timelineText: option.timeline
          }
        }));

        if (option.isCorrect) {
          addXp(30);
          playSound('correct', soundEnabled);
        } else {
          playSound('wrong', soundEnabled);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-brand-900 rounded-3xl p-6 border border-slate-800 shadow-xl space-y-2">
            <span className="text-xs font-mono font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/30">
              Module 3 • "Butterfly Effect" Alternate History Simulator
            </span>
            <h2 className="text-xl font-black font-header text-white">
              Change the Past: What If Accidents Had Never Happened?
            </h2>
            <p className="text-xs text-slate-400">
              Select the correct 3rd conditional formulation to rewrite modern history and unlock alternate timeline branches.
            </p>
          </div>

          {/* Scenario Tabs */}
          <div className="flex gap-2">
            {scenarios.map((s, idx) => (
              <button
                key={s.id}
                onClick={() => {
                  setActiveScenarioIdx(idx);
                  playSound('click', soundEnabled);
                }}
                className={`px-4 py-2 rounded-xl text-xs font-mono font-bold transition border ${
                  activeScenarioIdx === idx
                    ? 'bg-amber-600 border-amber-500 text-white'
                    : 'bg-brand-900 border-slate-800 text-slate-400 hover:text-white'
                }`}
              >
                {s.title}
              </button>
            ))}
          </div>

          {/* Active Scenario Card */}
          <div className="bg-brand-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
            
            <div className="bg-brand-950 p-4 rounded-2xl border border-slate-800 space-y-2">
              <span className="text-[10px] font-mono text-slate-400 uppercase tracking-widest block">Real History Fact:</span>
              <p className="text-xs sm:text-sm font-mono text-slate-200">"{scenario.historicalFact}"</p>
            </div>

            <div className="space-y-3">
              <h3 className="text-sm sm:text-base font-bold font-header text-amber-300">
                🦋 {scenario.question}
              </h3>

              <div className="space-y-3">
                {scenario.options.map((opt, idx) => {
                  const isSelected = userSelections[scenario.id] === idx;
                  return (
                    <button
                      key={idx}
                      onClick={() => handleOptionClick(idx, opt)}
                      className={`w-full text-left p-4 rounded-2xl border font-mono text-xs sm:text-sm transition ${
                        isSelected
                          ? opt.isCorrect
                            ? 'bg-emerald-950/60 border-emerald-500 text-emerald-200 font-bold'
                            : 'bg-rose-950/60 border-rose-500 text-rose-200 font-bold'
                          : 'bg-brand-950 border-slate-800 text-slate-300 hover:border-slate-700'
                      }`}
                    >
                      {opt.text}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Alternate Timeline Outcome Card */}
            {revealedTimelines[scenario.id] && (
              <div className={`p-5 rounded-2xl border font-mono text-xs space-y-2 animate-fadeIn ${
                revealedTimelines[scenario.id].isCorrect 
                  ? 'bg-amber-950/30 border-amber-500/50 text-amber-200' 
                  : 'bg-rose-950/30 border-rose-500/50 text-rose-200'
              }`}>
                <div className="flex justify-between items-center">
                  <span className="font-bold uppercase tracking-wider text-[10px]">
                    {revealedTimelines[scenario.id].isCorrect ? '⚡ Alternate Reality Unlocked (+30 XP)' : '⚠️ Timeline Disrupted'}
                  </span>
                  <button
                    onClick={() => speakText(revealedTimelines[scenario.id].timelineText, ttsRate)}
                    className="bg-slate-800 px-2.5 py-1 rounded-lg text-[10px] text-slate-300 hover:text-white"
                  >
                    🔊 Listen
                  </button>
                </div>
                <p className="leading-relaxed text-xs sm:text-sm">
                  {revealedTimelines[scenario.id].timelineText}
                </p>
              </div>
            )}

          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 4: PERSONAL REFLECTION & STORY STUDIO
    // =========================================================================
    function Module4StoryStudio({ targetChips, addXp, soundEnabled }) {
      const [storyText, setStoryText] = useState(
        "A turning point in my life happened two years ago. I was walking to the train station when I bumped into an old friend. If I had caught the earlier train, I would not have discovered our new business idea!"
      );
      const [detectedChips, setDetectedChips] = useState([]);

      useEffect(() => {
        const found = targetChips.filter(chip => chip.regex.test(storyText));
        setDetectedChips(found);
      }, [storyText]);

      const handleClaimXp = () => {
        if (detectedChips.length > 0) {
          addXp(detectedChips.length * 15);
          playSound('fanfare', soundEnabled);
        }
      };

      const wordCount = storyText.trim().split(/\s+/).filter(Boolean).length;

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="bg-brand-900 rounded-3xl p-6 border border-slate-800 shadow-xl space-y-2">
            <span className="text-xs font-mono font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/30">
              Module 4 • Personal Story Studio & Live Grammar Scanner
            </span>
            <h2 className="text-xl font-black font-header text-white">
              Write Your Own Serendipity Story
            </h2>
            <p className="text-xs text-slate-400">
              Describe an unexpected accident, mistake, or happy coincidence that influenced your life or someone you know.
            </p>
          </div>

          <div className="bg-brand-900 rounded-3xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
            
            <div className="bg-brand-950 p-4 rounded-2xl border border-slate-800 space-y-1">
              <span className="text-[10px] font-mono text-indigo-400 uppercase tracking-widest font-bold">Writing Prompt:</span>
              <p className="text-xs sm:text-sm font-mono text-white font-bold">
                "Talk about an unexpected accident, mistake, or coincidence that changed your direction or taught you something valuable."
              </p>
            </div>

            {/* Live Detected Target Phrases Chips Bar */}
            <div className="space-y-2">
              <div className="flex justify-between items-center">
                <span className="text-xs font-mono text-slate-400 uppercase tracking-wider">
                  ⚡ Live Detected Target Structures ({detectedChips.length}/{targetChips.length}):
                </span>
                <span className="text-xs font-mono text-emerald-400 font-bold">
                  +{detectedChips.length * 15} Storytelling XP
                </span>
              </div>

              <div className="flex flex-wrap gap-2 bg-brand-950 p-3 rounded-2xl border border-slate-800">
                {targetChips.map(chip => {
                  const isDetected = detectedChips.some(c => c.id === chip.id);
                  return (
                    <span
                      key={chip.id}
                      className={`px-3 py-1 rounded-xl text-xs font-mono font-bold transition flex items-center gap-1 ${
                        isDetected
                          ? 'bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 shadow-sm'
                          : 'bg-slate-900 border border-slate-800 text-slate-600'
                      }`}
                    >
                      <span>{isDetected ? '✓' : '•'}</span>
                      <span>{chip.label}</span>
                    </span>
                  );
                })}
              </div>
            </div>

            {/* Main Textarea */}
            <div className="space-y-2">
              <textarea
                rows={6}
                value={storyText}
                onChange={(e) => setStoryText(e.target.value)}
                placeholder="Type your serendipity story here..."
                className="w-full bg-brand-950 border border-slate-800 rounded-2xl p-4 text-xs sm:text-sm text-slate-100 font-mono leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
              <div className="flex justify-between text-[11px] font-mono text-slate-400">
                <span>Use 3rd conditionals, interrupted pasts, and idioms to light up chips above.</span>
                <span>Word Count: {wordCount} words</span>
              </div>
            </div>

            {/* Action Bar */}
            <div className="flex justify-end pt-2">
              <button
                onClick={handleClaimXp}
                className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-6 py-2.5 rounded-xl transition shadow-md shadow-indigo-600/20"
              >
                Claim Writing XP
              </button>
            </div>

          </div>
        </div>
      );
    }

    // =========================================================================
    // MODULE 5: MASTERY DASHBOARD & PRINTABLE CERTIFICATE
    // =========================================================================
    function Module5MasteryCertificate({ studentName, setStudentName, xp, currentRank, soundEnabled }) {

      useEffect(() => {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 120,
            spread: 80,
            origin: { y: 0.6 }
          });
        }
        playSound('fanfare', soundEnabled);
      }, []);

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="max-w-4xl mx-auto space-y-8">
          
          <div className="bg-brand-900 rounded-3xl p-6 border border-slate-800 shadow-xl flex flex-wrap justify-between items-center gap-4 no-print">
            <div>
              <span className="text-xs font-mono font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/30">
                Module 5 • Mastery Accreditation
              </span>
              <h2 className="text-xl font-black font-header text-white mt-1">
                Official Serendipity & Sparks Diploma
              </h2>
            </div>

            <div className="flex items-center space-x-3">
              <input
                type="text"
                value={studentName}
                onChange={(e) => setStudentName(e.target.value)}
                className="bg-brand-950 border border-slate-700 rounded-xl px-3.5 py-2 text-xs font-bold text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
                placeholder="Learner Full Name"
              />
              <button
                onClick={handlePrint}
                className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow-md shadow-indigo-600/20 flex items-center gap-2"
              >
                🖨️ Print Certificate
              </button>
            </div>
          </div>

          {/* PRINTABLE DIPLOMA CARD */}
          <div 
            id="printable-certificate"
            className="bg-brand-950 p-8 sm:p-12 rounded-3xl border-4 border-indigo-500/50 text-center space-y-6 relative overflow-hidden shadow-2xl text-slate-100"
          >
            <div className="absolute top-4 left-4 text-[10px] font-mono text-indigo-400/60">
              ACCREDITATION-ID: SERENDIPITY-2026-B1B2
            </div>
            <div className="absolute top-4 right-4 text-[10px] font-mono text-indigo-400/60">
              CEFR B1-B2 PROFICIENCY
            </div>

            <div className="space-y-2 pt-4">
              <span className="text-5xl">✨</span>
              <h2 className="text-2xl sm:text-3xl font-black font-header tracking-widest text-indigo-400">
                CERTIFICATE OF MASTERY
              </h2>
              <p className="text-xs text-slate-400 uppercase tracking-widest font-mono">
                Serendipity & Sparks • World-Changing Accidents & Personal Stories
              </p>
            </div>

            <div className="py-4 border-y border-slate-800 space-y-3">
              <p className="text-xs text-slate-400">This official document certifies that</p>
              <p className="text-2xl sm:text-3xl font-black text-white underline decoration-indigo-500 decoration-2 font-header">{studentName}</p>
              <p className="text-xs text-slate-300 max-w-lg mx-auto leading-relaxed pt-2 font-mono">
                has successfully demonstrated proficiency in **3rd conditionals** (`had + V3 ... would have + V3`), **interrupted past tense** (`was/were -ing when`), and **serendipity idioms** through historical case analysis and interactive storytelling.
              </p>
            </div>

            <div className="grid grid-cols-3 gap-4 max-w-md mx-auto text-center text-xs font-mono">
              <div className="bg-brand-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">Rank Achieved</span>
                <span className="text-xs font-black text-indigo-400">{currentRank.title}</span>
              </div>
              <div className="bg-brand-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">Total Score</span>
                <span className="text-xs font-black text-amber-300">{xp} XP</span>
              </div>
              <div className="bg-brand-900 p-3 rounded-2xl border border-slate-800">
                <span className="text-slate-400 block text-[10px]">CEFR Standard</span>
                <span className="text-xs font-black text-emerald-400">B1–B2 Intermediate</span>
              </div>
            </div>
          </div>

        </div>
      );
    }

    // RENDER APPLICATION
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
