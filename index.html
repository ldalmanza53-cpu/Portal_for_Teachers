<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher's Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        smartNavy: '#001b3a',
                        smartRed: '#e3000f'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans flex flex-col md:flex-row h-screen overflow-hidden">

    <aside class="w-full md:w-64 bg-smartNavy text-white flex flex-col shadow-xl flex-shrink-0 z-20">
        <div class="p-4 md:p-6 border-b border-gray-700 flex md:block justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-bold tracking-wider">TEACHER'S<span class="text-smartRed"> PORTAL</span></h1>
                <p class="text-xs text-gray-400 mt-0.5">Class Material Portal</p>
            </div>
            <button onclick="toggleMobileMenu()" class="md:hidden text-white focus:outline-none p-2 rounded hover:bg-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
        
        <nav id="mobileMenu" class="hidden md:flex flex-1 overflow-y-auto p-4 flex-col space-y-2 bg-smartNavy border-b md:border-b-0 border-gray-700">
            <button data-level="INTRO" onclick="selectLevel('INTRO')" class="lvl-btn w-full text-left px-4 py-3 rounded transition-colors hover:bg-gray-700 font-medium">Intro</button>
            <button data-level="A1" onclick="selectLevel('A1')" class="lvl-btn w-full text-left px-4 py-3 rounded transition-colors hover:bg-gray-700 font-medium">Level A1</button>
            <button data-level="A2" onclick="selectLevel('A2')" class="lvl-btn w-full text-left px-4 py-3 rounded transition-colors hover:bg-gray-700 font-medium">Level A2</button>
            <button data-level="B1" onclick="selectLevel('B1')" class="lvl-btn w-full text-left px-4 py-3 rounded transition-colors hover:bg-gray-700 font-medium">Level B1</button>
            <button data-level="B2" onclick="selectLevel('B2')" class="lvl-btn w-full text-left px-4 py-3 rounded transition-colors hover:bg-gray-700 font-medium">Level B2</button>
            <button data-level="C1" onclick="selectLevel('C1')" class="lvl-btn w-full text-left px-4 py-3 rounded transition-colors hover:bg-gray-700 font-medium">Level C1</button>
        </nav>

        <div class="hidden md:block p-4 border-t border-gray-700 text-center">
            <p class="text-sm font-serif italic text-white/30 tracking-widest cursor-default select-none">
                Leonardo Pabon
            </p>
        </div>
    </aside>

    <main class="flex-1 h-full overflow-y-auto bg-gray-50 p-4 md:p-8">
        <div class="max-w-7xl mx-auto" id="content">
            <div class="flex flex-col items-center justify-center h-full text-center mt-12 md:mt-20">
                <svg class="w-16 h-16 md:w-24 md:h-24 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                <h2 class="text-2xl md:text-3xl font-bold text-gray-400">Welcome to Teacher's Portal</h2>
                <p class="text-gray-500 mt-2 text-sm md:text-base">Select a level from the menu to view its classes.</p>
            </div>
        </div>
    </main>

    <script>
        const levelConfig = {
            'INTRO': { type: 'INTRO', blocks: 1, classesPerBlock: 8 },
            'A1': { type: 'A', blocks: 8, classesPerBlock: 9 }, 
            'A2': { type: 'A', blocks: 8, classesPerBlock: 9 }, 
            'B1': { type: 'A', blocks: 8, classesPerBlock: 9 }, 
            'B2': { type: 'B', blocks: 12, classesPerBlock: 7 }, 
            'C1': { type: 'C', blocks: 12, classesPerBlock: 7 }  
        };

        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        function selectLevel(levelName) {
            renderLevel(levelName);
            if (window.innerWidth < 768) {
                const menu = document.getElementById('mobileMenu');
                menu.classList.add('hidden');
                menu.classList.remove('flex');
            }
        }

        function renderLevel(levelName) {
            const config = levelConfig[levelName];
            const contentDiv = document.getElementById('content');
            
            document.querySelectorAll('.lvl-btn').forEach(btn => {
                btn.classList.remove('bg-smartRed');
                if(btn.dataset.level === levelName) {
                    btn.classList.add('bg-smartRed');
                }
            });

            let displayTitle = (levelName === 'INTRO') ? 'Intro' : `Level ${levelName}`;

            let html = `
                <div class="mb-6 md:mb-8">
                    <h2 class="text-2xl md:text-4xl font-black text-smartNavy border-b-4 border-smartRed inline-block pb-2">${displayTitle}</h2>
                </div>
                <div class="space-y-4 md:space-y-6">
            `;

            for (let i = 0; i < config.blocks; i++) {
                let unitTitle = "";
                if (config.type === 'INTRO') {
                    unitTitle = `Intro Classes`;
                } else if (config.type === 'A') {
                    unitTitle = `Units ${i * 2 + 1} & ${i * 2 + 2}`;
                } else {
                    unitTitle = `Unit ${i + 1}`;
                }

                let blockId = `block-${levelName}-${i}`;

                html += `
                    <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
                        <div onclick="toggleBlock('${blockId}', this)" class="bg-smartNavy text-white px-4 md:px-6 py-3 md:py-4 flex justify-between items-center cursor-pointer select-none hover:bg-opacity-95 transition-all">
                            <h3 class="text-base md:text-xl font-bold flex items-center gap-2 md:gap-3">
                                ${unitTitle}
                                <span class="bg-gray-700 text-xs px-2 md:px-3 py-0.5 md:py-1 rounded-full border border-gray-600 font-normal">${config.classesPerBlock} Items</span>
                            </h3>
                            <svg class="w-5 h-5 md:w-6 md:h-6 transform transition-transform duration-300 rotate-0 arrow-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                        
                        <div id="${blockId}" style="display: none;" class="p-4 md:p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 transition-all duration-300">
                `;

                for (let j = 1; j <= config.classesPerBlock; j++) {
                    let cardTitle = "";
                    let folderName = "";
                    let specialBadge = "";
                    let bgColor = "bg-gray-50";

                    if (config.type === 'INTRO') {
                        let fmt = j.toString().padStart(2, '0');
                        cardTitle = `Intro ${fmt}`;
                        folderName = `Class-${fmt}`;
                    }
                    else if (config.type === 'A') {
                        let classNum = (i * 9) + j;
                        let fmt = classNum.toString().padStart(2, '0');
                        cardTitle = `Class ${fmt}`;
                        folderName = `Class-${fmt}`;
                        
                        if (j === 9) {
                            bgColor = "bg-red-50 border-red-200";
                            specialBadge = `<span class="inline-block bg-smartRed text-white text-xs font-bold px-2 py-1 rounded shadow-sm">🏆 Progress Check</span>`;
                        }
                    } 
                    else if (config.type === 'B') {
                        let classNum = (i * 7) + j;
                        let fmt = classNum.toString().padStart(2, '0');
                        cardTitle = `Class ${fmt}`;
                        folderName = `Class-${fmt}`;

                        if (j === 7) {
                            bgColor = "bg-blue-50 border-blue-200";
                            specialBadge = `<span class="inline-block bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded shadow-sm">🎬 Video Class</span>`;
                        }
                    } 
                    else if (config.type === 'C') {
                        if (j <= 6) {
                            let classNum = (i * 6) + j;
                            let fmt = classNum.toString().padStart(2, '0');
                            cardTitle = `Class ${fmt}`;
                            folderName = `Class-${fmt}`;
                        } else {
                            let videoNum = i + 1;
                            let fmt = videoNum.toString().padStart(2, '0');
                            cardTitle = `Video ${fmt}`;
                            folderName = `Video-${fmt}`;
                            
                            bgColor = "bg-blue-50 border-blue-200";
                            specialBadge = `<span class="inline-block bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded shadow-sm">🎬 Video Class</span>`;
                        }
                    }

                    html += `
                        <div class="border rounded-lg p-4 md:p-5 hover:shadow-xl transition-all duration-300 flex flex-col justify-between ${bgColor}">
                            <div class="mb-3 md:mb-4">
                                <h4 class="text-base md:text-lg font-black text-gray-800 mb-1 md:mb-2">${cardTitle}</h4>
                                ${specialBadge ? specialBadge : '<div class="h-5 md:h-6"></div>'}
                            </div>
                            
                            <div class="flex gap-2 mt-auto">
                                <a href="./${levelName}/${folderName}/warmup.html" target="_blank" class="flex-1 bg-white border-2 border-smartNavy text-smartNavy hover:bg-smartNavy hover:text-white font-bold text-center text-xs py-2 px-1 rounded transition-colors">
                                    WARM UP
                                </a>
                                <a href="./${levelName}/${folderName}/production.html" target="_blank" class="flex-1 bg-smartRed border-2 border-smartRed hover:bg-red-700 hover:border-red-700 text-white font-bold text-center text-xs py-2 px-1 rounded transition-colors">
                                    PRODUCTION
                                </a>
                            </div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            contentDiv.innerHTML = html;
        }

        function toggleBlock(blockId, headerElement) {
            const blockContent = document.getElementById(blockId);
            const arrowIcon = headerElement.querySelector('.arrow-icon');
            
            if (blockContent.style.display === "none") {
                blockContent.style.display = "grid";
                arrowIcon.classList.remove('rotate-0');
                arrowIcon.classList.add('rotate-180');
            } else {
                blockContent.style.display = "none";
                arrowIcon.classList.remove('rotate-180');
                arrowIcon.classList.add('rotate-0');
            }
        }
    </script>
</body>
</html>
