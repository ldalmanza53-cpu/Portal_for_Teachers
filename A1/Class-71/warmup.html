<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task & Habit Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col items-center p-4 sm:p-8">

  <main class="max-w-2xl w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center pb-4 border-b border-slate-800">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">
          Pulse Tracker
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">Organize your goals and stay productive.</p>
      </div>
      <div class="text-right">
        <span id="completionRate" class="text-xl sm:text-2xl font-bold text-indigo-400">0%</span>
        <p class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Done</p>
      </div>
    </header>

    <!-- Progress Bar -->
    <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
      <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full w-0 transition-all duration-500"></div>
    </div>

    <!-- Task Input Form -->
    <form id="taskForm" onsubmit="handleAddTask(event)" class="space-y-3">
      <div class="flex flex-col sm:flex-row gap-2">
        <input 
          id="taskTitle" 
          type="text" 
          placeholder="Add a new task or habit..." 
          required 
          class="flex-1 px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm text-slate-100 placeholder-slate-500"
        />
        <select 
          id="taskCategory" 
          class="px-3 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm text-slate-300">
          <option value="Work">💼 Work</option>
          <option value="Personal">👤 Personal</option>
          <option value="Health">🏋️ Health</option>
        </select>
        <button 
          type="submit" 
          class="px-5 py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl text-sm transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
          <i class="fa-solid fa-plus"></i> Add
        </button>
      </div>
    </form>

    <!-- Filter Tabs -->
    <div class="flex gap-2 border-b border-slate-800 pb-3 text-xs sm:text-sm overflow-x-auto">
      <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1.5 rounded-lg font-medium bg-indigo-600 text-white">All</button>
      <button onclick="setFilter('Work')" id="filter-Work" class="px-3 py-1.5 rounded-lg font-medium bg-slate-800 text-slate-400 hover:text-white">Work</button>
      <button onclick="setFilter('Personal')" id="filter-Personal" class="px-3 py-1.5 rounded-lg font-medium bg-slate-800 text-slate-400 hover:text-white">Personal</button>
      <button onclick="setFilter('Health')" id="filter-Health" class="px-3 py-1.5 rounded-lg font-medium bg-slate-800 text-slate-400 hover:text-white">Health</button>
    </div>

    <!-- Task List -->
    <ul id="taskList" class="space-y-3 max-h-80 overflow-y-auto pr-1">
      <!-- Items dynamically populated -->
    </ul>

    <!-- Footer Stats -->
    <footer class="flex justify-between items-center pt-4 border-t border-slate-800 text-xs text-slate-500">
      <span id="taskCounter">0 tasks left</span>
      <button onclick="clearCompleted()" class="hover:text-rose-400 transition-colors">Clear Completed</button>
    </footer>

  </main>

  <script>
    let tasks = JSON.parse(localStorage.getItem('pulse_tasks')) || [
      { id: 1, title: 'Complete daily workout', category: 'Health', completed: false },
      { id: 2, title: 'Review project proposals', category: 'Work', completed: true }
    ];
    let currentFilter = 'all';

    function saveTasks() {
      localStorage.setItem('pulse_tasks', JSON.stringify(tasks));
      render();
    }

    function handleAddTask(e) {
      e.preventDefault();
      const titleInput = document.getElementById('taskTitle');
      const categoryInput = document.getElementById('taskCategory');

      const newTask = {
        id: Date.now(),
        title: titleInput.value.trim(),
        category: categoryInput.value,
        completed: false
      };

      tasks.unshift(newTask);
      titleInput.value = '';
      saveTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
      saveTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
    }

    function clearCompleted() {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'Work', 'Personal', 'Health'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === filter) {
          btn.className = 'px-3 py-1.5 rounded-lg font-medium bg-indigo-600 text-white';
        } else {
          btn.className = 'px-3 py-1.5 rounded-lg font-medium bg-slate-800 text-slate-400 hover:text-white';
        }
      });
      render();
    }

    function render() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      const filteredTasks = tasks.filter(t => currentFilter === 'all' || t.category === currentFilter);

      if (filteredTasks.length === 0) {
        list.innerHTML = `<li class="text-center py-8 text-slate-600 text-sm">No tasks found. Add one above!</li>`;
      } else {
        filteredTasks.forEach(task => {
          const li = document.createElement('li');
          li.className = `flex items-center justify-between p-3.5 rounded-xl border transition-all ${
            task.completed 
              ? 'bg-slate-950/50 border-slate-900 opacity-60' 
              : 'bg-slate-950 border-slate-800 hover:border-slate-700'
          }`;

          const categoryColors = {
            Work: 'bg-blue-500/10 text-blue-400 border-blue-500/20',
            Personal: 'bg-purple-500/10 text-purple-400 border-purple-500/20',
            Health: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'
          };

          li.innerHTML = `
            <div class="flex items-center gap-3 overflow-hidden">
              <button onclick="toggleTask(${task.id})" class="w-5 h-5 rounded-md border ${
                task.completed ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-700'
              } flex items-center justify-center text-xs transition">
                ${task.completed ? '<i class="fa-solid fa-check"></i>' : ''}
              </button>
              <span class="text-sm truncate ${task.completed ? 'line-through text-slate-500' : 'text-slate-200'}">
                ${task.title}
              </span>
              <span class="text-[10px] px-2 py-0.5 rounded-md border ${categoryColors[task.category]} font-medium hidden sm:inline">
                ${task.category}
              </span>
            </div>
            <button onclick="deleteTask(${task.id})" class="text-slate-600 hover:text-rose-400 text-xs p-1 transition">
              <i class="fa-solid fa-trash"></i>
            </button>
          `;
          list.appendChild(li);
        });
      }

      // Update analytics
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const rate = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById('completionRate').innerText = `${rate}%`;
      document.getElementById('progressBar').style.width = `${rate}%`;
      document.getElementById('taskCounter').innerText = `${tasks.filter(t => !t.completed).length} pending`;
    }

    // Initial render
    render();
  </script>
</body>
</html>
