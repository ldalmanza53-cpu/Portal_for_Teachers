  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Nunito', 'Inter', 'sans-serif'],
          },
        },
      },

  <style>
    /* Custom micro-animations & smartphone polish */
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    h1, h2, h3, .font-display {
      font-family: 'Nunito', sans-serif;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    @keyframes soundWave {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }

    @keyframes pulseRing {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 12px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    @keyframes starPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.35) rotate(12deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .animate-pop-in {
      animation: popIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-shake {
      animation: gentleShake 0.38s ease-in-out;
    }

    .animate-pulse-ring {
      animation: pulseRing 2s infinite;
    }

    .animate-star-pop {
      animation: starPop 0.45s ease-out;
    }

    .sound-bar {
      display: inline-block;
      width: 3px;
      height: 14px;
      border-radius: 9999px;
      background-color: currentColor;
      animation: soundWave 0.75s ease-in-out infinite;
    }
    .sound-bar:nth-child(2) { animation-delay: 0.15s; }
    .sound-bar:nth-child(3) { animation-delay: 0.3s; }
    .sound-bar:nth-child(4) { animation-delay: 0.45s; }

    /* Custom subtle scrollbars inside phone chat containers */
    .phone-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .phone-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .phone-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-100 via-indigo-50 to-emerald-50 text-slate-800 py-2 px-2 sm:py-6 sm:px-4 flex flex-col items-center justify-start">

        { type: 'gap', index: 0, answer: 'calling' },

        { type: 'gap', index: 1, answer: 'speak' },
        { type: 'text', value: ' to you about our English homework. Could I leave a ' },
        { type: 'gap', index: 2, answer: 'message' },
        { type: 'text', value: '? Please call me ' },
        { type: 'gap', index: 3, answer: 'back' },
        { type: 'text', value: ' today. My phone ' },
        { type: 'gap', index: 4, answer: 'number' },
        { type: 'text', value: ' is 555-0184. Thank you. ' },
        { type: 'gap', index: 5, answer: 'goodbye', capitalize: true },
        { type: 'text', value: '!' }
      ],
      fullText: 'Hello, Mr. Green. This is Maria calling. I wanted to speak to you about our English homework. Could I leave a message? Please call me back today. My phone number is 555-0184. Thank you. Goodbye!'
    };

    /* ==========================================================================
       2. APPLICATION STATE
       ========================================================================== */
    const TOTAL_MAX_STARS = 20;

    let state = {
      activeTab: 'learn',
      stars: 0,
      // Mode 1: Track which phrase IDs have been listened to & how many phrase-milestone stars awarded
      listenedPhrases: new Set(),
      learnStarsAwarded: 0, // max 4 (1 star per 3 phrases listened)

      // Mode 2: Dialogue ordering
      activeOrderScenarioIdx: 0,
      orderProgress: {
        scA: { placedSteps: [], scrambledOrder: [], solved: false, hintStep: null, lastWrongTip: '' },
        scB: { placedSteps: [], scrambledOrder: [], solved: false, hintStep: null, lastWrongTip: '' }
      },
      playingDialogueId: null,
      activeDialogueLineIdx: -1,

      // Mode 3: Roleplay simulator
      activeMissionIdx: 0,
      missionState: {
        m1: { stepIdx: 0, transcript: [], selectedOptionIdx: null, lastFeedback: null, completed: false, seconds: 0 },
        m2: { stepIdx: 0, transcript: [], selectedOptionIdx: null, lastFeedback: null, completed: false, seconds: 0 }
      },

      // Mode 4: Voicemail lab
      gapUserAnswers: [null, null, null, null, null, null],
      activeGapIndex: 0,
      gapChecked: false,
      gapSolved: false,
      customVm: {
        recipient: 'Sarah',
        callerName: 'Alex',
        message: "Let's meet at the café at 4 o'clock.",
        phone: '555-0192',
        listenedRewarded: false
      }
    };

    let callTimerInterval = null;
    let currentlySpeakingId = null;

    /* ==========================================================================
       3. AUDIO & SPEECH SYNTHESIS HELPERS
       ========================================================================== */

    // Subtle Web Audio API UI sound effects (no external audio URLs)
    function playUiTone(type = 'pop') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now); // C5
          osc.frequency.setValueAtTime(659.25, now + 0.09); // E5
          osc.frequency.setValueAtTime(783.99, now + 0.18); // G5
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === 'error') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(195, now + 0.12);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
          osc.start(now);
          osc.stop(now + 0.27);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.start(now);
          osc.stop(now + 0.1);
        }
      } catch (e) {
        // Ignore audio context errors on restricted devices
      }
    }

    // Pick the clearest English voice available
    function getBestEnglishVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;
      return (
        voices.find(v => v.lang === 'en-US' && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha'))) ||
        voices.find(v => v.lang.startsWith('en-US')) ||
        voices.find(v => v.lang.startsWith('en')) ||
        voices[0]
      );
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        getBestEnglishVoice();
      };
    }

    /**
     * Speak a phrase clearly at beginner speed (rate 0.9) using Web Speech API
     */
    function speakText(text, options = {}) {
      const { rate = 0.9, pitch = 1.0, elementId = null, onEnd = null } = options;

      if (!('speechSynthesis' in window)) {
        showToast('Audio not supported in this browser, read the text aloud!', 'info');
        if (onEnd) onEnd();
        return;
      }

      try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        const voice = getBestEnglishVoice();
        if (voice) utterance.voice = voice;
        utterance.lang = 'en-US';
        utterance.rate = rate;
        utterance.pitch = pitch;

        currentlySpeakingId = elementId;
        updateSpeakingVisuals();

        utterance.onend = () => {
          currentlySpeakingId = null;
          updateSpeakingVisuals();
          if (onEnd) onEnd();
        };

        utterance.onerror = () => {
          currentlySpeakingId = null;
          updateSpeakingVisuals();
          if (onEnd) onEnd();
        };

        window.speechSynthesis.speak(utterance);
      } catch (err) {
        currentlySpeakingId = null;
        updateSpeakingVisuals();
        if (onEnd) onEnd();
      }
    }

    function updateSpeakingVisuals() {
      document.querySelectorAll('[data-speak-id]').forEach(btn => {
        const id = btn.getAttribute('data-speak-id');
        const wave = btn.querySelector('.wave-indicator');
        const icon = btn.querySelector('.static-icon');
        if (id === currentlySpeakingId) {
          if (wave) wave.classList.remove('hidden');
          if (icon) icon.classList.add('hidden');
        } else {
          if (wave) wave.classList.add('hidden');
          if (icon) icon.classList.remove('hidden');
        }
      });
    }

    /* ==========================================================================
       4. REWARD STARS, PROGRESS BAR & TOASTS
       ========================================================================== */

    function awardStars(amount, reasonText) {
      if (amount <= 0) return;
      state.stars = Math.min(TOTAL_MAX_STARS, state.stars + amount);
      playUiTone('success');

      // Animate star badge
      const badge = document.getElementById('star-badge');
      if (badge) {
        badge.classList.remove('animate-star-pop');
        void badge.offsetWidth; // trigger reflow
        badge.classList.add('animate-star-pop');
      }

      updateHeaderProgress();
      showToast(`+${amount} Star${amount > 1 ? 's' : ''}! ${reasonText}`, 'star');
    }

    function updateHeaderProgress() {
      const starEl = document.getElementById('star-count');
      const barEl = document.getElementById('progress-bar');
      const pctEl = document.getElementById('progress-percent');
      const lblEl = document.getElementById('progress-label');

      const pct = Math.round((state.stars / TOTAL_MAX_STARS) * 100);
      if (starEl) starEl.textContent = state.stars;
      if (barEl) barEl.style.width = `${pct}%`;
      if (pctEl) pctEl.textContent = `${pct}%`;

      if (lblEl) {
        if (pct === 0) lblEl.textContent = 'Level: Beginner Caller';
        else if (pct < 40) lblEl.textContent = 'Level: Polite Listener';
        else if (pct < 75) lblEl.textContent = 'Level: Confident Caller';
        else if (pct < 100) lblEl.textContent = 'Level: Message Pro';
        else lblEl.textContent = '🏆 A1 Phone Superstar!';
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      let colors = 'bg-slate-900 text-white border-slate-700';
      let icon = '<i class="fa-solid fa-circle-info text-sky-400"></i>';

      if (type === 'star') {
        colors = 'bg-amber-400 text-slate-950 border-amber-500 font-extrabold';
        icon = '<i class="fa-solid fa-star text-amber-800"></i>';
      } else if (type === 'success') {
        colors = 'bg-emerald-600 text-white border-emerald-500 font-bold';
        icon = '<i class="fa-solid fa-circle-check text-emerald-200"></i>';
      } else if (type === 'warn') {
        colors = 'bg-rose-600 text-white border-rose-500 font-bold';
        icon = '<i class="fa-solid fa-lightbulb text-amber-200"></i>';
      }

      toast.className = `px-4 py-2.5 rounded-2xl shadow-xl border text-xs sm:text-sm flex items-center gap-2 animate-pop-in ${colors}`;
      toast.innerHTML = `${icon}<span>${message}</span>`;

      container.innerHTML = '';
      container.appendChild(toast);

      setTimeout(() => {
        if (toast.parentNode) {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.25s ease';
          setTimeout(() => toast.remove(), 260);
        }
      }, 2400);
    }

    /* ==========================================================================
       5. TAB NAVIGATION & INITIALIZATION
       ========================================================================== */

    function initScrambledScenarios() {
      ORDER_SCENARIOS.forEach(sc => {
        const indices = sc.lines.map((_, i) => i);
        // Shuffle until not already solved
        let shuffled = [...indices];
        do {
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
        } while (shuffled.every((val, idx) => val === idx));

        state.orderProgress[sc.id] = {
          placedSteps: [],
          scrambledOrder: shuffled,
          solved: false,
          hintStep: null,
          lastWrongTip: ''
        };
      });
    }

    function switchTab(tabName) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      state.playingDialogueId = null;
      state.activeTab = tabName;

      // Manage roleplay call timer
      if (tabName === 'roleplay') {
        startCallTimer();
      } else {
        stopCallTimer();
      }

      // Update tab button styles
      ['learn', 'order', 'roleplay', 'voicemail'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (!btn) return;
        if (t === tabName) {
          btn.className = 'tab-btn flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 py-2 px-2 rounded-xl text-xs sm:text-sm font-extrabold bg-indigo-600 text-white shadow-sm transition-all';
        } else {
          btn.className = 'tab-btn flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 py-2 px-2 rounded-xl text-xs sm:text-sm font-bold text-slate-600 hover:bg-white hover:text-indigo-600 transition-all';
        }
      });

      renderCurrentView();
    }

    function renderCurrentView() {
      const container = document.getElementById('app-content');
      if (!container) return;

      if (state.activeTab === 'learn') {
        container.innerHTML = renderLearnView();
      } else if (state.activeTab === 'order') {
        container.innerHTML = renderOrderView();
      } else if (state.activeTab === 'roleplay') {
        container.innerHTML = renderRoleplayView();
      } else if (state.activeTab === 'voicemail') {
        container.innerHTML = renderVoicemailView();
      }
      updateSpeakingVisuals();
    }

    /* ==========================================================================
       6. MODE 1: PHRASEBOOK & AUDIO (LEARN)
       ========================================================================== */

    function handleListenPhrase(phraseId) {
      let targetPhrase = null;
      PHRASEBOOK_CATEGORIES.forEach(cat => {
        const found = cat.phrases.find(p => p.id === phraseId);
        if (found) targetPhrase = found;
      });
      if (!targetPhrase) return;

      speakText(targetPhrase.text, {
        rate: 0.9,
        pitch: targetPhrase.voicePitch || 1.0,
        elementId: phraseId
      });

      if (!state.listenedPhrases.has(phraseId)) {
        state.listenedPhrases.add(phraseId);
        // Award 1 star for every 3 phrases practiced (up to 4 stars)
        const possibleStars = Math.min(4, Math.floor(state.listenedPhrases.size / 3));
        if (possibleStars > state.learnStarsAwarded) {
          const diff = possibleStars - state.learnStarsAwarded;
          state.learnStarsAwarded = possibleStars;
          awardStars(diff, `Practiced ${state.listenedPhrases.size}/12 phrases!`);
        }
        renderCurrentView();
      }
    }

    function formatPhraseWithHighlight(phrase) {
      if (!phrase.highlight) return phrase.text;
      return phrase.text.replace(
        phrase.highlight,
        `<span class="bg-indigo-100 text-indigo-800 px-1.5 py-0.5 rounded-md font-extrabold">${phrase.highlight}</span>`
      );
    }

    function renderLearnView() {
      const listenedCount = state.listenedPhrases.size;
      const totalPhrases = 12;

      let categoriesHtml = PHRASEBOOK_CATEGORIES.map(cat => {
        const cardsHtml = cat.phrases.map(p => {
          const isListened = state.listenedPhrases.has(p.id);
          return `
            <div class="bg-white rounded-2xl p-3.5 sm:p-4 border ${isListened ? 'border-emerald-300 bg-emerald-50/20' : cat.borderClass} shadow-xs hover:shadow-md transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div class="space-y-1">
                <div class="flex items-center gap-2 flex-wrap">
                  <p class="text-base sm:text-lg font-bold text-slate-800 leading-snug">
                    "${formatPhraseWithHighlight(p)}"
                  </p>
                  ${isListened ? '<span class="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full"><i class="fa-solid fa-check"></i> Heard</span>' : ''}
                </div>
                <p class="text-xs sm:text-sm text-slate-500 flex items-center gap-1.5">
                  <i class="fa-regular fa-lightbulb text-amber-500"></i>
                  <span>${p.hint}</span>
                </p>
              </div>

              <button
                onclick="handleListenPhrase('${p.id}')"
                data-speak-id="${p.id}"
                aria-label="Listen to ${p.text}"
                class="${cat.btnClass} shrink-0 px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 shadow-xs active:scale-95 transition min-w-[106px]"
              >
                <span class="static-icon"><i class="fa-solid fa-volume-high"></i></span>
                <span class="wave-indicator hidden inline-flex items-end gap-0.5 h-3.5">
                  <span class="sound-bar"></span>
                  <span class="sound-bar"></span>
                  <span class="sound-bar"></span>
                </span>
                <span>Listen</span>
              </button>
            </div>
          `;
        }).join('');

        return `
          <section class="mb-6">
            <div class="flex items-center gap-2.5 mb-2.5">
              <span class="w-8 h-8 rounded-xl ${cat.badgeBg} flex items-center justify-center text-sm shadow-2xs">
                <i class="fa-solid ${cat.icon}"></i>
              </span>
              <h3 class="font-display font-extrabold text-base sm:text-lg text-slate-800">${cat.title}</h3>
            </div>
            <div class="space-y-2.5">
              ${cardsHtml}
            </div>
          </section>
        `;
      }).join('');

      return `
        <div class="animate-pop-in">
          <!-- Mode Intro Card -->
          <div class="bg-white rounded-2xl p-4 border border-indigo-100 shadow-xs mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 class="font-display font-extrabold text-lg text-slate-800">Phone Phrasebook</h2>
              <p class="text-xs sm:text-sm text-slate-600">Tap <strong>Listen</strong> on each phrase to hear slow, clear English (0.9x speed).</p>
            </div>
            <div class="bg-indigo-50 text-indigo-800 px-3.5 py-2 rounded-xl text-xs font-extrabold border border-indigo-100 shrink-0 text-center">
              Heard: ${listenedCount} / ${totalPhrases} Phrases
            </div>
          </div>

          ${categoriesHtml}

          <!-- Step-by-Step Progression Button -->
          <div class="mt-6 pt-4 border-t border-slate-200 flex justify-end">
            <button onclick="switchTab('order')" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-6 py-3 rounded-2xl shadow-md flex items-center justify-center gap-2 transition active:scale-95">
              <span>Next: Build the Call</span>
              <i class="fa-solid fa-arrow-right"></i>
            </button>

        </div>
      `;
    }

    /* ==========================================================================
       7. MODE 2: DIALOGUE ORDERING (BUILD THE CALL)
       ========================================================================== */

    function selectOrderScenario(idx) {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      state.playingDialogueId = null;
      state.activeOrderScenarioIdx = idx;
      renderCurrentView();
    }

    function placeOrderLine(lineStepIdx) {
      const sc = ORDER_SCENARIOS[state.activeOrderScenarioIdx];
      const prog = state.orderProgress[sc.id];
      if (prog.solved) return;

      const expectedStep = prog.placedSteps.length;
      prog.hintStep = null;

      if (lineStepIdx === expectedStep) {
        // Correct chronological placement!
        prog.placedSteps.push(lineStepIdx);
        prog.lastWrongTip = '';
        playUiTone('pop');

        const lineObj = sc.lines[lineStepIdx];
        speakText(lineObj.text, {
          rate: 0.92,
          pitch: lineObj.side === 'left' ? 1.08 : 0.94
        });

        // Check if all 6 lines placed
        if (prog.placedSteps.length === sc.lines.length) {
          prog.solved = true;
          awardStars(3, `${sc.title} solved!`);
        }
      } else {
        // Incorrect order — gentle feedback & shake
        playUiTone('error');
        const expectedLine = sc.lines[expectedStep];
        prog.lastWrongTip = `Not quite! ${expectedLine.tip}`;
        showToast('Wrong order! Check the hint below.', 'warn');
      }

      renderCurrentView();
    }

    function undoOrderLine() {
      const sc = ORDER_SCENARIOS[state.activeOrderScenarioIdx];
      const prog = state.orderProgress[sc.id];
      if (prog.solved || prog.placedSteps.length === 0) return;

      prog.placedSteps.pop();
      prog.lastWrongTip = '';
      prog.hintStep = null;
      playUiTone('pop');
      renderCurrentView();
    }

    function showOrderHint() {
      const sc = ORDER_SCENARIOS[state.activeOrderScenarioIdx];
      const prog = state.orderProgress[sc.id];
      if (prog.solved) return;

      const expectedStep = prog.placedSteps.length;
      prog.hintStep = expectedStep;
      prog.lastWrongTip = `Hint: ${sc.lines[expectedStep].tip}`;
      playUiTone('pop');
      renderCurrentView();
    }

    function resetCurrentOrderScenario() {
      const sc = ORDER_SCENARIOS[state.activeOrderScenarioIdx];
      const prog = state.orderProgress[sc.id];
      prog.placedSteps = [];
      prog.lastWrongTip = '';
      prog.hintStep = null;
      // Keep solved star status if already earned, or allow replay cleanly
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      state.playingDialogueId = null;
      renderCurrentView();
    }

    function playFullOrderedDialogue() {
      const sc = ORDER_SCENARIOS[state.activeOrderScenarioIdx];
      if (state.playingDialogueId === sc.id) {
        // Stop playback
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        state.playingDialogueId = null;
        state.activeDialogueLineIdx = -1;
        renderCurrentView();
        return;
      }

      state.playingDialogueId = sc.id;
      let currentIndex = 0;

      function speakNextLine() {
        if (state.playingDialogueId !== sc.id || currentIndex >= sc.lines.length) {
          state.playingDialogueId = null;
          state.activeDialogueLineIdx = -1;
          renderCurrentView();
          return;
        }

        state.activeDialogueLineIdx = currentIndex;
        renderCurrentView();

        const line = sc.lines[currentIndex];
        speakText(line.text, {
          rate: 0.9,
          pitch: line.side === 'left' ? 1.1 : 0.92,
          onEnd: () => {
            currentIndex++;
            setTimeout(speakNextLine, 350);
          }
        });
      }

      speakNextLine();
    }

    function renderOrderView() {
      const sc = ORDER_SCENARIOS[state.activeOrderScenarioIdx];
      const prog = state.orderProgress[sc.id];

      // Scenario selector pills
      const selectorHtml = ORDER_SCENARIOS.map((item, idx) => {
        const isActive = idx === state.activeOrderScenarioIdx;
        const isDone = state.orderProgress[item.id].solved;
        return `
          <button onclick="selectOrderScenario(${idx})" class="flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-extrabold border transition flex items-center justify-center gap-2 ${
            isActive
              ? 'bg-indigo-600 text-white border-indigo-600 shadow-xs'
              : 'bg-white text-slate-700 border-slate-200 hover:border-indigo-300'
          }">
            <span>${item.contactAvatar}</span>
            <span class="truncate">${idx === 0 ? 'Scenario A: Friend' : 'Scenario B: Office'}</span>
            ${isDone ? '<i class="fa-solid fa-circle-check text-emerald-300"></i>' : ''}
          </button>
        `;
      }).join('');

      // Placed bubbles inside phone screen
      const chatHtml = prog.placedSteps.length === 0
        ? `
          <div class="h-44 flex flex-col items-center justify-center text-center text-slate-400 px-4">
            <i class="fa-regular fa-comments text-3xl mb-2 text-slate-300"></i>
            <p class="text-xs sm:text-sm font-semibold">Tap the scrambled bubbles below in the right order to build the phone call!</p>
          </div>
        `
        : prog.placedSteps.map((stepIdx, orderPos) => {
            const line = sc.lines[stepIdx];
            const isSpeakingThis = state.playingDialogueId === sc.id && state.activeDialogueLineIdx === orderPos;
            const isLeft = line.side === 'left';
            return `
              <div class="flex flex-col ${isLeft ? 'items-start' : 'items-end'} animate-pop-in">
                <span class="text-[11px] font-bold text-slate-500 mb-0.5 px-1">
                  ${orderPos + 1}. ${line.speaker}
                </span>
                <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-xs sm:text-sm font-medium shadow-2xs transition-all ${
                  isLeft
                    ? 'bg-white text-slate-800 border border-slate-200 rounded-tl-xs'
                    : 'bg-indigo-600 text-white rounded-tr-xs'
                } ${isSpeakingThis ? 'ring-4 ring-amber-400 scale-[1.02]' : ''}">
                  <div class="flex items-start justify-between gap-2">
                    <span>${line.text}</span>
                    <button onclick="speakText('${line.text.replace(/'/g, "\\'")}', { rate: 0.9, pitch: ${isLeft ? 1.08 : 0.94} })" aria-label="Listen to line" class="opacity-75 hover:opacity-100 mt-0.5 shrink-0">
                      <i class="fa-solid fa-volume-high text-xs"></i>
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('');

      // Remaining scrambled choices
      const remainingSteps = prog.scrambledOrder.filter(stepIdx => !prog.placedSteps.includes(stepIdx));
      const scrambledHtml = remainingSteps.map(stepIdx => {
        const line = sc.lines[stepIdx];
        const isHinted = prog.hintStep === stepIdx;
        return `
          <button
            onclick="placeOrderLine(${stepIdx})"
            class="w-full text-left p-3 rounded-2xl border-2 transition-all active:scale-[0.99] flex items-center justify-between gap-3 ${
              isHinted
                ? 'bg-amber-50 border-amber-400 shadow-md ring-2 ring-amber-300'
                : 'bg-white border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/40 shadow-2xs'
            }"
          >
            <div>
              <span class="inline-block text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-md mb-1 ${
                line.side === 'left' ? 'bg-purple-100 text-purple-700' : 'bg-sky-100 text-sky-700'
              }">
                ${line.speaker}
              </span>
              <p class="text-xs sm:text-sm font-semibold text-slate-800">${line.text}</p>
            </div>
            <span class="w-8 h-8 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center shrink-0">
              <i class="fa-solid fa-plus"></i>
            </span>
          </button>
        `;
      }).join('');

      return `
        <div class="animate-pop-in">
          <!-- Scenario Switcher -->
          <div class="flex gap-2 mb-4">
            ${selectorHtml}
          </div>

          <div class="mb-3">
            <h2 class="font-display font-extrabold text-lg text-slate-800">${sc.title}</h2>
            <p class="text-xs sm:text-sm text-slate-600">${sc.subtitle}</p>
          </div>

          <!-- Phone Chat Screen Container -->
          <div class="bg-slate-100 rounded-3xl border-2 border-slate-300 overflow-hidden shadow-inner mb-4">
            <!-- Phone Mini Header -->
            <div class="bg-slate-800 text-white px-4 py-2.5 flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <span class="text-lg">${sc.contactAvatar}</span>
                <div>
                  <p class="text-xs sm:text-sm font-bold leading-none">${sc.contactName}</p>
                  <p class="text-[10px] text-emerald-400 font-semibold mt-0.5">Phone Transcript (${prog.placedSteps.length}/${sc.lines.length})</p>
                </div>
              </div>
              <div class="flex items-center gap-1.5">
                ${!prog.solved && prog.placedSteps.length > 0 ? `
                  <button onclick="undoOrderLine()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition">
                    <i class="fa-solid fa-rotate-left"></i> Undo
                  </button>
                ` : ''}
                ${!prog.solved ? `
                  <button onclick="showOrderHint()" class="bg-amber-400 hover:bg-amber-300 text-slate-900 text-xs font-extrabold px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition">
                    <i class="fa-solid fa-lightbulb"></i> Hint
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- Chat Messages Area -->
            <div class="p-3.5 sm:p-4 space-y-3 max-h-80 overflow-y-auto phone-scroll">
              ${chatHtml}
            </div>
          </div>

          <!-- Supportive Tip / Error Banner -->
          ${prog.lastWrongTip ? `
            <div class="mb-4 p-3 rounded-2xl bg-amber-50 border border-amber-300 text-amber-900 text-xs sm:text-sm font-semibold flex items-center gap-2.5 animate-shake">
              <i class="fa-solid fa-circle-exclamation text-amber-600 text-base shrink-0"></i>
              <span>${prog.lastWrongTip}</span>
            </div>
          ` : ''}

          <!-- Solved Banner OR Scrambled Bubbles -->
          ${prog.solved ? `
            <div class="bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-4 text-center space-y-3 animate-pop-in">
              <div class="inline-flex items-center gap-2 bg-emerald-600 text-white text-xs font-extrabold px-3 py-1 rounded-full">
                <i class="fa-solid fa-star text-amber-300"></i> Great Job! Dialogue Complete!
              </div>
              <p class="text-xs sm:text-sm text-emerald-900 font-medium">
                Listen to the whole phone call from start to finish!
              </p>
              <div class="flex flex-col sm:flex-row gap-2.5 justify-center">
                <button onclick="playFullOrderedDialogue()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm px-5 py-3 rounded-xl shadow-sm flex items-center justify-center gap-2 transition">
                  <i class="fa-solid ${state.playingDialogueId === sc.id ? 'fa-stop' : 'fa-play'}"></i>
                  <span>${state.playingDialogueId === sc.id ? 'Stop Audio' : 'Play Full Dialogue'}</span>
                </button>
                <button onclick="resetCurrentOrderScenario()" class="bg-white hover:bg-emerald-100 text-emerald-800 border border-emerald-300 font-bold text-xs sm:text-sm px-4 py-3 rounded-xl transition">
                  Practice Again
                </button>
              </div>
            </div>
          ` : `
            <div>
              <p class="text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-2">
                Tap the next line in the call:
              </p>
              <div class="space-y-2">
                ${scrambledHtml}
              </div>
            </div>
          `}

          <!-- Next Activity Navigation -->
          <div class="mt-6 pt-4 border-t border-slate-200 flex justify-between items-center gap-2">
            <button onclick="switchTab('learn')" class="text-slate-600 hover:text-indigo-600 font-bold text-xs sm:text-sm px-3 py-2 rounded-xl transition">
              <i class="fa-solid fa-arrow-left mr-1"></i> Phrasebook
            </button>
            <button onclick="switchTab('roleplay')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm px-5 py-3 rounded-2xl shadow-md flex items-center gap-2 transition active:scale-95">
              <span>Next: Call Simulator</span>
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
      `;
    }

    /* ==========================================================================
       8. MODE 3: INTERACTIVE CALL SIMULATOR (ROLEPLAY)
       ========================================================================== */

    function startCallTimer() {
      stopCallTimer();
      callTimerInterval = setInterval(() => {
        const mission = ROLEPLAY_MISSIONS[state.activeMissionIdx];
        const mState = state.missionState[mission.id];
        if (!mState.completed) {
          mState.seconds++;
          const timerEl = document.getElementById('live-call-timer');
          if (timerEl) timerEl.textContent = formatSeconds(mState.seconds);
        }
      }, 1000);
    }

    function stopCallTimer() {
      if (callTimerInterval) {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
      }
    }

    function formatSeconds(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function initMissionIfNeeded(missionId) {
      const mission = ROLEPLAY_MISSIONS.find(m => m.id === missionId);
      const mState = state.missionState[missionId];
      if (mState.transcript.length === 0 && mission) {
        mState.transcript.push({
          sender: 'other',
          text: mission.steps[0].incoming
        });
      }
    }

    function selectRoleplayMission(idx) {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      state.activeMissionIdx = idx;
      const mission = ROLEPLAY_MISSIONS[idx];
      initMissionIfNeeded(mission.id);
      renderCurrentView();
      // Speak the active incoming prompt if not completed
      const mState = state.missionState[mission.id];
      if (!mState.completed && mState.selectedOptionIdx === null) {
        speakText(mission.steps[mState.stepIdx].incoming, { rate: 0.9, pitch: 1.06 });
      }
    }

    function chooseRoleplayOption(optIdx) {
      const mission = ROLEPLAY_MISSIONS[state.activeMissionIdx];
      const mState = state.missionState[mission.id];
      if (mState.completed) return;

      const currentStep = mission.steps[mState.stepIdx];
      const chosen = currentStep.options[optIdx];

      mState.selectedOptionIdx = optIdx;
      mState.lastFeedback = {
        correct: chosen.correct,
        text: chosen.feedback
      };

      if (chosen.correct) {
        playUiTone('pop');
        speakText(chosen.text, { rate: 0.92, pitch: 0.95 });
        // Add user reply to transcript if not already added for this step
        const expectedLen = mState.stepIdx * 2 + 1;
        if (mState.transcript.length === expectedLen) {
          mState.transcript.push({
            sender: 'user',
            text: chosen.text
          });
        }
      } else {
        playUiTone('error');
      }

      renderCurrentView();
    }

    function advanceRoleplayStep() {
      const mission = ROLEPLAY_MISSIONS[state.activeMissionIdx];
      const mState = state.missionState[mission.id];

      if (mState.stepIdx + 1 < mission.steps.length) {
        mState.stepIdx++;
        mState.selectedOptionIdx = null;
        mState.lastFeedback = null;
        const nextIncoming = mission.steps[mState.stepIdx].incoming;
        mState.transcript.push({
          sender: 'other',
          text: nextIncoming
        });
        renderCurrentView();
        speakText(nextIncoming, { rate: 0.9, pitch: 1.06 });
      } else {
        // Mission finished!
        const wasAlreadyCompleted = mState.completed;
        mState.completed = true;
        mState.selectedOptionIdx = null;
        mState.lastFeedback = null;
        if (!wasAlreadyCompleted) {
          awardStars(3, `${mission.title} complete!`);
        }
        renderCurrentView();
      }
    }

    function restartRoleplayMission() {
      const mission = ROLEPLAY_MISSIONS[state.activeMissionIdx];
      state.missionState[mission.id] = {
        stepIdx: 0,
        transcript: [{ sender: 'other', text: mission.steps[0].incoming }],
        selectedOptionIdx: null,
        lastFeedback: null,
        completed: false,
        seconds: 0
      };
      renderCurrentView();
      speakText(mission.steps[0].incoming, { rate: 0.9, pitch: 1.06 });
    }

    function renderRoleplayView() {
      const mission = ROLEPLAY_MISSIONS[state.activeMissionIdx];
      initMissionIfNeeded(mission.id);
      const mState = state.missionState[mission.id];
      const currentStep = mission.steps[mState.stepIdx];

      // Mission selector buttons
      const missionTabs = ROLEPLAY_MISSIONS.map((m, idx) => {
        const isActive = idx === state.activeMissionIdx;
        const isDone = state.missionState[m.id].completed;
        return `
          <button onclick="selectRoleplayMission(${idx})" class="flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-extrabold border transition flex items-center justify-center gap-2 ${
            isActive
              ? 'bg-emerald-600 text-white border-emerald-600 shadow-xs'
              : 'bg-white text-slate-700 border-slate-200 hover:border-emerald-300'
          }">
            <span>${m.avatarEmoji}</span>
            <span class="truncate">${idx === 0 ? 'Mission 1: Friend' : 'Mission 2: Clinic'}</span>
            ${isDone ? '<i class="fa-solid fa-circle-check text-amber-300"></i>' : ''}
          </button>
        `;
      }).join('');

      // Transcript bubbles
      const transcriptHtml = mState.transcript.map(msg => {
        const isOther = msg.sender === 'other';
        return `
          <div class="flex flex-col ${isOther ? 'items-start' : 'items-end'} animate-pop-in">
            <div class="max-w-[86%] rounded-2xl px-3.5 py-2.5 text-xs sm:text-sm font-medium shadow-2xs ${
              isOther
                ? 'bg-slate-800 text-white border border-slate-700 rounded-tl-xs'
                : 'bg-emerald-500 text-slate-950 font-semibold rounded-tr-xs'
            }">
              <div class="flex items-start gap-2">
                <span>${msg.text}</span>
                <button onclick="speakText('${msg.text.replace(/'/g, "\\'")}', { rate: 0.9, pitch: ${isOther ? 1.06 : 0.95} })" aria-label="Replay voice" class="opacity-80 hover:opacity-100 mt-0.5 shrink-0">
                  <i class="fa-solid fa-volume-high text-xs"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Options or Completion Screen
      let bottomInteractionHtml = '';
      if (mState.completed) {
        bottomInteractionHtml = `
          <div class="bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-4 text-center space-y-2.5 animate-pop-in">
            <div class="w-12 h-12 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xl mx-auto shadow-md">
              <i class="fa-solid fa-phone-slash"></i>
            </div>
            <h3 class="font-display font-extrabold text-base sm:text-lg text-emerald-950">Call Ended — Great Job!</h3>
            <p class="text-xs sm:text-sm text-emerald-800">
              You finished <strong>${mission.title}</strong> politely and clearly!
            </p>
            <div class="flex flex-col sm:flex-row gap-2 justify-center pt-1">
              <button onclick="restartRoleplayMission()" class="bg-white hover:bg-emerald-100 text-emerald-800 border border-emerald-300 font-bold text-xs sm:text-sm px-4 py-2.5 rounded-xl transition">
                <i class="fa-solid fa-rotate-right mr-1"></i> Call Again
              </button>
              ${state.activeMissionIdx === 0 ? `
                <button onclick="selectRoleplayMission(1)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm px-5 py-2.5 rounded-xl shadow-sm transition">
                  Try Mission 2 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
              ` : `
                <button onclick="switchTab('voicemail')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs sm:text-sm px-5 py-2.5 rounded-xl shadow-sm transition">
                  Next: Voicemail Lab <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
              `}
            </div>
          </div>
        `;
      } else {
        const isCorrectChosen = mState.lastFeedback && mState.lastFeedback.correct;
        const optionsHtml = currentStep.options.map((opt, idx) => {
          const isSelected = mState.selectedOptionIdx === idx;
          let btnStyle = 'bg-white border-slate-200 hover:border-indigo-400 text-slate-800';
          if (isSelected) {
            btnStyle = opt.correct
              ? 'bg-emerald-50 border-emerald-500 text-emerald-950 ring-2 ring-emerald-300'
              : 'bg-rose-50 border-rose-400 text-rose-950 animate-shake';
          }
          return `
            <button
              onclick="chooseRoleplayOption(${idx})"
              ${isCorrectChosen && !isSelected ? 'disabled' : ''}
              class="w-full text-left p-3.5 rounded-2xl border-2 font-semibold text-xs sm:text-sm transition-all flex items-center justify-between gap-3 ${btnStyle} ${isCorrectChosen && !isSelected ? 'opacity-50' : ''}"
            >
              <span>${opt.text}</span>
              <span class="shrink-0 text-base">
                ${isSelected ? (opt.correct ? '<i class="fa-solid fa-circle-check text-emerald-600"></i>' : '<i class="fa-solid fa-circle-xmark text-rose-500"></i>') : '<i class="fa-regular fa-circle text-slate-300"></i>'}
              </span>
            </button>
          `;
        }).join('');

        bottomInteractionHtml = `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <p class="text-xs font-extrabold uppercase tracking-wider text-indigo-700">
                Step ${mState.stepIdx + 1} of ${mission.steps.length}: ${currentStep.prompt}
              </p>
            </div>

            <div class="space-y-2">
              ${optionsHtml}
            </div>

            ${mState.lastFeedback ? `
              <div class="p-3.5 rounded-2xl border text-xs sm:text-sm animate-pop-in ${
                mState.lastFeedback.correct
                  ? 'bg-emerald-50 border-emerald-300 text-emerald-950'
                  : 'bg-rose-50 border-rose-300 text-rose-950'
              }">
                <p class="font-bold flex items-start gap-2">
                  <i class="fa-solid ${mState.lastFeedback.correct ? 'fa-star text-amber-500' : 'fa-circle-info text-rose-600'} mt-0.5"></i>
                  <span>${mState.lastFeedback.text}</span>
                </p>
                ${mState.lastFeedback.correct ? `
                  <button onclick="advanceRoleplayStep()" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-2.5 px-4 rounded-xl text-xs sm:text-sm shadow-sm flex items-center justify-center gap-2 transition">
                    <span>${mState.stepIdx + 1 < mission.steps.length ? 'Continue Call' : 'Finish Call'}</span>
                    <i class="fa-solid fa-arrow-right"></i>
                  </button>
                ` : ''}
              </div>
            ` : ''}
          </div>
        `;
      }

      return `
        <div class="animate-pop-in">
          <!-- Mission Selector -->
          <div class="flex gap-2 mb-4">
            ${missionTabs}
          </div>

          <!-- Mission Objective Card -->
          <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-3.5 mb-4 flex items-start gap-3">
            <span class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-sm shrink-0 mt-0.5">
              <i class="fa-solid fa-bullseye"></i>
            </span>
            <div>
              <h2 class="font-display font-extrabold text-sm sm:text-base text-indigo-950">${mission.title}</h2>
              <p class="text-xs sm:text-sm text-indigo-800 mt-0.5">${mission.goal}</p>
            </div>
          </div>

          <!-- Realistic Smartphone Active Call Screen -->
          <div class="bg-slate-900 rounded-3xl p-4 text-white shadow-xl border-2 border-slate-800 mb-4">
            <!-- Caller Top Info & Live Timer -->
            <div class="flex items-center justify-between pb-3.5 border-b border-slate-800">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-slate-800 border-2 border-emerald-400 flex items-center justify-center text-2xl ${!mState.completed ? 'animate-pulse-ring' : ''}">
                  ${mission.avatarEmoji}
                </div>
                <div>
                  <h3 class="font-display font-extrabold text-base leading-tight">${mission.contactName}</h3>
                  <p class="text-xs text-slate-400">${mission.contactRole}</p>
                </div>
              </div>
              <div class="text-right">
                <span class="inline-flex items-center gap-1.5 text-[11px] font-bold px-2.5 py-1 rounded-full ${
                  mState.completed ? 'bg-slate-800 text-slate-400' : 'bg-emerald-500/20 text-emerald-300'
                }">
                  <span class="w-2 h-2 rounded-full ${mState.completed ? 'bg-slate-500' : 'bg-emerald-400 animate-ping'}"></span>
                  ${mState.completed ? 'Ended' : 'On Call'}
                </span>
                <p id="live-call-timer" class="text-xs font-mono text-slate-300 mt-1">${formatSeconds(mState.seconds)}</p>
              </div>
            </div>

            <!-- Live Call Transcript -->
            <div class="py-3.5 space-y-2.5 max-h-60 overflow-y-auto phone-scroll">
              ${transcriptHtml}
            </div>
          </div>

          <!-- Multiple Choice Response Area -->
          ${bottomInteractionHtml}
        </div>
      `;
    }

    /* ==========================================================================
       9. MODE 4: VOICEMAIL LAB (LEAVE A MESSAGE)
       ========================================================================== */

    function selectGapSlot(slotIdx) {
      if (state.gapSolved) return;
      state.activeGapIndex = slotIdx;
      state.gapChecked = false;
      renderCurrentView();
    }

    function clickWordChip(word) {
      if (state.gapSolved) return;
      state.gapChecked = false;

      // If word is already used in a slot, remove it from that slot first
      const existingIdx = state.gapUserAnswers.indexOf(word);
      if (existingIdx !== -1) {
        state.gapUserAnswers[existingIdx] = null;
      }

      // Place word into active slot (or first empty slot)
      let targetSlot = state.activeGapIndex;
      if (targetSlot === null || targetSlot < 0 || targetSlot >= 6) {
        targetSlot = state.gapUserAnswers.indexOf(null);
      }
      if (targetSlot !== -1) {
        state.gapUserAnswers[targetSlot] = word;
        // Move active focus to next empty gap
        const nextEmpty = state.gapUserAnswers.indexOf(null);
        state.activeGapIndex = nextEmpty !== -1 ? nextEmpty : targetSlot;
        playUiTone('pop');
      }

      renderCurrentView();
    }

    function clearGapSlot(slotIdx) {
      if (state.gapSolved) return;
      state.gapUserAnswers[slotIdx] = null;
      state.activeGapIndex = slotIdx;
      state.gapChecked = false;
      playUiTone('pop');
      renderCurrentView();
    }

    function checkVoicemailGaps() {
      if (state.gapUserAnswers.includes(null)) {
        showToast('Fill all 6 spaces first!', 'warn');
        playUiTone('error');
        return;
      }

      state.gapChecked = true;
      const gapSegments = VOICEMAIL_GAPS.segments.filter(s => s.type === 'gap');
      const allRight = gapSegments.every((seg, idx) => state.gapUserAnswers[idx] === seg.answer);

      if (allRight) {
        if (!state.gapSolved) {
          state.gapSolved = true;
          awardStars(2, 'Voicemail gap-fill solved!');
        } else {
          playUiTone('success');
        }
      } else {
        playUiTone('error');
        showToast('Some words are in the wrong spot. Tap red words to fix!', 'warn');
      }

      renderCurrentView();
    }

    function updateCustomVmField(field, value) {
      state.customVm[field] = value;
      const previewEl = document.getElementById('custom-vm-script-text');
      if (previewEl) {
        previewEl.textContent = buildCustomVoicemailScript();
      }
    }

    function applyQuickVmIdea(ideaText) {
      state.customVm.message = ideaText;
      playUiTone('pop');
      renderCurrentView();
    }

    function buildCustomVoicemailScript() {
      const who = state.customVm.recipient.trim() || 'Sarah';
      const name = state.customVm.callerName.trim() || 'Alex';
      let msg = state.customVm.message.trim() || "Let's meet at the café at 4 o'clock.";
      if (!/[.!?]$/.test(msg)) msg += '.';
      const phone = state.customVm.phone.trim() || '555-0192';

      return `Hello, ${who}. This is ${name} calling. ${msg} Please call me back. My phone number is ${phone}. Thank you. Goodbye!`;
    }

    function listenCustomVoicemail() {
      const script = buildCustomVoicemailScript();
      speakText(script, {
        rate: 0.9,
        pitch: 1.0,
        elementId: 'custom-vm-btn'
      });

      if (!state.customVm.listenedRewarded) {
        state.customVm.listenedRewarded = true;
        awardStars(2, 'Created & listened to your voicemail!');
        renderCurrentView();
      }
    }

    function copyCustomVoicemail() {
      const script = buildCustomVoicemailScript();
      try {
        const tempInput = document.createElement('textarea');
        tempInput.value = script;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        playUiTone('pop');
        showToast('Voicemail script copied!', 'success');
      } catch (e) {
        showToast('Could not copy automatically.', 'warn');
      }
    }

    function renderVoicemailView() {
      // Part A: Render text with interactive gap slots
      const gapSegments = VOICEMAIL_GAPS.segments.filter(s => s.type === 'gap');
      const paragraphHtml = VOICEMAIL_GAPS.segments.map(seg => {
        if (seg.type === 'text') return `<span>${seg.value}</span>`;

        const idx = seg.index;
        const userWord = state.gapUserAnswers[idx];
        const isActive = state.activeGapIndex === idx && !state.gapSolved;
        const isCorrect = userWord === seg.answer;

        let displayWord = userWord ? (seg.capitalize ? userWord.charAt(0).toUpperCase() + userWord.slice(1) : userWord) : `(${idx + 1})`;
        let slotClasses = 'inline-flex items-center justify-center min-w-[82px] px-2.5 py-1 mx-0.5 rounded-xl font-extrabold text-xs sm:text-sm border-2 transition cursor-pointer ';

        if (state.gapSolved || (state.gapChecked && userWord && isCorrect)) {
          slotClasses += 'bg-emerald-100 border-emerald-500 text-emerald-900';
        } else if (state.gapChecked && userWord && !isCorrect) {
          slotClasses += 'bg-rose-100 border-rose-500 text-rose-900 animate-shake';
        } else if (userWord) {
          slotClasses += 'bg-indigo-100 border-indigo-400 text-indigo-900';
        } else if (isActive) {
          slotClasses += 'bg-amber-50 border-amber-400 text-amber-700 ring-2 ring-amber-200';
        } else {
          slotClasses += 'bg-slate-100 border-dashed border-slate-300 text-slate-400 hover:border-indigo-400';
        }

        return `<button type="button" onclick="${userWord && !state.gapSolved ? `clearGapSlot(${idx})` : `selectGapSlot(${idx})`}" class="${slotClasses}">${displayWord}</button>`;
      }).join('');

      // Word bank chips
      const chipsHtml = VOICEMAIL_GAPS.wordBank.map(word => {
        const isUsed = state.gapUserAnswers.includes(word);
        return `
          <button
            type="button"
            onclick="clickWordChip('${word}')"
            ${state.gapSolved ? 'disabled' : ''}
            class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-extrabold border-2 transition active:scale-95 ${
              isUsed
                ? 'bg-slate-100 border-slate-200 text-slate-400 line-through'
                : 'bg-white border-purple-200 text-purple-900 hover:border-purple-500 hover:bg-purple-50 shadow-2xs'
            }"
          >
            ${word}
          </button>
        `;
      }).join('');

      const generatedScript = buildCustomVoicemailScript();

      return `
        <div class="animate-pop-in space-y-6">
          <!-- PART A: GAP-FILL VOICEMAIL -->
          <section class="bg-white rounded-3xl p-4 sm:p-5 border border-purple-200 shadow-xs">
            <div class="flex items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2.5">
                <span class="w-9 h-9 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center text-base">
                  <i class="fa-solid fa-voicemail"></i>
                </span>
                <div>
                  <h2 class="font-display font-extrabold text-base sm:text-lg text-slate-800">Part A: Complete the Voicemail</h2>
                  <p class="text-xs text-slate-500">Tap a word below to fill each blank space.</p>
                </div>
              </div>
              ${state.gapSolved ? '<span class="bg-emerald-100 text-emerald-800 text-xs font-extrabold px-2.5 py-1 rounded-full"><i class="fa-solid fa-check mr-1"></i>Done</span>' : ''}
            </div>

            <!-- Word Bank -->
            <div class="bg-purple-50/70 p-3 rounded-2xl border border-purple-100 mb-4">
              <p class="text-[11px] font-extrabold uppercase tracking-wider text-purple-700 mb-2">Word Bank:</p>
              <div class="flex flex-wrap gap-2">
                ${chipsHtml}
              </div>
            </div>

            <!-- Gap-fill Message Box -->
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-sm sm:text-base leading-loose text-slate-800 font-medium mb-4">
              ${paragraphHtml}
            </div>

            <!-- Part A Actions -->
            <div class="flex flex-wrap items-center gap-2.5">
              ${!state.gapSolved ? `
                <button onclick="checkVoicemailGaps()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-extrabold text-xs sm:text-sm py-3 px-5 rounded-xl shadow-sm flex items-center justify-center gap-2 transition active:scale-95">
                  <i class="fa-solid fa-check-double"></i>
                  <span>Check Answers</span>
                </button>
              ` : `
                <button onclick="speakText('${VOICEMAIL_GAPS.fullText.replace(/'/g, "\\'")}', { rate: 0.9, elementId: 'vm-parta-listen' })" data-speak-id="vm-parta-listen" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs sm:text-sm py-3 px-5 rounded-xl shadow-sm flex items-center justify-center gap-2 transition">
                  <span class="static-icon"><i class="fa-solid fa-volume-high"></i></span>
                  <span class="wave-indicator hidden inline-flex items-end gap-0.5 h-3.5">
                    <span class="sound-bar"></span>
                    <span class="sound-bar"></span>
                    <span class="sound-bar"></span>
                  </span>
                  <span>Listen to Voicemail</span>
                </button>
              `}
            </div>
          </section>

          <!-- PART B: CUSTOM VOICEMAIL BUILDER -->
          <section class="bg-white rounded-3xl p-4 sm:p-5 border border-sky-200 shadow-xs">
            <div class="flex items-center gap-2.5 mb-3">
              <span class="w-9 h-9 rounded-xl bg-sky-100 text-sky-700 flex items-center justify-center text-base">
                <i class="fa-solid fa-microphone-lines"></i>
              </span>
              <div>
                <h2 class="font-display font-extrabold text-base sm:text-lg text-slate-800">Part B: Your Turn (Voicemail Builder)</h2>
                <p class="text-xs text-slate-500">Write your own simple A1 voicemail and listen to it!</p>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">1. Who are you calling?</label>
                <input
                  type="text"
                  value="${state.customVm.recipient.replace(/"/g, '&quot;')}"
                  oninput="updateCustomVmField('recipient', this.value)"
                  placeholder="e.g., Sarah"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-200 outline-none text-sm font-medium"
                />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">2. Your name:</label>
                <input
                  type="text"
                  value="${state.customVm.callerName.replace(/"/g, '&quot;')}"
                  oninput="updateCustomVmField('callerName', this.value)"
                  placeholder="e.g., Alex"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-200 outline-none text-sm font-medium"
                />
              </div>
            </div>

            <div class="mb-3">
              <label class="block text-xs font-bold text-slate-700 mb-1">3. Your short message:</label>
              <input
                type="text"
                value="${state.customVm.message.replace(/"/g, '&quot;')}"
                oninput="updateCustomVmField('message', this.value)"
                placeholder="e.g., Let's meet at the café at 4 o'clock."
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-200 outline-none text-sm font-medium"
              />
              <!-- Quick A1 Idea Pills -->
              <div class="flex flex-wrap items-center gap-1.5 mt-2">
                <span class="text-[11px] font-bold text-slate-400">Ideas:</span>
                <button type="button" onclick="applyQuickVmIdea(&quot;Let's meet at the café at 4 o'clock.&quot;)" class="text-[11px] bg-slate-100 hover:bg-sky-100 text-slate-700 px-2.5 py-1 rounded-lg font-semibold transition">
                  Meet at café
                </button>
                <button type="button" onclick="applyQuickVmIdea(&quot;I cannot come to English class today.&quot;)" class="text-[11px] bg-slate-100 hover:bg-sky-100 text-slate-700 px-2.5 py-1 rounded-lg font-semibold transition">
                  Miss class today
                </button>
                <button type="button" onclick="applyQuickVmIdea(&quot;Please call me about Saturday's party.&quot;)" class="text-[11px] bg-slate-100 hover:bg-sky-100 text-slate-700 px-2.5 py-1 rounded-lg font-semibold transition">
                  Saturday party
                </button>
              </div>
            </div>

            <div class="mb-4">
              <label class="block text-xs font-bold text-slate-700 mb-1">4. Your phone number:</label>
              <input
                type="text"
                value="${state.customVm.phone.replace(/"/g, '&quot;')}"
                oninput="updateCustomVmField('phone', this.value)"
                placeholder="e.g., 555-0192"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-200 outline-none text-sm font-medium"
              />
            </div>

            <!-- Live Generated Voicemail Card -->
            <div class="bg-gradient-to-br from-sky-50 to-indigo-50 border-2 border-sky-200 rounded-2xl p-4 mb-4">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-[11px] font-extrabold uppercase tracking-wider text-sky-700">Your Voicemail Script</span>
                <button type="button" onclick="copyCustomVoicemail()" class="text-xs font-bold text-indigo-700 hover:text-indigo-900 flex items-center gap-1">
                  <i class="fa-regular fa-copy"></i> Copy
                </button>
              </div>
              <p id="custom-vm-script-text" class="text-sm sm:text-base font-semibold text-slate-800 leading-relaxed">
                ${generatedScript}
              </p>
            </div>

            <button
              type="button"
              onclick="listenCustomVoicemail()"
              data-speak-id="custom-vm-btn"
              class="w-full bg-sky-600 hover:bg-sky-700 text-white font-extrabold text-sm py-3.5 px-5 rounded-2xl shadow-md flex items-center justify-center gap-2.5 transition active:scale-95"
            >
              <span class="static-icon"><i class="fa-solid fa-volume-high text-base"></i></span>
              <span class="wave-indicator hidden inline-flex items-end gap-0.5 h-4">
                <span class="sound-bar"></span>
                <span class="sound-bar"></span>
                <span class="sound-bar"></span>
                <span class="sound-bar"></span>
              </span>
              <span>Listen to My Voicemail</span>
            </button>
          </section>

          <!-- Final Completion Banner if all 20 stars earned -->
          ${state.stars >= TOTAL_MAX_STARS ? `
            <div class="bg-gradient-to-r from-amber-400 via-yellow-300 to-emerald-300 rounded-3xl p-5 text-center text-slate-950 shadow-lg border-2 border-amber-500 animate-pop-in">
              <div class="text-3xl mb-1">🏆⭐🎉</div>
              <h3 class="font-display font-extrabold text-lg sm:text-xl">Congratulations! 20 / 20 Stars!</h3>
              <p class="text-xs sm:text-sm font-semibold mt-1">
                You can now make phone calls, understand messages, and leave polite voicemails in English!
              </p>
            </div>
          ` : ''}
        </div>
      `;
    }

    /* ==========================================================================
       10. RESET MODAL & BOOTSTRAP
       ========================================================================== */

    function resetProgressModal() {
      const modal = document.getElementById('reset-modal');
      if (modal) modal.classList.remove('hidden');
    }

    function closeResetModal() {
      const modal = document.getElementById('reset-modal');
      if (modal) modal.classList.add('hidden');
    }

    function confirmResetApp() {
      closeResetModal();
      stopCallTimer();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      state.stars = 0;
      state.listenedPhrases = new Set();
      state.learnStarsAwarded = 0;
      state.activeOrderScenarioIdx = 0;
      initScrambledScenarios();
      state.activeMissionIdx = 0;
      state.missionState = {
        m1: { stepIdx: 0, transcript: [], selectedOptionIdx: null, lastFeedback: null, completed: false, seconds: 0 },
        m2: { stepIdx: 0, transcript: [], selectedOptionIdx: null, lastFeedback: null, completed: false, seconds: 0 }
      };
      state.gapUserAnswers = [null, null, null, null, null, null];
      state.activeGapIndex = 0;
      state.gapChecked = false;
      state.gapSolved = false;
      state.customVm.listenedRewarded = false;

      updateHeaderProgress();
      switchTab('learn');
      showToast('Progress reset! Ready to practice.', 'info');
    }

    // Update top phone status clock with local time
    function updateStatusClock() {
      const clockEl = document.getElementById('status-clock');
      if (!clockEl) return;
      const now = new Date();
      const hrs = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      clockEl.textContent = `${hrs}:${mins}`;
    }

    // Initialize app on load
    window.addEventListener('DOMContentLoaded', () => {
      updateStatusClock();
      setInterval(updateStatusClock, 30000);
      initScrambledScenarios();
      updateHeaderProgress();
      switchTab('learn');
    });
  </script>
</body>
</html>
