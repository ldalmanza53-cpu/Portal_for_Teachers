<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verb Master: Present to Past Tense</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --success: #10b981;
      --error: #ef4444;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header { text-align: center; padding: 10px 0; }
    header h1 { font-size: 1.6rem; color: #60a5fa; margin-bottom: 4px; }
    header p { font-size: 0.9rem; color: var(--text-muted); }

    .score-board {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .score-val { font-size: 1.4rem; font-weight: 800; color: #38bdf8; }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: #334155;
      padding: 4px;
      border-radius: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 8px;
    }

    .tab-btn.active { background: var(--primary); color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .grid-table {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .verb-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .verb-present {
      font-weight: 700;
      color: #93c5fd;
      font-size: 1rem;
    }

    .verb-input {
      width: 100px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: white;
      font-weight: 600;
      text-align: center;
    }

    .verb-input.correct { border-color: var(--success); background: #064e3b; color: #a7f3d0; }
    .verb-input.incorrect { border-color: var(--error); background: #7f1d1d; color: #fecaca; }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--primary-dark); }
    .btn.secondary { background: #475569; }

    .prompt-box {
      background: #0f172a;
      border-left: 4px solid var(--primary);
      padding: 16px;
      border-radius: 6px;
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .feedback-box {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .feedback-box.correct { display: block; background: #064e3b; color: #a7f3d0; border: 1px solid var(--success); }
    .feedback-box.incorrect { display: block; background: #7f1d1d; color: #fecaca; border: 1px solid var(--error); }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>📝 Verb Master: Simple Past</h1>
      <p>Transform Present Verbs into Past Tense Forms</p>
    </header>

    <div class="score-board">
      <div>
        <div style="font-size:0.75rem; color:#94a3b8; font-weight:700;">YOUR PROGRESS</div>
        <div class="score-val" id="scoreDisplay">0 / 16 Correct</div>
      </div>
      <button class="btn secondary" onclick="resetAll()">Reset All</button>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('table')">📊 Complete the Table</button>
      <button class="tab-btn" onclick="switchTab('sentences')">💬 Sentence Practice</button>
    </div>

    <!-- TAB 1: TABLE FILL -->
    <div id="table" class="tab-content active">
      <div class="card">
        <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 14px;">Fill in the past tense form for each verb from your worksheet. Click "Check Answers" when finished!</p>
        
        <div class="grid-table" id="tableGrid">
          <!-- Dynamically Generated -->
        </div>

        <div style="margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px;">
          <button class="btn" onclick="checkTable()">Check Table Answers</button>
        </div>
      </div>
    </div>

    <!-- TAB 2: SENTENCE QUIZ -->
    <div id="sentences" class="tab-content">
      <div class="card">
        <div class="prompt-box" id="sentencePrompt">
          Loading sentence...
        </div>

        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <input type="text" id="sentenceInput" class="verb-input" style="width:100%; text-align:left; padding:10px;" placeholder="Type the past tense verb here...">
          <button class="btn" onclick="checkSentence()">Submit</button>
        </div>

        <div class="feedback-box" id="sentenceFeedback"></div>

        <div style="margin-top: 16px; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.85rem; color: #94a3b8;" id="cardCounter">Question 1 of 16</span>
          <button class="btn secondary" onclick="nextSentence()">Next Question ➔</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const verbList = [
      { present: "call", past: "called", sentence: "Yesterday, I ________ my best friend to talk about the project." },
      { present: "cost", past: "cost", sentence: "The delicious lunch only ________ $5 at the school cafeteria." },
      { present: "do", past: "did", sentence: "She ________ her English homework before watching TV." },
      { present: "find", past: "found", sentence: "He ________ a silver coin on the street yesterday." },
      { present: "get", past: "got", sentence: "We ________ a very nice gift from our teacher." },
      { present: "go", past: "went", sentence: "Last Sunday, they ________ to the beach." },
      { present: "have", past: "had", sentence: "I ________ toast and orange juice for breakfast." },
      { present: "leave", past: "left", sentence: "The bus ________ the station at exactly 8:00 AM." },
      { present: "lock", past: "locked", sentence: "He ________ the office door before going home." },
      { present: "open", past: "opened", sentence: "She ________ the classroom door for the students." },
      { present: "pay", past: "paid", sentence: "They ________ for the movie tickets with cash." },
      { present: "put", past: "put", sentence: "I ________ my wallet on the kitchen table." },
      { present: "remember", past: "remembered", sentence: "She ________ to bring her umbrella because it rained." },
      { present: "see", past: "saw", sentence: "We ________ a very interesting movie last night." },
      { present: "take", past: "took", sentence: "He ________ the train to travel to the city center." },
      { present: "try", past: "tried", sentence: "She ________ the new recipe and it tasted great!" }
    ];

    let currentSentenceIdx = 0;

    function buildTable() {
      const grid = document.getElementById('tableGrid');
      grid.innerHTML = '';
      verbList.forEach((v, idx) => {
        const isPreFilled = (v.present === 'call' || v.present === 'cost');
        const val = isPreFilled ? v.past : '';
        const readonly = isPreFilled ? 'readonly style="background:#334155;"' : '';
        
        grid.innerHTML += `
          <div class="verb-row">
            <span class="verb-present">${v.present}</span>
            <input type="text" class="verb-input" id="verb-${idx}" value="${val}" ${readonly} placeholder="...">
          </div>
        `;
      });
    }

    function checkTable() {
      let correctCount = 0;
      verbList.forEach((v, idx) => {
        const input = document.getElementById(`verb-${idx}`);
        const userVal = input.value.trim().toLowerCase();
        if (userVal === v.past) {
          input.classList.remove('incorrect');
          input.classList.add('correct');
          correctCount++;
        } else {
          input.classList.remove('correct');
          input.classList.add('incorrect');
        }
      });
      document.getElementById('scoreDisplay').innerText = `${correctCount} / ${verbList.length} Correct`;
    }

    function loadSentence() {
      const item = verbList[currentSentenceIdx];
      document.getElementById('sentencePrompt').innerText = item.sentence;
      document.getElementById('sentenceInput').value = '';
      document.getElementById('sentenceInput').focus();
      document.getElementById('sentenceFeedback').className = 'feedback-box';
      document.getElementById('cardCounter').innerText = `Question ${currentSentenceIdx + 1} of ${verbList.length}`;
    }

    function checkSentence() {
      const item = verbList[currentSentenceIdx];
      const userVal = document.getElementById('sentenceInput').value.trim().toLowerCase();
      const fb = document.getElementById('sentenceFeedback');

      if (userVal === item.past) {
        fb.className = 'feedback-box correct';
        fb.innerText = `✨ Correct! The past tense of "${item.present}" is "${item.past}".`;
      } else {
        fb.className = 'feedback-box incorrect';
        fb.innerText = `❌ Not quite! The past tense of "${item.present}" is "${item.past}".`;
      }
    }

    function nextSentence() {
      currentSentenceIdx = (currentSentenceIdx + 1) % verbList.length;
      loadSentence();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function resetAll() {
      buildTable();
      currentSentenceIdx = 0;
      loadSentence();
      document.getElementById('scoreDisplay').innerText = `0 / ${verbList.length} Correct`;
    }

    // Initialize
    buildTable();
    loadSentence();
  </script>
</body>
</html>
