<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A1 Question Roulette: Likes & Dislikes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #2e1065, #4c1d95);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #581c87;
      border-radius: 16px;
      padding: 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      border: 1px solid #7e22ce;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #fde047;
    }
    p.subtitle {
      color: #e9d5ff;
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    .roulette-box {
      background: #2e1065;
      border: 2px dashed #a855f7;
      border-radius: 12px;
      padding: 30px 20px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
    }
    .level-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 1px;
      background: #fde047;
      color: #2e1065;
    }
    .question-text {
      font-size: 1.25rem;
      line-height: 1.5;
      color: #faf5ff;
      font-weight: 500;
    }
    .spin-btn {
      background: #fde047;
      color: #2e1065;
      border: none;
      padding: 15px 40px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(253, 224, 71, 0.3);
      transition: transform 0.1s ease, background 0.2s ease;
    }
    .spin-btn:hover {
      background: #fef08a;
      transform: translateY(-2px);
    }
    .spin-btn:active {
      transform: translateY(1px);
    }
    .spin-btn:disabled {
      background: #7e22ce;
      color: #3b0764;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Question Roulette</h1>
    <p class="subtitle">Level A1 • Expressing Likes & Dislikes</p>

    <div class="roulette-box" id="rouletteBox">
      <span class="level-tag" id="tag">Ready?</span>
      <div class="question-text" id="questionText">Click "Spin Roulette" to pick a question!</div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinRoulette()">Spin Roulette 🎲</button>
  </div>

  <script>
    const questions = [
      "Do you like eating pizza?",
      "What is your favorite food?",
      "Do you like rainy weather?",
      "Do you enjoy studying English?",
      "What is one activity you dislike on weekends?",
      "Which do you prefer: cats or dogs?",
      "Do you like waking up early in the morning?",
      "What is your favorite type of music?",
      "Do you prefer cooking at home or eating at restaurants?",
      "What is a sport you do not like?",
      "Do you like watching movies at the cinema?",
      "Do you like living in a big city?",
      "What is your favorite season of the year?",
      "Do you like shopping for clothes?",
      "What subject in school did you dislike?",
      "Do you like traveling by plane?",
      "Do you enjoy exercising?",
      "What is your favorite drink?",
      "Do you like playing video games?",
      "What is one job you would dislike?"
    ];

    function spinRoulette() {
      const btn = document.getElementById("spinBtn");
      const tag = document.getElementById("tag");
      const qText = document.getElementById("questionText");
      
      btn.disabled = true;
      let counter = 0;
      const totalSpins = 20;
      const intervalSpeed = 60;

      const interval = setInterval(() => {
        const randomIndex = Math.floor(Math.random() * questions.length);
        tag.textContent = `Question ${randomIndex + 1} of 20`;
        qText.textContent = questions[randomIndex];

        counter++;
        if (counter >= totalSpins) {
          clearInterval(interval);
          btn.disabled = false;
        }
      }, intervalSpeed);
    }
  </script>
</body>
</html>
