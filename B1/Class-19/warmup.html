        tailwind.config = {
            darkMode: 'class',

                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',

                            500: '#6366f1',

    <!-- Custom CSS Styles -->
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Print Specific Styles for Output Documents */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-area, #printable-area * {
                visibility: visible;
            }
            #printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                color: #000 !important;
                background: #fff !important;
                padding: 20px;
            }
            .no-print {
                display: none !important;
            }
        }

        /* Interactive tile animations */
        .tile-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tile-btn:hover {
            transform: translateY(-2px);
        }
        .tile-btn:active {
            transform: translateY(0);
        }

        /* Glassmorphism panel effects */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Pulse glow animation for active badges */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 0 25px rgba(99, 102, 241, 0.8); }
        }
        .active-glow {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>

    <script>
        // Global App State
        const state = {
            user: {
                name: 'Alex Johnson',
                xp: 150,
                streak: 5,
                level: 1,
                speechRate: 1.0,
            },
            activeTab: 'dashboard',
            unitsProgress: {
                unit1: 40,
                unit2: 25,
                unit3: 10,
                unit4: 0,
                unit5: 0,
                unit6: 0,
                unit7: 15
            },
            unlockedBadges: ['first_step', 'audio_pioneer'],
            decisionChartInstance: null
        };

        // Web Audio API Sound Synthesizer (No external audio asset dependence)
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playAudioFx(type) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now); // A3
                    osc.frequency.setValueAtTime(180, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'victory') {
                    // Short victory fanfare
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const noteOsc = ctx.createOscillator();
                        const noteGain = ctx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(ctx.destination);
                        noteOsc.type = 'triangle';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        noteGain.gain.setValueAtTime(0.2, now + idx * 0.1);
                        noteGain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
                        noteOsc.start(now + idx * 0.1);
                        noteOsc.stop(now + idx * 0.1 + 0.2);
                    });
                }
            } catch (e) {
                console.log('Audio Context muted or not allowed without user gesture.', e);
            }
        }

        // Web Speech API Integration
        function speakText(text) {
            playAudioFx('click');
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Cancel previous speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = state.user.speechRate || 1.0;
                window.speechSynthesis.speak(utterance);
                showToast(`Reading audio at ${state.user.speechRate}x speed`, 'info');
            } else {
                showToast('Text-to-Speech is not supported in this browser.', 'warning');
            }
        }

        function setSpeechRate(rate) {
            state.user.speechRate = rate;
            document.querySelectorAll('[id^="rate-"]').forEach(btn => {
                btn.className = 'px-1.5 py-0.5 rounded hover:bg-slate-700 font-mono transition';
            });
            const activeBtn = document.getElementById(`rate-${Math.round(rate * 10)}`);
            if (activeBtn) activeBtn.className = 'px-1.5 py-0.5 rounded bg-brand-600 text-white font-mono font-bold transition';
            playAudioFx('click');
            showToast(`Speech rate set to ${rate}x`, 'info');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = 'bg-emerald-600 text-white';
            let icon = 'fa-circle-check';
            if (type === 'warning') { bg = 'bg-amber-600 text-white'; icon = 'fa-triangle-exclamation'; }
            if (type === 'info') { bg = 'bg-brand-600 text-white'; icon = 'fa-circle-info'; }
            if (type === 'error') { bg = 'bg-rose-600 text-white'; icon = 'fa-circle-xmark'; }

            toast.className = `pointer-events-auto flex items-center space-x-2 px-4 py-3 rounded-xl shadow-xl font-medium text-sm transition transform translate-y-2 opacity-0 ${bg}`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function addXP(amount) {
            state.user.xp += amount;
            document.getElementById('header-xp').innerText = state.user.xp;
            
            // Level calculation
            const nextLevelXP = state.user.level * 400;
            if (state.user.xp >= nextLevelXP) {
                state.user.level += 1;
                playAudioFx('victory');
                showToast(`🎉 Level Up! You are now Level ${state.user.level}!`, 'success');
            } else {
                playAudioFx('correct');
                showToast(`+${amount} XP Earned!`, 'success');
            }
            updateUserLevelUI();
        }

        function updateUserLevelUI() {
            const levelTitles = ['Novice Communicator', 'Fluent Explorer', 'Grammar Strategist', 'Intercultural Diplomat', 'LinguaMaster Scholar'];
            const currentTitle = levelTitles[Math.min(state.user.level - 1, levelTitles.length - 1)];
            
            document.getElementById('user-level-num').innerText = state.user.level;
            document.getElementById('user-level-title').innerText = currentTitle;
            
            const nextXP = state.user.level * 400;
            const progress = Math.min(100, Math.round((state.user.xp / nextXP) * 100));
            document.getElementById('user-xp-next').innerText = `${state.user.xp} / ${nextXP} XP to Level ${state.user.level + 1}`;
            document.getElementById('user-level-bar').style.width = `${progress}%`;
        }

        function switchTab(tabId) {
            playAudioFx('click');
            state.activeTab = tabId;

            // Update Nav item highlights
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-brand-600', 'text-white', 'shadow-md');
                el.classList.add('text-slate-300');
            });
            const activeNav = document.getElementById(`nav-${tabId}`);
            if (activeNav) {
                activeNav.classList.add('bg-brand-600', 'text-white', 'shadow-md');
                activeNav.classList.remove('text-slate-300');
            }

            // Render view
            const main = document.getElementById('main-content');
            switch (tabId) {
                case 'dashboard':
                    renderDashboardView(main);
                    break;
                case 'unit1':
                    renderUnit1View(main);
                    break;
                case 'unit2':
                    renderUnit2View(main);
                    break;
                case 'unit3':
                    renderUnit3View(main);
                    break;
                case 'unit4':
                    renderUnit4View(main);
                    break;
                case 'unit5':
                    renderUnit5View(main);
                    break;
                case 'unit6':
                    renderUnit6View(main);
                    break;
                case 'unit7':
                    renderUnit7View(main);
                    break;
                case 'practice':
                    renderPracticeView(main);
                    break;
                case 'certificate':
                    renderCertificateView(main);
                    break;
                default:
                    renderDashboardView(main);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar-nav');
            sidebar.classList.toggle('hidden');
            sidebar.classList.toggle('w-full');
        }

        function renderDashboardView(container) {
            const avgProgress = Math.round(Object.values(state.unitsProgress).reduce((a, b) => a + b, 0) / 7);

            container.innerHTML = `
                <!-- Welcome Banner -->
                <div class="glass-panel p-6 sm:p-8 rounded-3xl bg-gradient-to-r from-brand-900/80 via-slate-900/90 to-slate-900 border border-brand-500/20 relative overflow-hidden">
                    <div class="relative z-10 space-y-4">

        function generateU1Sentence() {
            const past = document.getElementById('u1-past').value.trim();
            const present = document.getElementById('u1-present').value.trim();
            if (!past || !present) {
                showToast('Please fill in both past and present habits.', 'warning');
                return;
            }

            const sentence = `I used to ${past}, but currently I ${present}.`;
            document.getElementById('u1-result-text').innerText = sentence;
            document.getElementById('u1-result').classList.remove('hidden');
            playAudioFx('correct');
        }

        function checkU1Quiz() {
            const selected = document.querySelector('input[name="u1-q1"]:checked');
            if (!selected) {
                showToast('Please select an option first.', 'warning');
                return;
            }
            if (selected.value === 'b') {
                playAudioFx('correct');
                addXP(30);
                state.unitsProgress.unit1 = Math.min(100, state.unitsProgress.unit1 + 20);
                showToast('Correct! "used to + base verb" expresses past habits.', 'success');
            } else {
                playAudioFx('wrong');
                showToast('Incorrect. Remember: used to is followed by the base verb (live).', 'error');
            }
        }

        function checkReportedSpeech(isCorrect) {

                playAudioFx('correct');

                state.unitsProgress.unit6 = Math.min(100, state.unitsProgress.unit6 + 30);

            } else {
                playAudioFx('wrong');
                showToast('Incorrect structure. Use: "told me not to stay out"', 'error');
            }
        }

        function printHouseholdContract() {
            const content = document.getElementById('household-contract-preview').innerHTML;
            const printArea = document.getElementById('printable-area');
            printArea.innerHTML = content;
            window.print();
        }

                        <h2 class="font-bold text-white text-base flex items-center space-x-2">
