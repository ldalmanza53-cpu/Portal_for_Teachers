<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favor Master: Asking Formally & Informally</title>
  <style>
    :root {
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --informal: #EF4444;
      --informal-bg: #FEF2F2;
      --formal: #2563EB;
      --formal-bg: #EFF6FF;
      --success: #10B981;
      --warning: #F59E0B;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 850px;
    }

    header h1 {
      color: var(--primary);
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 900px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      padding: 12px 20px;
      border: none;
      background: #E2E8F0;
      color: var(--text);
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .tab-content {
      display: none;
      background: var(--card-bg);
      padding: 28px;
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
    }

    .tab-content.active {
      display: block;
    }

    h2 {
      color: var(--primary);
      font-size: 1.4rem;
      margin-bottom: 18px;
      border-bottom: 2px solid #F1F5F9;
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Formality Explorer Cards */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .explorer-card {
      border-radius: var(--radius);
      padding: 20px;
      border: 2px solid var(--border);
    }

    .explorer-card.informal-theme {
      background-color: var(--informal-bg);
      border-color: #FCA5A5;
    }

    .explorer-card.formal-theme {
      background-color: var(--formal-bg);
      border-color: #93C5FD;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .badge-informal {
      background: #FEE2E2;
      color: #991B1B;
    }

    .badge-formal {
      background: #DBEAFE;
      color: #1E40AF;
    }

    .formula-box {
      background: white;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      margin: 10px 0;
      border-left: 4px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .example-list {
      list-style: none;
      margin-top: 10px;
    }

    .example-list li {
      padding: 8px 0;
      border-bottom: 1px dashed rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .audio-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .audio-btn:hover {
      transform: scale(1.1);
    }

    /* Game Tab Styles */
    .game-score-bar {
      display: flex;
      justify-content: space-between;
      background: #F1F5F9;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .scenario-card {
      background: #F8FAFC;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }

    .scenario-avatar {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .scenario-text {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .scenario-sub {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .choice-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .btn-choice {
      padding: 16px;
