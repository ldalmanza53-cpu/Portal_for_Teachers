<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 Word Power: Collocations Activity</title>
  <style>
    :root {
      --primary: #4A90E2;
      --primary-dark: #357ABD;
      --secondary: #F5A623;
      --success: #2ECC71;
      --error: #E74C3C;
      --bg: #F4F7F9;
      --card-bg: #FFFFFF;
      --text: #2C3E50;
      --border: #DCDFE6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 15px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    p.instructions {
      color: #666;
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid var(--primary);
      background: none;
      color: var(--primary);
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: white;
    }

    .word-bank {
      background: #FFF8E7;
      border: 2px dashed var(--secondary);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      min-height: 100px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .chip {
      background: white;
      border: 2px solid var(--primary);
      color: var(--primary-dark);
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, background-color 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .chip:hover {
      transform: translateY(-2px);
      background-color: #EBF3FB;
    }

    .chip.selected {
      background: var(--primary);
      color: white;
      transform: scale(1.05);
    }

    .verb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .verb-column {
      background: #FAFAFA;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.2s;
    }

    .verb-column.target-hover {
      border-color: var(--primary);
      background: #F0F7FF;
    }

    .verb-header {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .drop-zone {
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .chip.correct {
      background-color: #E8F8F0;
      border-color: var(--success);
      color: #27AE60;
    }

    .chip.incorrect {
      background-color: #FDF2E9;
      border-color: var(--error);
      color: var(--error);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #E0E0E0; color: #333; }
    .btn-secondary:hover { background: #D0D0D0; }

    .sentence-quiz {
      display: none;
    }

    .sentence-card {
      background: #FAFAFA;
      border-left: 4px solid var(--primary);
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 4px;
      font-size: 1.05rem;
    }

    select.gap-select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 1rem;
      background: white;
      color: var(--text);
    }

    #score-board {
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 15px;
      color: var(--primary-dark);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Word Power: Collocations</h1>
      <p class="instructions">Match phrases with the correct verbs. Click a phrase, then click a verb column to place it!</p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('sorting')">Part A: Collocation Grid</button>
      <button class="tab-btn" onclick="switchTab('sentences')">Part B: Sentence Practice</button>
    </div>

    <!-- PART A: SORTING -->
    <div id="sorting-section">
      <div class="word-bank" id="wordBank">
        <!-- Phrase chips generated dynamically -->
      </div>

      <div class="verb-grid">
        <div class="verb-column" onclick="placeSelected('earn')">
          <div class="verb-header">earn</div>
          <div class="drop-zone" id="zone-earn"></div>
        </div>
        <div class="verb-column" onclick="placeSelected('get')">
          <div class="verb-header">get</div>
          <div class="drop-zone" id="zone-get"></div>
        </div>
        <div class="verb-column" onclick="placeSelected('join')">
          <div class="verb-header">join</div>
          <div class="drop-zone" id="zone-join"></div>
        </div>
        <div class="verb-column" onclick="placeSelected('spend')">
          <div class="verb-header">spend</div>
          <div class="drop-zone" id="zone-spend"></div>
        </div>
        <div class="verb-column" onclick="placeSelected('feel')">
          <div class="verb-header">feel</div>
          <div class="drop-zone" id="zone-feel"></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" onclick="checkSorting()">Check Answers</button>
        <button class="btn btn-secondary" onclick="resetSorting()">Reset</button>
      </div>
    </div>

    <!-- PART B: SENTENCE PRACTICE -->
    <div id="sentences-section" class="sentence-quiz">
      <div id="sentenceContainer"></div>
      <div class="controls">
        <button class="btn btn-primary" onclick="checkSentences()">Check Sentences</button>
        <button class="btn btn-secondary" onclick="resetSentences()">Reset Sentences</button>
      </div>
    </div>

    <div id="score-board"></div>
  </div>

  <script>
    const phrases = [
      "a club", "a degree", "a group", "a gym", "a living",
      "energy", "in shape", "into college", "jealous", "money",
      "stressed", "time", "tired", "work experience", "your own money"
    ];

    // Valid collocations according to English usage
    const validCollocations = {
      earn: ["a degree", "a living", "money", "your own money", "work experience"],
      get: ["a degree", "in shape", "into college", "jealous", "stressed", "tired", "work experience"],
      join: ["a club", "a group", "a gym"],
      spend: ["energy", "money", "time", "your own money"],
      feel: ["jealous", "stressed", "tired"]
    };

    const sentenceData = [
      { text: "After four years of university, Sarah finally earned _____.", options: ["a degree", "a club", "a group"], answer: "a degree" },
      { text: "I go to the gym three times a week to get _____.", options: ["in shape", "energy", "a living"], answer: "in shape" },
      { text: "He works two jobs because he needs to earn _____.", options: ["a living", "into college", "jealous"], answer: "a living" },
      { text: "Don't spend all your _____ on video games!", options: ["money", "a gym", "jealous"], answer: "money" },
      { text: "I always feel _____ when I don't get enough sleep.", options: ["tired", "a living", "a club"], answer: "tired" },
      { text: "She wants to join _____ to meet people who like painting.", options: ["a club", "a living", "in shape"], answer: "a club" }
    ];

    let selectedChip = null;

    function playAudio(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      if (type === 'success') {
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      }
    }

    function initSorting() {
      const bank = document.getElementById('wordBank');
      bank.innerHTML = '';
      document.querySelectorAll('.drop-zone').forEach(z => z.innerHTML = '');
      document.getElementById('score-board').innerText = '';

      // Shuffle phrases
      const shuffled = [...phrases].sort(() => Math.random() - 0.5);
      shuffled.forEach(phrase => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerText = phrase;
        chip.onclick = (e) => {
          e.stopPropagation();
          selectChip(chip);
        };
        bank.appendChild(chip);
      });
    }

    function selectChip(chip) {
      if (selectedChip) selectedChip.classList.remove('selected');
      if (selectedChip === chip) {
        selectedChip = null;
        return;
      }
      selectedChip = chip;
      selectedChip.classList.add('selected');
    }

    function placeSelected(verb) {
      if (!selectedChip) return;
      const zone = document.getElementById(`zone-${verb}`);
      
      // If clicking back to bank or another zone
      selectedChip.classList.remove('selected', 'correct', 'incorrect');
      zone.appendChild(selectedChip);
      selectedChip = null;
    }

    // Allow returning items to word bank
    document.getElementById('wordBank').onclick = () => {
      if (selectedChip) {
        selectedChip.classList.remove('selected', 'correct', 'incorrect');
        document.getElementById('wordBank').appendChild(selectedChip);
        selectedChip = null;
      }
    };

    function checkSorting() {
      let totalPlaced = 0;
      let correctCount = 0;

      const verbs = ['earn', 'get', 'join', 'spend', 'feel'];
      verbs.forEach(verb => {
        const zone = document.getElementById(`zone-${verb}`);
        const chips = zone.querySelectorAll('.chip');
        chips.forEach(chip => {
          totalPlaced++;
          const val = chip.innerText;
          if (validCollocations[verb].includes(val)) {
            chip.className = 'chip correct';
            correctCount++;
          } else {
            chip.className = 'chip incorrect';
          }
        });
      });

      const scoreBoard = document.getElementById('score-board');
      if (totalPlaced === 0) {
        scoreBoard.innerText = "Place some phrases into verb columns first!";
        scoreBoard.style.color = "var(--error)";
      } else {
        scoreBoard.innerText = `Score: ${correctCount} correct collocation(s) out of ${totalPlaced} placed!`;
        if (correctCount === totalPlaced && totalPlaced >= 15) {
          playAudio('success');
          scoreBoard.innerText += " Excellent work! Perfect score!";
          scoreBoard.style.color = "var(--success)";
        } else {
          playAudio('error');
          scoreBoard.style.color = "var(--text)";
        }
      }
    }

    function resetSorting() {
      selectedChip = null;
      initSorting();
    }

    function initSentences() {
      const container = document.getElementById('sentenceContainer');
      container.innerHTML = '';
      sentenceData.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = 'sentence-card';
        
        const parts = s.text.split('_____');
        const selectHTML = `
          <select class="gap-select" id="select-${idx}">
            <option value="">-- select phrase --</option>
            ${s.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
          </select>
        `;
        
        card.innerHTML = `${idx + 1}. ${parts[0]} ${selectHTML} ${parts[1] || ''}`;
        container.appendChild(card);
      });
    }

    function checkSentences() {
      let score = 0;
      sentenceData.forEach((s, idx) => {
        const sel = document.getElementById(`select-${idx}`);
        if (sel.value === s.answer) {
          sel.style.borderColor = "var(--success)";
          sel.style.backgroundColor = "#E8F8F0";
          score++;
        } else {
          sel.style.borderColor = "var(--error)";
          sel.style.backgroundColor = "#FDF2E9";
        }
      });
      const scoreBoard = document.getElementById('score-board');
      scoreBoard.innerText = `Sentence Quiz Score: ${score} / ${sentenceData.length}`;
      if (score === sentenceData.length) {
        playAudio('success');
      } else {
        playAudio('error');
      }
    }

    function resetSentences() {
      initSentences();
      document.getElementById('score-board').innerText = '';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tab === 'sorting') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('sorting-section').style.display = 'block';
        document.getElementById('sentences-section').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('sorting-section').style.display = 'none';
        document.getElementById('sentences-section').style.display = 'block';
      }
      document.getElementById('score-board').innerText = '';
    }

    // Initialize on load
    window.onload = () => {
      initSorting();
      initSentences();
    };
  </script>
</body>
</html>
