<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grammar Lab: Time Contrasts & Conditionals</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --success: #16a34a;
      --error: #dc2626;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 850px; width: 100%; background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

    header { text-align: center; margin-bottom: 24px; border-bottom: 2px solid var(--border); padding-bottom: 16px; }
    header h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 6px; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: 2px solid var(--border); background: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; color: var(--text-muted); }
    .tab-btn.active { border-color: var(--primary); background: #eef2ff; color: var(--primary); }

    .tip-box { background: #f0f9ff; border-left: 4px solid #0284c7; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9rem; line-height: 1.5; color: #0369a1; }
    .tip-box strong { color: #075985; }

    .exercise-section { display: none; }
    .exercise-section.active { display: block; }

    .dialogue-card, .sentence-card { background: #fafafa; border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; line-height: 1.8; font-size: 1rem; }
    .speaker { font-weight: bold; color: var(--primary); margin-right: 6px; }

    input[type="text"] {
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
      width: 140px;
      text-align: center;
    }
    input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
    input.correct { border-color: var(--success) !important; background-color: #f0fdf4; color: var(--success); font-weight: bold; }
    input.incorrect { border-color: var(--error) !important; background-color: #fef2f2; color: var(--error); }

    .hint-text { font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 4px; }

    .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }

    .score-board { font-size: 1.1rem; font-weight: 600; color: var(--text); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ Grammar Lab: Time & Conditionals</h1>
    <p>Practice time contrasts, modal verbs, and <em>if</em> clauses for A2 English learners.</p>
  </header>
