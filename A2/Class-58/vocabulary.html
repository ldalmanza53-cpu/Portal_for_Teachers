<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary: Street Performers</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #6d28d9;
      --secondary: #f59e0b;
      --bg: #f5f3ff;
      --card-bg: #ffffff;
      --text: #1e1b4b;
      --border: #ddd6fe;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #ede9fe;
      padding-bottom: 16px;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 1.75rem;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #6b7280;
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid var(--primary);
      background: none;
      color: var(--primary-dark);
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: white;
    }

    .word-bank-box {
      background: #ede9fe;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .word-bank-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-dark);
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .word-chip {
      background: white;
      border: 2px solid var(--primary);
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .picture-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .picture-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .card-label {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 8px;
      align-self: flex-start;
      color: var(--primary-dark);
    }

    .select-performer {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      background: white;
    }

    .select-performer.correct {
      border-color: var(--success) !important;
      background-color: #dcfce7 !important;
      color: var(--success) !important;
    }

    .select-performer.incorrect {
      border-color: var(--danger) !important;
      background-color: #fee2e2 !important;
      color: var(--danger) !important;
    }

    .custom-section {
      background: #fef3c7;
      border: 2px dashed var(--secondary);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .custom-section h3 {
      font-size: 1rem;
      color: #b45309;
      margin-bottom: 12px;
    }

    .custom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 500px) {
      .custom-grid {
        grid-template-columns: 1fr;
      }
    }

    .custom-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #fde68a;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }

    /* PARTE B SIMULADOR */
    .part-b-container {
      display: none;
    }

    .pair-card {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .pair-card h3 {
      font-size: 1rem;
      color: var(--primary-dark);
      margin-bottom: 12px;
    }

    .speech-bubble {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 1rem;
      line-height: 1.6;
    }

    #score-board {
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vocabulary: Street Performers</h1>
      <p class="subtitle">Identifica los tipos de artistas callejeros y practica conversaciones de nivel A2/B1.</p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('partA')">Parte A: Identificación de Imágenes</button>
      <button class="tab-btn" onclick="switchTab('partB')">Parte B: Simulador de Diálogo</button>
    </div>

    <!-- PARTE A: IDENTIFICACIÓN -->
    <div id="partA-section">
      <div class="word-bank-box">
        <div class="word-bank-title">Banco de Palabras</div>
        <div class="word-bank" id="wordBank"></div>
      </div>

      <div class="picture-grid" id="pictureGrid"></div>

      <div class="custom-section">
        <h3>Parte B: ¿Puedes pensar en 4 artistas callejeros más?</h3>
        <div class="custom-grid">
          <input type="text" class="custom-input" placeholder="1. e.g., a living statue">
          <input type="text" class="custom-input" placeholder="2. e.g., a puppeteer">
          <input type="text" class="custom-input" placeholder="3. e.g., a juggler">
          <input type="text" class="custom-input" placeholder="4. e.g., a busker / street musician">
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" onclick="checkPartA()">Verificar Respuestas</button>
        <button class="btn btn-secondary" onclick="resetPartA()">Reiniciar</button>
      </div>
    </div>

    <!-- PARTE B: SIMULADOR -->
    <div id="partB-section" class="part-b-container">
      <div class="pair-card">
        <h3>🗣️ Práctica de conversación en pareja (Pair Work)</h3>
        
        <label style="font-weight: 600; display: block; margin-bottom: 6px;">Selecciona un artista callejero:</label>
        <select class="select-performer" id="performerSelect" style="margin-bottom: 12px;">
          <option value="a magician">a magician</option>
          <option value="an acrobat">an acrobat</option>
          <option value="a clown">a clown</option>
          <option value="an accordion player">an accordion player</option>
          <option value="a dance troupe">a dance troupe</option>
          <option value="a balloon man">a balloon man</option>
          <option value="a living statue">a living statue</option>
        </select>

        <label style="font-weight: 600; display: block; margin-bottom: 6px;">Selecciona una ubicación:</label>
        <select class="select-performer" id="locationSelect" style="margin-bottom: 12px;">
          <option value="in the main square">in the main square</option>
          <option value="at the park">at the park</option>
          <option value="near the subway station">near the subway station</option>
        </select>

        <button class="btn btn-primary" style="width: 100%; margin-top: 8px;" onclick="generateDialogue()">Generar Diálogo</button>

        <div id="dialogueOutput" style="display: none;"></div>
      </div>
    </div>

    <div id="score-board"></div>
  </div>

  <script>
    const performers = [
      "an acrobat",
      "an accordion player",
      "a balloon man",
      "a clown",
      "a dance troupe",
      "a magician"
    ];

    const cardsData = [
      { id: 1, icon: "🤡", label: "Picture 1", correct: "a clown" },
      { id: 2, icon: "🎪", label: "Picture 2", correct: "an acrobat" },
      { id: 3, icon: "🪗", label: "Picture 3", correct: "an accordion player" },
      { id: 4, icon: "🎩", label: "Picture 4", correct: "a magician" },
      { id: 5, icon: "💃", label: "Picture 5", correct: "a dance troupe" },
      { id: 6, icon: "🎈", label: "Picture 6", correct: "a balloon man" }
    ];

    function playSound(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      if (type === 'success') {
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      }
    }

    function speakText(text, e) {
      if (e) e.stopPropagation();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderWordBank() {
      const bank = document.getElementById('wordBank');
      bank.innerHTML = '';
      performers.forEach(p => {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.innerHTML = `<span>${p}</span> <span onclick="speakText('${p}', event)">🔊</span>`;
        bank.appendChild(chip);
      });
    }

    function renderPictures() {
      const grid = document.getElementById('pictureGrid');
      grid.innerHTML = '';

      cardsData.forEach(card => {
        const div = document.createElement('div');
        div.className = 'card';

        let options = `<option value="">-- Choose option --</option>`;
        performers.forEach(p => {
          const isSelected = (card.id === 2 && p === card.correct) ? 'selected' : '';
          options += `<option value="${p}" ${isSelected}>${p}</option>`;
        });

        div.innerHTML = `
          <div class="card-icon">${card.icon}</div>
          <div class="card-label">${card.id}. ${card.label}</div>
          <select class="select-performer" id="select-${card.id}">${options}</select>
        `;
        grid.appendChild(div);
      });
    }

    function checkPartA() {
      let score = 0;

      cardsData.forEach(card => {
        const select = document.getElementById(`select-${card.id}`);
        if (select.value === card.correct) {
          select.className = 'select-performer correct';
          score++;
        } else {
          select.className = 'select-performer incorrect';
        }
      });

      const scoreBoard = document.getElementById('score-board');
      scoreBoard.innerText = `Puntuación: ${score} / 6 correctas!`;

      if (score === 6) {
        scoreBoard.style.color = "var(--success)";
        playSound('success');
      } else {
        scoreBoard.style.color = "var(--danger)";
        playSound('error');
      }
    }

    function resetPartA() {
      document.getElementById('score-board').innerText = '';
      renderPictures();
    }

    function generateDialogue() {
      const perf = document.getElementById('performerSelect').value;
      const loc = document.getElementById('locationSelect').value;
      const output = document.getElementById('dialogueOutput');

      output.style.display = 'block';
      output.className = 'speech-bubble';

      const scriptA = `Have you ever seen ${perf} ${loc}?`;
      const scriptB = `Yes, I have! It was really entertaining to watch.`;
      const fullText = `Speaker A: ${scriptA} ... Speaker B: ${scriptB}`;

      output.innerHTML = `
        <strong>💬 Conversación de práctica:</strong><br><br>
        <strong>A:</strong> ${scriptA}<br>
        <strong>B:</strong> ${scriptB}
        <br><br>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="speakText('${fullText.replace(/'/g, "\\'")}')">🔊 Escuchar diálogo</button>
      `;

      playSound('success');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'partA') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('partA-section').style.display = 'block';
        document.getElementById('partB-section').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('partA-section').style.display = 'none';
        document.getElementById('partB-section').style.display = 'block';
      }
      document.getElementById('score-board').innerText = '';
    }

    window.onload = () => {
      renderWordBank();
      renderPictures();
    };
  </script>
</body>
</html>
