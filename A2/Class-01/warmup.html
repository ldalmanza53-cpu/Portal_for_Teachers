<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Early Life Memory Box - A1 English App</title>
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #50E3C2;
      --accent: #FF6B6B;
      --bg: #F4F7FC;
      --card-bg: #FFFFFF;
      --text: #2C3E50;
      --text-muted: #7F8C8D;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      color: var(--primary);
      font-size: 2.2rem;
      margin-bottom: 5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Grid layout for 4 memory boxes */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 20px;
    }

    .memory-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border-top: 5px solid var(--primary);
      display: flex;
      flex-direction: column;
      justify: space-between;
      gap: 15px;
    }

    .memory-card:nth-child(2) { border-top-color: #F5A623; }
    .memory-card:nth-child(3) { border-top-color: #7ED321; }
    .memory-card:nth-child(4) { border-top-color: #9013FE; }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-selector {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .icon-option {
      font-size: 2rem;
      padding: 8px;
      border: 2px solid #E0E0E0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #FAF3EF;
      user-select: none;
    }

    .icon-option.selected {
      border-color: var(--primary);
      background-color: #E8F2FF;
      transform: scale(1.1);
    }

    .sentence-builder {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      background: #F8F9FA;
      padding: 12px;
      border-radius: 8px;
    }

    select, input[type="text"] {
      padding: 6px 10px;
      border: 1px solid #CCC;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary);
    }

    .verb-highlight {
      font-weight: bold;
      color: #D9534F;
    }

    .output-sentence {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-audio {
      background: var(--secondary);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-audio:hover {
      background: #39C2A4;
    }

    /* Action Buttons */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-secondary {
      background-color: #6C757D;
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    /* Print styling */
    @media print {
      body { background: white; padding: 0; }
      .controls, .icon-selector, .sentence-builder { display: none !important; }
      .memory-card { border: 1px solid #DDD; page-break-inside: avoid; }
      .btn-audio { display: none !important; }
    }
  </style>
</head>
<body>

  <header>
    <h1>📦 My Memory Box</h1>
    <p>Practice past tense verbs (<em>was, were, lived, had, played, loved</em>) and describe your childhood!</p>
  </header>

  <div class="container">
    <div class="memory-grid">

      <!-- Box 1: Where I Lived -->
      <div class="memory-card">
        <div class="card-title">1. Where I Lived</div>
        <div class="icon-selector" id="icons-1">
          <span class="icon-option selected" onclick="selectIcon(1, '🏡')">🏡</span>
          <span class="icon-option" onclick="selectIcon(1, '🏢')">🏢</span>
          <span class="icon-option" onclick="selectIcon(1, '🏞️')">🏞️</span>
          <span class="icon-option" onclick="selectIcon(1, '🌊')">🌊</span>
        </div>
        <div class="sentence-builder">
          When I <span class="verb-highlight">was</span> young, I
          <select id="verb-1" onchange="updateCard(1)">
            <option value="lived in">lived in</option>
            <option value="was in">was in</option>
          </select>
          <input type="text" id="input-1" placeholder="City or Country" value="London" oninput="updateCard(1)" />.
        </div>
        <div class="output-sentence">
          <span id="text-1">When I was young, I lived in London.</span>
          <button class="btn-audio" onclick="speakText(1)" title="Listen">🔊</button>
        </div>
      </div>

      <!-- Box 2: Favorite Toy / Game -->
      <div class="memory-card">
        <div class="card-title">2. My Favorite Toy / Game</div>
        <div class="icon-selector" id="icons-2">
          <span class="icon-option selected" onclick="selectIcon(2, '🧸')">🧸</span>
          <span class="icon-option" onclick="selectIcon(2, '⚽')">⚽</span>
          <span class="icon-option" onclick="selectIcon(2, '🎮')">🎮</span>
          <span class="icon-option" onclick="selectIcon(2, '🧩')">🧩</span>
        </div>
        <div class="sentence-builder">
          I
          <select id="verb-2" onchange="updateCard(2)">
            <option value="played with">played with</option>
            <option value="had">had</option>
          </select>
          <input type="text" id="input-2" placeholder="a toy or game" value="a teddy bear" oninput="updateCard(2)"
