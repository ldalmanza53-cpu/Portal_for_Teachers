<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary: Getting a job</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #0891b2;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 1.75rem;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid var(--primary);
      background: none;
      color: var(--primary);
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: white;
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .match-row {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .start-text {
      font-weight: 700;
      color: var(--primary-dark);
      min-width: 170px;
      font-size: 1rem;
    }

    .select-ending {
      flex-grow: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      background: white;
    }

    .select-ending.correct {
      border-color: var(--success) !important;
      background-color: #dcfce7 !important;
      color: var(--success) !important;
    }

    .select-ending.incorrect {
      border-color: var(--danger) !important;
      background-color: #fee2e2 !important;
      color: var(--danger) !important;
    }

    .custom-questions {
      background: #f0f9ff;
      border: 2px dashed var(--secondary);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .custom-questions h3 {
      font-size: 1rem;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .custom-input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }

    /* SIMULADOR PAIR WORK */
    .part-b-container {
      display: none;
    }

    .pair-card {
      background: #f8fafc;
      border-left: 4px solid var(--secondary);
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .pair-card h3 {
      font-size: 1rem;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .speech-bubble {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 1rem;
      line-height: 1.6;
    }

    #score-board {
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vocabulary: Getting a Job</h1>
      <p class="subtitle">Une las partes de las preguntas que realizaría un entrevistador de trabajo en un restaurante de comida rápida.</p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('partA')">Parte A: Emparejamiento</button>
      <button class="tab-btn" onclick="switchTab('partB')">Parte B: Simulador de Entrevista</button>
    </div>

    <!-- PARTE A: EMPAREJAMIENTO -->
    <div id="partA-section">
      <div class="match-list" id="matchList"></div>

      <div class="custom-questions">
        <h3>Añade 2 preguntas propias (Preguntas 7 y 8):</h3>
        <input type="text" class="custom-input" id="custom-7" placeholder="7. e.g., Do you have experience in customer service?">
        <input type="text" class="custom-input" id="custom-8" placeholder="8. e.g., Are you available to work on weekends?">
      </div>

      <div class="controls">
        <button class="btn btn-primary" onclick="checkMatching()">Verificar Respuestas</button>
        <button class="btn btn-secondary" onclick="resetMatching()">Reiniciar</button>
      </div>
    </div>

    <!-- PARTE B: SIMULADOR -->
    <div id="partB-section" class="part-b-container">
      <div class="pair-card">
        <h3>🗣️ Practica la entrevista de trabajo en parejas (Pair Work)</h3>
        
        <label for="questionSelect" style="font-weight: 600; display: block; margin-bottom: 6px;">Selecciona una pregunta del entrevistador:</label>
        <select class="select-ending" id="questionSelect" style="width: 100%; margin-bottom: 12px;">
          <option value="Where did you find out about this job?">1. Where did you find out about this job?</option>
          <option value="What are your qualifications?">2. What are your qualifications?</option>
          <option value="Why do you want to work here?">3. Why do you want to work here?</option>
          <option value="Do you like working with people?">4. Do you like working with people?</option>
          <option value="Do you get along well with children?">5. Do you get along well with children?</option>
          <option value="Are you good with money?">6. Are you good with money?</option>
        </select>

        <label for="answerInput" style="font-weight: 600; display: block; margin-bottom: 6px;">Escribe o selecciona tu respuesta:</label>
        <input type="text" class="custom-input" id="answerInput" value="I saw the job post online and I love working in customer service.">

        <button class="btn btn-primary" style="width: 100%; margin-top: 8px;" onclick="generateDialogue()">Generar Diálogo</button>

        <div id="dialogueOutput" style="display: none;"></div>
      </div>
    </div>

    <div id="score-board"></div>
  </div>

  <script>
    const matchData = [
      { id: 1, start: "1. Where did you", correct: "find out about this job?" },
      { id: 2, start: "2. What are your", correct: "qualifications?" },
      { id: 3, start: "3. Why do you", correct: "want to work here?" },
      { id: 4, start: "4. Do you like", correct: "working with people?" },
      { id: 5, start: "5. Do you get along", correct: "well with children?" },
      { id: 6, start: "6. Are you", correct: "good with money?" }
    ];

    const endings = [
      "want to work here?",
      "find out about this job?",
      "well with children?",
      "qualifications?",
      "good with money?",
      "working with people?"
    ];

    function playSound(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      if (type === 'success') {
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderMatching() {
      const list = document.getElementById('matchList');
      list.innerHTML = '';

      matchData.forEach(item => {
        const row = document.createElement('div');
        row.className = 'match-row';

        let options = `<option value="">-- Selecciona la continuación --</option>`;
        endings.forEach(end => {
          const isSelected = (item.id === 1 && end === item.correct) ? 'selected' : '';
          options += `<option value="${end}" ${isSelected}>${end}</option>`;
        });

        row.innerHTML = `
          <div class="start-text">${item.start}</div>
          <select class="select-ending" id="select-${item.id}">${options}</select>
          <button class="btn btn-secondary" style="padding: 6px 10px;" onclick="speakFullSentence(${item.id})">🔊</button>
        `;
        list.appendChild(row);
      });
    }

    function speakFullSentence(id) {
      const item = matchData.find(m => m.id === id);
      const val = document.getElementById(`select-${id}`).value;
      if (val) {
        const cleanStart = item.start.replace(/^\d+\.\s*/, '');
        speakText(`${cleanStart} ${val}`);
      }
    }

    function checkMatching() {
      let score = 0;

      matchData.forEach(item => {
        const select = document.getElementById(`select-${item.id}`);
        if (select.value === item.correct) {
          select.className = 'select-ending correct';
          score++;
        } else {
          select.className = 'select-ending incorrect';
        }
      });

      const scoreBoard = document.getElementById('score-board');
      scoreBoard.innerText = `Puntuación: ${score} / 6 correctas!`;

      if (score === 6) {
        scoreBoard.style.color = 'var(--success)';
        playSound('success');
      } else {
        scoreBoard.style.color = 'var(--danger)';
        playSound('error');
      }
    }

    function resetMatching() {
      document.getElementById('score-board').innerText = '';
      renderMatching();
    }

    function generateDialogue() {
      const q = document.getElementById('questionSelect').value;
      const a = document.getElementById('answerInput').value.trim();
      const output = document.getElementById('dialogueOutput');

      output.style.display = 'block';
      output.className = 'speech-bubble';

      const fullText = `Interviewer: ${q} ... Candidate: ${a}`;

      output.innerHTML = `
        <strong>💬 Diálogo de Entrevista:</strong><br><br>
        <strong>Interviewer:</strong> ${q}<br>
        <strong>Candidate:</strong> ${a}
        <br><br>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="speakText('${fullText.replace(/'/g, "\\'")}')">🔊 Escuchar conversación</button>
      `;

      playSound('success');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'partA') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('partA-section').style.display = 'block';
        document.getElementById('partB-section').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('partA-section').style.display = 'none';
        document.getElementById('partB-section').style.display = 'block';
      }
      document.getElementById('score-board').innerText = '';
    }

    window.onload = () => {
      renderMatching();
    };
  </script>
</body>
</html>
