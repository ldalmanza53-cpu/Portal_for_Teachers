<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerunds & Short Responses Practice</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success: #16a34a;
      --error: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 850px; width: 100%; background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

    header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 16px; }
    header h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 6px; }
    header p { color: #64748b; font-size: 0.95rem; }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; border: 2px solid var(--border); background: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; color: #64748b; }
    .tab-btn.active { border-color: var(--primary); background: #e0f2fe; color: var(--primary); }

    .rule-box { background: #f0f9ff; border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 0.88rem; line-height: 1.6; color: #0369a1; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .q-card { background: #fafafa; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .q-statement { font-weight: 600; font-size: 1.05rem; margin-bottom: 10px; color: #1e293b; }
    .q-statement select { padding: 4px 8px; font-size: 0.95rem; border-radius: 6px; border: 1px solid var(--border); }

    .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
    .opt-btn { background: #ffffff; border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; text-align: center; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
    .opt-btn:hover { border-color: var(--primary); color: var(--primary); }
    .opt-btn.selected { background: var(--primary); color: white; border-color: var(--primary); }
    .opt-btn.correct { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
    .opt-btn.incorrect { background: var(--error) !important; color: white !important; border-color: var(--error) !important; }

    .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: var(--primary-hover); }
    .btn-sec { background: #64748b; }

    .score { font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Gerunds & Short Responses</h1>
    <p>A2 Grammar: Expressing Likes, Dislikes & Preferences</p>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('part-a')">1. Matching & Agreement</button>
    <button class="tab-btn" onclick="switchTab('part-b')">2. Agreement Quiz</button>
  </div>

  <div class="rule-box">
    <strong>Grammar Rule:</strong><br/>
    • <strong>Affirmative (+):</strong> "I'm good at..." → <em>So am I.</em> | "I love..." → <em>So do I.</em>[cite: 3]<br/>
    • <strong>Negative (-):</strong> "I don't mind..." → <em>Neither do I.</em> | "I can't stand..." → <em>Neither can I.</em>[cite: 3]
  </div>

  <!-- Tab 1: Match & Agree -->
  <div id="part-a" class="tab-content active">
    <div id="matchingContainer"></div>
  </div>

  <!-- Tab 2: Agreement Quiz -->
  <div id="part-b" class="tab-content">
    <div id="quizContainer"></div>
  </div>

  <div class="controls">
    <div class="score">Score: <span id="scoreVal">0</span> / <span id="totalVal">0</span></div>
    <div>
      <button class="btn btn-sec" onclick="resetAll()">Reset</button>
      <button class="btn" onclick="checkAnswers()">Check Answers</button>
    </div>
  </div>
</div>

<script>
  const partAData = [
    { start: "I can't stand", targetVerb: "can", isNeg: true, choices: ["sitting in long meetings", "speaking in public", "managing my time"], correctEnding: "sitting in long meetings", correctResponse: "Neither can I." },
    { start: "I'm not very good at", targetVerb: "am", isNeg: true, choices: ["speaking in public", "working alone", "solving problems"], correctEnding: "speaking in public", correctResponse: "Neither am I." },
    { start: "I'm good at", targetVerb: "am", isNeg: false, choices: ["managing my time", "working the night shift", "sitting in meetings"], correctEnding: "managing my time", correctResponse: "So am I." },
    { start: "I don't like", targetVerb: "do", isNeg: true, choices: ["working the night shift", "learning foreign languages", "managing time"], correctEnding: "working the night shift", correctResponse: "Neither do I." },
    { start: "I hate", targetVerb: "do", isNeg: false, choices: ["working on weekends", "working alone", "speaking in public"], correctEnding: "working on weekends", correctResponse: "So do I." },
    { start: "I'm interested in", targetVerb: "am", isNeg: false, choices: ["learning foreign languages", "working the night shift", "sitting in long meetings"], correctEnding: "learning foreign languages", correctResponse: "So am I." },
    { start: "I don't mind", targetVerb: "do", isNeg: true, choices: ["working alone", "managing my time", "speaking in public"], correctEnding: "working alone", correctResponse: "Neither do I." },
    { start: "I enjoy", targetVerb: "do", isNeg: false, choices: ["solving other people's problems", "working the night shift", "sitting in meetings"], correctEnding: "solving other people's problems", correctResponse: "So do I." }
  ];

  function renderPartA() {
    const container = document.getElementById('matchingContainer');
    container.innerHTML = '';

    partAData.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'q-card';
      
      let selectHtml = `<select id="ending-${idx}"><option value="">-- Choose ending --</option>`;
      item.choices.forEach(c => selectHtml += `<option value="${c}">${c}</option>`);
      selectHtml += `</select>`;

      card.innerHTML = `
        <div class="q-statement">${idx + 1}. ${item.start} ${selectHtml}.</div>
        <div style="font-size:0.9rem; color:#64748b; margin-bottom:6px;">Select the matching agreement:</div>
        <div class="options-grid" id="opts-${idx}">
          ${['So do I.', 'Neither do I.', 'So am I.', 'Neither am I.', 'Neither can I.'].map(resp => `
            <div class="opt-btn" onclick="selectOpt(${idx}, '${resp}', this)">${resp}</div>
          `).join('')}
        </div>
      `;
      container.appendChild(card);
    });
  }

  function renderPartB() {
    const container = document.getElementById('quizContainer');
    container.innerHTML = '';

    const quizQuestions = [
      { stmt: "I love playing video games.", target: "So do I." },
      { stmt: "I'm not good at selling things.", target: "Neither am I." },
      { stmt: "I don't mind working evenings.", target: "Neither do I." },
      { stmt: "I'm interested in joining a gym.", target: "So am I." },
      { stmt: "I can't stand commuting in heavy traffic.", target: "Neither can I." }
    ];

    quizQuestions.forEach((q, idx) => {
      const card = document.createElement('div');
      card.className = 'q-card';
      card.innerHTML = `
        <div class="q-statement">A: "${q.stmt}"</div>
        <div style="font-size:0.9rem; color:#64748b; margin-bottom:6px;">Select the correct response to AGREE:</div>
        <div class="options-grid" id="qopts-${idx}">
          ${['So do I.', 'Neither do I.', 'So am I.', 'Neither am I.', 'Neither can I.'].map(resp => `
            <div class="opt-btn" onclick="selectQuizOpt(${idx}, '${resp}', '${q.target}', this)">${resp}</div>
          `).join('')}
        </div>
      `;
      container.appendChild(card);
    });
  }

  const selectedAnswersA = {};
  function selectOpt(cardIdx, val, btnEl) {
    const parent = document.getElementById(`opts-${cardIdx}`);
    parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');
    selectedAnswersA[cardIdx] = val;
  }

  const selectedAnswersB = {};
  function selectQuizOpt(cardIdx, val, target, btnEl) {
    const parent = document.getElementById(`qopts-${cardIdx}`);
    parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
    btnEl.classList.add('selected');
    selectedAnswersB[cardIdx] = { chosen: val, target: target };
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById(tabId).classList.add('active');
    updateScoreDisplay();
  }

  function checkAnswers() {
    let score = 0;
    let total = 0;

    const activeTab = document.querySelector('.tab-content.active').id;

    if (activeTab === 'part-a') {
      partAData.forEach((item, idx) => {
        total++;
        const endVal = document.getElementById(`ending-${idx}`).value;
        const respVal = selectedAnswersA[idx];
        const parent = document.getElementById(`opts-${idx}`);

        let isEndingCorrect = (endVal === item.correctEnding);
        let isRespCorrect = (respVal === item.correctResponse);

        parent.querySelectorAll('.opt-btn').forEach(btn => {
          if (btn.textContent.trim() === item.correctResponse) {
            btn.classList.add('correct');
          } else if (btn.classList.contains('selected') && !isRespCorrect) {
            btn.classList.add('incorrect');
          }
        });

        if (isEndingCorrect && isRespCorrect) score++;
      });
    } else {
      Object.keys(selectedAnswersB).forEach(idx => {
        total = 5;
        const item = selectedAnswersB[idx];
        const parent = document.getElementById(`qopts-${idx}`);

        parent.querySelectorAll('.opt-btn').forEach(btn => {
          if (btn.textContent.trim() === item.target) {
            btn.classList.add('correct');
          } else if (btn.classList.contains('selected') && item.chosen !== item.target) {
            btn.classList.add('incorrect');
          }
        });

        if (item.chosen === item.target) score++;
      });
    }

    document.getElementById('scoreVal').textContent = score;
    document.getElementById('totalVal').textContent = total;
  }

  function resetAll() {
    selectedAnswersA = {};
    selectedAnswersB = {};
    renderPartA();
    renderPartB();
    updateScoreDisplay();
  }

  function updateScoreDisplay() {
    const activeTab = document.querySelector('.tab-content.active').id;
    const total = (activeTab === 'part-a') ? partAData.length : 5;
    document.getElementById('scoreVal').textContent = '0';
    document.getElementById('totalVal').textContent = total;
  }

  window.onload = () => {
    renderPartA();
    renderPartB();
    updateScoreDisplay();
  };
</script>

</body>
</html>
