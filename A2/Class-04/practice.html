<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 English: Personal History & Background Interview</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --secondary: #0d9488;
      --bg: #f0f9ff;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #bae6fd;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #e0f2fe;
      padding-bottom: 16px;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 1.75rem;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid var(--primary);
      background: none;
      color: var(--primary);
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* WORD BANK */
    .word-bank-box {
      background: #e0f2fe;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .word-bank-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-dark);
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .word-chip {
      background: white;
      border: 1px solid var(--primary);
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* QUESTION LIST */
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .question-row {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .q-number {
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 1rem;
      min-width: 24px;
    }

    .q-prompt-start {
      font-weight: 600;
      font-size: 0.95rem;
      color: #334155;
    }

    .select-phrase {
      flex-grow: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      background: white;
    }

    .select-phrase.correct {
      border-color: var(--success) !important;
      background-color: #dcfce7 !important;
      color: var(--success) !important;
    }

    .select-phrase.incorrect {
      border-color: var(--danger) !important;
      background-color: #fee2e2 !important;
      color: var(--danger) !important;
    }

    .custom-box {
      background: #f0fdf4;
      border: 2px dashed var(--secondary);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .custom-box h3 {
      font-size: 1rem;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .custom-input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 10px;
      background: white;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }

    /* PART B STYLES */
    .part-b-container {
      display: none;
    }

    .pair-card {
      background: #f8fafc;
      border-left: 4px solid var(--secondary);
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .pair-card h3 {
      font-size: 1rem;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .speech-bubble {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 1rem;
      line-height: 1.6;
    }

    #score-board {
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Grammar Practice: Asking About Background</h1>
      <p class="subtitle">Complete the interview questions, create your own, and practice speaking with a partner.</p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('partA')">Part A: Sentence Completion</button>
      <button class="tab-btn" onclick="switchTab('partB')">Part B: Pair Work Interview</button>
    </div>

    <!-- PART A SECTION -->
    <div id="partA-section">
      <div class="word-bank-box">
        <div class="word-bank-title">Phrase Bank</div>
        <div class="word-bank" id="wordBank"></div>
      </div>

      <div class="question-list" id="questionList"></div>

      <div class="custom-box">
        <h3>Add two questions of your own (Lines 7 & 8):</h3>
        <input type="text" class="custom-input" id="custom-7" value="7. What was your favorite subject in high school?">
        <input type="text" class="custom-input" id="custom-8" value="8. What hobbies did you have when you were younger?">
      </div>

      <div class="controls">
        <button class="btn btn-primary" onclick="checkAnswers()">Check Answers</button>
        <button class="btn btn-secondary" onclick="resetExercise()">Reset</button>
      </div>
    </div>

    <!-- PART B SECTION -->
    <div id="partB-section" class="part-b-container">
      <div class="pair-card">
        <h3>🗣️ Pair Work Interview Simulator</h3>
        
        <label for="questionSelect" style="font-weight: 600; display: block; margin-bottom: 6px;">Select Question to Ask:</label>
        <select class="select-phrase" id="questionSelect" style="width: 100%; margin-bottom: 12px;" onchange="updateSampleAnswer()">
          <option value="1">1. Where were you born?</option>
          <option value="2">2. How many people are in your family?</option>
          <option value="3">3. Did you play any sports in high school?</option>
          <option value="4">4. Where did you go to high school?</option>
          <option value="5">5. Did you study English in high school?</option>
          <option value="6">6. Did you work part-time after school?</option>
          <option value="7">7. Custom Question 1</option>
          <option value="8">8. Custom Question 2</option>
        </select>

        <label for="answerInput" style="font-weight: 600; display: block; margin-bottom: 6px;">Answer (Student B):</label>
        <input type="text" class="custom-input" id="answerInput" value="I was born in Chicago, Illinois.">

        <button class="btn btn-primary" style="width: 100%; margin-top: 8px;" onclick="generateDialogue()">Generate & Listen Dialogue</button>

        <div id="dialogueOutput" style="display: none;"></div>
      </div>
    </div>

    <div id="score-board"></div>
  </div>

  <script>
    const phrases = [
      "any sports in high school",
      "English in high school",
      "go to high school",
      "were you born",
      "part-time after school",
      "people are in your family"
    ];

    const questionsData = [
      { id: 1, start: "Where", correct: "were you born" },
      { id: 2, start: "How many", correct: "people are in your family" },
      { id: 3, start: "Did you play", correct: "any sports in high school" },
      { id: 4, start: "Where did you", correct: "go to high school" },
      { id: 5, start: "Did you study", correct: "English in high school" },
      { id: 6, start: "Did you work", correct: "part-time after school" }
    ];

    const sampleAnswers = {
      1: "I was born in Chicago, Illinois.",
      2: "There are four people in my family: my parents, my sister, and me.",
      3: "Yes, I played basketball and ran track.",
      4: "I went to Oak Park High School.",
      5: "Yes, I studied English for three years.",
      6: "No, I didn't work. I focused on my studies.",
      7: "My favorite subject was history.",
      8: "I used to collect comic books and play guitar."
    };

    function playSound(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      if (type === 'success') {
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderWordBank() {
      const bank = document.getElementById('wordBank');
      bank.innerHTML = '';
      phrases.forEach(p => {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.innerHTML = `<span>${p}</span> <span style="cursor:pointer;" onclick="speakText('${p}')">🔊</span>`;
        bank.appendChild(chip);
      });
    }

    function renderQuestions() {
      const list = document.getElementById('questionList');
      list.innerHTML = '';

      questionsData.forEach(q => {
        const row = document.createElement('div');
        row.className = 'question-row';

        let options = `<option value="">-- Choose phrase --</option>`;
        phrases.forEach(p => {
          const isSelected = (q.id === 1 && p === q.correct) ? 'selected' : '';
          options += `<option value="${p}" ${isSelected}>${p}</option>`;
        });

        row.innerHTML = `
          <div class="q-number">${q.id}.</div>
          <div class="q-prompt-start">${q.start}</div>
          <select class="select-phrase" id="select-${q.id}">${options}</select>
          <span class="q-prompt-start">?</span>
          <button class="btn btn-secondary" style="padding: 6px 10px;" onclick="speakQuestion(${q.id})">🔊</button>
        `;
        list.appendChild(row);
      });
    }

    function speakQuestion(id) {
      const q = questionsData.find(item => item.id === id);
      const val = document.getElementById(`select-${id}`).value;
      if (val) {
        speakText(`${q.start} ${val}?`);
      }
    }

    function checkAnswers() {
      let score = 0;

      questionsData.forEach(q => {
        const select = document.getElementById(`select-${q.id}`);
        if (select.value === q.correct) {
          select.className = 'select-phrase correct';
          score++;
        } else {
          select.className = 'select-phrase incorrect';
        }
      });

      const scoreBoard = document.getElementById('score-board');
      scoreBoard.innerText = `Score: ${score} / 6 correct!`;

      if (score === 6) {
        scoreBoard.style.color = "var(--success)";
        playSound('success');
      } else {
        scoreBoard.style.color = "var(--danger)";
        playSound('error');
      }
    }

    function resetExercise() {
      document.getElementById('score-board').innerText = '';
      renderQuestions();
    }

    function updateSampleAnswer() {
      const qVal = document.getElementById('questionSelect').value;
      const answerInput = document.getElementById('answerInput');
      if (qVal <= 6) {
        answerInput.value = sampleAnswers[qVal];
      } else if (qVal == 7) {
        answerInput.value = "My favorite subject was history.";
      } else {
        answerInput.value = "I used to collect comic books.";
      }
    }

    function generateDialogue() {
      const qVal = document.getElementById('questionSelect').value;
      let questionText = "";

      if (qVal <= 6) {
        const qData = questionsData.find(item => item.id == qVal);
        const selectedVal = document.getElementById(`select-${qVal}`).value || qData.correct;
        questionText = `${qData.start} ${selectedVal}?`;
      } else if (qVal == 7) {
        questionText = document.getElementById('custom-7').value;
      } else {
        questionText = document.getElementById('custom-8').value;
      }

      const answerText = document.getElementById('answerInput').value;
      const output = document.getElementById('dialogueOutput');

      output.style.display = 'block';
      output.className = 'speech-bubble';

      const fullScript = `Student A asks: ${questionText} ... Student B answers: ${answerText}`;

      output.innerHTML = `
        <strong>💬 Interview Dialogue:</strong><br><br>
        <strong>Student A:</strong> ${questionText}<br>
        <strong>Student B:</strong> ${answerText}
        <br><br>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="speakText('${fullScript.replace(/'/g, "\\'")}')">🔊 Listen to Dialogue</button>
      `;

      playSound('success');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'partA') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('partA-section').style.display = 'block';
        document.getElementById('partB-section').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('partA-section').style.display = 'none';
        document.getElementById('partB-section').style.display = 'block';
        updateSampleAnswer();
      }
      document.getElementById('score-board').innerText = '';
    }

    window.onload = () => {
      renderWordBank();
      renderQuestions();
    };
  </script>
</body>
</html>
