<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Master: Plans, Requests & Apologies</title>
  <style>
    :root {
      --primary: #0284C7;
      --primary-dark: #0369A1;
      --secondary: #0D9488;
      --accent: #F59E0B;
      --danger: #EF4444;
      --success: #10B981;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 850px;
    }

    header h1 {
      color: var(--primary);
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 900px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      padding: 12px 20px;
      border: none;
      background: #E2E8F0;
      color: var(--text);
      font-weight: 600;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .tab-content {
      display: none;
      background: var(--card-bg);
      padding: 28px;
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
    }

    .tab-content.active {
      display: block;
    }

    h2 {
      color: var(--primary);
      font-size: 1.4rem;
      margin-bottom: 18px;
      border-bottom: 2px solid #F1F5F9;
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .phrase-card {
      background: #F8FAFC;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      transition: border-color 0.2s;
    }

    .phrase-card:hover {
      border-color: var(--primary);
    }

    .phrase-category {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .cat-plan { background: #E0F2FE; color: #0369A1; }
    .cat-request { background: #FEF3C7; color: #B45309; }
    .cat-apology { background: #FEE2E2; color: #991B1B; }
    .cat-excuse { background: #F3E8FF; color: #6B21A8; }
    .cat-response { background: #D1FAE5; color: #065F46; }

    .phrase-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 6px;
      color: var(--text);
    }

    .phrase-list {
      list-style: none;
      margin-top: 8px;
    }

    .phrase-item {
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
    }

    .phrase-item:last-child {
      border-bottom: none;
    }

    .audio-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background-color 0.2s;
      flex-shrink: 0;
    }

    .audio-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.1);
    }

    /* Game Tab Styles */
    .game-status-bar {
      display: flex;
      justify-content: space-between;
      background: #F1F5F9;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .scenario-card {
      background: #F0F9FF;
      border: 2px solid #BAE6FD;
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }

    .scenario-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .scenario-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-dark);
    }

    .scenario-desc {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .btn-option {
      padding: 14px 18px;
      border: 2px solid var(--border);
      background: white;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-option:hover {
      border-color: var(--primary);
      background: #F8FAFC;
    }

    .feedback-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: var(--radius);
      display: none;
      font-weight: 600;
    }

    .feedback-correct {
      background: #D1FAE5;
      color: #065F46;
      border: 1px solid #A7F3D0;
    }

    .feedback-wrong {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
    }

    /* Builder Tab */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      background: white;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary);
    }

    .dialogue-preview {
      background: #0F172A;
      color: white;
      padding: 24px;
      border-radius: var(--radius);
      margin-top: 20px;
    }

    .chat-bubble {
      background: #1E293B;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 12px;
      line-height: 1.5;
      font-size: 1rem;
    }

    .chat-bubble.traveler {
      border-left: 4px solid #38BDF8;
    }

    .chat-bubble.agent {
      border-left: 4px solid #34D399;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 24px;
      font-weight: 700;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    /* Quiz Tab */
    .quiz-card {
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .quiz-card p {
      font-weight: 700;
      margin-bottom: 12px;
    }

    .quiz-opt {
      display: block;
      padding: 10px 14px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .quiz-opt:hover {
      background: #F0F9FF;
    }

    /* Boarding Pass Certificate */
    .boarding-pass {
      display: none;
      background: #FFFFFF;
      border: 2px dashed var(--primary);
      border-radius: 16px;
      padding: 28px;
      margin-top: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      position: relative;
      overflow: hidden;
    }

    .bp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .bp-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .bp-body {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .bp-field label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      display: block;
    }

    .bp-field span {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    @media print {
      .nav-tabs, header, .btn-primary, .audio-btn { display: none !important; }
      body { background: white; padding: 0; }
      .tab-content { display: block !important; box-shadow: none; border: none; }
      .boarding-pass { display: block !important; border: 2px solid #000; }
    }
  </style>
</head>
<body>

  <header>
    <h1>✈️️ Travel Master</h1>
    <p>Practice Vacation Plans, Requests, Apologies & Excuses (Level A1)</p>
  </header>
