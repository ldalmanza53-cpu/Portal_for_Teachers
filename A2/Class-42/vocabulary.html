<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 Word Power: Personality Traits</title>
  <style>
    :root {
      --primary: #8E44AD;
      --primary-dark: #712693;
      --positive: #2ECC71;
      --negative: #E74C3C;
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text: #2C3E50;
      --border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 15px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    p.instructions {
      color: #666;
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid var(--primary);
      background: none;
      color: var(--primary);
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: white;
    }

    .word-bank {
      background: #F3E8FF;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      min-height: 90px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .chip {
      background: white;
      border: 2px solid var(--primary);
      color: var(--primary-dark);
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, background-color 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .chip:hover {
      transform: translateY(-2px);
      background-color: #F8F0FC;
    }

    .chip.selected {
      background: var(--primary);
      color: white;
      transform: scale(1.05);
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 25px;
    }

    @media (max-width: 600px) {
      .category-grid {
        grid-template-columns: 1fr;
      }
    }

    .category-column {
      background: #FAFAFA;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .category-column.positive-col {
      border-color: rgba(46, 204, 113, 0.4);
      background: #F4FBF7;
    }

    .category-column.negative-col {
      border-color: rgba(231, 76, 60, 0.4);
      background: #FDF6F5;
    }

    .category-header {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .positive-col .category-header { color: #27AE60; }
    .negative-col .category-header { color: #C0392B; }

    .drop-zone {
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .chip.correct {
      background-color: #E8F8F0;
      border-color: var(--positive);
      color: #27AE60;
    }

    .chip.incorrect {
      background-color: #FDF2E9;
      border-color: var(--negative);
      color: var(--negative);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #E0E0E0; color: #333; }
    .btn-secondary:hover { background: #D0D0D0; }

    .sentence-quiz {
      display: none;
    }

    .sentence-card {
      background: #FAFAFA;
      border-left: 4px solid var(--primary);
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 4px;
      font-size: 1.05rem;
    }

    select.gap-select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 1rem;
      background: white;
      color: var(--text);
    }

    #score-board {
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 15px;
      color: var(--primary-dark);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Word Power: Personality Traits</h1>
      <p class="instructions">Classify each adjective as Positive (P) or Negative (N). Click a word, then click a category column!</p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('sorting')">Part A: Trait Sorting</button>
      <button class="tab-btn" onclick="switchTab('sentences')">Part B: Sentence Practice</button>
    </div>

    <!-- PART A: SORTING -->
    <div id="sorting-section">
      <div class="word-bank" id="wordBank">
        <!-- Adjective chips populated here -->
      </div>

      <div class="category-grid">
        <div class="category-column positive-col" onclick="placeSelected('P')">
          <div class="category-header"> Positive Traits (P)</div>
          <div class="drop-zone" id="zone-P"></div>
        </div>
        <div class="category-column negative-col" onclick="placeSelected('N')">
          <div class="category-header"> Negative Traits (N)</div>
          <div class="drop-zone" id="zone-N"></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" onclick="checkSorting()">Check Answers</button>
        <button class="btn btn-secondary" onclick="resetSorting()">Reset</button>
      </div>
    </div>

    <!-- PART B: SENTENCE PRACTICE -->
    <div id="sentences-section" class="sentence-quiz">
      <div id="sentenceContainer"></div>
      <div class="controls">
        <button class="btn btn-primary" onclick="checkSentences()">Check Sentences</button>
        <button class="btn btn-secondary" onclick="resetSentences()">Reset Sentences</button>
      </div>
    </div>

    <div id="score-board"></div>
  </div>

  <script>
    // Trait data directly from the exercise
    const traitData = {
      P: ["creative", "efficient", "generous", "hardworking", "level-headed", "punctual", "reliable"],
      N: ["critical", "disorganized", "forgetful", "impatient", "moody", "short-tempered", "strict"]
    };

    const sentenceData = [
      { text: "Maria always arrives at 8:00 AM sharp. She is extremely _____.", options: ["punctual", "disorganized", "forgetful"], answer: "punctual" },
      { text: "My brother loses his temper very quickly when driving. He is _____.", options: ["short-tempered", "creative", "reliable"], answer: "short-tempered" },
      { text: "You can trust James to finish any job on time. He is very _____.", options: ["reliable", "moody", "impatient"], answer: "reliable" },
      { text: "She stays calm and logical even during emergencies. She is _____.", options: ["level-headed", "strict", "critical"], answer: "level-headed" },
      { text: "He constantly leaves his papers everywhere and can't find anything. He is _____.", options: ["disorganized", "efficient", "generous"], answer: "disorganized" },
      { text: "Our art teacher comes up with amazing new ideas every day. She is so _____.", options: ["creative", "forgetful", "impatient"], answer: "creative" }
    ];

    let selectedChip = null;

    function playAudio(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      if (type === 'success') {
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      }
    }

    function initSorting() {
      const bank = document.getElementById('wordBank');
      bank.innerHTML = '';
      document.querySelectorAll('.drop-zone').forEach(z => z.innerHTML = '');
      document.getElementById('score-board').innerText = '';

      const allTraits = [...traitData.P, ...traitData.N].sort(() => Math.random() - 0.5);
      allTraits.forEach(word => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerText = word;
        chip.onclick = (e) => {
          e.stopPropagation();
          selectChip(chip);
        };
        bank.appendChild(chip);
      });
    }

    function selectChip(chip) {
      if (selectedChip) selectedChip.classList.remove('selected');
      if (selectedChip === chip) {
        selectedChip = null;
        return;
      }
      selectedChip = chip;
      selectedChip.classList.add('selected');
    }

    function placeSelected(category) {
      if (!selectedChip) return;
      const zone = document.getElementById(`zone-${category}`);
      selectedChip.classList.remove('selected', 'correct', 'incorrect');
      zone.appendChild(selectedChip);
      selectedChip = null;
    }

    document.getElementById('wordBank').onclick = () => {
      if (selectedChip) {
        selectedChip.classList.remove('selected', 'correct', 'incorrect');
        document.getElementById('wordBank').appendChild(selectedChip);
        selectedChip = null;
      }
    };

    function checkSorting() {
      let totalPlaced = 0;
      let correctCount = 0;

      ['P', 'N'].forEach(cat => {
        const zone = document.getElementById(`zone-${cat}`);
        const chips = zone.querySelectorAll('.chip');
        chips.forEach(chip => {
          totalPlaced++;
          const val = chip.innerText;
          if (traitData[cat].includes(val)) {
            chip.className = 'chip correct';
            correctCount++;
          } else {
            chip.className = 'chip incorrect';
          }
        });
      });

      const scoreBoard = document.getElementById('score-board');
      if (totalPlaced === 0) {
        scoreBoard.innerText = "Place some traits into the categories first!";
        scoreBoard.style.color = "var(--negative)";
      } else {
        scoreBoard.innerText = `Score: ${correctCount} correct out of ${totalPlaced} placed!`;
        if (correctCount === totalPlaced && totalPlaced === 14) {
          playAudio('success');
          scoreBoard.innerText += " Fantastic! All 14 personality traits categorized correctly!";
          scoreBoard.style.color = "var(--positive)";
        } else {
          playAudio('error');
          scoreBoard.style.color = "var(--text)";
        }
      }
    }

    function resetSorting() {
      selectedChip = null;
      initSorting();
    }

    function initSentences() {
      const container = document.getElementById('sentenceContainer');
      container.innerHTML = '';
      sentenceData.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = 'sentence-card';
        
        const parts = s.text.split('_____');
        const selectHTML = `
          <select class="gap-select" id="select-${idx}">
            <option value="">-- select adjective --</option>
            ${s.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
          </select>
        `;
        
        card.innerHTML = `${idx + 1}. ${parts[0]} ${selectHTML} ${parts[1] || ''}`;
        container.appendChild(card);
      });
    }

    function checkSentences() {
      let score = 0;
      sentenceData.forEach((s, idx) => {
        const sel = document.getElementById(`select-${idx}`);
        if (sel.value === s.answer) {
          sel.style.borderColor = "var(--positive)";
          sel.style.backgroundColor = "#E8F8F0";
          score++;
        } else {
          sel.style.borderColor = "var(--negative)";
          sel.style.backgroundColor = "#FDF2E9";
        }
      });
      const scoreBoard = document.getElementById('score-board');
      scoreBoard.innerText = `Sentence Quiz Score: ${score} / ${sentenceData.length}`;
      if (score === sentenceData.length) {
        playAudio('success');
      } else {
        playAudio('error');
      }
    }

    function resetSentences() {
      initSentences();
      document.getElementById('score-board').innerText = '';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tab === 'sorting') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('sorting-section').style.display = 'block';
        document.getElementById('sentences-section').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('sorting-section').style.display = 'none';
        document.getElementById('sentences-section').style.display = 'block';
      }
      document.getElementById('score-board').innerText = '';
    }

    window.onload = () => {
      initSorting();
      initSentences();
    };
  </script>
</body>
</html>
