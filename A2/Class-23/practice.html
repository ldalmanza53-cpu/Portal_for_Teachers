<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 English: Two-Part Verbs & Household Requests</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #0d9488;
      --accent: #8b5cf6;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
    }

    .unit-tag {
      display: inline-block;
      background: #dbeafe;
      color: var(--primary-dark);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 1.75rem;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 18px;
      border: 2px solid var(--primary);
      background: none;
      color: var(--primary);
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: white;
    }

    .grammar-card {
      background: #f0f9ff;
      border: 2px solid #bae6fd;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .grammar-card h2 {
      font-size: 1.1rem;
      color: var(--primary-dark);
      margin-bottom: 10px;
    }

    .grammar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
      font-size: 0.9rem;
    }

    .grammar-box {
      background: white;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e0f2fe;
    }

    .grammar-box strong {
      color: var(--primary-dark);
      display: block;
      margin-bottom: 4px;
    }

    .highlight {
      font-weight: 700;
      color: var(--primary-dark);
      background: #e0f2fe;
      padding: 2px 6px;
      border-radius: 4px;
    }
