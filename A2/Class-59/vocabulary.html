      const playSound = (type) => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
          } else if (type === 'incorrect') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
            osc.start();
            osc.stop(ctx.currentTime + 0.25);
          } else if (type === 'chime') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
          }
        } catch(e) {
          console.log('Audio disabled or unsupported');
        }
      };

                    <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-white">4. Oral Delivery & Fluency</span>
                        <span class="text-xs font-mono text-cyan-400 font-bold">{rubricScores.oralDelivery} / 4</span>
                      </div>
                      <p class="text-[11px] text-slate-400">Clear pronunciation, natural pacing, and confident delivery.</p>
                      <div class="flex items-center gap-2 pt-1">
                        {[1, 2, 3, 4].map(s => (
                          <button 
                            key={s} 
                            onClick={() => setRubricScores({ ...rubricScores, oralDelivery: s })}
                            class={`text-lg transition-transform hover:scale-125 ${s <= rubricScores.oralDelivery ? 'text-amber-400' : 'text-slate-700'}`}>
                            <i class="fa-solid fa-star"></i>
                          </button>
                        ))}
                      </div>
                    </div>

                  </div>

                  {/* Auditor Notes Textpad */}
                  <div class="space-y-2">
                    <label class="text-xs font-mono text-slate-400 block">Auditor Observation Notes:</label>
                    <textarea 
                      rows="3"
                      value={auditorNotes}
                      onChange={(e) => setAuditorNotes(e.target.value)}
                      placeholder="Write constructive notes for your peer..."
                      class="w-full bg-slate-950 text-slate-200 p-3 rounded-xl border border-slate-800 focus:outline-none focus:border-cyan-500 text-xs font-mono">
                    </textarea>
                  </div>
                </section>

                {/* TEACHER SUMMARY EXPORTER */}
                <section class="glass-card rounded-2xl p-6 border border-slate-800 space-y-4">
                  <div class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-slate-800 pb-3">
                    <div>
                      <h3 class="text-base font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-file-export text-cyan-400"></i> Teacher Summary Markdown Exporter
                      </h3>
                      <p class="text-xs text-slate-400">Generate and copy a comprehensive student workshop report for gradebooks and portfolios.</p>
                    </div>

                    <button 
                      onClick={copyReportToClipboard}
                      class={`px-5 py-2.5 rounded-xl font-bold text-xs transition-all flex items-center gap-2 ${copySuccess ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/20' : 'bg-cyan-500 hover:bg-cyan-400 text-black shadow-lg shadow-cyan-500/20'}`}>
                      <i class={`fa-solid ${copySuccess ? 'fa-check' : 'fa-copy'}`}></i>
                      {copySuccess ? 'Markdown Copied to Clipboard!' : 'Copy Summary Report'}
                    </button>
                  </div>

                  {/* Markdown Preview Box */}
                  <div class="bg-slate-950 rounded-xl p-4 border border-slate-800">
                    <pre class="text-[11px] font-mono text-slate-300 whitespace-pre-wrap leading-relaxed max-h-60 overflow-y-auto">
                      {generateMarkdownReport()}
                    </pre>
                  </div>
                </section>

              </div>
            )}

            {/* FOOTER */}
            <footer class="pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500 space-y-1">
              <p>Body Language Intelligence Bureau • CEFR B1 ESL/EFL Communication Workshop Studio</p>
              <p class="text-[10px] text-slate-600">Based on '4 WORD POWER Body language' textbook unit</p>
            </footer>

          </div>
        );
      }

      // Render React App
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
