<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A2 Past Events: Opinions & Suggestions - Event Review Committee</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-dark: #7c3aed;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #c4b5fd;
      --accent: #f59e0b;
      --border: #334155;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -2px rgba(0,0,0,0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 10px 0;
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--primary);
    }

    header p {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .timer-card {
      background: #1e293b;
      border: 1px solid var(--primary-dark);
      border-radius: var(--radius);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .timer-display {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: #334155;
      padding: 4px;
      border-radius: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 8px;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .prompt-box {
      min-height: 95px;
      background: #0f172a;
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      padding: 16px;
      display: flex;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 12px;
      color: #f1f5f9;
    }

    .grammar-box {
      background: #334155;
      border: 1px dashed var(--primary);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .grammar-box ul {
      margin-left: 18px;
      margin-top: 4px;
      color: #e2e8f0;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
