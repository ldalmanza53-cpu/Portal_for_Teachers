<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechWise - Digital Wellbeing & Practice App</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --primary: #3498db;
      --accent: #2ecc71;
      --warn: #e67e22;
      --border-radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }

    body.warm-mode {
      --bg-color: #2c221e;
      --card-bg: #3d312a;
      --text-color: #f5e6d3;
      --primary: #e67e22;
      --accent: #d35400;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 20px;
      transition: background-color 0.4s, color 0.4s;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 10px 0;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary);
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow);
      transition: background-color 0.4s;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Focus Mode Timer */
    .timer-display {
      font-size: 3rem;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
      color: var(--primary);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background-color: #95a5a6;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* Habit Tracker */
    .habit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .habit-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
    }

    .habit-item input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    /* Interview Deck */
    .prompt-box {
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.05rem;
      padding: 10px;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 8px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .prompt-counter {
      font-size: 0.8rem;
      opacity: 0.7;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>TechWise</h1>
      <p>A2 Digital Wellbeing & Activity Helper</p>
    </header>

    <!-- Sleep Guard / Theme -->
    <div class="card">
      <div class="card-title">
        <span>🌙 Sleep Guard (Warm Mode)</span>
        <label class="switch">
          <input type="checkbox" id="sleepGuardToggle" onchange="toggleSleepGuard()">
          <span class="slider"></span>
        </label>
      </div>
      <p style="font-size: 0.85rem; opacity: 0.8;">Reduces blue light exposure for better sleep after study sessions.</p>
    </div>

    <!-- Focus Mode -->
    <div class="card">
      <div class="card-title">
        <span>⏱️ Focus Mode</span>
        <span id="timerStatus" style="font-size: 0.8rem; color: var(--accent);">Ready</span>
      </div>
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="btn-group">
        <button id="startBtn" onclick="toggleTimer()">Start</button>
        <button class="secondary" onclick="resetTimer()">Reset</button>
      </div>
    </div>

    <!-- A2 Speaking Cards -->
    <div class="card">
      <div class="card-title">
        <span>💬 A2 Interview Deck</span>
      </div>
      <div class="prompt-box" id="promptText">
        Click "Next" to start the student interview practice!
      </div>
      <div class="btn-group">
        <button class="secondary" onclick="prevPrompt()">Prev</button>
        <button onclick="nextPrompt()">Next Prompt</button>
      </div>
      <div class="prompt-counter" id="promptCounter">Prompt 0 of 20</div>
    </div>

    <!-- Daily Habit Checklist -->
    <div class="card">
      <div class="card-title">
        <span>✅ Daily Healthy Habits</span>
      </div>
      <ul class="habit-list">
        <li class="habit-item">
          <input type="checkbox" id="h1" onchange="checkHabits()">
          <label for="h1">Turn off alerts during homework</label>
        </li>
        <li class="habit-item">
          <input type="checkbox" id="h2" onchange="checkHabits()">
          <label for="h2">Keep phone away from bed</label>
        </li>
        <li class="habit-item">
          <input type="checkbox" id="h3" onchange="checkHabits()">
          <label for="h3">Take a 20-second screen break</label>
        </li>
        <li class="habit-item">
          <input type="checkbox" id="h4" onchange="checkHabits()">
          <label for="h4">No screens during meals</label>
        </li>
      </ul>
    </div>
  </div>

  <script>
    // --- Prompts Data ---
    const prompts = [
      "How many hours do you use your phone every day?",
      "What is your favorite app on your smartphone?",
      "Do you check your phone immediately when you wake up?",
      "Do you use your phone while you do homework?",
      "How often do you turn off your phone notifications?",
      "Is your phone near your bed when you sleep?",
      "Do you set time limits for social media apps?",
      "What do you usually do on your laptop or computer?",
      "Do you use your tablet or phone during meal times?",
      "How do you feel when you leave your phone at home?",
      "Should students turn off their phones during class?",
      "What can you do instead of looking at a screen when you are bored?",
      "How many video games or social apps do you have on your phone?",
      "Do you listen to music or podcasts while studying?",
      "Why should we stop looking at bright screens before sleeping?",
      "Can the TechWise app help you study better?",
      "What is one bad phone habit you want to change today?",
      "Which app notification do you receive the most?",
      "How can you use your phone to practice English every day?",
      "Which feature of the TechWise app do you like best?"
    ];

    let currentPromptIndex = -1;

    function nextPrompt() {
      if (currentPromptIndex < prompts.length - 1) {
        currentPromptIndex++;
      } else {
        currentPromptIndex = 0;
      }
      updatePromptUI();
    }

    function prevPrompt() {
      if (currentPromptIndex > 0) {
        currentPromptIndex--;
      } else {
        currentPromptIndex = prompts.length - 1;
      }
      updatePromptUI();
    }

    function updatePromptUI() {
      document.getElementById('promptText').innerText = prompts[currentPromptIndex];
      document.getElementById('promptCounter').innerText = `Prompt ${currentPromptIndex + 1} of ${prompts.length}`;
    }

    // --- Sleep Guard ---
    function toggleSleepGuard() {
      document.body.classList.toggle('warm-mode');
    }

    // --- Timer Logic ---
    let timerInterval = null;
    let timeLeft = 25 * 60; // 25 minutes
    let isRunning = false;

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      document.getElementById('timerDisplay').innerText = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
      const startBtn = document.getElementById('startBtn');
      const statusText = document.getElementById('timerStatus');

      if (!isRunning) {
        isRunning = true;
        startBtn.innerText = 'Pause';
        statusText.innerText = 'Active';
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.innerText = 'Start';
            statusText.innerText = 'Completed!';
            alert('Focus time finished! Take a break.');
          }
        }, 1000);
      } else {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.innerText = 'Start';
        statusText.innerText = 'Paused';
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeLeft = 25 * 60;
      document.getElementById('startBtn').innerText = 'Start';
      document.getElementById('timerStatus').innerText = 'Ready';
      updateTimerDisplay();
    }

    // --- Habit Logic ---
    function checkHabits() {
      const checkboxes = document.querySelectorAll('.habit-list input[type="checkbox"]');
      const total = checkboxes.length;
      let checked = 0;
      checkboxes.forEach(cb => { if (cb.checked) checked++; });
      if (checked === total) {
        setTimeout(() => alert(' Great job! You completed all healthy habits for today!'), 100);
      }
    }
  </script>
</body>
</html>
