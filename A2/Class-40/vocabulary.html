<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary: Transportation Costs</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #0d9488;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 16px;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 1.75rem;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid var(--primary);
      background: none;
      color: var(--primary);
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* PART A STYLES */
    .item-card {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
      color: #334155;
    }

    .word-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .word-btn {
      background: white;
      border: 2px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .word-btn:hover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .word-btn.selected {
      border-color: var(--primary);
      background: #dbeafe;
      color: var(--primary-dark);
    }

    .word-btn.correct {
      border-color: var(--success) !important;
      background: #dcfce7 !important;
      color: var(--success) !important;
    }

    .word-btn.incorrect {
      border-color: var(--danger) !important;
      background: #fee2e2 !important;
      color: var(--danger) !important;
    }

    .audio-icon {
      font-size: 0.8rem;
      opacity: 0.7;
    }

    .explanation-box {
      display: none;
      background: #eff6ff;
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 0.88rem;
      color: #1e40af;
      margin-top: 8px;
    }

    /* PART B STYLES */
    .part-b-container {
      display: none;
    }

    .pair-card {
      background: #f8fafc;
      border-left: 4px solid var(--secondary);
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 8px;
    }

    .pair-card h3 {
      font-size: 1rem;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      background: white;
    }

    .speech-bubble {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 16px;
      border-radius: 12px;
      margin-top: 20px;
      font-size: 1rem;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }

    #score-board {
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vocabulary: Transportation Costs</h1>
      <p class="subtitle">Find the odd word out, learn why it doesn't belong, and build pair work conversations!</p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('partA')">Part A: Odd One Out</button>
      <button class="tab-btn" onclick="switchTab('partB')">Part B: Pair Work Simulator</button>
    </div>

    <!-- PART A: ODD ONE OUT -->
    <div id="partA-section">
      <div id="itemsContainer"></div>

      <div class="controls">
        <button class="btn btn-primary" onclick="checkPartA()">Check Answers</button>
        <button class="btn btn-secondary" onclick="resetPartA()">Reset</button>
      </div>
    </div>

    <!-- PART B: PAIR WORK SIMULATOR -->
    <div id="partB-section" class="part-b-container">
      <div class="pair-card">
        <h3>1. Select Topic Group</h3>
        <div class="form-group">
          <label for="groupSelect">Choose a word group:</label>
          <select class="form-select" id="groupSelect" onchange="updateWordSelections()">
            <option value="1">Group 1: Car & driving (car, insurance, parking ticket)</option>
            <option value="2">Group 2: Cycling gear (tires, bicycle, helmet)</option>
            <option value="3">Group 3: Banking & money (loan, credit, debt, job)</option>
            <option value="4">Group 4: Public transit (bus, route, public transportation)</option>
            <option value="5">Group 5: Financial management (lend, borrow, manage, commute)</option>
          </select>
        </div>
      </div>

      <div class="pair-card">
        <h3>2. Choose Two Words to Use in a Sentence</h3>
        <div class="form-group">
          <label for="sampleSentenceSelect">Select a target sentence:</label>
          <select class="form-select" id="sampleSentenceSelect"></select>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" onclick="generateDialogue()">Generate Dialogue 🗣️</button>
      </div>

      <div id="dialogueOutput" style="display: none;"></div>
    </div>

    <div id="score-board"></div>
  </div>

  <script>
    const partAData = [
      {
        id: 1,
        words: ["car", "insurance", "parking ticket", "sidewalk"],
        odd: "sidewalk",
        reason: "Car, insurance, and parking ticket relate to vehicle ownership and driving expenses. A sidewalk is a pedestrian walkway."
      },
      {
        id: 2,
        words: ["tires", "expense", "bicycle", "helmet"],
        odd: "expense",
        reason: "Tires, bicycle, and helmet are physical cycling equipment and safety gear. An expense is a general financial term."
      },
      {
        id: 3,
        words: ["job", "loan", "credit", "debt"],
        odd: "job",
        reason: "Loan, credit, and debt refer to borrowing and owing money. A job is an employment source of income."
      },
      {
        id: 4,
        words: ["repairs", "bus", "route", "public transportation"],
        odd: "repairs",
        reason: "Bus, route, and public transportation are elements of public transit systems. Repairs refer to fixing vehicle damage."
      },
      {
        id: 5,
        words: ["lend", "commute", "borrow", "manage"],
        odd: "commute",
        reason: "Lend, borrow, and manage are financial management actions. Commute means traveling between home and work or school."
      }
    ];

    const sampleSentences = {
      1: [
        { words: ["car", "insurance"], text: "I bought a new car, but then I couldn't afford the insurance!" },
        { words: ["car", "parking ticket"], text: "I parked my car near the park and got an expensive parking ticket." }
      ],
      2: [
        { words: ["bicycle", "helmet"], text: "You should always wear a helmet when riding your bicycle." },
        { words: ["tires", "bicycle"], text: "My bicycle needs new tires before we go on our long ride." }
      ],
      3: [
        { words: ["job", "loan"], text: "After I got my new job, I was able to pay off my bank loan." },
        { words: ["credit", "debt"], text: "If you use too much credit, you might end up deep in debt." }
      ],
      4: [
        { words: ["bus", "public transportation"], text: "I take the bus every morning because public transportation is affordable." },
        { words: ["bus", "route"], text: "The bus route changes on weekends, so check the schedule." }
      ],
      5: [
        { words: ["lend", "borrow"], text: "Can you lend me some money? I forgot to borrow any cash from home." },
        { words: ["commute", "manage"], text: "It is hard to manage my budget when my daily commute is so expensive." }
      ]
    };

    const userAnswers = {};

    function playSound(type) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      if (type === 'success') {
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderPartA() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      partAData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.id = `card-${item.id}`;

        let wordsHtml = item.words.map(w => `
          <button class="word-btn ${userAnswers[item.id] === w ? 'selected' : ''}" 
                  id="btn-${item.id}-${w.replace(/\s+/g, '_')}"
                  onclick="selectWord(${item.id}, '${w}')">
            <span>${w}</span>
            <span class="audio-icon" onclick="event.stopPropagation(); speakText('${w}')">🔊</span>
          </button>
        `).join('');

        card.innerHTML = `
          <div class="item-header">
            <span>Item ${item.id}</span>
          </div>
          <div class="word-options">${wordsHtml}</div>
          <div class="explanation-box" id="exp-${item.id}">💡 <strong>Reason:</strong> ${item.reason}</div>
        `;

        container.appendChild(card);
      });

      // Default example pre-selected for Item 1
      if (!userAnswers[1]) {
        selectWord(1, "sidewalk");
      }
    }

    function selectWord(itemId, word) {
      userAnswers[itemId] = word;
      
      const item = partAData.find(i => i.id === itemId);
      item.words.forEach(w => {
        const btn = document.getElementById(`btn-${itemId}-${w.replace(/\s+/g, '_')}`);
        if (btn) {
          if (w === word) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        }
      });
    }

    function checkPartA() {
      let correctCount = 0;

      partAData.forEach(item => {
        const selected = userAnswers[item.id];
        const expBox = document.getElementById(`exp-${item.id}`);

        item.words.forEach(w => {
          const btn = document.getElementById(`btn-${item.id}-${w.replace(/\s+/g, '_')}`);
          if (btn) {
            btn.classList.remove('correct', 'incorrect');
            if (w === item.odd) {
              btn.classList.add('correct');
            } else if (w === selected && selected !== item.odd) {
              btn.classList.add('incorrect');
            }
          }
        });

        if (selected === item.odd) {
          correctCount++;
        }

        expBox.style.display = 'block';
      });

      const scoreBoard = document.getElementById('score-board');
      scoreBoard.innerText = `Score: ${correctCount} / 5 correct!`;

      if (correctCount === 5) {
        scoreBoard.style.color = "var(--success)";
        playSound('success');
      } else {
        scoreBoard.style.color = "var(--danger)";
        playSound('error');
      }
    }

    function resetPartA() {
      partAData.forEach(item => {
        delete userAnswers[item.id];
        const expBox = document.getElementById(`exp-${item.id}`);
        if (expBox) expBox.style.display = 'none';
      });
      document.getElementById('score-board').innerText = '';
      renderPartA();
    }

    function updateWordSelections() {
      const groupVal = document.getElementById('groupSelect').value;
      const sentenceSelect = document.getElementById('sampleSentenceSelect');
      sentenceSelect.innerHTML = '';

      sampleSentences[groupVal].forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.text;
        opt.innerText = `[${s.words.join(' + ')}] "${s.text}"`;
        sentenceSelect.appendChild(opt);
      });
    }

    function generateDialogue() {
      const sentence = document.getElementById('sampleSentenceSelect').value;
      const output = document.getElementById('dialogueOutput');

      output.style.display = 'block';
      output.className = 'speech-bubble';

      const scriptA = "Can you make a sentence using two words from this lesson?";
      const scriptB = sentence;
      const fullText = `Speaker A: ${scriptA} ... Speaker B: ${scriptB}`;

      output.innerHTML = `
        <strong>💬 Pair Work Conversation:</strong><br><br>
        <strong>A:</strong> ${scriptA}<br>
        <strong>B:</strong> "${scriptB}"
        <br><br>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="speakText('${fullText.replace(/'/g, "\\'")}')">🔊 Listen to Audio Dialogue</button>
      `;

      playSound('success');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (tab === 'partA') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('partA-section').style.display = 'block';
        document.getElementById('partB-section').style.display = 'none';
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('partA-section').style.display = 'none';
        document.getElementById('partB-section').style.display = 'block';
        updateWordSelections();
      }
      document.getElementById('score-board').innerText = '';
    }

    window.onload = () => {
      renderPartA();
    };
  </script>
</body>
</html>
