<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary: Sightseeing</title>
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --secondary: #d97706;
      --bg: #f0fdf4;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 1.75rem;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }

    .word-bank-box {
      background: #ccfbf1;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .word-bank-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-dark);
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .word-chip {
      background: white;
      border: 1px solid var(--primary);
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 640px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }

    .column-card {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .column-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 14px;
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary);
    }

    .slot-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slot-item {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .select-word {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .select-word.correct {
      border-color: var(--success) !important;
      background-color: #dcfce7 !important;
      color: var(--success) !important;
    }

    .select-word.incorrect {
      border-color: var(--danger) !important;
      background-color: #fee2e2 !important;
      color: var(--danger) !important;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }

    /* SECTION PAIR WORK */
    .pair-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px dashed var(--border);
    }

    .pair-card {
      background: #fffbeb;
      border-left: 4px solid var(--secondary);
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .pair-card h3 {
      font-size: 1rem;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .speech-bubble {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 1rem;
      line-height: 1.6;
    }

    #score-board {
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vocabulary: Sightseeing</h1>
      <p class="subtitle">Clasifica los lugares para ver (Things to see) y las actividades para hacer (Things to do).</p>
    </header>

    <div class="word-bank-box">
      <div class="word-bank-title">Banco de Palabras</div>
      <div class="word-bank" id="wordBank"></div>
    </div>

    <div class="chart-grid">
      <!-- THINGS TO SEE -->
      <div class="column-card">
        <div class="column-title">Things to see</div>
        <div class="slot-list" id="seeList"></div>
      </div>

      <!-- THINGS TO DO -->
      <div class="column-card">
        <div class="column-title">Things to do</div>
        <div class="slot-list" id="doList"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" onclick="checkAnswers()">Verificar Respuestas</button>
      <button class="btn btn-secondary" onclick="resetExercise()">Reiniciar</button>
    </div>

    <div id="score-board"></div>

    <!-- PAIR WORK SIMULATOR -->
    <div class="pair-section">
      <div class="pair-card">
        <h3>🗣️ Practica la conversación en pareja (Pair Work)</h3>
        <p style="font-size: 0.9rem; margin-bottom: 12px; color: #475569;">Elige qué te gustaría hacer cuando viajes a un sitio histórico:</p>
        
        <select class="select-word" id="pairSelect" style="margin-bottom: 12px;">
          <option value="see ancient ruins">see ancient ruins</option>
          <option value="visit temples">visit temples</option>
          <option value="relax in hot springs">relax in hot springs</option>
          <option value="go hiking">go hiking</option>
          <option value="eat at local restaurants">eat at local restaurants</option>
          <option value="join a tour group">join a tour group</option>
          <option value="shop at local markets">shop at local markets</option>
        </select>

        <button class="btn btn-primary" style="width: 100%;" onclick="generateDialogue()">Generar Diálogo</button>

        <div id="dialogueOutput" style="display: none;"></div>
      </div>
    </div>
  </div>

  <script>
    const allWords = [
      "ancient ruins",
      "eat at restaurants",
      "go hiking",
      "hot springs",
      "join a tour group",
      "shop at local markets",
      "temples"
    ];

    const correctSee = ["ancient ruins", "hot springs", "temples"];
    const correctDo = ["eat at restaurants", "go hiking", "join a tour group", "shop at local markets"];

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderWordBank() {
      const bank = document.getElementById('wordBank');
      bank.innerHTML = '';
      allWords.forEach(w => {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.innerHTML = `<span>${w}</span> <span onclick="event.stopPropagation(); speakText('${w}')">🔊</span>`;
        bank.appendChild(chip);
      });
    }

    function renderSlots() {
      const seeList = document.getElementById('seeList');
      const doList = document.getElementById('doList');
      seeList.innerHTML = '';
      doList.innerHTML = '';

      // Slots para Things to see (3 slots)
      for (let i = 0; i < 3; i++) {
        const div = document.createElement('div');
        div.className = 'slot-item';

        let options = `<option value="">-- Elige una opción --</option>`;
        allWords.forEach(w => {
          const isSelected = (i === 0 && w === 'ancient ruins') ? 'selected' : '';
          options += `<option value="${w}" ${isSelected}>${w}</option>`;
        });

        div.innerHTML = `<select class="select-word" id="see-${i}">${options}</select>`;
        seeList.appendChild(div);
      }

      // Slots para Things to do (4 slots)
      for (let i = 0; i < 4; i++) {
        const div = document.createElement('div');
        div.className = 'slot-item';

        let options = `<option value="">-- Elige una opción --</option>`;
        allWords.forEach(w => {
          options += `<option value="${w}">${w}</option>`;
        });

        div.innerHTML = `<select class="select-word" id="do-${i}">${options}</select>`;
        doList.appendChild(div);
      }
    }

    function checkAnswers() {
      let score = 0;

      // Evaluar Things to see
      for (let i = 0; i < 3; i++) {
        const select = document.getElementById(`see-${i}`);
        const val = select.value;
        if (correctSee.includes(val)) {
          select.className = 'select-word correct';
          score++;
        } else {
          select.className = 'select-word incorrect';
        }
      }

      // Evaluar Things to do
      for (let i = 0; i < 4; i++) {
        const select = document.getElementById(`do-${i}`);
        const val = select.value;
        if (correctDo.includes(val)) {
          select.className = 'select-word correct';
          score++;
        } else {
          select.className = 'select-word incorrect';
        }
      }

      const scoreBoard = document.getElementById('score-board');
      scoreBoard.innerText = `Puntuación: ${score} / 7 correctas!`;
      scoreBoard.style.color = (score === 7) ? 'var(--success)' : 'var(--danger)';
    }

    function resetExercise() {
      document.getElementById('score-board').innerText = '';
      renderSlots();
    }

    function generateDialogue() {
      const choice = document.getElementById('pairSelect').value;
      const output = document.getElementById('dialogueOutput');
      output.style.display = 'block';
      output.className = 'speech-bubble';

      const scriptA = "What can you do when you travel to a historic site?";
      const scriptB = `You can ${choice}!`;
      const fullText = `Speaker A: ${scriptA} ... Speaker B: ${scriptB}`;

      output.innerHTML = `
        <strong>💬 Conversación de práctica:</strong><br><br>
        <strong>A:</strong> ${scriptA}<br>
        <strong>B:</strong> ${scriptB}
        <br><br>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="speakText('${fullText.replace(/'/g, "\\'")}')">🔊 Escuchar audio</button>
      `;
    }

    window.onload = () => {
      renderWordBank();
      renderSlots();
    };
  </script>
</body>
</html>
