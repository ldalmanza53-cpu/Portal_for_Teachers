<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Practice: Expressions of Quantity</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #0d9488;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 1.75rem;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #64748b;
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid var(--primary);
      background: none;
      color: var(--primary);
      border-radius: 24px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* GRAMMAR CHART */
    .grammar-chart {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: #eff6ff;
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 24px;
    }

    @media (max-width: 640px) {
      .grammar-chart {
        grid-template-columns: 1fr;
      }
    }

    .chart-col h3 {
      font-size: 1rem;
      color: var(--primary-dark);
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #bfdbfe;
    }

    .chart-col ul {
      list-style: none;
      font-size: 0.9rem;
    }

    .chart-col li {
      margin-bottom: 6px;
    }

    .highlight {
      font-weight: 700;
      color: var(--primary-dark);
    }

    /* PART A STYLES */
    .statement-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .statement-row {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .s-number {
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 1rem;
      min-width: 24px;
    }

    .s-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
    }

    .noun-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: auto;
    }

    .badge-count { background: #dbeafe; color: #1e40af; }
    .badge-noncount { background: #ccfbf1; color: #0f766e; }

    .select-quantifier {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      background: white;
      min-width: 140px;
    }

    .select-quantifier.correct {
      border-color: var(--success) !important;
      background-color: #dcfce7 !important;
      color: var(--success) !important;
    }

    .select-quantifier.incorrect {
      border-color: var(--danger) !important;
      background-color: #fee2e2 !important;
      color: var(--danger) !important;
    }

    /* PART B STYLES */
    .part-b-container, .pair-section {
      display: none;
    }

    .city-card {
      background: #f0fdf4;
      border-left: 4px solid var(--secondary);
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

      font-size: 1rem;
      color: var(--secondary
