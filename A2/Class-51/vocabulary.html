<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 Word Power: What Happened?</title>
  <style>
    :root {
      --primary: #D35400;
      --primary-dark: #A04000;
      --positive: #27AE60;
      --negative: #C0392B;
      --either: #2980B9;
      --bg: #FDFBF7;
      --card-bg: #FFFFFF;
      --text: #2C3E50;
      --border: #E0D6C8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--bg);
      padding-bottom: 15px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    p.instructions {
      color: #666;
      font-size: 0.95rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid var(--primary);
      background: none;
      color: var(--primary);
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      color: white;
    }

    .word-bank {
      background: #FDF2E9;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      min-height: 90px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    .chip {
      background: white;
      border: 2px solid var(--primary);
      color: var(--primary-dark);
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, background-color 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .chip:hover {
      transform: translateY(-2px);
      background-color: #FADBD8;
    }

    .chip.selected {
      background: var(--primary);
      color: white;
      transform: scale(1.05);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    @media (max-width: 700px) {
      .category-grid {
        grid-template-columns: 1fr;
      }
    }

    .category-column {
      background: #FAFAFA;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .category-column.pos-col {
      border-color: rgba(39, 174, 96, 0.4);
      background: #F4FBF7;
    }

    .category-column.neg-col {
      border-color: rgba(192, 57, 43, 0.4);
      background: #FDF6F5;
    }

    .category-column.either-col {
      border-color: rgba(41, 128, 185, 0.4);
      background: #F2F8FC;
    }

    .category-header {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
    }

    .pos-col .category-header { color: var(--positive); }
    .neg-col .category-header { color: var(--negative); }
    .either-col .category-header { color: var(--either); }

    .drop-zone {
      width: 100%;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .chip.correct {
      background-color: #E8F8F0;
      border-color: var(--positive);
      color: var(--positive);
    }

    .chip.incorrect {
      background-color: #FDF2E9;
      border-color: var(--negative);
      color: var(--negative);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #E0E0E0; color: #333; }
    .btn-secondary:hover { background: #D0D0D0; }

    /* PART B STYLES */
    .part-b-container {
      display: none;
    }

    .story-card {
      background: #FAFAFA;
      border-left: 4px solid var(--primary);
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 6px;
    }

    .story-prompt {
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 1.05rem;
    }

    .story-inputs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    select.adverb-select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary-dark);
    }

    input.continuation-input {
      flex-grow: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      min-width: 200px;
    }

    .story-display {
      margin-top: 20px;
      padding: 15px;
      background: #FFF8E7;
      border: 1px solid var(--primary);
      border-radius: 8px;
      font-style: italic;
      font-size: 1.05rem;
    }

    #score-board {
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 15px;
      color: var(--primary-dark);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Word Power: Storytelling Adverbs</h1>
      <p class="instructions">Learn adverbs used in storytelling to build suspense and interest! Classify them into Positive, Negative, or Either.</p>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('partA')">Part A: Categorize Adverbs</button>
      <button class="tab-btn" onclick="switchTab('partB')">Part B: Interactive Story Builder</button>
    </div>

    <!-- PART A: CATEGORIZATION -->
    <div id="partA-section">
      <div class="word-bank" id="wordBank"></div>

      <div class="category-grid">
        <div class="category-column pos-col" onclick="placeSelected('P')">
          <div class="category-header">👍 Positive (P)</div>
          <div class="drop-zone" id="zone-P"></div>
        </div>

        <div class="category-column neg-col" onclick="placeSelected('N')">
          <div class="category-header">👎 Negative (N)</div>
          <div class="drop-zone" id="zone-N"></div>
        </div>

        <div class="category-column either-col" onclick="placeSelected('E')">
          <div class="category-header">🔄 Either (E)</div>
          <div class="drop-zone" id="zone-E"></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" onclick="checkPartA()">Check Answers</button>
        <button class="btn btn-secondary" onclick="resetPartA()">Reset</button>
      </div>
    </div>

    <!-- PART B: STORY BUILDER -->
    <div id="partB-section" class="part-b-container">
      <p class="instructions" style="margin-bottom: 20px;">
        Use storytelling adverbs to complete these creative sentences!
      </p>

      <div class="story-card">
        <div class="story-prompt">1. We were having a party when...</div>
        <div class="story-inputs">
          <select class="adverb-select" id="adv-1">
            <option value="">-- select adverb --</option>
          </select>
          <input type="text" class="continuation-input" id="cont-1" placeholder="e.g., the lights suddenly went out!">
        </div>
